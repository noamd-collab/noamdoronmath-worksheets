<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דפי עבודה במתמטיקה · נועם דורון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://static.wixstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@500;700;800;900&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@500;700;800;900&display=swap"></noscript>
<style>
  /* =======================================================================
     עיצוב "מחברת משבצות" — ערכת הצבעים מתחלפת לפי הלשונית הפעילה
     באמצעות data-grade על .wrap. אין צורך לגעת בזה.
     ======================================================================= */
  .wrap[data-grade="1"], body:has(.wrap[data-grade="1"]){
    --ink:#1E1D1A; --accent:#7C3AED; --accent-dark:#4C2392; --tint:#EFE7FE;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }
  .wrap[data-grade="2"], body:has(.wrap[data-grade="2"]){
    --on-accent:#10100E;
    --ink:#1E1D1A; --accent:#0B84D0; --accent-dark:#065180; --tint:#DFF0FB;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }
  .wrap[data-grade="3"], body:has(.wrap[data-grade="3"]){
    --on-accent:#1E1D1A;
    --ink:#1E1D1A; --accent:#12A05C; --accent-dark:#0B6339; --tint:#DFF5E9;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }
  .wrap[data-grade="4"], body:has(.wrap[data-grade="4"]){
    --on-accent:#1E1D1A;
    --ink:#1E1D1A; --accent:#D97706; --accent-dark:#864903; --tint:#FDEDD8;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }
  .wrap[data-grade="5"], body:has(.wrap[data-grade="5"]){
    --ink:#1E1D1A; --accent:#DB2777; --accent-dark:#871849; --tint:#FDE4EF;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }
  .wrap[data-grade="6"], body:has(.wrap[data-grade="6"]){
    --ink:#1E1D1A; --accent:#4F5BD5; --accent-dark:#303884; --tint:#E5E7FC;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }
  .wrap[data-grade="7"], body:has(.wrap[data-grade="7"]){
    --on-accent:#1E1D1A;
    --ink:#1E1D1A; --accent:#E4572E; --accent-dark:#8D351C; --tint:#FFE8DF;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }
  .wrap[data-grade="8"], body:has(.wrap[data-grade="8"]){
    --on-accent:#1E1D1A;
    --ink:#1E1D1A; --accent:#E0A500; --accent-dark:#8A6600; --tint:#FFF4D6;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }
  .wrap[data-grade="9"], body:has(.wrap[data-grade="9"]){
    --on-accent:#10100E;
    --ink:#1E1D1A; --accent:#0E9384; --accent-dark:#085B51; --tint:#DDF3EF;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }
  :root{
    --r-card:20px;
    --radius:20px;
    --cta:#2F63C6;
    --lime:#BACA76;
    --on-accent:#fff;
    --foot:#1E1D1A;
    --ink:#1E1D1A; --accent:#0E9384; --accent-dark:#085B51; --tint:#DDF3EF;
    --paper:#FDFCF4; --grid:#E4E2CF; --muted:#57564A; --ph:#8E8C7C;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .skip-link{
    position:fixed; top:12px; inset-inline-start:12px; z-index:1000;
    padding:10px 18px; border:3px solid var(--ink); border-radius:12px;
    background:#fff; color:var(--ink); font-weight:800;
    transform:translateY(-200%);
  }
  .skip-link:focus{ transform:translateY(0); }
  :where(a,button,input,[tabindex]):focus-visible{
    outline:3px solid var(--ink); outline-offset:4px;
  }

  body{
    margin:0; padding:0;
    font-family:'Assistant','Heebo','Arial Hebrew',Arial,sans-serif;
    font-size:16px; line-height:1.55; color:var(--ink,#2A1F26);
    -webkit-font-smoothing:antialiased;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/26px 26px,
      var(--paper);
  }

  /* ---------- מתג מסלול (ט׳ בלבד) ---------- */
  .trackbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin:0 0 14px; padding:10px 12px;
    background:#fff; border:3px solid var(--ink); border-radius:var(--r-card);
    box-shadow:-6px 6px 0 var(--ink);
  }
  .trackbar[hidden]{ display:none; }
  .track{
    font-family:'Heebo',Arial,sans-serif; font-weight:900; font-size:15px;
    background:#fff; color:var(--ink); cursor:pointer;
    border:3px solid var(--ink); border-radius:999px; padding:8px 18px;
    box-shadow:-3px 3px 0 var(--ink); transition:transform .15s ease, box-shadow .15s ease;
  }
  .track:hover{ transform:translate(2px,-2px); box-shadow:-5px 5px 0 var(--ink); }
  .track[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent,#fff); }
  .tracknote{ font-size:14px; color:var(--muted); margin-inline-start:auto; }
  @media (max-width:600px){ .tracknote{ flex-basis:100%; margin-inline-start:0; } }

  /* ---------- אלמנטים תלת־ממדיים ---------- */
  .toy{ display:block; height:auto; user-select:none; -webkit-user-drag:none; }
  .headrow .toy-head{
    width:clamp(64px,8vw,96px); flex:none; margin-inline-start:auto;
    transform:rotate(-6deg);
    filter:drop-shadow(-4px 5px 0 rgba(30,29,26,.14));
    animation:bob 6.5s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-7px) rotate(-1deg)} }
  .outro .toy-outro{
    position:absolute; inset-inline-end:22px; bottom:-6px;
    width:clamp(96px,14vw,148px); opacity:.95; z-index:0;
    transform:rotate(-8deg);
    filter:drop-shadow(-4px 5px 10px rgba(0,0,0,.45));
  }
  @media (max-width:700px){ .outro .toy-outro{ display:none; } .headrow .toy-head{ display:none; } }

  /* ---------- שוברי צבע ---------- */
  .hl{
    background:linear-gradient(transparent 55%, #FEFF91 55%, #FEFF91 92%, transparent 92%);
    transform:rotate(-1deg); display:inline-block; padding:0 6px;
  }
  .doodle{ position:absolute; pointer-events:none; opacity:.85; }
  .doodle.d1{ inset-inline-end:4px;  top:-8px;  transform:rotate(8deg); }
  .doodle.d2{ inset-inline-end:66px; top:30px;  transform:rotate(-12deg); }
  .doodle.d3{ inset-inline-end:140px;top:-4px;  transform:rotate(4deg); }
  @media (max-width:600px){ .doodle{ display:none; } }

  .wrap{
    position:relative;
    width:100%; max-width:1060px; margin:0 auto;
    padding:26px 18px 14px; color:var(--ink);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/26px 26px,
      var(--paper);
  }
  /* התוכן עצמו נשאר ברוחב קריא וממורכז, הרקע נמתח לרוחב מלא */
  .wrap > *{ max-width:1000px; margin-inline:auto; }

  /* ---------- לשוניות כיתה ---------- */
  .grades{ display:flex; gap:12px; justify-content:center; margin:0 0 26px; flex-wrap:wrap; }
  .grade-tab{
    font-family:'Heebo',inherit; font-size:16px; font-weight:900;
    color:var(--ink); background:#fff;
    border:3px solid var(--ink); border-radius:999px;
    padding:10px 30px; cursor:pointer;
    box-shadow:-4px 4px 0 var(--ink);
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
  }
  .grade-tab:hover{ transform:translate(2px,-2px); box-shadow:-6px 6px 0 var(--ink); }
  .grade-tab:active{ transform:translate(0,0); box-shadow:-2px 2px 0 var(--ink); }
  .grade-tab[aria-selected="true"]{ background:var(--accent); color:var(--on-accent,#fff); }

  /* ---------- כותרת ---------- */
  h1{
    font-family:'Heebo','Assistant',Arial,sans-serif;
    font-weight:900; font-size:clamp(23px,4.3vw,37px); line-height:1.3;
    color:var(--ink); text-align:center; margin:0 0 12px;
    letter-spacing:-.015em; position:relative; padding-bottom:16px;
  }
  h1::after{
    content:""; position:absolute; bottom:0; left:50%;
    transform:translateX(-50%) rotate(-.8deg);
    width:120px; height:9px; background:var(--tint);
    border:2.5px solid var(--ink); border-radius:999px;
  }
  .lede{ text-align:center; color:var(--muted); margin:0 auto 26px; max-width:640px; font-size:15px; font-weight:600; }

  /* ---------- סרגל חיפוש וסינון ---------- */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
    padding:16px; margin-bottom:10px;
    background:#fff; border:3px solid var(--ink); border-radius:var(--r-card);
    box-shadow:-6px 6px 0 var(--ink);
  }
  .search{ position:relative; flex:1 1 260px; min-width:220px; }
  .search input{
    width:100%; font-family:inherit; font-size:15px; font-weight:600; color:var(--ink);
    padding:12px 42px 12px 16px;
    background:var(--paper); border:2.5px solid var(--ink); border-radius:999px;
  }
  .search input::placeholder{ color:var(--muted); font-weight:600; }
  .search input:focus{ outline:none; box-shadow:-3px 3px 0 var(--accent); }
  .search input:focus-visible{ outline:3px solid var(--ink); outline-offset:4px; }
  .search svg{ position:absolute; inset-inline-end:15px; top:50%; transform:translateY(-50%); width:17px; height:17px; stroke:var(--ink); fill:none; stroke-width:2.4; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ transform:rotate(3deg);
    font-family:'Heebo',inherit; font-size:13.5px; font-weight:800; color:var(--ink);
    background:var(--paper); border:2.5px solid var(--ink);
    border-radius:999px; padding:8px 16px; cursor:pointer;
    transition:background .16s ease, color .16s ease, transform .16s ease;
  }
  .chip:hover{ transform:translateY(-2px); }
  .chip[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent,#fff); }

  /* ---------- שורת חיפוש חוצה-כיתות ---------- */
  .cross{
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
    margin:14px auto 0; font-size:14px; font-weight:800; color:var(--ink);
    background:#fff; border:2.5px solid var(--ink); border-radius:999px;
    padding:8px 18px; width:fit-content; box-shadow:-3px 3px 0 var(--ink);
  }
  .cross label{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
  .cross input{ width:17px; height:17px; accent-color:var(--accent); cursor:pointer; }
  .hint{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px;
    font-size:13.5px; font-weight:800; color:var(--ink);
    margin:16px auto 26px; text-align:center;
  }
  .hint b{ font-weight:900; }
  .hint .k{
    display:inline-flex; align-items:center; gap:6px;
    border:2px solid var(--ink); border-radius:999px; padding:5px 12px; background:#fff;
  }
  .hint .k i{ width:12px; height:12px; border-radius:4px; border:2px solid var(--ink); display:inline-block; font-style:normal; }
  .hint .k.a i{ background:var(--tint); }
  .hint .k.b i{ background:#fff; }
  .hint .k.c i{ background:#FFD84D; }

  /* ---------- כותרת כיתה בתוצאות חוצות-כיתות ---------- */
  .grade-band{
    display:flex; align-items:center; gap:12px;
    margin:30px 0 16px; padding:10px 16px;
    background:var(--tint); border:3px solid var(--ink); border-radius:var(--r-card);
    box-shadow:-4px 4px 0 var(--ink);
  }
  .grade-band h2{
    font-family:'Heebo',Arial,sans-serif; font-weight:900; font-size:17px;
    color:var(--ink); margin:0; white-space:nowrap;
  }
  .grade-band .rule{ flex:1; height:2.5px; background:var(--ink); opacity:.18; border-radius:2px; }
  .grade-band .count{ font-size:13px; font-weight:700; color:var(--ink); opacity:.65; white-space:nowrap; }

  /* ---------- קבוצות נושאים ---------- */
  .group{ content-visibility:auto; contain-intrinsic-size:auto 420px; margin-bottom:38px; }
  .group:last-child{ margin-bottom:0; }
  .group-head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .group-head h3{
    font-family:'Heebo',Arial,sans-serif; font-weight:900; font-size:16px;
    color:var(--ink); margin:0; white-space:nowrap; letter-spacing:.01em;
    background:var(--tint); border:2.5px solid var(--ink); border-radius:999px;
    padding:7px 18px; transform:rotate(-1.2deg);
  }
  .group-head::after{
    content:""; display:block; height:4px; width:88px; margin-top:8px;
    background:var(--lime); border:2px solid var(--ink); border-radius:999px;
    transform:rotate(-1deg);
  }
  .group-head .rule{ flex:1; height:2.5px; background:var(--ink); opacity:.14; border-radius:2px; }
  .group-head .count{ font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap; }

  /* ---------- כרטיס נושא ---------- */
  .card{
    display:flex; align-items:center; gap:22px; justify-content:space-between;
    background:#fff; border:3px solid var(--ink); border-radius:var(--r-card);
    padding:18px 22px; margin-bottom:14px;
    box-shadow:-6px 6px 0 var(--ink);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    animation:pop .32s ease both; animation-delay:var(--d,0s);
    position:relative;
  }
  .card::after{
    content:""; position:absolute; inset:0;
    border-radius:calc(var(--r-card) - 3px);
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.4) 0 12px, transparent 12px 24px);
    pointer-events:none; opacity:.5;
  }
  .card > *{ position:relative; z-index:1; }
  .card:hover{ background:var(--tint); transform:translate(4px,-4px); box-shadow:-10px 10px 0 var(--ink); }
  .card:active{ transform:translate(0,0); box-shadow:-3px 3px 0 var(--ink); }

  .card-text{ min-width:0; }
  .card-text h4{
    font-family:'Heebo',Arial,sans-serif; font-weight:900;
    font-size:20px; color:var(--ink); margin:0 0 6px; line-height:1.35;
  }
  .card-text p{ margin:0; font-size:14.5px; font-weight:600; color:var(--muted); line-height:1.5; }
  .card-text .note{ margin-top:8px; font-size:13px; font-weight:800; color:var(--accent-dark); }

  /* ---------- אייקון נושא ---------- */
  .card-main{ display:flex; align-items:flex-start; gap:16px; min-width:0; }
  .tico{
    flex:none; width:46px; height:46px; margin-top:2px;
    display:grid; place-items:center;
    background:var(--tint); border:2.5px solid var(--ink); border-radius:50%;
    color:var(--accent-dark); transform:rotate(-5deg);
    transition:transform .25s ease;
  }
  .card:hover .tico{ transform:rotate(4deg) scale(1.06); }
  .tico svg{
    width:23px; height:23px;
    fill:none; stroke:currentColor; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round;
  }

  /* תג PDF ליד שם הנושא */
  .pdf-badge{
    display:inline-flex; align-items:center; gap:4px;
    margin-inline-start:9px; vertical-align:3px;
    padding:3px 8px; border-radius:6px;
    font-family:'Heebo',inherit; font-size:10.5px; font-weight:900; letter-spacing:.04em;
    color:var(--ink); background:var(--tint); border:2px solid var(--ink);
    transform:rotate(2deg);
  }
  .pdf-badge svg{
    width:11px; height:13px; flex-shrink:0;
    fill:none; stroke:var(--ink); stroke-width:1.9;
    stroke-linejoin:round; stroke-linecap:round;
  }

  /* ---------- כפתורי רמות ---------- */
  .levels{ display:flex; gap:10px; flex-shrink:0; }
  .card--bundle{ flex-wrap:wrap; }
  .card--bundle .card-main{ flex-basis:100%; }
  .levels.levels--bundle{ display:flex; flex-direction:column; width:100%; gap:8px; }
  .worksheet-links{ display:flex; flex-wrap:wrap; gap:10px; }
  .worksheet-links .lvl{ flex:1 1 180px; min-height:44px; white-space:normal; line-height:1.35; }
  .more-worksheets summary{ cursor:pointer; font-weight:800; min-height:44px; padding:10px 0; }
  .more-worksheets summary:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .lvl{
    display:inline-flex; align-items:center; justify-content:center; text-align:center;
    min-width:106px; padding:10px 16px;
    font-family:'Heebo',inherit; font-weight:900; font-size:14px;
    text-decoration:none; white-space:nowrap; color:var(--ink); background:#fff;
    border:2.5px solid var(--ink); border-radius:999px;
    box-shadow:-3px 3px 0 var(--ink);
    transition:background .16s ease, color .16s ease, transform .16s ease, box-shadow .16s ease;
  }
  .lvl--a,.lvl--b,.lvl--c{ background:#fff; color:var(--ink); }
  .lvl--a:hover,.lvl--b:hover,.lvl--c:hover{
    background:var(--accent); color:var(--on-accent,#fff); transform:translate(2px,-2px); box-shadow:-5px 5px 0 var(--ink);
  }
  .lvl--a:active,.lvl--b:active,.lvl--c:active{ transform:translate(0,0); box-shadow:-2px 2px 0 var(--ink); }

  /* מצב "אין לינק" — חייב לבוא אחרי .lvl--a/b/c */
  .lvl--soon,
  .lvl--soon:hover{
    background:var(--paper); color:var(--muted);
    border:2.5px dashed var(--ink); box-shadow:none; transform:none; cursor:default;
    font-size:12.5px; font-weight:800; white-space:normal; line-height:1.25;
  }
  .lvl--soon .soon-note{ font-weight:700; font-size:11.5px; color:var(--muted); opacity:.85; margin-inline-start:5px; }
  .lvl--one{ min-width:238px; }

  :where(a,button,input):focus-visible{ outline:3px solid var(--cta); outline-offset:3px; }

  .empty{
    text-align:center; padding:44px 20px; color:var(--muted); font-weight:600;
    background:#fff; border:3px dashed var(--ink); border-radius:var(--r-card);
  }
  .empty strong{ display:block; font-family:'Heebo',Arial,sans-serif; color:var(--ink); font-size:19px; font-weight:900; margin-bottom:8px; }
  .foot{ text-align:center; font-size:13px; font-weight:700; color:var(--muted); margin:18px 0 0; }

  @keyframes pop{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

  /* ---------- פס מעבר אל הפוטר של האתר ----------
     נדגם מן האתר עצמו: רקע #1E1D1A, ליים #BACA76, טקסט #FEFF91.
     שומר על שפת ה-embed (גבול 3px, צל מוצק שמאלה) כדי שיישאר שייך. */
  .outro{
    position:relative; overflow:hidden;
    margin:34px 0 0; padding:26px 26px 24px;
    border:3px solid var(--ink); border-radius:var(--r-card);
    box-shadow:-6px 6px 0 var(--ink);
    background:linear-gradient(105deg, #7C8551 0%, #2E2E22 34%, #1E1D1A 100%);
    color:#FEFF91;
  }
  .outro::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.30;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 12px, transparent 12px 24px);
  }
  .outro > *{ position:relative; z-index:1; }
  .outro h3{
    font-family:'Heebo',Arial,sans-serif; font-weight:900;
    font-size:clamp(19px,2.6vw,26px); margin:0 0 6px; color:#FEFF91;
    letter-spacing:-.01em;
  }
  .outro p{ margin:0; color:#EAFE93; font-size:15px; max-width:62ch; line-height:1.6; }
  .outro .oline{
    display:block; height:5px; width:132px; margin:14px 0 0;
    background:#BACA76; border:2px solid #1E1D1A; border-radius:999px;
    transform:rotate(-1deg);
  }
  @media (max-width:600px){ .outro{ padding:20px 18px; } }

  /* ---------- נקודות שבירה לפי המפרט ---------- */
  @media (max-width:820px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:500px){ .grid{ grid-template-columns:1fr; } }

  /* ---------- מובייל ---------- */
  @media (max-width:720px){
    .wrap{ padding:20px 14px 8px; }
    .grades{ gap:8px; }
    .grade-tab{ padding:9px 20px; font-size:14px; box-shadow:-3px 3px 0 var(--ink); }
    .toolbar{ padding:13px; box-shadow:-4px 4px 0 var(--ink); }
    .card{ flex-direction:column; align-items:stretch; gap:14px; padding:16px; box-shadow:-4px 4px 0 var(--ink); }
    .card:hover{ transform:none; box-shadow:-4px 4px 0 var(--ink); }
    .card-text h4{ font-size:18px; }
    .levels{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .lvl{ min-width:0; padding:11px 4px; font-size:12.5px; box-shadow:-2px 2px 0 var(--ink); }
    .lvl--soon{ font-size:11px; }
    .lvl--soon .soon-note{ font-size:10px; }
    .lvl--one{ min-width:0; grid-column:1 / -1; }
    .group-head h3{ font-size:14.5px; padding:6px 14px; }
    .tico{ width:40px; height:40px; }
    .tico svg{ width:20px; height:20px; }
  }

  /* ---------- playful upgrade ---------- */
  /* card hand-placed tilt */
  .card{ --tilt:0deg; transform:rotate(var(--tilt)); }
  #list .card:nth-child(odd), .group .card:nth-of-type(odd){ --tilt:-.35deg; }
  .group .card:nth-of-type(even){ --tilt:.35deg; }
  .card:hover{ transform:translate(3px,-3px) rotate(0deg); }
  .card:active{ transform:translate(0,0) rotate(0deg); }

  /* icon wiggle on hover */
  @keyframes wiggle{
    0%,100%{ transform:rotate(-5deg) scale(1.06); }
    30%{ transform:rotate(7deg) scale(1.1); }
    60%{ transform:rotate(-3deg) scale(1.08); }
  }
  .card:hover .tico{ animation:wiggle .5s ease 1; transform:rotate(4deg) scale(1.06); }

  /* level buttons — color-coded */
  .lvl--a{ background:var(--tint); }
  .lvl--b{ background:#fff; }
  .lvl--c{ background:#FEFF91; }
  .lvl--c::before{ content:"★"; margin-inline-end:6px; font-size:12px; transform:translateY(-1px); }
  .lvl--a:hover,.lvl--b:hover,.lvl--c:hover{ background:var(--accent); color:var(--on-accent,#fff); }
  .lvl--soon, .lvl--soon:hover{ background:var(--paper); color:var(--muted); }
  .lvl--soon::before{ content:none; }

  /* group stickers alternate tilt */
  .group:nth-of-type(even) .group-head h3{ transform:rotate(1.2deg); }

  /* active grade tab gets a jaunty tilt */
  .grade-tab[aria-selected="true"]{ transform:rotate(-2deg); }
  .grade-tab[aria-selected="true"]:hover{ transform:rotate(-2deg) translate(2px,-2px); }

  /* pdf badge waves on card hover */
  .card:hover .pdf-badge{ transform:rotate(-3deg) scale(1.08); transition:transform .2s ease; }

  /* empty state doodle */
  .empty::before{ content:"🔍"; display:block; font-size:38px; margin-bottom:10px; }


  /* ---------- כרטיס מודגש: מעבר לחטיבה העליונה (ט׳) ---------- */
  .card[data-g="bridge"]{
    background:linear-gradient(135deg, #FFF3C4 0%, #FEFF91 100%);
    border-width:3.5px;
  }
  .card[data-g="bridge"]::after{ opacity:.25; }
  .card[data-g="bridge"] .tico{ background:#fff; }
  .card[data-g="bridge"] .card-text h4::before{ content:"🎓 "; }
  .card[data-g="bridge"]:hover{ background:linear-gradient(135deg, #FEFF91 0%, #FFD84D 100%); }


  /* ---------- לגו: פיני חיבור בראש כל כרטיס ---------- */
  .card::before{
    content:""; position:absolute; top:-9px; inset-inline-start:26px;
    width:64px; height:12px; z-index:2; pointer-events:none;
    background:
      radial-gradient(circle at 12px 50%, var(--accent) 0 6px, transparent 6.5px),
      radial-gradient(circle at 40px 50%, var(--accent) 0 6px, transparent 6.5px);
    filter:drop-shadow(0 -2px 0 var(--ink));
    opacity:.95;
  }
  .card{ position:relative; }
  .card[data-g="bridge"]::before{ background:
      radial-gradient(circle at 12px 50%, #FFB703 0 6px, transparent 6.5px),
      radial-gradient(circle at 40px 50%, #FFB703 0 6px, transparent 6.5px); }

  /* צבע לכל קבוצת נושאים — סרגל צד מזהה */
  .card{ border-inline-end-width:9px; }

  /* לשוניות ושבבים — יותר "כפתורי לגו" */
  .grade-tab, .chip, .lvl{ letter-spacing:.01em; }
  .grade-tab[aria-selected="true"]{ box-shadow:-4px 4px 0 var(--ink); }
  .chip[aria-pressed="true"]{ box-shadow:-3px 3px 0 var(--ink); }

  /* מדבקת הקבוצה — צבעונית וגדולה יותר */
  .group-head h3{ background:var(--accent); color:var(--on-accent,#fff); }
  .group-head .rule{ background:var(--accent); opacity:.35; height:3px; }

  /* כותרת: פס מרקר בצבע הכיתה */
  h1::after{ background:var(--accent); border-color:var(--ink); width:150px; }

  /* אייקון הנושא — עיגול בצבע מלא */
  .tico{ background:var(--tint); }
  .card:hover .tico{ background:#fff; }

  /* סרגל החיפוש — מסגרת צבעונית */
  .toolbar{ border-color:var(--ink); box-shadow:-6px 6px 0 var(--accent); }
  .search input:focus{ box-shadow:-3px 3px 0 var(--accent); }

  @media (max-width:720px){
    .card::before{ inset-inline-start:18px; width:52px; }
  }

  /* ---------- לבנת לגו לכל קבוצת נושאים ---------- */
  .card[data-g]{ --brick:var(--accent); border-inline-end-color:var(--brick); }
  .card::before{ background:
      radial-gradient(circle at 12px 50%, var(--brick) 0 6px, transparent 6.5px),
      radial-gradient(circle at 40px 50%, var(--brick) 0 6px, transparent 6.5px); }
  .card[data-g="num"],   .card[data-g="alg"]   { --brick:#E63946; }
  .card[data-g="addsub"],.card[data-g="ops"]   { --brick:#F77F00; }
  .card[data-g="muldiv"],.card[data-g="fun"]   { --brick:#FCBF11; }
  .card[data-g="frac"],  .card[data-g="fracmul"],.card[data-g="ratio"]{ --brick:#2A9D3F; }
  .card[data-g="dec"],   .card[data-g="pct"]   { --brick:#00A6C0; }
  .card[data-g="geo"]                          { --brick:#1D5FD8; }
  .card[data-g="meas"],  .card[data-g="area"]  { --brick:#7B2FD1; }
  .card[data-g="solid"], .card[data-g="coord"] { --brick:#D62A8E; }
  .card[data-g="data"],  .card[data-g="stat"]  { --brick:#00A08A; }
  .card[data-g="think"], .card[data-g="model"],.card[data-g="eq"]{ --brick:#8D5A2B; }
  .card[data-g="word"],  .card[data-g="synth"],.card[data-g="support"],.card[data-g="deep"]{ --brick:#5A6B7A; }
  .card[data-g="bridge"]                       { --brick:#FFB703; }
  .card[data-g="spiral"]                       { --brick:#8D5A2B; }
  .card:hover .tico{ color:var(--brick); }


  /* ---------- מרכוז: גובר על כללי margin מקומיים ---------- */
  .wrap > .grades,
  .wrap > .aibanner,
  .wrap > h1,
  .wrap > .lede,
  .wrap > .toolbar,
  .wrap > .cross,
  .wrap > .hint,
  .wrap > .foot,
  .wrap > .jump,
  .wrap > #list{
    max-width:1000px;
    margin-inline:auto;
  }


  /* ---------- שורות לשוניות: יסודי + חטיבה ---------- */
  .grades{ flex-direction:column; gap:10px; align-items:center; }
  .tabrow{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;
    background:#fff; border:2.5px solid var(--ink); border-radius:999px;
    padding:8px 16px; box-shadow:-4px 4px 0 var(--ink); max-width:100%;
  }
  .tabrow-label{
    font-family:'Heebo',inherit; font-weight:900; font-size:13px; white-space:nowrap;
    color:var(--ink); opacity:.75; padding-inline-end:4px;
  }
  .tabrow-btns{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .tabrow .grade-tab{
    padding:7px 16px; font-size:14px; box-shadow:-2px 2px 0 var(--ink); border-width:2.5px;
  }
  .tabrow .grade-tab:hover{ transform:translate(1px,-1px); box-shadow:-4px 4px 0 var(--ink); }
  @media (max-width:720px){
    .tabrow{ padding:8px 12px; }
    .tabrow-label{ font-size:12px; width:100%; text-align:center; padding:0; }
    .tabrow .grade-tab{ padding:7px 12px; font-size:13px; }
  }


  /* ---------- מעבר בין שכבות בתחתית העמוד ---------- */
  .jump{
    margin:34px auto 0; padding:20px 22px;
    background:var(--tint); border:3px solid var(--ink); border-radius:var(--r-card);
    box-shadow:-6px 6px 0 var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
  }
  .jump-label{ font-family:'Heebo',inherit; font-weight:900; font-size:17px; color:var(--ink); }
  .jump-btns{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .jump-btn{
    font-family:'Heebo',inherit; font-weight:900; font-size:14px; cursor:pointer;
    color:var(--ink); background:#fff;
    border:2.5px solid var(--ink); border-radius:999px; padding:9px 18px;
    box-shadow:-3px 3px 0 var(--ink);
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
  }
  .jump-btn:hover{ background:var(--accent); color:var(--on-accent,#fff); transform:translate(2px,-2px); box-shadow:-5px 5px 0 var(--ink); }
  .jump-btn:active{ transform:translate(0,0); box-shadow:-2px 2px 0 var(--ink); }
  @media (max-width:720px){
    .jump{ padding:16px; }
    .jump-label{ font-size:15px; }
    .jump-btn{ padding:8px 14px; font-size:13px; }
  }


  /* ---------- באנר נועם AI ---------- */
  .aibanner{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    margin:0 auto 26px; padding:18px 22px;
    background:linear-gradient(135deg, #fff 0%, var(--tint) 100%);
    border:3px solid var(--ink); border-radius:var(--r-card);
    box-shadow:-6px 6px 0 var(--ink);
  }
  /* עיגול מספר הכיתה — מוטה, עם טבעת מקווקוות מסתובבת */
  .headrow{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .gbadge{
    position:relative; width:70px; height:70px; flex:0 0 auto;
    display:grid; place-items:center;
    background:#fff; border:3px solid var(--ink); border-radius:50%;
    font-family:'Heebo',Arial,sans-serif; font-weight:900; font-size:36px;
    color:var(--accent); transform:rotate(-7deg);
  }
  .gbadge::after{
    content:""; position:absolute; inset:-8px; border-radius:50%;
    border:2.5px dashed var(--accent); opacity:.55;
    animation:spin 14s linear infinite;
  }
  .wrap[data-grade="8"] .gbadge{ color:var(--accent-dark); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ .gbadge::after{ animation:none; } }

  .aibanner .robot{
    flex:none; width:66px; height:66px; display:grid; place-items:center;
    font-size:34px; background:#fff; border:3px solid var(--ink); border-radius:50%;
    transform:rotate(-7deg);
  }
  .aibanner .txt{ flex:1; min-width:230px; }
  .aibanner h2{
    font-family:'Heebo',sans-serif; font-weight:900; font-size:19px;
    margin:0 0 5px; color:var(--ink);
  }
  .aibanner p{ margin:0; font-size:14.5px; font-weight:600; color:var(--muted); line-height:1.5; }
  @media (max-width:720px){
    .aibanner{ padding:15px; gap:12px; }
    .aibanner .robot{ width:48px; height:48px; font-size:25px; }
    .aibanner h2{ font-size:17px; }
  }

  /* תגית AI על כרטיס נושא */
  .aihint{
    display:inline-flex; align-items:center; gap:5px; margin-top:9px;
    font-family:'Heebo',sans-serif; font-weight:800; font-size:11.5px;
    color:var(--accent-dark); background:var(--tint);
    border:2px solid var(--ink); border-radius:999px; padding:3px 9px;
  }



  /* מצב "בקרוב" — יסודי, עד שנועם AI יגיע גם לשם */
  .aibanner.soon{
    background:#fff;
    border-style:dashed;
  }
  .aibanner.soon .robot{ opacity:.75; }

  @media (prefers-reduced-motion:reduce){ .card::before{ filter:none; } }

  @media (prefers-reduced-motion:reduce){
    .card{ transform:none; }
    .card:hover .tico{ animation:none; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
    .card:hover,.grade-tab:hover,.lvl:hover,.chip:hover{ transform:none; }
    .card:hover .tico{ transform:rotate(-5deg); }
  }

  /* ---------- ביצועים: אנימציות מתחילות רק אחרי הציור הראשון ---------- */
  .badge::after, .toy, .doodle{ animation-play-state:paused; }
  html.io-ready .badge::after,
  html.io-ready .toy,
  html.io-ready .doodle{ animation-play-state:running; }
</style>

          stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/></svg>

          stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="doodle d3" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">

var NO_LINK = "אין לינק כעת";

/* תג PDF שמופיע ליד שם כל נושא */
var PDF_BADGE =
  '<span class="pdf-badge" aria-label="קובץ PDF להורדה">' +
    '<svg viewBox="0 0 14 17" aria-hidden="true">' +
      '<path d="M2.2 1h5.4l4.2 4.2v10.6a.8.8 0 0 1-.8.8H2.2a.8.8 0 0 1-.8-.8V1.8A.8.8 0 0 1 2.2 1z"/>' +
      '<path d="M7.6 1v4.2h4.2"/>' +
    '</svg>PDF</span>';

function url(v){
  if(!v) return "";
  return /^https?:\/\//.test(v) ? v : BASE + v + ".pdf";
}

function noamTopicPrefix(topic, grade){
  if (topic && topic.x) return topic.x;
  var gradeMap = NOAM_PREFIX_FALLBACK[grade] || {};
  return topic ? (gradeMap[topic.id] || "") : "";
}

/* Universal Noam AI routing for every middle-school worksheet. */
function sheetHref(topic, grade, level, hex, row){
  if (!VIEWER.enabled || !topic || !hex) return url(hex);

  var prefix = noamTopicPrefix(topic, grade);

  /* Elementary remains unchanged until its manifests are generated. */
  if (!prefix || grade < 7 || grade > 9) return url(hex);

  var params = [
    "g="   + encodeURIComponent(row && row.sourceGrade || grade),
    "x="   + encodeURIComponent(row && row.sourcePrefix || prefix),
    "lv="  + encodeURIComponent(level),
    "pdf=" + encodeURIComponent(hex),
    "t="   + encodeURIComponent(row && row.sourceTitle || topic.t)
  ];

  if (row){
    ["a", "b", "c", "c2"].forEach(function(key){
      if (row[key]){
        params.push("p" + key + "=" + encodeURIComponent(row[key]));
      }
    });
  }

  return VIEWER.path + "?" + params.join("&");
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(m){
    return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m] || m;
  });
}

var state = { grade:DEFAULT_GRADE, q:"", group:"all", cross:false, track:"reg" };
var TRACK_GROUPS = { r9sep:true, r9oct:true };   /* קבוצות ששייכות למסלול המצומצם */

/* ---------- לשוניות כיתה ---------- */
function tabsRow(list, label, emoji){
  return '<div class="tabrow">' +
           '<span class="tabrow-label">' + emoji + ' ' + label + '</span>' +
           '<div class="tabrow-btns">' +
             list.map(function(g){
               return '<button class="grade-tab" type="button" role="tab" data-grade="' + g + '" ' +
                      'id="grade-tab-' + g + '" aria-controls="list" tabindex="' + (g === state.grade ? '0' : '-1') + '" ' +
                      'aria-selected="' + (g === state.grade) + '">' +
                      '<span aria-hidden="true">' + (GRADE_EMOJI[g] || "") + '</span> ' + GRADE_NAME[g] + '</button>';
             }).join("") +
           '</div>' +
         '</div>';
}

function buildGradeTabs(){
  var box = document.getElementById("grades");
  if (!box.dataset.bound){
    box.innerHTML = tabsRow(ELEMENTARY, "בית ספר יסודי", "🎒") +
                    tabsRow(MIDDLE,     "חטיבת ביניים",  "🏫");
    box.dataset.bound = "1";
    box.addEventListener("click", function(e){
      var btn = e.target.closest(".grade-tab");
      if(!btn) return;
      goToGrade(Number(btn.dataset.grade));
    });
    box.addEventListener("keydown", function(e){
      var btn = e.target.closest(".grade-tab");
      if (!btn || e.altKey || e.ctrlKey || e.metaKey) return;
      var grades = ELEMENTARY.concat(MIDDLE);
      var index = grades.indexOf(Number(btn.dataset.grade));
      if (e.key === "ArrowLeft") index = (index + 1) % grades.length;
      else if (e.key === "ArrowRight") index = (index + grades.length - 1) % grades.length;
      else if (e.key === "Home") index = 0;
      else if (e.key === "End") index = grades.length - 1;
      else return;
      e.preventDefault();
      goToGrade(grades[index], true);
    });
  }
  Array.prototype.forEach.call(box.querySelectorAll(".grade-tab"), function(btn){
    var selected = Number(btn.dataset.grade) === state.grade;
    btn.setAttribute("aria-selected", String(selected));
    btn.tabIndex = selected ? 0 : -1;
  });
  document.getElementById("list").setAttribute("aria-labelledby", "grade-tab-" + state.grade);
}

function goToGrade(g, focusTab){
  if (!DATA[g]) return;
  state.grade = g;
  state.group = "all";
  state.track = "reg";
  state.q = "";
  var qEl = document.getElementById("q");
  if (qEl) qEl.value = "";
  GRADE_ORDER = familyOf(g);
  document.getElementById("wrap").dataset.grade = g;
  buildGradeTabs();
  syncTrackbar();
  buildChips();
  setHeader();
  render();
  if (focusTab) document.getElementById("grade-tab-" + g).focus({ preventScroll:true });
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  try { window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); } catch(e){ window.scrollTo(0,0); }
}

function buildJump(){
  var box = document.getElementById("jump");
  if (!box) return;
  var inMiddle = MIDDLE.indexOf(state.grade) !== -1;
  var list  = inMiddle ? ELEMENTARY : MIDDLE;
  var label = inMiddle ? "🎒 מחפשים דפי עבודה ליסודי?" : "🏫 מחפשים דפי עבודה לחטיבת הביניים?";
  box.innerHTML =
    '<span class="jump-label">' + label + '</span>' +
    '<div class="jump-btns">' +
      list.map(function(g){
        return '<button class="jump-btn" type="button" data-grade="' + g + '">' +
               (GRADE_EMOJI[g] || "") + ' ' + GRADE_NAME[g] + '</button>';
      }).join("") +
    '</div>';
  if (box.dataset.bound) return;
  box.dataset.bound = "1";
  box.addEventListener("click", function(e){
    var b = e.target.closest(".jump-btn");
    if (b) goToGrade(Number(b.dataset.grade), true);
  });
}

/* Cards that actually render: children stay inside the parent card, and grade 9
   reduced-program groups are hidden on the regular track (and the reverse). */
function renderedCardCount(d){
  return d.topics.filter(function(t){
    if (t.parent !== undefined) return false;
    if (state.grade !== 9) return true;
    var isTrack = !!TRACK_GROUPS[t.g];
    return state.track === "red" ? isTrack : !isTrack;
  }).length;
}

function setHeader(){
  var d = DATA[state.grade];
  var esc = function(t){ return String(t).replace(/[&<>]/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m]; }); };
  document.getElementById("title").innerHTML =
    esc(GRADE_EMOJI[state.grade] || "") + " דפי עבודה ל<span class=\"hl\">" +
    esc(GRADE_NAME[state.grade]) + "</span> — לפי תכנית הלימודים תשפ״ז 2026";
  var gb = document.getElementById("gbadge");
  if (gb) gb.textContent = (GRADE_NAME[state.grade] || "").replace("כיתה ", "").trim();
  document.getElementById("lede").textContent =
    renderedCardCount(d) +
    " נושאים. בחרו דף והוא ייפתח בלשונית חדשה.";

  /* נועם AI זמין כרגע בחטיבת הביניים בלבד (ז׳–ט׳). ביסודי מוצג נוסח "בקרוב".
     כשה-AI יגיע ליסודי — מספיק להוסיף x לנושאים, והנוסח יתעדכן לבד. */
  var aiOn   = MIDDLE.indexOf(state.grade) !== -1;
  var aiHead = document.getElementById("aititle");
  var aitxt  = document.getElementById("aitext");
  var banner = document.getElementById("aibanner");

  if (banner) banner.classList.toggle("soon", !aiOn);

  if (aiHead){
    aiHead.textContent = aiOn
      ? "נתקעתם בתרגיל? נועם AI כאן לעזור"
      : "נועם AI בדרך גם ליסודי";
  }
  if (aitxt){
    aitxt.textContent = aiOn
      ? ("בכל דף עבודה של " + GRADE_NAME[state.grade] + " מחכה נועם AI: שואלים שאלה על תרגיל, " +
         "ומקבלים רמז או הסבר צעד אחר צעד — בדיוק כמו מורה פרטי. בחינם.")
      : ("העוזר החכם שמסביר תרגילים צעד אחר צעד זמין כרגע בדפי חטיבת הביניים — ובקרוב גם כאן. " +
         "בינתיים אפשר להוריד ולהדפיס את כל דפי העבודה של " + GRADE_NAME[state.grade] + " בחינם.");
  }

  buildJump();
}

/* ---------- שבבי תחום ---------- */
function buildChips(){
  var box = document.getElementById("chips");
  var groups = DATA[state.grade].groups.filter(function(g){
    var isTrack = !!TRACK_GROUPS[g.key];
    return state.track === "red" ? isTrack : !isTrack;
  });
  var items = [{ key:"all", name:"כל הנושאים" }].concat(groups);
  box.innerHTML = items.map(function(it){
    return '<button class="chip" type="button" data-group="' + it.key + '" aria-pressed="' +
           (it.key === state.group) + '">' + it.name + '</button>';
  }).join("");
}
document.getElementById("trackbar").addEventListener("click", function(e){
  var btn = e.target.closest(".track");
  if(!btn) return;
  state.track = btn.dataset.track;
  state.group = "all";
  syncTrackbar();
  buildChips();
  setHeader();
  render();
});
function syncTrackbar(){
  var bar = document.getElementById("trackbar");
  bar.hidden = (state.grade !== 9);
  Array.prototype.forEach.call(bar.querySelectorAll(".track"), function(b){
    b.setAttribute("aria-pressed", String(b.dataset.track === state.track));
  });
  var note = document.getElementById("tracknote");
  if(!note) return;
  note.textContent = state.track === "red"
    ? "מסלול נפרד לקראת 3 יח״ל — 162 שעות, לפי פריסת תשפ״ז"
    : "לפי פריסת תשפ״ז — רמה רגילה";
}
document.getElementById("chips").addEventListener("click", function(e){
  var btn = e.target.closest(".chip");
  if(!btn) return;
  state.group = btn.dataset.group;
  Array.prototype.forEach.call(this.children, function(c){
    c.setAttribute("aria-pressed", String(c.dataset.group === state.group));
  });
  render();
});

/* ---------- כרטיס ---------- */
function topicChildren(grade, topic){
  return DATA[grade].topics.filter(function(t){ return t.parent === topic.id; });
}

function levelLinksHTML(topic, grade){
  var row = DATA[grade].links[topic.id] || {};
  var buttons;

  if(row.one !== undefined){                 /* דף יחיד ללא רמות */
    var oneHref  = sheetHref(topic, grade, row.viewerLevel || "b", row.one, row);
    var oneLabel = row.oneLabel || "דף יחיד — כל הרמות";
    buttons = oneHref
      ? '<a class="lvl lvl--a lvl--one" href="' + oneHref + '" target="_blank" rel="noopener noreferrer" ' +
        'aria-label="' + esc(topic.t) + ' — ' + esc(oneLabel) + ', קובץ PDF">' + esc(oneLabel) + '</a>'
      : '<span class="lvl lvl--a lvl--one lvl--soon" aria-disabled="true" ' +
        'aria-label="' + esc(oneLabel) + ' — ' + NO_LINK + '">' + esc(oneLabel) +
        ' <span class="soon-note">(' + NO_LINK + ')</span></span>';
  } else {
    buttons = LEVELS.map(function(lv){
      var href  = url(row[lv.k]);
      var label = topic[lv.k + "Label"] || lv.label;
      if(!href){
        return '';
      }
      return '<a class="lvl ' + lv.cls + '" href="' + sheetHref(topic, grade, lv.k, row[lv.k], row) + '" target="_blank" rel="noopener noreferrer" ' +
             'aria-label="' + esc(topic.t) + ' — ' + esc(label) + ', קובץ PDF">' + esc(label) + '</a>';
    }).join("");
  }
  return buttons;
}

function cardHTML(topic, grade, cardIndex){
  var children = topicChildren(grade, topic);
  var buttons = levelLinksHTML(topic, grade);
  if (children.length){
    buttons = '<div class="worksheet-links">' + children.map(function(child){
      return levelLinksHTML(child, grade);
    }).join("") + '</div>' +
      '<details class="more-worksheets"><summary>תרגול נוסף לפי רמות</summary>' +
      '<div class="worksheet-links">' + buttons + '</div></details>';
  }

  var ico = ICONS[topic.ic] || ICONS.star;
  var _d = (typeof cardIndex === "number" ? cardIndex : 0) * 0.05;
  return '<article class="card' + (children.length ? ' card--bundle' : '') + '" data-g="' + topic.g + '" style="--d:' + _d.toFixed(2) + 's">' +
           '<div class="card-main">' +
             '<span class="tico" aria-hidden="true"><svg viewBox="0 0 24 24">' + ico + '</svg></span>' +
             '<div class="card-text"><h4>' + esc(topic.t) + PDF_BADGE + '</h4>' + (topic.d ? '<p>' + esc(topic.d) + '</p>' : '') +
               (topic.n ? '<p class="note">' + esc(topic.n) + '</p>' : '') +

           '</div>' +
           '<div class="levels' + (children.length ? ' levels--bundle' : '') + '">' + buttons + '</div>' +
         '</article>';
}

/* ---------- חיפוש חכם: ניקוד, סופיות, ריבוי, תחיליות, כתיב ---------- */
function searchNorm(s){
  return String(s)
    .replace(/[\u0591-\u05C7]/g, "")                 /* ניקוד וטעמים */
    .replace(/[״"'׳]/g, "")                            /* גרשיים */
    .replace(/ך/g,"כ").replace(/ם/g,"מ").replace(/ן/g,"נ")
    .replace(/ף/g,"פ").replace(/ץ/g,"צ")
    .replace(/גיאו/g,"גאו")                            /* גיאומטריה/גאומטריה */
    .replace(/[^\u05D0-\u05EA0-9a-zA-Z]+/g, " ")
    .toLowerCase().trim();
}
function stemsOf(tok){
  var out = [tok];
  ["וה","שה","מה","כש","ב","ה","ל","ו","מ","ש","כ"].forEach(function(p){
    if (tok.length > p.length + 2 && tok.indexOf(p) === 0) out.push(tok.slice(p.length));
  });
  var more = [];
  out.forEach(function(t){
    ["יות","ות","ים","י"].forEach(function(sf){
      if (t.length > sf.length + 2 && t.slice(-sf.length) === sf) more.push(t.slice(0, -sf.length));
    });
  });
  return out.concat(more);
}
function tokenHits(qtok, hayToks){
  var stems = stemsOf(qtok);
  for (var i = 0; i < hayToks.length; i++){
    var h = hayToks[i];
    for (var j = 0; j < stems.length; j++){
      var st = stems[j];
      if (st.length < 2) continue;
      if (h.indexOf(st) === 0) return true;              /* התאמת תחילית */
      if (st.indexOf(h) === 0 && h.length >= 3) return true;
    }
  }
  return false;
}
var _hayCache = {};
function topicHaystack(grade, t){
  var key = grade + ":" + t.id;
  if (!_hayCache[key]){
    var extra = (typeof SEARCH_TERMS !== "undefined" && SEARCH_TERMS[grade] && SEARCH_TERMS[grade][t.id]) || "";
    var gname = "";
    for (var gi = 0; gi < DATA[grade].groups.length; gi++){
      if (DATA[grade].groups[gi].key === t.g){ gname = DATA[grade].groups[gi].name; break; }
    }
    extra += " " + gname;
    extra += " " + topicChildren(grade, t).map(function(child){
      return child.t + " " + (child.d || "");
    }).join(" ");
    var base = searchNorm(t.t + " " + (t.d || "") + " " + extra).split(" ").filter(Boolean);
    var ex = [];
    base.forEach(function(w){ ex = ex.concat(stemsOf(w)); });
    _hayCache[key] = ex;
  }
  return _hayCache[key];
}
function topicMatches(grade, t, q){
  var qToks = searchNorm(q).split(" ").filter(Boolean);
  if (!qToks.length) return true;
  for (var i = 0; i < qToks.length; i++){
    if (!tokenHits(qToks[i], topicHaystack(grade, t))) return false;
  }
  return true;
}

/* ---------- סינון ---------- */
function matchesIn(grade, useGroup){
  var q = state.q.trim();
  return DATA[grade].topics.filter(function(t){
    if (t.parent !== undefined) return false;
    var isTrack = !!TRACK_GROUPS[t.g];
    var okTrack = grade !== 9 || (state.track === "red" ? isTrack : !isTrack);
    var okGroup = !useGroup || state.group === "all" || t.g === state.group;
    var okText  = !q || topicMatches(grade, t, q);
    return okTrack && okGroup && okText;
  });
}

function groupsHTML(grade, list){
  return DATA[grade].groups.map(function(g){
    var inGroup = list.filter(function(t){ return t.g === g.key; });
    if(!inGroup.length) return "";
    return '<section class="group">' +
             '<div class="group-head"><h3>' + g.name + '</h3>' +
               '<span class="rule"></span>' +
               '<span class="count">' + inGroup.length + ' נושאים</span>' +
             '</div>' +
             inGroup.map(function(t,ci){ return cardHTML(t, grade, ci); }).join("") +
           '</section>';
  }).join("");
}

var resultsStatusTimer;
function announceResults(total){
  clearTimeout(resultsStatusTimer);
  resultsStatusTimer = setTimeout(function(){
    var message = total ? "נמצאו " + total + " נושאים" : "לא נמצאו נושאים";
    if (!(state.cross && state.q.trim())) message += " ב" + GRADE_NAME[state.grade];
    if (state.q.trim()) message += ' לחיפוש "' + state.q.trim() + '"';
    document.getElementById("results-status").textContent = message + ".";
  }, 250);
}

function render(){
  var list = document.getElementById("list");
  var hint = document.getElementById("crosshint");
  var q    = state.q.trim();
  var html = "", total = 0;
  list.setAttribute("aria-labelledby", "grade-tab-" + state.grade + (state.cross && q ? " results-scope" : ""));

  if(state.cross && q){
    GRADE_ORDER.forEach(function(g){
      var m = matchesIn(g, false);
      if(!m.length) return;
      total += m.length;
      html += '<div class="grade-band"><h2>' + GRADE_NAME[g] + '</h2>' +
              '<span class="rule"></span>' +
              '<span class="count">' + m.length + ' נושאים</span></div>' +
              groupsHTML(g, m);
    });
    hint.textContent = total ? "נמצאו " + total + " נושאים בכל הכיתות" : "";
  } else {
    var m = matchesIn(state.grade, true);
    total = m.length;
    html  = '<h2 class="sr-only">דפי העבודה</h2>' + groupsHTML(state.grade, m);

    /* רמז: יש תוצאות גם בכיתות אחרות? */
    if(q && !state.cross){
      var other = 0;
      GRADE_ORDER.forEach(function(g){ if(g !== state.grade) other += matchesIn(g, false).length; });
      hint.textContent = other ? "יש עוד " + other + " תוצאות בכיתות אחרות" : "";
    } else {
      hint.textContent = "";
    }
  }

  announceResults(total);
  if(!total){
    list.innerHTML = '<h2 class="sr-only">דפי העבודה</h2><div class="empty"><strong>אין נושא שמתאים לחיפוש</strong>' +
                     'נסו מילה אחרת, או לחצו על "כל הנושאים" כדי לראות את הרשימה המלאה.</div>';
    postHeight();
    return;
  }

  list.innerHTML = html;
  postHeight();
}

/* מדווח את גובה התוכן לעמוד העוטף (שימושי אם רוצים גובה אוטומטי ב-Wix) */
var lastPostedHeight = 0;
var heightFrame = 0;
function postHeight(){
  try{
    var wrap = document.getElementById("wrap");
    // Content height can shrink below the iframe's current viewport after filtering.
    var h = wrap && wrap.getBoundingClientRect
      ? Math.ceil(Math.max(wrap.scrollHeight, wrap.getBoundingClientRect().height))
      : document.documentElement.scrollHeight;
    if (!h || h === lastPostedHeight) return;
    window.parent.postMessage({ type:"setHeight", height:h }, "*");
    lastPostedHeight = h;
  }catch(e){}
}
function scheduleHeight(){
  if (heightFrame) return;
  heightFrame = requestAnimationFrame(function(){
    heightFrame = 0;
    postHeight();
  });
}
// Optional progress panels, font preferences and late content also resize the embed.
if (window.ResizeObserver){
  var wrapSizeObserver = new window.ResizeObserver(scheduleHeight);
  wrapSizeObserver.observe(document.getElementById("wrap"));
}
document.getElementById("wrap").addEventListener("toggle", postHeight, true);

document.getElementById("list").addEventListener("toggle", function(e){
  if (e.target.classList.contains("more-worksheets")) postHeight();
}, true);

document.getElementById("q").addEventListener("input", function(e){
  state.q = e.target.value;
  render();
});
document.getElementById("crossq").addEventListener("change", function(e){
  state.cross = e.target.checked;
  render();
});

/* אתחול */
if(!DATA[state.grade]) state.grade = 7;
GRADE_ORDER = familyOf(state.grade);
document.getElementById("wrap").dataset.grade = state.grade;
buildGradeTabs();
syncTrackbar();
buildChips();
setHeader();
render();
window.addEventListener("resize", postHeight);

/* --- ביצועים: כל מה שלא נחוץ לציור הראשון רץ אחריו --- */
function afterPaint(fn){
  if ("requestIdleCallback" in window) requestIdleCallback(fn, { timeout: 800 });
  else setTimeout(fn, 1);
}
requestAnimationFrame(function(){
  requestAnimationFrame(function(){
    postHeight();                                   /* גובה מיד אחרי הציור */
    afterPaint(function(){
      document.documentElement.classList.add("io-ready");  /* אנימציות */
    });
  });
});
window.addEventListener("load", postHeight);
/* תמונות מגיעות מ-CDN ומשנות גובה כשהן נוחתות */
document.querySelectorAll("img").forEach(function(im){
  if (im.complete) return;
  im.addEventListener("load", postHeight, { once:true });
  im.addEventListener("error", postHeight, { once:true });
});
