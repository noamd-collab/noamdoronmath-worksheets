<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>דף עבודה · מתמטיקה · נועם דורון</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://amiramnoam.wixstudio.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">

<!-- KaTeX: pinned production math renderer -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/contrib/auto-render.min.js"></script>

<!-- PDF.js: clean, toolbar-free worksheet rendering; native viewer remains available as fallback -->
<script defer src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<style>
:root{
  --ink:#14213D;
  --accent:#7B2FD1;
  --accent-dark:#551F92;
  --tint:#EBDDFB;
  --paper:#E3DFD2;
  --grid:#BFBDB2;
  --muted:#5E5478;
  --r:18px;
}

[data-grade="7"]{
  --accent:#7B2FD1;
  --accent-dark:#551F92;
  --tint:#EBDDFB;
  --muted:#5E5478;
}

[data-grade="8"]{
  --accent:#D62A8E;
  --accent-dark:#961B62;
  --tint:#FBDCEE;
  --muted:#6E4F62;
}

[data-grade="9"]{
  --accent:#00A08A;
  --accent-dark:#00705F;
  --tint:#CFF3EC;
  --muted:#4A6B64;
}

*,*::before,*::after{
  box-sizing:border-box;
}

html,body{
  height:100%;
  margin:0;
}

body{
  font-family:'Assistant','Heebo',Arial,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;

  background:
    linear-gradient(var(--grid) 2.2px, transparent 2.2px) 0 0/45px 45px,
    linear-gradient(90deg, var(--grid) 2.2px, transparent 2.2px) 0 0/45px 45px,
    var(--paper);

  display:flex;
  flex-direction:column;
}

/* HEADER */

.bar{
  flex:none;
  display:flex;
  align-items:center;
  gap:10px 12px;
  flex-wrap:wrap;
  padding:10px 14px;
  background:#fff;
  border-bottom:3px solid var(--ink);
}

.bar h1{
  flex:0 1 auto;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:20px;
  margin:0;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.bar h1 span.ttl{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.context-chips{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  min-width:0;
}

.chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12.5px;
  line-height:1;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:6px 13px;
  background:var(--tint);
}

.level-switch{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.level-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12.5px;
  line-height:1;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:6px 13px;
  transition:transform .14s ease, box-shadow .14s ease, background .14s ease;
}

.level-link:hover{
  transform:translateY(-1px);
  box-shadow:-2px 2px 0 var(--ink);
}

.level-link[aria-current="page"]{
  color:#fff;
  background:var(--accent);
  box-shadow:-2px 2px 0 var(--ink);
  cursor:default;
  pointer-events:none;
}

.level-link[data-level="c"][aria-current="page"]{
  color:var(--ink);
  background:#FFD84D;
}

.level-link.is-loading,
.level-link[aria-disabled="true"]{
  opacity:.48;
  cursor:wait;
  pointer-events:none;
}

.bar .spacer{
  margin-inline-start:auto;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:8px 16px;
  box-shadow:-3px 3px 0 var(--ink);
}

.btn:hover{
  transform:translateY(-1px);
}

.btn--go{
  background:var(--accent);
  color:#fff;
}

/* LAYOUT */

.stage{
  flex:1;
  display:flex;
  min-height:0;
}

.pdfwrap{
  flex:1;
  min-width:0;
  min-height:0;
  padding:8px;
}

.pdf-surface{
  position:relative;
  width:100%;
  height:100%;
  min-height:0;
  overflow:hidden;
  background:#E9EAEC;
  border:3px solid var(--ink);
  border-radius:var(--r);
  box-shadow:-5px 5px 0 var(--ink);
}

.pdf-scroll{
  width:100%;
  height:100%;
  overflow:auto;
  overscroll-behavior:contain;
  padding:10px 10px 28px;
  background:#E9EAEC;
  scrollbar-gutter:stable;
}

.pdf-scroll.hidden{
  display:none;
}

.pdf-pages{
  width:max-content;
  min-width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  margin-inline:auto;
}

.pdf-page{
  position:relative;
  flex:none;
  width:min(900px, calc(100vw - 80px));
  max-width:none;
  min-height:320px;
  aspect-ratio:210 / 297;
  overflow:hidden;
  background:#fff;
  box-shadow:0 2px 12px rgba(20,33,61,.18);
}

.pdf-page canvas{
  display:block;
  max-width:none;
  height:auto;
  background:#fff;
}

.pdf-page-wait{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  min-height:220px;
  color:#6C7484;
  font-family:'Heebo',sans-serif;
  font-weight:800;
  font-size:13px;
}

.pdf-page.is-ready .pdf-page-wait{
  display:none;
}

.pdf-status{
  position:absolute;
  inset:0;
  z-index:4;
  display:grid;
  place-items:center;
  padding:24px;
  text-align:center;
  background:#E9EAEC;
  color:var(--ink);
  font-family:'Heebo',sans-serif;
  font-weight:900;
}

.pdf-status.hidden{
  display:none;
}

.pdf-native{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  display:block;
}

.pdf-native.hidden{
  display:none;
}

.pdf-tools{
  position:absolute;
  inset-block-start:10px;
  inset-inline-start:10px;
  z-index:8;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  max-width:calc(100% - 20px);
  padding:8px;
  background:rgba(255,255,255,.97);
  border:2.5px solid var(--ink);
  border-radius:14px;
  box-shadow:-3px 3px 0 var(--ink);
}

.pdf-tools.hidden{
  display:none;
}

.pdf-tool,
.pdf-tool-link{
  min-height:35px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12.5px;
  line-height:1;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:nowrap;
  cursor:pointer;
  border:2px solid var(--ink);
  border-radius:999px;
  padding:7px 11px;
}

.pdf-tool.primary{
  color:#fff;
  background:var(--accent);
}

.pdf-zoom-value{
  min-width:48px;
  text-align:center;
  font-family:'Heebo',sans-serif;
  font-size:12.5px;
  font-weight:900;
}

.pdf-fallback-message{
  position:absolute;
  inset-inline:12px;
  inset-block-end:12px;
  z-index:7;
  padding:8px 12px;
  color:var(--ink);
  background:rgba(255,255,255,.95);
  border:2px solid var(--ink);
  border-radius:12px;
  font-size:12px;
  font-weight:800;
}

.pdf-fallback-message.hidden{
  display:none;
}

.mobile-open{
  display:none;
}

/* AI PANEL */

.panel{
  flex:none;
  width:430px;
  max-width:46vw;
  padding:8px 8px 8px 0;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.panel.hidden{
  display:none;
}

.panel-in{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  border:3px solid var(--ink);
  border-radius:var(--r);
  box-shadow:-5px 5px 0 var(--ink);
  overflow:hidden;
}

.panel-head{
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:58px;
  padding:10px 12px;
  background:var(--tint);
  border-bottom:3px solid var(--ink);
}

.panel-head b{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:17px;
}

.panel-badge{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:4px 10px;
  color:var(--accent-dark);
  background:rgba(255,255,255,.68);
  border-radius:999px;
  font-family:'Heebo',sans-serif;
  font-size:11.5px;
  font-weight:900;
  white-space:nowrap;
}

.panel-head-spacer{
  flex:1;
}

.panel-back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:6px 12px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  font-family:'Heebo',sans-serif;
  font-size:12.5px;
  font-weight:900;
  cursor:pointer;
}

.panel-back[hidden]{
  display:none;
}

.panel-close{
  flex:none;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  color:var(--ink);
  background:transparent;
  border:0;
  border-radius:50%;
  font-size:22px;
  line-height:1;
  cursor:pointer;
}

.panel-close:hover{
  background:rgba(255,255,255,.58);
}

.panel-body{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:14px;
}

.step-title{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  margin:0 0 10px;
}

.opts{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

.qpick{
  display:flex;
  align-items:stretch;
  gap:8px;
  margin-bottom:8px;
}

.qinput{
  flex:1;
  min-width:0;
  font-family:'Heebo',sans-serif;
  font-weight:800;
  font-size:16px;
  color:var(--ink);
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:10px 12px;
  text-align:center;
}

.qinput:focus{
  outline:none;
  box-shadow:-3px 3px 0 var(--accent);
}

.inline-error{
  min-height:20px;
  margin:6px 0 0;
  color:#9A1D2F;
  font-weight:800;
  font-size:13px;
}

.opt{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  background:#fff;
  color:var(--ink);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:8px 15px;
  box-shadow:-2px 2px 0 var(--ink);
}

.picked{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:var(--tint);
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:9px 12px;
  font-weight:800;
  font-size:14px;
  margin-bottom:14px;
}

.picked button{
  margin-inline-start:auto;
  font-family:inherit;
  font-weight:800;
  font-size:12.5px;
  cursor:pointer;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  padding:4px 10px;
}

textarea{
  width:100%;
  min-height:92px;
  resize:vertical;
  font-family:inherit;
  font-size:15px;
  color:var(--ink);
  padding:11px 13px;
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
}

textarea:focus{
  outline:none;
  box-shadow:-3px 3px 0 var(--accent);
}

.send{
  width:100%;
  margin-top:10px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:#fff;
  background:var(--accent);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:11px;
  box-shadow:-3px 3px 0 var(--ink);
}

.send.qgo{
  flex:none;
  margin-top:0;
  width:auto;
  min-width:92px;
  padding-inline:18px;
}

/* 3 BUTTONS */

.assist-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin:8px 0 4px;
}

.assist-btn{
  width:100%;
  text-align:right;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:var(--ink);
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:14px;
  padding:12px 14px;
  box-shadow:-3px 3px 0 var(--ink);
}

.assist-btn.primary{
  background:var(--tint);
}

.assist-btn.custom{
  background:var(--accent);
  color:#fff;
}

.hint{
  font-size:12.5px;
  font-weight:700;
  color:var(--muted);
  margin:10px 0 0;
}

.note{
  background:var(--tint);
  border:2.5px dashed var(--ink);
  border-radius:12px;
  padding:14px;
  font-weight:700;
  font-size:14px;
  line-height:1.55;
}

.thinking{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:15px;
}

.dots::after{
  content:".";
  animation:dots 1.2s steps(4,end) infinite;
}

@keyframes dots{
  0%{content:"."}
  33%{content:".."}
  66%{content:"..."}
  100%{content:"."}
}

.answer{
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:14px;
  font-size:15px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.qecho{
  font-weight:800;
  font-size:13.5px;
  color:var(--muted);
  margin:0 0 10px;
}

.skel{
  height:38px;
  border-radius:999px;
  background:linear-gradient(90deg,#eee,#f7f7f7,#eee);
  background-size:200% 100%;
  animation:sh 1.2s linear infinite;
  margin-bottom:8px;
}

@keyframes sh{
  to{
    background-position:-200% 0;
  }
}

/* FLOATING AI BUTTON */

.fab{
  position:fixed;
  inset-block-end:18px;
  inset-inline-end:18px;
  z-index:40;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
  color:#fff;
  background:var(--accent);
  border:3px solid var(--ink);
  border-radius:999px;
  padding:13px 22px;
  box-shadow:-5px 5px 0 var(--ink);
}

.fab.hidden{
  display:none;
}

/* MOBILE */

@media (max-width:900px){

  body{
    height:auto;
    min-height:100%;
  }

  .bar{
    padding:10px 12px 12px;
  }

  .bar h1{
    width:100%;
    flex:1 1 100%;
    font-size:18px;
  }

  .context-chips{
    flex:1 1 auto;
  }

  .header-actions{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .header-actions .btn{
    width:100%;
    padding-inline:10px;
    text-align:center;
  }

  #pdfToolsToggle{
    display:none;
  }

  .stage{
    flex-direction:column;
  }

  .pdfwrap{
    padding:12px;
  }

  .pdf-surface{
    display:none;
  }

  .mobile-open{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:var(--r);
    box-shadow:-6px 6px 0 var(--ink);
    padding:26px 18px;
  }

  .mobile-open .big{
    font-size:40px;
    line-height:1;
  }

  .panel{
    width:100%;
    max-width:100%;
    padding:0 12px 12px;
  }

  .panel.hidden{
    display:flex;
  }

  .panel-in{
    min-height:340px;
  }

  .panel-close{
    display:none;
  }

  .fab{
    display:none;
  }
}


/* CHAT */
.chat-shell{
  display:flex;
  flex-direction:column;
  min-height:100%;
}

.chat-log{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-bottom:10px;
}

.chat-row{
  display:flex;
  width:100%;
}

.chat-row.student{
  justify-content:flex-start;
}

.chat-row.tutor{
  justify-content:flex-end;
}

.chat-bubble{
  max-width:96%;
  border:2.5px solid var(--ink);
  border-radius:16px;
  padding:10px 12px;
  font-size:13.5px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
  box-shadow:-2px 2px 0 var(--ink);
}

.chat-row.student .chat-bubble{
  background:var(--accent);
  color:#fff;
  border-bottom-right-radius:5px;
}

.chat-row.tutor .chat-bubble{
  background:var(--tint);
  color:var(--ink);
  border-bottom-left-radius:5px;
}

.chat-name{
  display:block;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:11.5px;
  margin-bottom:3px;
  opacity:.78;
}

.chat-thinking{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:900;
}

.chat-quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:10px 0 8px;
}

.chat-quick .assist-btn{
  font-size:13px;
  padding:9px 10px;
  text-align:center;
}

.chat-compose{
  position:sticky;
  bottom:-14px;
  margin:0 -2px -14px;
  padding:10px 2px 14px;
  background:#fff;
  border-top:2px solid #ece8f1;
}

.chat-compose-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.chat-input{
  flex:1;
  min-height:48px;
  max-height:120px;
  resize:vertical;
  margin:0;
}

.chat-send{
  flex:none;
  width:auto;
  min-width:72px;
  margin:0;
  padding:11px 13px;
}

.chat-send[disabled],
.assist-btn[disabled]{
  opacity:.55;
  cursor:not-allowed;
}

.chat-error{
  background:#fff4f4;
  border:2px dashed #9A1D2F;
  border-radius:12px;
  padding:10px 12px;
  font-size:13px;
  font-weight:800;
  color:#7b1726;
}


/* ---------- IMAGE ATTACHMENT ---------- */
.chat-tools{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0 0;
  flex-wrap:wrap;
}

.image-pick{
  width:auto;
  margin:0;
  padding:8px 12px;
  font-size:13px;
  background:#fff;
  color:var(--ink);
}

.image-pick[disabled]{
  opacity:.55;
  cursor:not-allowed;
}

.image-preview{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:8px;
  padding:8px 10px;
  background:var(--tint);
  border:2px solid var(--ink);
  border-radius:12px;
}

.image-preview img{
  width:54px;
  height:54px;
  object-fit:cover;
  border:2px solid var(--ink);
  border-radius:9px;
  background:#fff;
}

.image-meta{
  min-width:0;
  flex:1;
  font-size:12.5px;
  font-weight:800;
  line-height:1.35;
}

.image-meta b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.image-remove{
  flex:none;
  border:2px solid var(--ink);

  for (var j = 0; j < bytes.length; j += 1){

  }

}

function escapeRegExp(value){
  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );
}

function parseIndexLevelPdfs(
  source
){

  if (
    !okGrade ||
    !okX ||
    !source
  ){
    return null;
  }

  var topicMatch =
    new RegExp(
      "\\{\\s*id\\s*:\\s*(\\d+)\\s*,\\s*x\\s*:\\s*[\"']" +
      escapeRegExp(x) +
      "[\"']",
      "i"
    )
    .exec(source);

  if (!topicMatch){
    return null;
  }

  var topicId =
    parseInt(
      topicMatch[1],
      10
    );

  var dataStart =
    source.indexOf(
      "var DATA"
    );

  var gradeSearch =
    dataStart >= 0
      ? source.slice(dataStart)
      : source;

  var gradeMarker =
    new RegExp(
      "(?:^|\\n)\\s*" +
      g +
      "\\s*:\\s*\\{\\s*(?:\\n\\s*)?links\\s*:\\s*\\{",
      "m"
    )
    .exec(gradeSearch);

  if (!gradeMarker){
    return null;
  }

  var gradeStart =
    gradeMarker.index;

  var groupsIndex =
    gradeSearch.indexOf(
      "groups:",
      gradeStart
    );

  if (groupsIndex < 0){
    return null;
  }

  var gradeBlock =
    gradeSearch.slice(
      gradeStart,
      groupsIndex
    );

  var rowMatch =
    new RegExp(
      "(?:^|\\n)\\s*" +
      topicId +
      "\\s*:\\s*\\{([\\s\\S]*?)\\}",
      "m"
    )
    .exec(gradeBlock);

  if (!rowMatch){
    return null;
  }

  var row =
    rowMatch[1];

  var found = {
    a:"",
    b:"",
    c:""
  };

  ["a", "b", "c"]
    .forEach(
      function(key){

        var match =
          new RegExp(
            "(?:^|[,\\s])" +
            key +
            "\\s*:\\s*[\"']([0-9a-f]{32})[\"']",
            "i"
          )
          .exec(row);

        if (match){
          found[key] =
            match[1]
            .toLowerCase();
        }
      }
    );

  return found;
}

function discoverSiblingLevels(){

  renderLevelSwitch(

      return response.text();
    }
  )
  .then(

      var discovered =

    }
  )
  .catch(
    function(error){
      console.warn(
        "LEVEL SWITCH DISCOVERY:",
        error
      );

      renderLevelSwitch(false);
    }
  );
}

function createPdfPageShells(
  doc
){

  var html =
    "";

  for (
    var pageNumber = 1;
    pageNumber <= doc.numPages;
    pageNumber += 1
  ){
    html +=
      '<div class="pdf-page" data-page="' +
      pageNumber +
      '" data-state="idle">' +
        '<canvas aria-label="עמוד ' +
        pageNumber +
        '"></canvas>' +
        '<div class="pdf-page-wait">עמוד ' +
        pageNumber +
        '</div>' +
      '</div>';
  }

  pdfPages.innerHTML =
    html;
}

function renderPdfPage(
  pageNumber,
  version
){

  if (
    !pdfDocument ||
    version !== pdfRenderVersion
  ){
    return;
  }

  var pageElement =
    pdfPages.querySelector(
      '[data-page="' +
      pageNumber +
      '"]'
    );

  if (!pageElement){
    return;
  }

  var state =
    pageElement.getAttribute(
      "data-state"
    );

  if (
    state === "rendering" ||
    state === "ready"
  ){
    return;
  }

  pageElement.setAttribute(
    "data-state",
    "rendering"
  );

  pdfDocument
    .getPage(pageNumber)
    .then(
      function(page){

        if (
          version !== pdfRenderVersion
        ){
          return;
        }

        var baseViewport =
          page.getViewport({
            scale:1
          });

        var availableWidth =
          Math.max(
            280,
            pdfScroll.clientWidth -
            34
          );

        var cssScale =
          (
            availableWidth /
            baseViewport.width
          ) *
          pdfZoom;

        var viewport =
          page.getViewport({
            scale:cssScale
          });

        var pixelRatio =
          Math.min(
            window.devicePixelRatio || 1,
            1.25
          );

        var canvas =
          pageElement.querySelector(
            "canvas"
          );

        var context =
          canvas.getContext(
            "2d",
            {
              alpha:false
            }
          );

        canvas.width =
          Math.max(
            1,
            Math.floor(
              viewport.width *
              pixelRatio
            )
          );

        canvas.height =
          Math.max(
            1,
            Math.floor(
              viewport.height *
              pixelRatio
            )
          );

        canvas.style.width =
          Math.floor(
            viewport.width
          ) +
          "px";

        canvas.style.height =
          Math.floor(
            viewport.height
          ) +
          "px";

        pageElement.style.width =
          Math.floor(
            viewport.width
          ) +
          "px";

        pageElement.style.height =
          Math.floor(
            viewport.height
          ) +
          "px";

        pageElement.style.aspectRatio =
          viewport.width +
          " / " +
          viewport.height;

        var renderTask =
          page.render({
            canvasContext:context,
            viewport:viewport,
            transform:
              pixelRatio === 1
                ? null
                : [
                    pixelRatio,
                    0,
                    0,
                    pixelRatio,
                    0,
                    0
                  ]
          });

        pageElement._renderTask =
          renderTask;

        return renderTask.promise;
      }
    )
    .then(
      function(){

        if (
          version !== pdfRenderVersion
        ){
          return;
        }

        pageElement.setAttribute(
          "data-state",
          "ready"
        );

        pageElement.classList
          .add(
            "is-ready"
          );
      }
    )
    .catch(
      function(error){

        if (
          error &&
          error.name ===
          "RenderingCancelledException"
        ){
          return;
        }

        console.warn(
          "PDF PAGE RENDER:",
          pageNumber,
          error
        );

        pageElement.setAttribute(
          "data-state",
          "error"
        );

        var wait =
          pageElement.querySelector(
            ".pdf-page-wait"
          );

        if (wait){
          wait.textContent =
            "לא הצלחתי להציג את עמוד " +
            pageNumber;
        }
      }
    );
}

function observePdfPages(){

  if (pdfObserver){
    pdfObserver.disconnect();
  }

  var version =
    pdfRenderVersion;

  if (
    "IntersectionObserver" in window
  ){
    pdfObserver =
      new IntersectionObserver(
        function(entries){
          entries.forEach(
            function(entry){
              if (entry.isIntersecting){
                renderPdfPage(
                  Number(
                    entry.target.dataset.page
                  ),
                  version
                );
              }
            }
          );
        },
        {
          root:pdfScroll,
          rootMargin:"900px 0px",
          threshold:.01
        }
      );

    pdfPages
      .querySelectorAll(
        ".pdf-page"
      )
      .forEach(
        function(pageElement){
          pdfObserver.observe(
            pageElement
          );
        }
      );

  }else{
    for (
      var pageNumber = 1;
      pageNumber <= pdfDocument.numPages;
      pageNumber += 1
    ){
      renderPdfPage(
        pageNumber,
        version
      );
    }
  }
}

function resetPdfRendering(){

  if (!pdfDocument){
    return;
  }

  pdfRenderVersion += 1;

  pdfPages
    .querySelectorAll(
      ".pdf-page"
    )
    .forEach(
      function(pageElement){

        if (
          pageElement._renderTask &&
          typeof pageElement._renderTask.cancel ===
            "function"
        ){
          try{
            pageElement._renderTask.cancel();
          }catch(e){}
        }

        pageElement._renderTask =
          null;

        pageElement.classList
          .remove(
            "is-ready"
          );

        pageElement.setAttribute(
          "data-state",
          "idle"
        );

        var canvas =
          pageElement.querySelector(
            "canvas"
          );

        if (canvas){
          canvas.width = 1;
          canvas.height = 1;
          canvas.style.width = "";
          canvas.style.height = "";
        }

        pageElement.style.width = "";
        pageElement.style.height = "";
        pageElement.style.aspectRatio = "";
      }
    );

  observePdfPages();
}

function setPdfZoom(
  value
){

  pdfZoom =
    Math.max(
      .7,
      Math.min(
        1.7,
        Math.round(
          value * 10
        ) /
        10
      )
    );

  pdfZoomValue.textContent =
    Math.round(
      pdfZoom *
      100
    ) +
    "%";

  resetPdfRendering();
}

function schedulePdfResize(){

  clearTimeout(
    pdfResizeTimer
  );

  pdfResizeTimer =
    setTimeout(
      function(){

        var nextWidth =
          Math.round(
            pdfScroll.clientWidth
          );

        if (
          !pdfDocument ||
          Math.abs(
            nextWidth -
            pdfLastWidth
          ) < 3
        ){
          return;
        }

        pdfLastWidth =
          nextWidth;

        resetPdfRendering();
      },
      180
    );
}

function initPdfExperience(){

  /* Default for every viewport: the browser's own PDF viewer.
     It renders the embedded Hebrew fonts correctly. */
  setPdfStatus(
    "",
    false
  );

  setNativePdfMode(true);

  showPdfTools(true);

  /* Noam overlays require the page canvas on every viewport. */

  if (
    !PDF_CLEAN_OPT_IN
  ){
    pdfCleanAvailable =
      false;

    return;
  }

  if (
    !window.pdfjsLib
  ){
    showPdfFallback(
      "לא ניתן לטעון את התצוגה הנקייה. הוצגה תצוגת ה-PDF המלאה."
    );
    return;
  }

  try{
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      PDFJS_BASE + "build/pdf.worker.min.js";
  }catch(e){}

  setPdfStatus(
    "טוען את דף העבודה…",
    true
  );

  var loadTask =
    window.pdfjsLib
      .getDocument({
        url:pdfUrl,
        withCredentials:false,
        cMapUrl:PDFJS_CMAP_URL,
        cMapPacked:true,
        standardFontDataUrl:PDFJS_STD_FONT_URL,
        disableFontFace:true,
        useSystemFonts:false
      });

  loadTask.promise
    .then(
      function(doc){

        pdfDocument =
          doc;

        pdfCleanAvailable =
          true;

        pdfFallbackMessage.classList
          .add(
            "hidden"
          );

        createPdfPageShells(
          doc
        );

        pdfRenderVersion += 1;
        pdfLastWidth =
          Math.round(
            pdfScroll.clientWidth
          );

        setPdfStatus(
          "",
          false
        );

        observePdfPages();

        /* The static manifest pins live on the clean page layer. */
        setNativePdfMode(false);

        if (
          "ResizeObserver" in window
        ){
          pdfResizeObserver =
            new ResizeObserver(
              schedulePdfResize
            );

          pdfResizeObserver.observe(
            pdfScroll
          );
        }else{
          window.addEventListener(
            "resize",
            schedulePdfResize
          );
        }
      }
    )
    .catch(
      function(error){
        console.warn(
          "CLEAN PDF VIEWER:",
          error
        );

        showPdfFallback(
          "התצוגה הנקייה נחסמה בדפדפן; הוצגה תצוגת ה-PDF המלאה."
        );
      }
    );
}

function loadStaticManifest(){
  if (!aiReady){
    fab.classList.add("hidden");
    return Promise.resolve(null);
  }

  return fetch(MANIFEST_PATH, { cache:"no-store" })
    .then(function(response){
      if (!response.ok){ throw new Error("manifest " + response.status); }
      return response.json();
    })
    .then(function(data){
      if (!data || !Array.isArray(data.exercises) || !data.exercises.length){
        throw new Error("empty manifest");
      }
      manifest = data;
      manifestReady = true;
      fab.classList.remove("hidden");
      renderManifestPins();
      return data;
    })
    .catch(function(error){
      console.warn("NOAM STATIC MANIFEST:", error);
      manifestReady = false;
      manifest = null;
      fab.classList.add("hidden");
      return null;
    });
}

function renderManifestPins(){
  if (!manifestReady || !pdfPages){ return; }

  pdfPages.querySelectorAll(".noam-exercise-pin")
    .forEach(function(button){ button.remove(); });

  manifest.exercises.forEach(function(exercise){
    var pin = exercise.pin || {};
    var pageNumber = Number(pin.page || 0);
    var pageElement = pdfPages.querySelector('.pdf-page[data-page="' + pageNumber + '"]');
    if (!pageElement){ return; }

    /*
      Manifest coordinates point at the printed RTL question/part marker.
      Keep the robot beside that marker, in the clear right-hand margin,
      rather than centering it over the Hebrew letter or question number.
    */
    var pinX = Number(pin.x);
    if (!isFinite(pinX)){ pinX = .92; }
    pinX = Math.max(.02,Math.min(.98,pinX));
    var pinLeft = "clamp(16px, calc(" + (pinX*100) + "% + 52px), calc(100% - 16px))";

    var button = document.createElement("button");
    button.type = "button";
    button.className = "noam-exercise-pin";
    button.textContent = "🤖";
    button.style.left = pinLeft;
    button.style.top = (Math.max(.02,Math.min(.98,Number(pin.y)||.2))*100) + "%";
    button.dataset.exerciseId = exercise.id;
    button.dataset.label = exerciseLabel(exercise) + " · העזר בנועם AI";
    button.setAttribute("aria-label", button.dataset.label);
    button.addEventListener("click", function(event){
      event.preventDefault();
      event.stopPropagation();
      selectManifestExercise(exercise, button);
    });
    pageElement.appendChild(button);
  });
}

if (window.MutationObserver){
  new MutationObserver(function(){
    if (manifestReady){ renderManifestPins(); }
  }).observe(pdfPages,{childList:true});
}

function selectManifestExercise(exercise, pin){
  selectedExercise = exercise;
  if (selectedPin){ selectedPin.classList.remove("is-active"); }
  selectedPin = pin || null;
  if (selectedPin){ selectedPin.classList.add("is-active"); }
  exerciseThread(exercise.id);
  openNoamPanel();
  renderNoamChat();
}

function renderExercisePicker(){
  panelBack.hidden = true;
  if (!manifestReady){
    panelBody.innerHTML = '<div class="note">נועם AI עדיין אינו זמין לדף הזה.</div>';
    return;
  }

  var buttons = manifest.exercises.map(function(exercise){
    return '<button type="button" data-exercise-id="' + escAttr(exercise.id) + '">' +
      esc(exercise.part ? (exercise.q + exercise.part) : String(exercise.q)) + '</button>';
  }).join("");

  panelBody.innerHTML =
    '<p class="step-title">בחרו שאלה או לחצו על 🤖 ליד הסעיף בדף</p>' +
    '<div class="noam-question-list">' + buttons + '</div>';

  panelBody.querySelectorAll("[data-exercise-id]").forEach(function(button){
    button.addEventListener("click",function(){
      var id = button.getAttribute("data-exercise-id");
      var exercise = manifest.exercises.find(function(item){ return item.id===id; });
      if (exercise){ selectManifestExercise(exercise,null); }
    });
  });
}

function addTranscriptBubble(container, role, text, kind){
  var row = document.createElement("div");
  row.className = "noam-row " + role;
  var bubble = document.createElement("div");
  bubble.className = "noam-bubble";
  if (kind && role === "user"){
    var label = document.createElement("span");
    label.className = "noam-kind";
    label.textContent = kind;
    bubble.appendChild(label);
  }
  var content = document.createElement("span");
  content.textContent = text;
  bubble.appendChild(content);
  row.appendChild(bubble);
  container.appendChild(row);
  return row;
}

function renderNoamChat(){
  if (!selectedExercise){ return renderExercisePicker(); }
  panelBack.hidden = false;
  var thread = exerciseThread(selectedExercise.id);
  var text = selectedExercise.text || selectedExercise.prompt || selectedExercise.context || "";

  panelBody.innerHTML =
    '<div class="noam-picked">' +
      '<div class="noam-picked-label">' + esc(exerciseLabel(selectedExercise)) + '</div>' +
      '<div class="noam-picked-preview" id="noamPickedPreview" hidden></div>' +
      '<div class="noam-picked-text" id="noamPickedText">' + esc(text) + '</div>' +
    '</div>' +
    '<div class="noam-actions">' +
      '<button type="button" class="noam-action" id="noamOverview">הסבר כללי</button>' +
      '<button type="button" class="noam-action primary" id="noamHint">רמז</button>' +
      '<button type="button" class="noam-action" id="noamMistake" hidden>טעות נפוצה</button>' +
    '</div>' +
    '<div class="noam-thread-tools">' +
      '<button type="button" class="noam-link-button" id="noamNewThread">שיחה חדשה</button>' +
      '<button type="button" class="noam-link-button" id="noamLocate">הצג בדף</button>' +
    '</div>' +
    '<div class="noam-transcript" id="noamTranscript"></div>' +
    '<div class="noam-compose">' +
      '<label for="noamQuestion">יש לי שאלה</label>' +
      '<textarea id="noamQuestion" maxlength="700" placeholder="למשל: איך מתחילים?" aria-describedby="noamComposeHelp"></textarea>' +
      '<div class="noam-compose-help" id="noamComposeHelp"><span dir="ltr">Enter</span> לשליחה · <span dir="ltr">Shift+Enter</span> לשורה חדשה</div>' +
      '<button type="button" class="noam-send" id="noamSend">שלח לנועם AI</button>' +
    '</div>';

  var transcript = document.getElementById("noamTranscript");
  if (!thread.messages.length){
    transcript.innerHTML = '<div class="noam-empty">בחרו סוג עזרה או כתבו שאלה. השיחה תישמר גם אם תעברו לסעיף אחר.</div>';
  }else{
    thread.messages.forEach(function(message){
      addTranscriptBubble(transcript,message.role,message.text,message.kind||"");
    });
  }
  if (busy){
    var thinkingText=pendingExerciseId===selectedExercise.id
      ? "נועם AI חושב…"
      : "נועם AI עדיין חושב על הסעיף הקודם…";
    var thinking=addTranscriptBubble(transcript,"assistant",thinkingText,"");
    var thinkingBubble=thinking.querySelector(".noam-bubble");
    thinkingBubble.classList.add("thinking");
    thinkingBubble.setAttribute("role","status");
    thinkingBubble.setAttribute("aria-live","polite");
    thinkingBubble.setAttribute("aria-atomic","true");
    var dots=document.createElement("span");
    dots.className="noam-thinking-dots";
    dots.setAttribute("aria-hidden","true");
    for (var i=0;i<3;i++){ dots.appendChild(document.createElement("span")); }
    thinkingBubble.appendChild(dots);
  }

  var hintButton = document.getElementById("noamHint");
  hintButton.textContent = thread.hintIndex===0 ? "רמז" : thread.hintIndex===1 ? "רמז נוסף" : thread.hintIndex===2 ? "רמז אחרון" : "3 רמזים ניתנו";
  hintButton.disabled = busy || thread.hintIndex>=3;
  document.getElementById("noamMistake").hidden = thread.hintIndex<3;

  document.getElementById("noamOverview").addEventListener("click",function(){ askNoam("overview","תן לי הסבר כללי קצר על הרעיון הדרוש כאן."); });
  hintButton.addEventListener("click",function(){ askNoam("hint","תן לי רמז."); });
  document.getElementById("noamMistake").addEventListener("click",function(){ askNoam("common_mistake","מה הטעות הנפוצה שכדאי להיזהר ממנה כאן?"); });
  document.getElementById("noamNewThread").addEventListener("click",function(){
    threads[selectedExercise.id]={hintIndex:0,history:[],messages:[]};
    saveNoamState();renderNoamChat();
  });
  document.getElementById("noamLocate").addEventListener("click",locateSelectedExercise);
  document.getElementById("noamSend").addEventListener("click",function(){
    var input=document.getElementById("noamQuestion");
    var message=String(input.value||"").trim().slice(0,700);
    if (!message){ input.focus(); return; }
    askNoam("free_question",message);
  });
  document.getElementById("noamQuestion").addEventListener("keydown",function(event){
    if (event.key==="Enter"&&!event.shiftKey&&!event.isComposing&&event.keyCode!==229){
      event.preventDefault();document.getElementById("noamSend").click();
    }
  });

  setNoamBusy(busy);
  transcript.scrollTop = transcript.scrollHeight;
  renderPanelMath(panelBody);
  renderExercisePreview(selectedExercise,0);
}

function locateSelectedExercise(){
  if (!selectedExercise){ return; }
  if (pdfNativeActive && pdfCleanAvailable){ setNativePdfMode(false); }
  var page = pdfPages.querySelector('.pdf-page[data-page="' + selectedExercise.pin.page + '"]');
  if (page){ page.scrollIntoView({behavior:"smooth",block:"center"}); }
}

function setNoamBusy(value){
  busy=!!value;
  if (!busy){ pendingExerciseId=null; }
  ["noamOverview","noamHint","noamMistake","noamSend","noamQuestion","noamNewThread"]
    .forEach(function(id){ var el=document.getElementById(id);if(el){el.disabled=busy;} });
}

function syntheticAnalysis(exercise){
  var prompt = exercise.prompt || [exercise.context,exercise.text].filter(Boolean).join("\n");
  return {
    readable:true,
    readability_confidence:1,
    content_type:"static_manifest_exercise",
    transcription:prompt,
    math_content:exercise.text||prompt,
    problem_statement:prompt,
    diagram_description:"",
    student_work:"",
    extracted_entities:{numbers:[],expressions:[],labels:[],units:[]},
    uncertain_parts:[],
    complexity:exercise.needsVision ? "medium" : "easy",
    complexity_reasons:["static worksheet manifest"]
  };
}

function cropExerciseCanvas(exercise){
  return new Promise(function(resolve,reject){
    var crop=exercise.crop||{};
    var page=pdfPages.querySelector('.pdf-page[data-page="'+Number(crop.page||0)+'"]');
    var source=page && page.querySelector("canvas");
    if (!source || source.width<20 || source.height<20){ reject(new Error("page canvas unavailable"));return; }
    var sx=Math.max(0,Math.floor((Number(crop.x)||0)*source.width));
    var sy=Math.max(0,Math.floor((Number(crop.y)||0)*source.height));
    var sw=Math.max(20,Math.min(source.width-sx,Math.floor((Number(crop.w)||1)*source.width)));
    var sh=Math.max(20,Math.min(source.height-sy,Math.floor((Number(crop.h)||1)*source.height)));
    var maxDim=1500;var scale=Math.min(1,maxDim/Math.max(sw,sh));
    var target=document.createElement("canvas");
    target.width=Math.max(20,Math.round(sw*scale));
    target.height=Math.max(20,Math.round(sh*scale));
    var ctx=target.getContext("2d",{alpha:false});
    ctx.fillStyle="#fff";ctx.fillRect(0,0,target.width,target.height);
    ctx.drawImage(source,sx,sy,sw,sh,0,0,target.width,target.height);
    resolve(target);
  });
}

function cropExerciseImage(exercise){
  return cropExerciseCanvas(exercise).then(function(canvas){
    return canvas.toDataURL("image/jpeg",.84);
  });
}

function cacheExercisePreview(exerciseId,dataUrl){
  if (!exercisePreviewCache[exerciseId]){
    exercisePreviewOrder.push(exerciseId);
  }
  exercisePreviewCache[exerciseId]=dataUrl;
  while (exercisePreviewOrder.length>16){
    delete exercisePreviewCache[exercisePreviewOrder.shift()];
  }
}

function showExercisePreview(exercise,dataUrl){
  var preview=document.getElementById("noamPickedPreview");
  var fallback=document.getElementById("noamPickedText");
  if (!preview||!fallback||!selectedExercise||selectedExercise.id!==exercise.id){return;}
  var image=document.createElement("img");
  image.src=dataUrl;
  image.alt=exerciseLabel(exercise)+" — "+String(exercise.text||exercise.prompt||"").slice(0,500);
  preview.replaceChildren(image);
  preview.hidden=false;
  fallback.hidden=true;
}

function renderExercisePreview(exercise,attempt){
  if (!exercise||!exercise.crop){return;}
  if (exercisePreviewCache[exercise.id]){
    showExercisePreview(exercise,exercisePreviewCache[exercise.id]);
    return;
  }
  cropExerciseCanvas(exercise)
    .then(function(canvas){
      var dataUrl=canvas.toDataURL("image/png");
      cacheExercisePreview(exercise.id,dataUrl);
      showExercisePreview(exercise,dataUrl);
    })
    .catch(function(){
      if (attempt>=12||!selectedExercise||selectedExercise.id!==exercise.id){return;}
      renderPdfPage(Number(exercise.crop.page||0),pdfRenderVersion);
      setTimeout(function(){renderExercisePreview(exercise,attempt+1);},150);
    });
}

function getExerciseAnalysis(exercise){
  if (analysisCache[exercise.id]){ return Promise.resolve(analysisCache[exercise.id]); }
  var fallback=syntheticAnalysis(exercise);
  if (!exercise.needsVision){ analysisCache[exercise.id]=fallback;saveNoamState();return Promise.resolve(fallback); }

  return cropExerciseImage(exercise)
    .then(function(imageDataUrl){
      return postJson(API+"/noamImageAnalyze",{imageDataUrl:imageDataUrl,clientRequestId:"manifest-"+Date.now().toString(36)});
    })
    .then(function(result){
      if (!result||!result.ok||!result.analysis){ throw new Error("vision unavailable"); }
      var analysis=result.analysis;
      var semantic=exercise.prompt||"";
      analysis.transcription=[semantic,analysis.transcription||""].filter(Boolean).join("\n");
      analysis.problem_statement=[semantic,analysis.problem_statement||""].filter(Boolean).join("\n");
      analysisCache[exercise.id]=analysis;saveNoamState();return analysis;
    })
    .catch(function(error){
      console.warn("NOAM VISION FALLBACK:",exercise.id,error);
      analysisCache[exercise.id]=fallback;saveNoamState();return fallback;
    });
}

function askNoam(helpKind,studentMessage){
  if (!selectedExercise||busy){return;}
  var exercise=selectedExercise;
  var thread=exerciseThread(exercise.id);
  var hintIndex=helpKind==="hint"?thread.hintIndex:0;
  var kindLabel=helpKind==="overview"?"הסבר כללי":helpKind==="hint"?("רמז "+(hintIndex+1)):helpKind==="common_mistake"?"טעות נפוצה":"";
  var visible=helpKind==="overview"?"אפשר הסבר כללי קצר?":helpKind==="hint"?("אפשר רמז "+(hintIndex+1)+"?"):helpKind==="common_mistake"?"מה הטעות הנפוצה כאן?":studentMessage;
  var historyQuestion=kindLabel||studentMessage;
  var started=Date.now();

  thread.messages.push({role:"user",text:visible,kind:kindLabel});
  pendingExerciseId=exercise.id;
  saveNoamState();setNoamBusy(true);renderNoamChat();

  getExerciseAnalysis(exercise)
    .then(function(analysis){
      var solverMessage=String(studentMessage||"");
      solverMessage=solverMessage.slice(
        0,
        Math.max(0,SOLVER_MESSAGE_MAX-MATH_OUTPUT_INSTRUCTION.length)
      )+MATH_OUTPUT_INSTRUCTION;
      return postJson(API+"/noamImageSolve",{
        exerciseId:exercise.id,
        grade:g,
        level:LEVEL[lv],
        topic:ttl,
        helpKind:helpKind,
        hintIndex:hintIndex,
        studentMessage:solverMessage,
        conversationHistory:thread.history,
        imageAnalysis:analysis
      });
    })
    .then(function(result){
      if (!result||!result.ok||!result.answer){ throw new Error((result&&result.error)||"נועם AI לא זמין כרגע."); }
      var elapsed=Date.now()-started;
      return new Promise(function(resolve){setTimeout(function(){resolve(result);},Math.max(0,MIN_WAIT-elapsed));});
    })
    .then(function(result){
      var answer=String(result.answer||"").trim();
      thread.messages.push({role:"assistant",text:answer,kind:""});
      thread.history.push({role:"user",content:historyQuestion},{role:"assistant",content:answer});
      thread.history=thread.history.slice(-8);
      thread.messages=thread.messages.slice(-60);
      if (helpKind==="hint"){thread.hintIndex=Math.min(3,thread.hintIndex+1);}
      saveNoamState();setNoamBusy(false);renderNoamChat();
    })
    .catch(function(error){
      thread.messages.push({role:"assistant",text:String(error&&error.message||"לא הצלחנו לקבל תשובה כרגע."),kind:""});
      saveNoamState();setNoamBusy(false);renderNoamChat();
    });
}

function postJson(endpoint,payload){
  var controller=("AbortController" in window)?new AbortController():null;
  var timer=setTimeout(function(){if(controller){controller.abort();}},TIMEOUT);
  return fetch(endpoint,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload),
    signal:controller?controller.signal:undefined
  }).then(function(response){
    clearTimeout(timer);
    return response.json().catch(function(){return null;}).then(function(data){
      if (!response.ok){throw new Error((data&&data.error)||("HTTP "+response.status));}
      return data;
    });
  }).catch(function(error){clearTimeout(timer);throw error;});
}

function renderPanelMath(root){
  if (!root||typeof window.renderMathInElement!=="function"){return;}
  try{
    window.renderMathInElement(root,{
      delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"\\[",right:"\\]",display:true},
        {left:"\\(",right:"\\)",display:false},
        {left:"$",right:"$",display:false}
      ],
      throwOnError:false,strict:"ignore",trust:false
    });
  }catch(error){console.warn("NOAM KATEX:",error);}
}

if (!aiReady){
  fab.classList.add("hidden");
  panel.style.display="none";
}else{
  fab.classList.remove("hidden");
  loadStaticManifest();
}

/* ESCAPE HTML */

function escAttr(s){
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function esc(s){

  return String(s)
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[m];
      }
    );
}

})();
