<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<title>דף עבודה · מתמטיקה · נועם דורון</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.noamdoronmath.co.il" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<!-- Start fetching the PDF engine early; AI math assets load when the panel opens. -->
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin="anonymous">

<style>
:root{
  --ink:#14213D;
  --accent:#7B2FD1;
  --accent-dark:#551F92;
  --on-accent:#fff;
  --tint:#EBDDFB;
  --paper:#E3DFD2;
  --grid:#BFBDB2;
  --muted:#5E5478;
  --r:18px;
}

[data-grade="7"]{
  --accent:#7B2FD1;
  --accent-dark:#551F92;
  --tint:#EBDDFB;
  --muted:#5E5478;
}

[data-grade="8"]{
  --accent:#D62A8E;
  --accent-dark:#961B62;
  --tint:#FBDCEE;
  --muted:#6E4F62;
}

[data-grade="9"]{
  --accent:#00A08A;
  --accent-dark:#00705F;
  --on-accent:#14213D;
  --tint:#CFF3EC;
  --muted:#4A6B64;
}

*,*::before,*::after{
  box-sizing:border-box;
}

html,body{
  height:100%;
  margin:0;
}

body{
  font-family:'Assistant','Heebo',Arial,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;

  background:
    linear-gradient(var(--grid) 2.2px, transparent 2.2px) 0 0/45px 45px,
    linear-gradient(90deg, var(--grid) 2.2px, transparent 2.2px) 0 0/45px 45px,
    var(--paper);

  display:flex;
  flex-direction:column;
}

.noam-sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
  border:0;
}

.skip-link{
  position:fixed;
  inset-block-start:8px;
  inset-inline-start:8px;
  z-index:100;
  padding:10px 16px;
  border:3px solid var(--ink);
  border-radius:10px;
  color:var(--ink);
  background:#fff;
  font-weight:800;
  transform:translateY(-180%);
}

.skip-link:focus{transform:translateY(0)}
:where(a,button,input,textarea,[tabindex]):focus-visible{
  outline:3px solid var(--accent-dark);
  outline-offset:3px;
}

/* HEADER */

.bar{
  flex:none;
  display:flex;
  align-items:center;
  gap:10px 12px;
  flex-wrap:wrap;
  padding:10px 14px;
  background:#fff;
  border-bottom:3px solid var(--ink);
}

.bar h1{
  flex:0 1 auto;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:20px;
  margin:0;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.bar h1 span.ttl{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.context-chips{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  min-width:0;
}

.chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12.5px;
  line-height:1;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:6px 13px;
  background:var(--tint);
}

.level-switch{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.level-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12.5px;
  line-height:1;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:6px 13px;
  transition:transform .14s ease, box-shadow .14s ease, background .14s ease;
}

.level-link:hover{
  transform:translateY(-1px);
  box-shadow:-2px 2px 0 var(--ink);
}

.level-link[aria-current="page"]{
  color:var(--on-accent);
  background:var(--accent);
  box-shadow:-2px 2px 0 var(--ink);
  cursor:default;
  pointer-events:none;
}

.level-link[data-level="c"][aria-current="page"]{
  color:var(--ink);
  background:#FFD84D;
}

.level-link.is-loading,
.level-link[aria-disabled="true"]{
  opacity:.48;
  cursor:wait;
  pointer-events:none;
}

.bar .spacer{
  margin-inline-start:auto;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:8px 16px;
  box-shadow:-3px 3px 0 var(--ink);
}

.btn:hover{
  transform:translateY(-1px);
}

.btn--go{
  background:var(--accent);
  color:var(--on-accent);
}

/* LAYOUT */

.stage{
  flex:1;
  display:flex;
  min-height:0;
}

.pdfwrap{
  flex:1;
  min-width:0;
  min-height:0;
  padding:8px;
}

.pdf-surface{
  --pdf-tools-width:136px;
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  width:100%;
  height:100%;
  min-height:0;
  overflow:hidden;
  background:#E9EAEC;
  border:3px solid var(--ink);
  border-radius:var(--r);
  box-shadow:-5px 5px 0 var(--ink);
}

.pdf-surface.has-pdf-tools{
  grid-template-columns:var(--pdf-tools-width) minmax(0,1fr);
}

.pdf-scroll,
.pdf-native{
  grid-area:1 / 1;
  min-width:0;
  min-height:0;
}

.pdf-surface.has-pdf-tools .pdf-scroll,
.pdf-surface.has-pdf-tools .pdf-native{
  grid-column:2;
}

.pdf-surface.has-pdf-tools .pdf-status{
  inset-inline-start:var(--pdf-tools-width);
}

.pdf-surface.has-pdf-tools .pdf-fallback-message{
  inset-inline-start:calc(var(--pdf-tools-width) + 12px);
}

.pdf-scroll{
  width:100%;
  height:100%;
  overflow:auto;
  overscroll-behavior:contain;
  padding:10px 10px 28px;
  background:#E9EAEC;
  scrollbar-gutter:stable;
}

.pdf-scroll.hidden{
  display:none;
}

.pdf-pages{
  width:max-content;
  min-width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  margin-inline:auto;
}

.pdf-page{
  position:relative;
  flex:none;
  width:min(900px, calc(100vw - 124px));
  max-width:none;
  min-height:320px;
  aspect-ratio:210 / 297;
  /* Physical right gutter belongs to the AI/report pair, including at zoom >100%. */
  margin-right:44px;
  overflow:visible;
  background:#fff;
  box-shadow:0 2px 12px rgba(20,33,61,.18);
}

.pdf-page canvas{
  display:block;
  max-width:none;
  height:auto;
  background:#fff;
}

.pdf-page-wait{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  min-height:220px;
  color:#6C7484;
  font-family:'Heebo',sans-serif;
  font-weight:800;
  font-size:13px;
}

.pdf-page.is-ready .pdf-page-wait{
  display:none;
}

.pdf-status{
  position:absolute;
  inset:0;
  z-index:4;
  display:grid;
  place-items:center;
  padding:24px;
  text-align:center;
  background:#E9EAEC;
  color:var(--ink);
  font-family:'Heebo',sans-serif;
  font-weight:900;
}

.pdf-status.hidden{
  display:none;
}

.pdf-native{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  display:block;
}

.pdf-native.hidden{
  display:none;
}

.pdf-tools{
  position:relative;
  grid-area:1 / 1;
  align-self:start;
  min-height:0;
  max-height:calc(100% - 20px);
  overflow-y:auto;
  overscroll-behavior:contain;
  margin:10px 8px;
  z-index:8;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:7px;
  padding:8px;
  background:rgba(255,255,255,.97);
  border:2.5px solid var(--ink);
  border-radius:14px;
  box-shadow:-3px 3px 0 var(--ink);
}

.pdf-tools.hidden,
.pdf-tools > .hidden{
  display:none;
}

.pdf-tool,
.pdf-tool-link{
  flex-shrink:0;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12.5px;
  line-height:1.3;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:normal;
  text-align:center;
  cursor:pointer;
  border:2px solid var(--ink);
  border-radius:999px;
  padding:7px 11px;
}

.pdf-tool.primary{
  color:var(--on-accent);
  background:var(--accent);
}

.pdf-zoom-value{
  min-width:48px;
  text-align:center;
  font-family:'Heebo',sans-serif;
  font-size:12.5px;
  font-weight:900;
}

.pdf-zoom-slider{
  display:block;
  flex-shrink:0;
  width:100%;
  min-width:0;
  height:44px;
  margin:0;
  direction:ltr;
  accent-color:var(--accent);
  cursor:ew-resize;
}

#pdfZoomOut,
#pdfZoomIn{
  align-self:center;
  width:30px;
  height:30px;
  min-height:30px;
  padding:0;
  border-width:1.5px;
  font-size:16px;
  line-height:1;
}

.pdf-fallback-message{
  position:absolute;
  inset-inline:12px;
  inset-block-end:12px;
  z-index:7;
  padding:8px 12px;
  color:var(--ink);
  background:rgba(255,255,255,.95);
  border:2px solid var(--ink);
  border-radius:12px;
  font-size:12px;
  font-weight:800;
}

.pdf-fallback-message.hidden{
  display:none;
}

/* AI PANEL */

.panel{
  flex:none;
  width:430px;
  max-width:46vw;
  padding:8px 8px 8px 0;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.panel.hidden{
  display:none;
}

.panel-in{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  border:3px solid var(--ink);
  border-radius:var(--r);
  box-shadow:-5px 5px 0 var(--ink);
  overflow:hidden;
}

.panel-head{
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:58px;
  padding:10px 12px;
  background:var(--tint);
  border-bottom:3px solid var(--ink);
}

.panel-head b{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:17px;
}

.panel-badge{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:4px 10px;
  color:var(--accent-dark);
  background:rgba(255,255,255,.68);
  border-radius:999px;
  font-family:'Heebo',sans-serif;
  font-size:11.5px;
  font-weight:900;
  white-space:nowrap;
}

.panel-head-spacer{
  flex:1;
}

.panel-back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:6px 12px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  font-family:'Heebo',sans-serif;
  font-size:12.5px;
  font-weight:900;
  cursor:pointer;
}

.panel-back[hidden]{
  display:none;
}

.panel-close{
  flex:none;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  color:var(--ink);
  background:transparent;
  border:0;
  border-radius:50%;
  font-size:22px;
  line-height:1;
  cursor:pointer;
}

.panel-close:hover{
  background:rgba(255,255,255,.58);
}

.panel-body{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:14px;
}

.step-title{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  margin:0 0 10px;
}

.opts{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

.qpick{
  display:flex;
  align-items:stretch;
  gap:8px;
  margin-bottom:8px;
}

.qinput{
  flex:1;
  min-width:0;
  font-family:'Heebo',sans-serif;
  font-weight:800;
  font-size:16px;
  color:var(--ink);
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:10px 12px;
  text-align:center;
}

.qinput:focus{
  outline:none;
  box-shadow:-3px 3px 0 var(--accent);
}

.inline-error{
  min-height:20px;
  margin:6px 0 0;
  color:#9A1D2F;
  font-weight:800;
  font-size:13px;
}

.opt{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  background:#fff;
  color:var(--ink);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:8px 15px;
  box-shadow:-2px 2px 0 var(--ink);
}

.picked{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:var(--tint);
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:9px 12px;
  font-weight:800;
  font-size:14px;
  margin-bottom:14px;
}

.picked button{
  margin-inline-start:auto;
  font-family:inherit;
  font-weight:800;
  font-size:12.5px;
  cursor:pointer;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  padding:4px 10px;
}

textarea{
  width:100%;
  min-height:92px;
  resize:vertical;
  font-family:inherit;
  font-size:15px;
  color:var(--ink);
  padding:11px 13px;
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
}

textarea:focus{
  outline:none;
  box-shadow:-3px 3px 0 var(--accent);
}

.send{
  width:100%;
  margin-top:10px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:var(--on-accent);
  background:var(--accent);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:11px;
  box-shadow:-3px 3px 0 var(--ink);
}

.send.qgo{
  flex:none;
  margin-top:0;
  width:auto;
  min-width:92px;
  padding-inline:18px;
}

/* 3 BUTTONS */

.assist-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin:8px 0 4px;
}

.assist-btn{
  width:100%;
  text-align:right;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:var(--ink);
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:14px;
  padding:12px 14px;
  box-shadow:-3px 3px 0 var(--ink);
}

.assist-btn.primary{
  background:var(--tint);
}

.assist-btn.custom{
  background:var(--accent);
  color:var(--on-accent);
}

.hint{
  font-size:12.5px;
  font-weight:700;
  color:var(--muted);
  margin:10px 0 0;
}

.note{
  background:var(--tint);
  border:2.5px dashed var(--ink);
  border-radius:12px;
  padding:14px;
  font-weight:700;
  font-size:14px;
  line-height:1.55;
}

.thinking{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:15px;
}

.dots::after{
  content:".";
  animation:dots 1.2s steps(4,end) infinite;
}

@keyframes dots{
  0%{content:"."}
  33%{content:".."}
  66%{content:"..."}
  100%{content:"."}
}

.answer{
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:14px;
  font-size:15px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.qecho{
  font-weight:800;
  font-size:13.5px;
  color:var(--muted);
  margin:0 0 10px;
}

.skel{
  height:38px;
  border-radius:999px;
  background:linear-gradient(90deg,#eee,#f7f7f7,#eee);
  background-size:200% 100%;
  animation:sh 1.2s linear infinite;
  margin-bottom:8px;
}

@keyframes sh{
  to{
    background-position:-200% 0;
  }
}

/* FLOATING AI BUTTON */

.fab{
  position:fixed;
  inset-block-end:18px;
  inset-inline-end:18px;
  z-index:40;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
  color:var(--on-accent);
  background:var(--accent);
  border:3px solid var(--ink);
  border-radius:999px;
  padding:13px 22px;
  box-shadow:-5px 5px 0 var(--ink);
}

.fab.hidden{
  display:none;
}

.mobile-hint,.mobile-close-label{display:none}


/* CHAT */
.chat-shell{
  display:flex;
  flex-direction:column;
  min-height:100%;
}

.chat-log{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-bottom:10px;
}

.chat-row{
  display:flex;
  width:100%;
}

.chat-row.student{
  justify-content:flex-start;
}

.chat-row.tutor{
  justify-content:flex-end;
}

.chat-bubble{
  max-width:96%;
  border:2.5px solid var(--ink);
  border-radius:16px;
  padding:10px 12px;
  font-size:13.5px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
  box-shadow:-2px 2px 0 var(--ink);
}

.chat-row.student .chat-bubble{
  background:var(--accent);
  color:var(--on-accent);
  border-bottom-right-radius:5px;
}

.chat-row.tutor .chat-bubble{
  background:var(--tint);
  color:var(--ink);
  border-bottom-left-radius:5px;
}

.chat-name{
  display:block;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:11.5px;
  margin-bottom:3px;
  opacity:.78;
}

.chat-thinking{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:900;
}

.chat-quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:10px 0 8px;
}

.chat-quick .assist-btn{
  font-size:13px;
  padding:9px 10px;
  text-align:center;
}

.chat-compose{
  position:sticky;
  bottom:-14px;
  margin:0 -2px -14px;
  padding:10px 2px 14px;
  background:#fff;
  border-top:2px solid #ece8f1;
}

.chat-compose-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.chat-input{
  flex:1;
  min-height:48px;
  max-height:120px;
  resize:vertical;
  margin:0;
}

.chat-send{
  flex:none;
  width:auto;
  min-width:72px;
  margin:0;
  padding:11px 13px;
}

.chat-send[disabled],
.assist-btn[disabled]{
  opacity:.55;
  cursor:not-allowed;
}

.chat-error{
  background:#fff4f4;
  border:2px dashed #9A1D2F;
  border-radius:12px;
  padding:10px 12px;
  font-size:13px;
  font-weight:800;
  color:#7b1726;
}


/* ---------- IMAGE ATTACHMENT ---------- */
.chat-tools{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0 0;
  flex-wrap:wrap;
}

.image-pick{
  width:auto;
  margin:0;
  padding:8px 12px;
  font-size:13px;
  background:#fff;
  color:var(--ink);
}

.image-pick[disabled]{
  opacity:.55;
  cursor:not-allowed;
}

.image-preview{
  display:flex;

/* ---------- מתמטיקה: KaTeX + RTL/LTR isolation ---------- */
/* טקסט השיחה נשאר RTL; כל נוסחה היא אי LTR עצמאי. */
.chat-bubble{
  direction:rtl;
  text-align:right;
  unicode-bidi:isolate;
}

.katex,
.katex-html{
  direction:ltr !important;
  unicode-bidi:isolate !important;
}

.katex{
  display:inline-block;
  max-width:100%;
}

/* נוסחה קצרה שנשלפה מתוך משפט עברי נשמרת כאי LTR עצמאי. */
.math-island{
  display:inline-block;
  direction:ltr;
  unicode-bidi:isolate;
  max-width:100%;
}

/* legacy formula שמכילה \text{עברית}: העברית יוצאת מ-KaTeX
   ונשארת טקסט RTL רגיל, בעוד המתמטיקה נשארת באיי LTR. */
.mixed-math{
  direction:rtl;
  unicode-bidi:isolate;
}

.mixed-math-display{
  display:block;
  direction:rtl;
  unicode-bidi:isolate;
  text-align:right;
  margin:.65em 0;
}

.katex-display{
  direction:ltr !important;
  unicode-bidi:isolate !important;
  overflow-x:auto;
  overflow-y:hidden;
  max-width:100%;
  margin:.65em 0;
  padding:2px 0;
  text-align:center;
}

.katex-display > .katex{
  display:inline-block;
  text-align:initial;
}

/* אם KaTeX אינו זמין, הטקסט נשאר קריא במקום לשבור את הפאנל */
.math-render-error{
  direction:ltr;
  unicode-bidi:isolate;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}



/* The existing PDF.js font settings preserve worksheet rendering.

/* =============================================================
   NOAM AI STATIC MANIFEST LAYER
   ============================================================= */
.pdf-page .noam-exercise-pin{
  position:absolute;
  z-index:12;
  width:29px;
  height:29px;
  display:grid;
  place-items:center;
  padding:0;
  transform:translate(-50%,-50%);
  color:var(--ink);
  background:rgba(255,255,255,.96);
  border:2px solid var(--ink);
  border-radius:50%;
  box-shadow:-2px 2px 0 var(--ink);
  cursor:pointer;
  font-size:14px;
  line-height:1;
  transition:transform .14s ease,background .14s ease,box-shadow .14s ease;
}
.pdf-page .noam-exercise-pin:hover,
.pdf-page .noam-exercise-pin:focus-visible{
  transform:translate(-50%,-50%) scale(1.1);
  background:var(--tint);
  outline:none;
}
.pdf-page .noam-exercise-pin.is-active{
  color:var(--on-accent);
  background:var(--accent);
  box-shadow:-3px 3px 0 var(--ink);
}
.pdf-page .noam-exercise-pin::after{
  content:attr(data-label);
  position:absolute;
  inset-inline-start:34px;
  top:50%;
  width:max-content;
  max-width:220px;
  transform:translateY(-50%);
  padding:6px 9px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  box-shadow:-2px 2px 0 var(--ink);
  font-family:'Heebo',sans-serif;
  font-size:11.5px;
  font-weight:900;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
.pdf-page .noam-exercise-pin:hover::after,
.pdf-page .noam-exercise-pin:focus-visible::after{
  opacity:1;
}
.noam-manifest-note{
  padding:10px 12px;
  margin-bottom:12px;
  border:2px solid var(--ink);
  border-radius:12px;
  background:var(--tint);

}
.noam-picked{

}

}

function createOwnerKey(){
  if (window.crypto && typeof window.crypto.randomUUID === "function"){
    return window.crypto.randomUUID();
  }

  var bytes = new Uint8Array(24);

  if (window.crypto && typeof window.crypto.getRandomValues === "function"){
    window.crypto.getRandomValues(bytes);
  }else{
    for (var i = 0; i < bytes.length; i += 1){
      bytes[i] = Math.floor(Math.random() * 256);
    }
  }

  var out = "";
  for (var j = 0; j < bytes.length; j += 1){
    out += bytes[j].toString(16).padStart(2, "0");
  }
  return out;
}

function getOwnerKey(){
  var existing = "";

    return existing;
  }

  var created = createOwnerKey();

  try{

  }catch(e){}

  return created;
}

function escapeRegExp(value){
  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );
}

function parseIndexLevelPdfs(
  source
){

  if (
    !okGrade ||
    !okX ||
    !source
  ){
    return null;
  }

  var topicMatch =
    new RegExp(
      "\\{\\s*id\\s*:\\s*(\\d+)\\s*,\\s*x\\s*:\\s*[\"']" +
      escapeRegExp(x) +
      "[\"']",
      "i"
    )
    .exec(source);

  if (!topicMatch){
    return null;
  }

  var topicId =
    parseInt(
      topicMatch[1],
      10
    );

  var dataStart =
    source.indexOf(
      "var DATA"
    );

  var gradeSearch =
    dataStart >= 0
      ? source.slice(dataStart)
      : source;

  var gradeMarker =
    new RegExp(
      "(?:^|\\n)\\s*" +
      g +
      "\\s*:\\s*\\{\\s*(?:\\n\\s*)?links\\s*:\\s*\\{",
      "m"
    )
    .exec(gradeSearch);

  if (!gradeMarker){
    return null;
  }

  var gradeStart =
    gradeMarker.index;

  var groupsIndex =
    gradeSearch.indexOf(
      "groups:",
      gradeStart
    );

  if (groupsIndex < 0){
    return null;
  }

  var gradeBlock =
    gradeSearch.slice(
      gradeStart,
      groupsIndex
    );

  var rowMatch =
    new RegExp(
      "(?:^|\\n)\\s*" +
      topicId +
      "\\s*:\\s*\\{([\\s\\S]*?)\\}",
      "m"
    )
    .exec(gradeBlock);

  if (!rowMatch){
    return null;
  }

  var row =
    rowMatch[1];

  var found = {
    a:"",
    b:"",
    c:""
  };

  ["a", "b", "c"]
    .forEach(
      function(key){

        var match =
          new RegExp(
            "(?:^|[,\\s])" +
            key +
            "\\s*:\\s*[\"']([0-9a-f]{32})[\"']",
            "i"
          )
          .exec(row);

        if (match){
          found[key] =
            match[1]
            .toLowerCase();
        }
      }
    );

  return found;
}

function discoverSiblingLevels(){

  if (
    !okX ||
    !okGrade ||
    !okLv

    renderLevelSwitch(false);
    return;

  if (levelPdfMap.a && levelPdfMap.b && levelPdfMap.c){
    renderLevelSwitch(false);
    return;

  renderLevelSwitch(
    !(
      levelPdfMap.a &&
      levelPdfMap.b &&
      levelPdfMap.c
    )
  );

  fetch(
    HEADLESS_LEGACY_INDEX,
    {
      cache:"default"
    }
  )
  .then(
    function(response){

      if (!response.ok){
        throw new Error(
          "index " +
          response.status
        );
      }

      return response.text();
    }
  )
  .then(
    function(source){

      var discovered =
        parseIndexLevelPdfs(
          source
        );

      if (discovered){
        ["a", "b", "c"]
          .forEach(
            function(key){

              if (
                discovered[key] &&
                key !== lv
              ){
                levelPdfMap[key] =
                  discovered[key];
              }
            }
          );
      }

      renderLevelSwitch(false);
    }
  )
  .catch(
    function(error){
      console.warn(
        "LEVEL SWITCH DISCOVERY:",
        error
      );

      renderLevelSwitch(false);
    }
  );
}

function pdfJsGetDocumentOptions(source){
  var options = {
    withCredentials:false,
    cMapUrl:PDFJS_CMAP_URL,
    cMapPacked:true,
    standardFontDataUrl:PDFJS_STD_FONT_URL,
    disableFontFace:true,
    useSystemFonts:false
  };
  if (source instanceof ArrayBuffer || ArrayBuffer.isView(source)){
    options.data = source instanceof ArrayBuffer ? new Uint8Array(source) : source;
  }else{
    options.url = source || pdfUrl;
  }
  return options;
}

/** Resolve a PDF.js document for cropping, independent of clean-view UI success. */
function ensurePdfDocumentForCrop(){
  if (pdfDocument){ return Promise.resolve(pdfDocument); }
  if (pdfCropLoadPromise){ return pdfCropLoadPromise; }
  if (!window.pdfjsLib || typeof window.pdfjsLib.getDocument !== "function"){
    return Promise.reject(new Error("מנוע התצוגה של ה-PDF אינו זמין לחיתוך השאלה."));
  }
  try{
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      PDFJS_BASE + "build/pdf.worker.min.js";
  }catch(e){}

  pdfCropLoadPromise = fetch(pdfUrl, {
    method:"GET",
    mode:"cors",
    credentials:"omit",
    cache:"force-cache"
  }).then(function(response){
    if (!response.ok){
      throw new Error("טעינת קובץ ה-PDF לחיתוך נכשלה (" + response.status + ").");
    }
    return response.arrayBuffer();
  }).then(function(buffer){
    return window.pdfjsLib.getDocument(pdfJsGetDocumentOptions(buffer)).promise;
  }).then(function(doc){
    pdfDocument = doc;
    return doc;
  }).catch(function(error){
    /* URL load as second chance when arraybuffer fetch is blocked. */
    return window.pdfjsLib.getDocument(pdfJsGetDocumentOptions(pdfUrl)).promise
      .then(function(doc){
        pdfDocument = doc;
        return doc;
      }, function(){
        pdfCropLoadPromise = null;
        throw error;
      });
  });

  return pdfCropLoadPromise;
}

function createPdfPageShells(
  doc
){

  var html =
    "";

  for (
    var pageNumber = 1;
    pageNumber <= doc.numPages;
    pageNumber += 1
  ){
    html +=
      '<div class="pdf-page" data-page="' +
      pageNumber +
      '" data-state="idle">' +
        '<canvas aria-label="עמוד ' +
        pageNumber +
        '"></canvas>' +
        '<div class="pdf-page-wait">עמוד ' +
        pageNumber +
        '</div>' +
      '</div>';
  }

  pdfPages.innerHTML =
    html;
}

function renderPdfPage(
  pageNumber,
  version
){

  if (
    !pdfDocument ||
    version !== pdfRenderVersion
  ){
    return;
  }

  var pageElement =
    pdfPages.querySelector(
      '[data-page="' +
      pageNumber +
      '"]'
    );

  if (!pageElement){
    return;
  }

  var state =
    pageElement.getAttribute(
      "data-state"
    );

  if (
    state === "rendering" ||
    state === "ready"
  ){
    return;
  }

  pageElement.setAttribute(
    "data-state",
    "rendering"
  );

  pdfDocument
    .getPage(pageNumber)
    .then(
      function(page){

        if (
          version !== pdfRenderVersion
        ){
          return;
        }

        var baseViewport =
          page.getViewport({
            scale:1
          });

        var cssScale = getPdfPageWidth() / baseViewport.width;

        var viewport =
          page.getViewport({
            scale:cssScale
          });

        /* Render the visible worksheet at the screen's full physical resolution.
           The former 1.25 desktop cap blurred small Hebrew type and geometry labels
           on Retina displays even though the source PDF was sharp.  The AI still
           receives its own off-screen question crop below; this canvas exists only
           for the student-facing PDF layer and the HTML pins remain independent. */
        var pixelRatio =
          Math.min(
            window.devicePixelRatio || 1,
            mobileLayout.matches ? 3 : 2
          );

        var canvas =
          pageElement.querySelector(
            "canvas"
          );

        var context =
          canvas.getContext(
            "2d",
            {
              alpha:false
            }
          );

        canvas.width =
          Math.max(
            1,
            Math.floor(
              viewport.width *
              pixelRatio
            )
          );

        canvas.height =
          Math.max(
            1,
            Math.floor(
              viewport.height *
              pixelRatio
            )
          );

        canvas.style.width =
          Math.floor(
            viewport.width
          ) +
          "px";

        canvas.style.height =
          Math.floor(
            viewport.height
          ) +
          "px";

        pageElement.style.width =
          Math.floor(
            viewport.width
          ) +
          "px";

        pageElement.style.height =
          Math.floor(
            viewport.height
          ) +
          "px";

        pageElement.style.aspectRatio =
          viewport.width +
          " / " +
          viewport.height;

        var renderTask =
          page.render({
            canvasContext:context,
            viewport:viewport,
            transform:
              pixelRatio === 1
                ? null
                : [
                    pixelRatio,
                    0,
                    0,
                    pixelRatio,
                    0,
                    0
                  ]
          });

        pageElement._renderTask =
          renderTask;

        return renderTask.promise;
      }
    )
    .then(
      function(){

        if (
          version !== pdfRenderVersion
        ){
          return;
        }

        pageElement.setAttribute(
          "data-state",
          "ready"
        );

        pageElement.classList
          .add(
            "is-ready"
          );
        if (manifestReady){renderManifestPins();}
      }
    )
    .catch(
      function(error){

        if (
          error &&
          error.name ===
          "RenderingCancelledException"
        ){
          return;
        }

        console.warn(
          "PDF PAGE RENDER:",
          pageNumber,
          error
        );

        pageElement.setAttribute(
          "data-state",
          "error"
        );

        var wait =
          pageElement.querySelector(
            ".pdf-page-wait"
          );

        if (wait){
          wait.textContent =
            "לא הצלחתי להציג את עמוד " +
            pageNumber;
        }
      }
    );
}

function observePdfPages(){

  if (pdfObserver){
    pdfObserver.disconnect();
  }

  var version =
    pdfRenderVersion;

  if (
    "IntersectionObserver" in window
  ){
    pdfObserver =
      new IntersectionObserver(
        function(entries){
          entries.forEach(
            function(entry){
              if (entry.isIntersecting){
                renderPdfPage(
                  Number(
                    entry.target.dataset.page
                  ),
                  version
                );
              }
            }
          );
        },
        {
          root:pdfScroll,
          rootMargin:"900px 0px",
          threshold:.01
        }
      );

    pdfPages
      .querySelectorAll(
        ".pdf-page"
      )
      .forEach(
        function(pageElement){
          pdfObserver.observe(
            pageElement
          );
        }
      );

  }else{
    for (
      var pageNumber = 1;
      pageNumber <= pdfDocument.numPages;
      pageNumber += 1
    ){
      renderPdfPage(
        pageNumber,
        version
      );
    }
  }
}

function getPdfPageWidth(){
  // Match live GitHub viewer: on phones, 70% zoom is the width that fits
  // beside the fixed button gutter. Scale only the PDF from there.
  if (mobileLayout.matches){
    return Math.max(120,pdfScroll.clientWidth - 116) * pdfZoom / .7;
  }
  return Math.max(120,pdfScroll.clientWidth - 78) * pdfZoom;
}

// Keep the same point on the current page when rotation or zoom changes page sizes.
function capturePdfPosition(){
  var top = pdfScroll.getBoundingClientRect().top;
  var pages = Array.from(pdfPages.querySelectorAll(".pdf-page"));
  var page = pages.find(function(item){ return item.getBoundingClientRect().bottom > top; });
  if (!page){return null;}
  var rect = page.getBoundingClientRect();
  return { page:page, fraction:Math.max(0,Math.min(1,(top-rect.top)/Math.max(1,rect.height))) };
}

function restorePdfPosition(anchor){
  if (!anchor || !anchor.page.isConnected){return;}
  var rect = anchor.page.getBoundingClientRect();
  pdfScroll.scrollTop += rect.top - pdfScroll.getBoundingClientRect().top + anchor.fraction * rect.height;
}

function resetPdfRendering(){

  if (!pdfDocument){
    return;
  }

  var anchor = capturePdfPosition();
  var nextWidth = getPdfPageWidth();
  pdfRenderVersion += 1;

  pdfPages
    .querySelectorAll(
      ".pdf-page"
    )
    .forEach(
      function(pageElement){

        if (
          pageElement._renderTask &&
          typeof pageElement._renderTask.cancel ===
            "function"
        ){
          try{
            pageElement._renderTask.cancel();
          }catch(e){}
        }

        pageElement._renderTask =
          null;

        pageElement.classList
          .remove(
            "is-ready"
          );

        pageElement.setAttribute(
          "data-state",
          "idle"
        );

        var canvas =
          pageElement.querySelector(
            "canvas"
          );

        if (canvas){
          canvas.width = 1;
          canvas.height = 1;
          canvas.style.width = "";
          canvas.style.height = "";
        }

        var oldRect = pageElement.getBoundingClientRect();
        var ratio = oldRect.width > 0 && oldRect.height > 0 ? oldRect.height / oldRect.width : 297 / 210;
        pageElement.style.width = nextWidth + "px";
        pageElement.style.height = (nextWidth * ratio) + "px";
      }
    );

  restorePdfPosition(anchor);
  observePdfPages();
}

function setPdfZoom(value, deferRender){
  if (!Number.isFinite(value)){ return; }
  var percent = Math.max(70, Math.min(170, Math.round(value * 100)));
  var nextZoom = percent / 100;
  var changed = nextZoom !== pdfZoom;
  pdfZoom = nextZoom;
  pdfZoomValue.textContent = percent + "%";
  pdfZoomSlider.value = String(percent);
  pdfZoomSlider.setAttribute("aria-valuetext", percent + "%");

  if (!changed && !pdfZoomRenderTimer){ return; }
  clearTimeout(pdfZoomRenderTimer);
  pdfZoomRenderTimer = 0;
  // Update the percentage immediately; redraw after a short pause or release.
  if (deferRender){
    pdfZoomRenderTimer = setTimeout(function(){
      pdfZoomRenderTimer = 0;
      resetPdfRendering();
    }, 120);
  }else{
    resetPdfRendering();
  }
}

function schedulePdfResize(){

  clearTimeout(
    pdfResizeTimer
  );

  pdfResizeTimer =
    setTimeout(
      function(){

        var nextWidth =
          Math.round(
            pdfScroll.clientWidth
          );

        if (
          !pdfDocument ||
          Math.abs(
            nextWidth -
            pdfLastWidth
          ) < 3
        ){
          return;
        }

        pdfLastWidth =
          nextWidth;

        resetPdfRendering();
      },
      180
    );
}

function initPdfExperience(){

  /* Only one viewer requests the PDF during normal startup. */
  setPdfStatus(
    "טוען את דף העבודה…",
    !pdfNativeActive
  );

  setNativePdfMode(pdfNativeActive);

  showPdfTools(!mobileLayout.matches);

  /* Noam overlays require the page canvas on every viewport. */

  if (
    !PDF_CLEAN_OPT_IN
  ){
    pdfCleanAvailable =
      false;
    setNativePdfMode(true);
    setPdfStatus("",false);
    ensurePdfDocumentForCrop().catch(function(error){
      console.warn("PDF CROP DOCUMENT:", error);
    });
    return;
  }

  if (
    !window.pdfjsLib
  ){
    showPdfFallback(
      "לא ניתן לטעון את התצוגה הנקייה. הוצגה תצוגת ה-PDF המלאה."
    );
    return;
  }

  try{
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      PDFJS_BASE + "build/pdf.worker.min.js";
  }catch(e){}

  setPdfStatus(
    "טוען את דף העבודה…",
    !pdfNativeActive
  );

  var loadTask =
    window.pdfjsLib
      .getDocument(pdfJsGetDocumentOptions(pdfUrl));

  loadTask.promise
    .then(
      function(doc){

        pdfDocument =
          doc;
        pdfCropLoadPromise =
          Promise.resolve(doc);

        pdfCleanAvailable =
          true;

        pdfFallbackMessage.classList
          .add(
            "hidden"
          );

        try{
          createPdfPageShells(
            doc
          );

          pdfRenderVersion += 1;
          pdfLastWidth =
            Math.round(
              pdfScroll.clientWidth
            );

          setPdfStatus(
            "",
            false
          );

          observePdfPages();

          /* The static manifest pins live on the clean page layer. */
          setNativePdfMode(pdfNativeActive);

          if (
            "ResizeObserver" in window
          ){
            pdfResizeObserver =
              new ResizeObserver(
                schedulePdfResize
              );

            pdfResizeObserver.observe(
              pdfScroll
            );
          }else{
            window.addEventListener(
              "resize",
              schedulePdfResize
            );
          }
        }catch(uiError){
          console.warn(
            "CLEAN PDF UI:",
            uiError
          );
          /* Keep pdfDocument for crops; fall back only for on-page pins/canvas. */
          showPdfFallback(
            "התצוגה הנקייה נחסמה בדפדפן; הוצגה תצוגת ה-PDF המלאה."
          );
        }
      }
    )
    .catch(
      function(error){
        console.warn(
          "CLEAN PDF VIEWER:",
          error
        );

        showPdfFallback(
          "התצוגה הנקייה נחסמה בדפדפן; הוצגה תצוגת ה-PDF המלאה."
        );
      }
    );
}

var noamAssetLoads = {};
var noamMathAssetsPromise = null;
var noamMathAssetsReady = false;

function loadNoamAsset(tag,url){
  if (noamAssetLoads[url]){return noamAssetLoads[url];}
  var element=document.createElement(tag);
  noamAssetLoads[url]=new Promise(function(resolve,reject){
    element.onload=function(){resolve();};
    element.onerror=function(){reject(new Error("לא ניתן לטעון רכיב תצוגה."));};
    if (tag==="script"){
      element.src=url;
      element.async=true;
      element.crossOrigin="anonymous";
    }else{
      element.rel="stylesheet";
      element.href=url;
    }
    document.head.appendChild(element);
  }).catch(function(error){
    delete noamAssetLoads[url];
    element.remove();
    throw error;
  });
  return noamAssetLoads[url];
}

function ensureNoamMathRenderer(){
  if (noamMathAssetsPromise){return noamMathAssetsPromise;}
  var base="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/";
  noamMathAssetsPromise=Promise.all([
    loadNoamAsset("link",base+"katex.min.css"),
    loadNoamAsset("script",base+"katex.min.js").then(function(){
      return loadNoamAsset("script",base+"contrib/auto-render.min.js");
    })
  ]).then(function(){
    noamMathAssetsReady=true;
  }).catch(function(error){
    noamMathAssetsPromise=null;
    throw error;
  });
  return noamMathAssetsPromise;
}

// Accept same-origin /worksheets returns. On the live domain, never send the
// student to the legacy GitHub Pages catalog — map those URLs to /worksheets.
try {
  var navigationParams = new URL(location.href).searchParams;
  var catalogRoot = new URL('./', location.href);
  var legacyRoot = new URL(HEADLESS_LEGACY_PAGES);
  var liveHost = /(?:^|\.)noamdoronmath\.co\.il$/i.test(location.hostname);
  var returnPath = navigationParams.get('back');
  function worksheetsHrefFromReturn(urlObj, gradeNum, topicId){
    var out = new URL("/worksheets", location.origin);
    if (urlObj && urlObj.searchParams){
      urlObj.searchParams.forEach(function(value, key){
        out.searchParams.set(key, value);
      });
    }
    if (gradeNum && !out.searchParams.get("grade")){
      out.searchParams.set("grade", String(gradeNum));
    }
    if (topicId){ out.searchParams.set("topic", String(topicId)); }
    return out.pathname + out.search;
  }
  if (returnPath) {
    var catalogReturn;
    if (/^https?:\/\//i.test(returnPath)) {
      catalogReturn = new URL(returnPath);
    } else if (returnPath.indexOf("/noamdoronmath-worksheets") === 0) {
      catalogReturn = new URL(returnPath, legacyRoot.origin);
    } else if (returnPath.indexOf("/worksheets") === 0) {
      catalogReturn = new URL(returnPath, location.href);
    } else {
      catalogReturn = new URL(returnPath, location.href);
    }
    var sameOriginCatalog =
      catalogReturn.origin === location.origin &&
      (catalogReturn.pathname === catalogRoot.pathname ||
       catalogReturn.pathname === catalogRoot.pathname + "index.html" ||
       catalogReturn.pathname === "/" ||
       catalogReturn.pathname === "/learning.html" ||
       catalogReturn.pathname === "/worksheets" ||
       catalogReturn.pathname.indexOf("/worksheets") === 0);
    var legacyCatalog =
      catalogReturn.origin === legacyRoot.origin &&
      catalogReturn.pathname.indexOf(legacyRoot.pathname.replace(/\/$/, "")) === 0;
    if (sameOriginCatalog || legacyCatalog) {
      var backHref;
      if (liveHost || catalogReturn.pathname.indexOf("/worksheets") === 0){
        backHref = worksheetsHrefFromReturn(
          catalogReturn.pathname.indexOf("/worksheets") === 0 ? catalogReturn : new URL("/worksheets"+catalogReturn.search, location.origin),
          okGrade ? g : null,
          null
        );
      } else if (!liveHost && legacyCatalog){
        backHref = catalogReturn.href;
      } else {
        backHref = worksheetsHrefFromReturn(catalogReturn, okGrade ? g : null, null);
      }
      document.getElementById("backBtn").href = backHref;
    }
  }
  if (/^\d+$/.test(navigationParams.get("topic") || "") && okGrade) {
    var topicBack = document.createElement("a");
    topicBack.className = "btn topic-back";
    topicBack.textContent = "חזרה לנושא";
    var topicId = navigationParams.get("topic");
    var backForTopic = document.getElementById("backBtn").getAttribute("href") || "";
    if (backForTopic.indexOf("/worksheets") === 0 || /^https?:\/\/[^/]+\/worksheets/i.test(backForTopic)){
      topicBack.href = worksheetsHrefFromReturn(new URL(backForTopic, location.origin), g, topicId);
    } else {
      topicBack.href = worksheetsHrefFromReturn(null, g, topicId);
    }
    document.getElementById("backBtn").after(topicBack);
  }
} catch (navigationError) { /* The default grade link remains available. */ }

function buildManifestPinGroups(exercises, groupByQuestion){
  var groups = [];
  var byQuestion = Object.create(null);
  exercises.forEach(function(exercise){
    var pageNumber = Number((exercise.pin || {}).page || 0);
    var questionKey = pageNumber + ":" + String(exercise.q);
    var group = groupByQuestion && byQuestion[questionKey];
    if (!group){
      group = { questionKey:questionKey, exercises:[] };
      groups.push(group);
      if (groupByQuestion){ byQuestion[questionKey] = group; }
    }
    group.exercises.push(exercise);
  });
  return groups;
}

function clusterManifestPinGroups(groups, pageHeight){
  var height = Math.max(1, Number(pageHeight) || 1);
  var edge = Math.min(22, height / 2);
  var positioned = groups.map(function(group){
    var pin = group.exercises[0].pin || {};
    var anchor = Math.max(.02, Math.min(.98, Number(pin.y) || .2)) * height;
    return {
      questionKey:group.questionKey,
      questionKeys:[group.questionKey],
      exercises:group.exercises.slice(),
      top:Math.max(edge, Math.min(height - edge, anchor))
    };
  }).sort(function(a,b){ return a.top - b.top; });
  var clusters = [];
  positioned.forEach(function(group){
    var previous = clusters[clusters.length - 1];
    if (previous && group.top - previous.top < 48){
      previous.exercises = previous.exercises.concat(group.exercises);
      previous.questionKeys = previous.questionKeys.concat(group.questionKeys);
    }else{
      clusters.push(group);
    }
  });
  return clusters;
}

function manifestPinQuestionLabel(exercises){
  var questions = [];
  exercises.forEach(function(exercise){
    if (questions.indexOf(String(exercise.q)) === -1){ questions.push(String(exercise.q)); }

  return (questions.length > 1 ? "שאלות " : "שאלה ") + questions.join(", ");
}

function renderManifestPins(){
  if (!manifestReady || !pdfPages){ return; }

  var focused = document.activeElement;
  var focusedReport = focused && focused.classList && focused.classList.contains("noam-report-pin");
  var focusedPinId = focused && focused.classList && (focusedReport || focused.classList.contains("noam-exercise-pin"))
    ? focused.dataset.exerciseId : null;
  var narrow = noamNarrowPinsMedia.matches;
  var activeQuestionKeys = selectedPin ? (selectedPin.dataset.questionKeys || selectedPin.dataset.questionKey || "").split(" ") : [];
  selectedPin = null;
  pdfPages.querySelectorAll(".noam-exercise-pin, .noam-report-pin")
    .forEach(function(button){ button.remove(); });

  var groups = buildManifestPinGroups(manifest.exercises, narrow);
  if (narrow){
    var groupsByPage = Object.create(null);
    groups.forEach(function(group){
      var number = Number((group.exercises[0].pin || {}).page || 0);
      if (!groupsByPage[number]){ groupsByPage[number] = []; }
      groupsByPage[number].push(group);
    });
    groups = [];
    Object.keys(groupsByPage).forEach(function(number){
      var page = pdfPages.querySelector('.pdf-page[data-page="' + number + '"]');
      if (page && page.clientHeight > 0){
        groups = groups.concat(clusterManifestPinGroups(groupsByPage[number], page.clientHeight));
      }
    });
  }
  /*
    On two-column worksheets a narrow rendered page can squeeze the report
    button of the left-hand question against the AI button of the right-hand
    question. Keep one report per question, but place the left report on the
    outer side of its own AI button when the two pairs would visually collide.
  */
  if (!narrow){
    groups.forEach(function(group){
      var exercise = group.exercises[0];
      var pin = exercise.pin || {};
      var pageNumber = Number(pin.page || 0);
      var pageElement = pdfPages.querySelector('.pdf-page[data-page="' + pageNumber + '"]');
      if (!pageElement || pageElement.clientWidth <= 0){ return; }
      var pinX = Number(pin.x);
      if (!isFinite(pinX)){ pinX = .92; }
      pinX = Math.max(.02,Math.min(.98,pinX));
      var center = Math.max(16,Math.min(pageElement.clientWidth - 16,pinX * pageElement.clientWidth + 52));
      var pinY = Math.max(.02,Math.min(.98,Number(pin.y)||.2));
      var hasCloseRightNeighbor = groups.some(function(other){
        if (other === group){ return false; }
        var otherPin = other.exercises[0].pin || {};
        if (Number(otherPin.page || 0) !== pageNumber){ return false; }
        var otherY = Math.max(.02,Math.min(.98,Number(otherPin.y)||.2));
        if (Math.abs(otherY - pinY) * pageElement.clientHeight > 18){ return false; }
        var otherX = Number(otherPin.x);
        if (!isFinite(otherX)){ otherX = .92; }
        otherX = Math.max(.02,Math.min(.98,otherX));
        var otherCenter = Math.max(16,Math.min(pageElement.clientWidth - 16,otherX * pageElement.clientWidth + 52));
        return otherCenter > center && otherCenter - center < 70;
      });
      group.reportBefore = hasCloseRightNeighbor && center >= 56;
    });
  }
  groups.forEach(function(group){
    var exercise = group.exercises[0];
    var pin = exercise.pin || {};
    var pageNumber = Number(pin.page || 0);
    var pageElement = pdfPages.querySelector('.pdf-page[data-page="' + pageNumber + '"]');
    if (!pageElement){ return; }

    /*
      Manifest coordinates point at the printed RTL question/part marker.
      Desktop robots stay beside that marker. The report shares the robot's
      clamped anchor plus a fixed gap, so the two buttons cannot converge at
      the page edge. Reserved right gutters keep both controls reachable;
      phone targets sit entirely outside the printed content.
    */
    var pinX = Number(pin.x);
    if (!isFinite(pinX)){ pinX = .92; }
    pinX = Math.max(.02,Math.min(.98,pinX));
    var pinLeft = narrow
      ? "calc(100% + 26px)"
      : "clamp(16px, calc(" + (pinX*100) + "% + 52px), calc(100% - 16px))";

    var button = document.createElement("button");
    button.type = "button";
    button.className = "noam-exercise-pin" + (narrow ? " noam-question-pin" : "");
    button.textContent = "🤖";
    button.style.left = pinLeft;
    button.style.top = narrow ? group.top + "px" : (Math.max(.02,Math.min(.98,Number(pin.y)||.2))*100) + "%";
    button.dataset.exerciseId = exercise.id;
    button.dataset.questionKey = group.questionKey;
    button.dataset.questionKeys = (group.questionKeys || [group.questionKey]).join(" ");
    button.dataset.exerciseIds = group.exercises.map(function(item){ return item.id; }).join(" ");
    button.dataset.label = narrow && group.exercises.length > 1
      ? manifestPinQuestionLabel(group.exercises) + " · בחירת שאלה וסעיף · נועם AI"
      : exerciseLabel(exercise) + " · העזר בנועם AI";
    button.setAttribute("aria-label", button.dataset.label);
    var active = selectedExercise
      ? group.exercises.some(function(item){ return item.id === selectedExercise.id; })
      : !selectedPin && (group.questionKeys || [group.questionKey]).some(function(key){ return activeQuestionKeys.indexOf(key) !== -1; });
    if (active){ button.classList.add("is-active"); selectedPin = button; }
    button.addEventListener("click", function(event){
      event.preventDefault();
      event.stopPropagation();
      if (narrow && group.exercises.length > 1){
        renderNoamQuestionParts(group.exercises, button);
      }else{
        selectManifestExercise(exercise, button);
      }
    });
    pageElement.appendChild(button);
    var report = document.createElement("button");
    report.type = "button";
    report.className = "noam-report-pin" + (group.reportBefore ? " noam-report-before" : "");
    report.textContent = "!";
    report.style.left = narrow
      ? "calc(100% + 76px)"
      : "calc(" + pinLeft + (group.reportBefore ? " - 40px)" : " + 40px)");
    report.style.top = button.style.top;
    report.dataset.exerciseId = exercise.id;
    report.dataset.exerciseIds = button.dataset.exerciseIds;
    report.dataset.label = "יש הערה על השאלה?";
    report.setAttribute("aria-label", "דיווח על " + (group.exercises.length > 1
      ? manifestPinQuestionLabel(group.exercises) + " · בחירת שאלה וסעיף"
      : exerciseLabel(exercise)));
    report.addEventListener("click", function(event){
      event.preventDefault();
      event.stopPropagation();
      showFeedbackPicker(group.exercises);
    });
    pageElement.appendChild(report);
    if (focusedPinId && button.dataset.exerciseIds.split(" ").indexOf(focusedPinId)!==-1){
      (focusedReport ? report : button).focus({preventScroll:true});
    }
  });
}

function addTranscriptBubble(container, role, text, kind, visual, message, thread){
  var row = document.createElement("div");
  row.className = "noam-row " + role;
  if (message && message.confirmed){ row.dataset.ramziConfirmed = "1"; }
  var bubble = document.createElement("div");
  bubble.className = "noam-bubble";
  if (kind && role === "user"){
    var label = document.createElement("span");
    label.className = "noam-kind";
    label.textContent = kind;
    bubble.appendChild(label);
  }
  var content = document.createElement("span");
  var speaker = document.createElement("span");
  speaker.className = "noam-sr-only";
  speaker.textContent = role === "user" ? "השאלה שלך: " : "נועם AI: ";
  bubble.appendChild(speaker);
  content.textContent = role === "assistant" ? noamStripMarkdownEmphasis(text) : text;
  bubble.appendChild(content);
  if (message && message.answerError){
    var retry=document.createElement("button");
    retry.type="button";
    retry.className="noam-retry-action";
    retry.textContent=noamRetryActionLabel(message);
    retry.addEventListener("click",function(){ retryLastNoamHelp(); });
    bubble.appendChild(retry);
  }
  // Source crops belong only in the selected-question preview. This also
  // suppresses old saved replies that predate the diagram mechanism.
  if (visual&&visual.type==="question-image"){visual=null;}
  if (visual){
    var visualElement=visual.type==="ai-diagram" ? noamRenderAiDiagram(visual) : visual.type==="geometry-guide"
      ? noamRenderGeometryGuide(visual)
      : window.NoamLocalVisual&&window.NoamLocalVisual.render(document,visual);
    if (visualElement){bubble.appendChild(visualElement);}
  }
  if (message&&thread&&noamCanOfferDrawing(selectedExercise,thread,message)){
    var drawButton=document.createElement("button");
    drawButton.type="button";
    drawButton.className="noam-draw-action";
    var drawingExercise=selectedExercise;
    var drawingPending=noamDiagramRuntime().messages.has(message);
    setNoamDiagramButtonLabel(drawButton,drawingPending?"מכין שרטוט…":message.diagramError?"השרטוט לא הופיע — נסו שוב":"לא הופיע שרטוט להמחשה? לחצו כאן",!drawingPending);
    drawButton.disabled=drawingPending;
    drawButton.addEventListener("click",function(){
      requestNoamDiagram(drawingExercise,thread,message);
    });
    bubble.appendChild(drawButton);
    if (message.diagramError){
      var drawError=document.createElement("span");
      drawError.className="noam-draw-error";
      drawError.setAttribute("role","status");
      drawError.textContent=message.diagramError;
      bubble.appendChild(drawError);
    }
  }
  row.appendChild(bubble);
  container.appendChild(row);
  return row;
}

  noamGlossaryPopover.addEventListener("focusout",function(){setTimeout(function(){
    if (!noamGlossaryPopover.contains(document.activeElement) && document.activeElement!==noamGlossaryTrigger){
      hideNoamGlossaryPopover();
    }
  },0);});
  document.body.appendChild(noamGlossaryPopover);
  return noamGlossaryPopover;
}

function positionNoamGlossaryPopover(trigger){
  if (!trigger||!noamGlossaryPopover||noamGlossaryPopover.hidden){return;}
  var rect=trigger.getBoundingClientRect();
  var width=noamGlossaryPopover.offsetWidth;
  var height=noamGlossaryPopover.offsetHeight;
  var viewportWidth=document.documentElement.clientWidth;
  var viewportHeight=window.innerHeight;
  var left=Math.max(12,Math.min(viewportWidth-width-12,rect.left+(rect.width-width)/2));
  var below=rect.bottom+8;
  var top=below+height<=viewportHeight-10?below:Math.max(10,rect.top-height-8);
  noamGlossaryPopover.style.left=Math.round(left)+"px";
  noamGlossaryPopover.style.top=Math.round(top)+"px";
}

function hideNoamGlossaryPopover(){
  clearTimeout(noamGlossaryCloseTimer);
  if (noamGlossaryTrigger){noamGlossaryTrigger.setAttribute("aria-expanded","false");}
  noamGlossaryTrigger=null;
  if (noamGlossaryPopover){noamGlossaryPopover.hidden=true;}
}

function scheduleNoamGlossaryClose(){
  clearTimeout(noamGlossaryCloseTimer);
  noamGlossaryCloseTimer=setTimeout(function(){
    if (noamGlossaryPopover && !noamGlossaryPopover.contains(document.activeElement) && document.activeElement!==noamGlossaryTrigger){
      hideNoamGlossaryPopover();
    }
  },180);
}

function showNoamGlossaryPopover(trigger,entry,keyboardOpen){
  if (!trigger||!entry){return;}
  var popover=ensureNoamGlossaryPopover();
  clearTimeout(noamGlossaryCloseTimer);
  if (noamGlossaryTrigger&&noamGlossaryTrigger!==trigger){noamGlossaryTrigger.setAttribute("aria-expanded","false");}
  noamGlossaryTrigger=trigger;
  trigger.setAttribute("aria-expanded","true");
  document.getElementById("noamGlossaryPopoverKind").textContent=entry.kind||"מושג";
  document.getElementById("noamGlossaryPopoverTitle").textContent=entry.term;
  document.getElementById("noamGlossaryPopoverText").textContent=entry.short;
  var more=document.getElementById("noamGlossaryMore");
  more.onclick=function(){hideNoamGlossaryPopover();renderNoamGlossaryDetail(entry.id);};
  popover.hidden=false;
  positionNoamGlossaryPopover(trigger);
  if (keyboardOpen){more.focus({preventScroll:true});}
}

function noamStripMarkdownEmphasis(text){
  // Keep math asterisks like 2*3; only unwrap common emphasis wrappers.
  return String(text||"")
    .replace(/\*\*([^*]+)\*\*/g,"$1")
    .replace(/(^|[\s(„"'])\*([^*\n]+)\*(?=[\s).,;:!?״"']|$)/g,"$1$2");
}

function makeNoamGlossaryTerm(match){
  var button=document.createElement("button");
  button.type="button";
  button.className="noam-term";
  button.textContent=match.text;
  button.dataset.glossaryId=match.id;
  button.setAttribute("aria-expanded","false");
  button.setAttribute("aria-controls","noamGlossaryPopover");
  button.setAttribute("aria-label",match.text+" — "+match.entry.short+" לחצו להסבר מלא");
  button.addEventListener("pointerenter",function(){showNoamGlossaryPopover(button,match.entry,false);});
  button.addEventListener("pointerleave",scheduleNoamGlossaryClose);
  button.addEventListener("focus",function(){showNoamGlossaryPopover(button,match.entry,false);});
  button.addEventListener("click",function(event){showNoamGlossaryPopover(button,match.entry,event.detail===0);});
  button.addEventListener("keydown",function(event){if(event.key==="Escape"){hideNoamGlossaryPopover();button.focus();}});
  return button;
}

function enhanceNoamGlossary(root){
  if (!root||!window.NoamGlossary){return;}
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  var nodes=[];
  while(walker.nextNode()){
    var node=walker.currentNode;
    var parent=node.parentElement;
    if (!parent||!node.nodeValue.trim()){continue;}
    if (parent.closest("button,a,textarea,script,style,svg,.katex,.noam-sr-only,.noam-term,.noam-glossary-popover")){continue;}
    nodes.push(node);
  }
  nodes.forEach(function(node){
    var matches=window.NoamGlossary.findTerms(node.nodeValue,g,6);
    if (!matches.length){
      var cleanedAlone=noamStripMarkdownEmphasis(node.nodeValue);
      if (cleanedAlone!==node.nodeValue){node.nodeValue=cleanedAlone;}
      return;
    }
    var fragment=document.createDocumentFragment();
    var cursor=0;
    matches.forEach(function(match){
      if (match.start>cursor){
        fragment.appendChild(document.createTextNode(noamStripMarkdownEmphasis(node.nodeValue.slice(cursor,match.start))));
      }
      fragment.appendChild(makeNoamGlossaryTerm(match));
      cursor=match.end;
    });
    if (cursor<node.nodeValue.length){
      fragment.appendChild(document.createTextNode(noamStripMarkdownEmphasis(node.nodeValue.slice(cursor))));
    }
    node.parentNode.replaceChild(fragment,node);
  });
}

function noamLatestDrawingAnswer(thread){
  var messages=thread&&thread.messages||[];
  for(var i=messages.length-1;i>=0;i--){
    var message=messages[i];
    if(!message||message.role!=="assistant"){continue;}
    if(message.answerError||!String(message.text||"").trim()){return null;}
    if(!message.diagramOptions&&!message.diagramError&&/failed\s+to\s+fetch|לא\s+זמין|לא\s+(?:ניתן|הצלחנו)\s+(?:להשלים|לקבל)|נסו\s+שוב\s+בעוד/i.test(message.text)){return null;}
    return message;
  }
  return null;
}
