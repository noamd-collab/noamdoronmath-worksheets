<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<title>דף עבודה · מתמטיקה · נועם דורון</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.noamdoronmath.co.il" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<!-- Start fetching the PDF engine early; AI math assets load when the panel opens. -->
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin="anonymous">

<style>
:root{
  --ink:#14213D;
  --accent:#7B2FD1;
  --accent-dark:#551F92;
  --on-accent:#fff;
  --tint:#EBDDFB;
  --paper:#E3DFD2;
  --grid:#BFBDB2;
  --muted:#5E5478;
  --r:18px;
}

[data-grade="7"]{
  --accent:#7B2FD1;
  --accent-dark:#551F92;
  --tint:#EBDDFB;
  --muted:#5E5478;
}

[data-grade="8"]{
  --accent:#D62A8E;
  --accent-dark:#961B62;
  --tint:#FBDCEE;
  --muted:#6E4F62;
}

[data-grade="9"]{
  --accent:#00A08A;
  --accent-dark:#00705F;
  --on-accent:#14213D;
  --tint:#CFF3EC;
  --muted:#4A6B64;
}

*,*::before,*::after{
  box-sizing:border-box;
}

html,body{
  height:100%;
  margin:0;
}

body{
  font-family:'Assistant','Heebo',Arial,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;

  background:
    linear-gradient(var(--grid) 2.2px, transparent 2.2px) 0 0/45px 45px,
    linear-gradient(90deg, var(--grid) 2.2px, transparent 2.2px) 0 0/45px 45px,
    var(--paper);

  display:flex;
  flex-direction:column;
}

.noam-sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
  border:0;
}

.skip-link{
  position:fixed;
  inset-block-start:8px;
  inset-inline-start:8px;
  z-index:100;
  padding:10px 16px;
  border:3px solid var(--ink);
  border-radius:10px;
  color:var(--ink);
  background:#fff;
  font-weight:800;
  transform:translateY(-180%);
}

.skip-link:focus{transform:translateY(0)}
:where(a,button,input,textarea,[tabindex]):focus-visible{
  outline:3px solid var(--accent-dark);
  outline-offset:3px;
}

/* HEADER */

.bar{
  flex:none;
  display:flex;
  align-items:center;
  gap:10px 12px;
  flex-wrap:wrap;
  padding:10px 14px;
  background:#fff;
  border-bottom:3px solid var(--ink);
}

.bar h1{
  flex:0 1 auto;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:20px;
  margin:0;
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.bar h1 span.ttl{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.context-chips{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  min-width:0;
}

.chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12.5px;
  line-height:1;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:6px 13px;
  background:var(--tint);
}

.level-switch{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.level-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12.5px;
  line-height:1;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:6px 13px;
  transition:transform .14s ease, box-shadow .14s ease, background .14s ease;
}

.level-link:hover{
  transform:translateY(-1px);
  box-shadow:-2px 2px 0 var(--ink);
}

.level-link[aria-current="page"]{
  color:var(--on-accent);
  background:var(--accent);
  box-shadow:-2px 2px 0 var(--ink);
  cursor:default;
  pointer-events:none;
}

.level-link[data-level="c"][aria-current="page"]{
  color:var(--ink);
  background:#FFD84D;
}

.level-link.is-loading,
.level-link[aria-disabled="true"]{
  opacity:.48;
  cursor:wait;
  pointer-events:none;
}

.bar .spacer{
  margin-inline-start:auto;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:8px 16px;
  box-shadow:-3px 3px 0 var(--ink);
}

.btn:hover{
  transform:translateY(-1px);
}

.btn--go{
  background:var(--accent);
  color:var(--on-accent);
}

/* LAYOUT */

.stage{
  flex:1;
  display:flex;
  min-height:0;
}

.pdfwrap{
  flex:1;
  min-width:0;
  min-height:0;
  padding:8px;
}

.pdf-surface{
  --pdf-tools-width:136px;
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  width:100%;
  height:100%;
  min-height:0;
  overflow:hidden;
  background:#E9EAEC;
  border:3px solid var(--ink);
  border-radius:var(--r);
  box-shadow:-5px 5px 0 var(--ink);
}

.pdf-surface.has-pdf-tools{
  grid-template-columns:var(--pdf-tools-width) minmax(0,1fr);
}

.pdf-scroll,
.pdf-native{
  grid-area:1 / 1;
  min-width:0;
  min-height:0;
}

.pdf-surface.has-pdf-tools .pdf-scroll,
.pdf-surface.has-pdf-tools .pdf-native{
  grid-column:2;
}

.pdf-surface.has-pdf-tools .pdf-status{
  inset-inline-start:var(--pdf-tools-width);
}

.pdf-surface.has-pdf-tools .pdf-fallback-message{
  inset-inline-start:calc(var(--pdf-tools-width) + 12px);
}

.pdf-scroll{
  width:100%;
  height:100%;
  overflow:auto;
  overscroll-behavior:contain;
  padding:10px 10px 28px;
  background:#E9EAEC;
  scrollbar-gutter:stable;
}

.pdf-scroll.hidden{
  display:none;
}

.pdf-pages{
  width:max-content;
  min-width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  margin-inline:auto;
}

.pdf-page{
  position:relative;
  flex:none;
  width:min(900px, calc(100vw - 80px));
  max-width:none;
  min-height:320px;
  aspect-ratio:210 / 297;
  overflow:hidden;
  background:#fff;
  box-shadow:0 2px 12px rgba(20,33,61,.18);
}

.pdf-page canvas{
  display:block;
  max-width:none;
  height:auto;
  background:#fff;
}

.pdf-page-wait{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  min-height:220px;
  color:#6C7484;
  font-family:'Heebo',sans-serif;
  font-weight:800;
  font-size:13px;
}

.pdf-page.is-ready .pdf-page-wait{
  display:none;
}

.pdf-status{
  position:absolute;
  inset:0;
  z-index:4;
  display:grid;
  place-items:center;
  padding:24px;
  text-align:center;
  background:#E9EAEC;
  color:var(--ink);
  font-family:'Heebo',sans-serif;
  font-weight:900;
}

.pdf-status.hidden{
  display:none;
}

.pdf-native{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  display:block;
}

.pdf-native.hidden{
  display:none;
}

.pdf-tools{
  position:relative;
  grid-area:1 / 1;
  align-self:start;
  min-height:0;
  max-height:calc(100% - 20px);
  overflow-y:auto;
  overscroll-behavior:contain;
  margin:10px 8px;
  z-index:8;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:7px;
  padding:8px;
  background:rgba(255,255,255,.97);
  border:2.5px solid var(--ink);
  border-radius:14px;
  box-shadow:-3px 3px 0 var(--ink);
}

.pdf-tools.hidden,
.pdf-tools > .hidden{
  display:none;
}

.pdf-tool,
.pdf-tool-link{
  flex-shrink:0;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12.5px;
  line-height:1.3;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:normal;
  text-align:center;
  cursor:pointer;
  border:2px solid var(--ink);
  border-radius:999px;
  padding:7px 11px;
}

.pdf-tool.primary{
  color:var(--on-accent);
  background:var(--accent);
}

.pdf-zoom-value{
  min-width:48px;
  text-align:center;
  font-family:'Heebo',sans-serif;
  font-size:12.5px;
  font-weight:900;
}

.pdf-zoom-slider{
  display:block;
  flex-shrink:0;
  width:100%;
  min-width:0;
  height:44px;
  margin:0;
  direction:ltr;
  accent-color:var(--accent);
  cursor:ew-resize;
}

#pdfZoomOut,
#pdfZoomIn{
  align-self:center;
  width:30px;
  height:30px;
  min-height:30px;
  padding:0;
  border-width:1.5px;
  font-size:16px;
  line-height:1;
}

.pdf-fallback-message{
  position:absolute;
  inset-inline:12px;
  inset-block-end:12px;
  z-index:7;
  padding:8px 12px;
  color:var(--ink);
  background:rgba(255,255,255,.95);
  border:2px solid var(--ink);
  border-radius:12px;
  font-size:12px;
  font-weight:800;
}

.pdf-fallback-message.hidden{
  display:none;
}

/* AI PANEL */

.panel{
  flex:none;
  width:430px;
  max-width:46vw;
  padding:8px 8px 8px 0;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.panel.hidden{
  display:none;
}

.panel-in{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  border:3px solid var(--ink);
  border-radius:var(--r);
  box-shadow:-5px 5px 0 var(--ink);
  overflow:hidden;
}

.panel-head{
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:58px;
  padding:10px 12px;
  background:var(--tint);
  border-bottom:3px solid var(--ink);
}

.panel-head b{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:17px;
}

.panel-badge{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:4px 10px;
  color:var(--accent-dark);
  background:rgba(255,255,255,.68);
  border-radius:999px;
  font-family:'Heebo',sans-serif;
  font-size:11.5px;
  font-weight:900;
  white-space:nowrap;
}

.panel-head-spacer{
  flex:1;
}

.panel-back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:6px 12px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  font-family:'Heebo',sans-serif;
  font-size:12.5px;
  font-weight:900;
  cursor:pointer;
}

.panel-back[hidden]{
  display:none;
}

.panel-close{
  flex:none;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  color:var(--ink);
  background:transparent;
  border:0;
  border-radius:50%;
  font-size:22px;
  line-height:1;
  cursor:pointer;
}

.panel-close:hover{
  background:rgba(255,255,255,.58);
}

.panel-body{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:14px;
}

.step-title{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  margin:0 0 10px;
}

.opts{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

.qpick{
  display:flex;
  align-items:stretch;
  gap:8px;
  margin-bottom:8px;
}

.qinput{
  flex:1;
  min-width:0;
  font-family:'Heebo',sans-serif;
  font-weight:800;
  font-size:16px;
  color:var(--ink);
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:10px 12px;
  text-align:center;
}

.qinput:focus{
  outline:none;
  box-shadow:-3px 3px 0 var(--accent);
}

.inline-error{
  min-height:20px;
  margin:6px 0 0;
  color:#9A1D2F;
  font-weight:800;
  font-size:13px;
}

.opt{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  background:#fff;
  color:var(--ink);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:8px 15px;
  box-shadow:-2px 2px 0 var(--ink);
}

.picked{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:var(--tint);
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:9px 12px;
  font-weight:800;
  font-size:14px;
  margin-bottom:14px;
}

.picked button{
  margin-inline-start:auto;
  font-family:inherit;
  font-weight:800;
  font-size:12.5px;
  cursor:pointer;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  padding:4px 10px;
}

textarea{
  width:100%;
  min-height:92px;
  resize:vertical;
  font-family:inherit;
  font-size:15px;
  color:var(--ink);
  padding:11px 13px;
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
}

textarea:focus{
  outline:none;
  box-shadow:-3px 3px 0 var(--accent);
}

.send{
  width:100%;
  margin-top:10px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:var(--on-accent);
  background:var(--accent);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:11px;
  box-shadow:-3px 3px 0 var(--ink);
}

.send.qgo{
  flex:none;
  margin-top:0;
  width:auto;
  min-width:92px;
  padding-inline:18px;
}

/* 3 BUTTONS */

.assist-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin:8px 0 4px;
}

.assist-btn{
  width:100%;
  text-align:right;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:var(--ink);
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:14px;
  padding:12px 14px;
  box-shadow:-3px 3px 0 var(--ink);
}

.assist-btn.primary{
  background:var(--tint);
}

.assist-btn.custom{
  background:var(--accent);
  color:var(--on-accent);
}

.hint{
  font-size:12.5px;
  font-weight:700;
  color:var(--muted);
  margin:10px 0 0;
}

.note{
  background:var(--tint);
  border:2.5px dashed var(--ink);
  border-radius:12px;
  padding:14px;
  font-weight:700;
  font-size:14px;
  line-height:1.55;
}

.thinking{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:15px;
}

.dots::after{
  content:".";
  animation:dots 1.2s steps(4,end) infinite;
}

@keyframes dots{
  0%{content:"."}
  33%{content:".."}
  66%{content:"..."}
  100%{content:"."}
}

.answer{
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:14px;
  font-size:15px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.qecho{
  font-weight:800;
  font-size:13.5px;
  color:var(--muted);
  margin:0 0 10px;
}

.skel{
  height:38px;
  border-radius:999px;
  background:linear-gradient(90deg,#eee,#f7f7f7,#eee);
  background-size:200% 100%;
  animation:sh 1.2s linear infinite;
  margin-bottom:8px;
}

@keyframes sh{
  to{
    background-position:-200% 0;
  }
}

/* FLOATING AI BUTTON */

.fab{
  position:fixed;
  inset-block-end:18px;
  inset-inline-end:18px;
  z-index:40;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
  color:var(--on-accent);
  background:var(--accent);
  border:3px solid var(--ink);
  border-radius:999px;
  padding:13px 22px;
  box-shadow:-5px 5px 0 var(--ink);
}

.fab.hidden{
  display:none;
}

.mobile-hint,.mobile-close-label{display:none}


/* CHAT */
.chat-shell{
  display:flex;
  flex-direction:column;
  min-height:100%;
}

.chat-log{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-bottom:10px;
}

.chat-row{
  display:flex;
  width:100%;
}

.chat-row.student{
  justify-content:flex-start;
}

.chat-row.tutor{
  justify-content:flex-end;
}

.chat-bubble{
  max-width:96%;
  border:2.5px solid var(--ink);
  border-radius:16px;
  padding:10px 12px;
  font-size:13.5px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
  box-shadow:-2px 2px 0 var(--ink);
}

.chat-row.student .chat-bubble{
  background:var(--accent);
  color:var(--on-accent);
  border-bottom-right-radius:5px;
}

.chat-row.tutor .chat-bubble{
  background:var(--tint);
  color:var(--ink);
  border-bottom-left-radius:5px;
}

.chat-name{
  display:block;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:11.5px;
  margin-bottom:3px;
  opacity:.78;
}

.chat-thinking{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:900;
}

.chat-quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:10px 0 8px;
}

.chat-quick .assist-btn{
  font-size:13px;
  padding:9px 10px;
  text-align:center;
}

.chat-compose{
  position:sticky;
  bottom:-14px;
  margin:0 -2px -14px;
  padding:10px 2px 14px;
  background:#fff;
  border-top:2px solid #ece8f1;
}

.chat-compose-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.chat-input{
  flex:1;
  min-height:48px;
  max-height:120px;
  resize:vertical;
  margin:0;
}

.chat-send{
  flex:none;
  width:auto;
  min-width:72px;
  margin:0;
  padding:11px 13px;
}

.chat-send[disabled],
.assist-btn[disabled]{
  opacity:.55;
  cursor:not-allowed;
}

.chat-error{
  background:#fff4f4;
  border:2px dashed #9A1D2F;
  border-radius:12px;
  padding:10px 12px;
  font-size:13px;
  font-weight:800;
  color:#7b1726;
}


/* ---------- IMAGE ATTACHMENT ---------- */
.chat-tools{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0 0;
  flex-wrap:wrap;
}

.image-pick{
  width:auto;
  margin:0;
  padding:8px 12px;
  font-size:13px;
  background:#fff;
  color:var(--ink);
}

.image-pick[disabled]{
  opacity:.55;
  cursor:not-allowed;
}

.image-preview{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:8px;
  padding:8px 10px;

}

/* ---------- מתמטיקה: KaTeX + RTL/LTR isolation ---------- */
/* טקסט השיחה נשאר RTL; כל נוסחה היא אי LTR עצמאי. */
.chat-bubble{
  direction:rtl;
  text-align:right;
  unicode-bidi:isolate;
}

.katex,
.katex-html{
  direction:ltr !important;
  unicode-bidi:isolate !important;
}

.katex{
  display:inline-block;
  max-width:100%;
}

/* נוסחה קצרה שנשלפה מתוך משפט עברי נשמרת כאי LTR עצמאי. */
.math-island{
  display:inline-block;
  direction:ltr;
  unicode-bidi:isolate;
  max-width:100%;
}

/* legacy formula שמכילה \text{עברית}: העברית יוצאת מ-KaTeX
   ונשארת טקסט RTL רגיל, בעוד המתמטיקה נשארת באיי LTR. */
.mixed-math{
  direction:rtl;
  unicode-bidi:isolate;
}

.mixed-math-display{
  display:block;
  direction:rtl;
  unicode-bidi:isolate;
  text-align:right;
  margin:.65em 0;
}

.katex-display{
  direction:ltr !important;
  unicode-bidi:isolate !important;
  overflow-x:auto;
  overflow-y:hidden;
  max-width:100%;
  margin:.65em 0;
  padding:2px 0;
  text-align:center;
}

.katex-display > .katex{
  display:inline-block;
  text-align:initial;
}

/* אם KaTeX אינו זמין, הטקסט נשאר קריא במקום לשבור את הפאנל */
.math-render-error{
  direction:ltr;
  unicode-bidi:isolate;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}

/* =============================================================
   NOAM AI STATIC MANIFEST LAYER
   ============================================================= */
.pdf-page .noam-exercise-pin{
  position:absolute;
  z-index:12;
  width:29px;
  height:29px;
  display:grid;
  place-items:center;
  padding:0;
  transform:translate(-50%,-50%);
  color:var(--ink);
  background:rgba(255,255,255,.96);
  border:2px solid var(--ink);
  border-radius:50%;
  box-shadow:-2px 2px 0 var(--ink);
  cursor:pointer;
  font-size:14px;
  line-height:1;
  transition:transform .14s ease,background .14s ease,box-shadow .14s ease;
}
.pdf-page .noam-exercise-pin:hover,
.pdf-page .noam-exercise-pin:focus-visible{
  transform:translate(-50%,-50%) scale(1.1);
  background:var(--tint);
  outline:none;
}
.pdf-page .noam-exercise-pin.is-active{
  color:var(--on-accent);
  background:var(--accent);
  box-shadow:-3px 3px 0 var(--ink);
}
.pdf-page .noam-exercise-pin::after{
  content:attr(data-label);
  position:absolute;
  inset-inline-start:34px;
  top:50%;
  width:max-content;
  max-width:220px;
  transform:translateY(-50%);
  padding:6px 9px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  box-shadow:-2px 2px 0 var(--ink);
  font-family:'Heebo',sans-serif;
  font-size:11.5px;
  font-weight:900;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
.pdf-page .noam-exercise-pin:hover::after,
.pdf-page .noam-exercise-pin:focus-visible::after{
  opacity:1;
}
.noam-manifest-note{
  padding:10px 12px;
  margin-bottom:12px;
  border:2px solid var(--ink);
  border-radius:12px;
  background:var(--tint);
  font-weight:800;
  font-size:13px;
  line-height:1.55;
}
.noam-picked{
  padding:10px 12px;
  margin-bottom:12px;
  background:var(--tint);
  border:2px solid var(--ink);
  border-radius:12px;
}
.noam-picked-label{
  font-family:'Heebo',sans-serif;
  font-size:13px;
  font-weight:900;
  margin-bottom:4px;
}
.noam-picked-text{
  font-size:14px;
  line-height:1.6;
}
.noam-picked-preview{
  width:100%;
  max-height:220px;
  margin-top:6px;
  overflow:hidden;
  direction:ltr;
  background:#fff;
  border:1px solid rgba(20,33,61,.18);
  border-radius:9px;
}
.noam-picked-preview img{
  display:block;
  width:100%;
  height:auto;
  max-height:220px;
  object-fit:contain;
  object-position:center;
}
.noam-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:8px;
}
.noam-action{
  min-height:36px;
  padding:7px 12px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  box-shadow:-2px 2px 0 var(--ink);
  font-family:'Heebo',sans-serif;
  font-size:12.5px;
  font-weight:900;
  cursor:pointer;
}
.noam-action.primary{
  color:var(--on-accent);
  background:var(--accent);
}
.noam-action[disabled]{opacity:.45;cursor:not-allowed}
.noam-thread-tools{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:8px 0;
}
.noam-link-button{
  padding:2px 0;
  color:var(--muted);
  background:transparent;
  border:0;
  font-family:'Assistant',sans-serif;
  font-size:12px;
  font-weight:800;
  text-decoration:underline;
  cursor:pointer;
}
.noam-transcript{
  min-height:110px;
  max-height:38vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:7px 2px 12px;
  scroll-behavior:smooth;
}
.noam-empty{
  padding:10px 2px;
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}
.noam-row{display:flex;width:100%}
.noam-row.user{justify-content:flex-start}
.noam-row.assistant{justify-content:flex-end}
.noam-bubble{
  max-width:90%;
  padding:8px 10px;
  border:2px solid var(--ink);
  border-radius:13px;
  font-size:14.5px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.noam-row.user .noam-bubble{
  background:#fff;
  border-bottom-right-radius:4px;
}
.noam-row.assistant .noam-bubble{

  border-bottom-left-radius:4px;
}
.noam-bubble.thinking{

}
.noam-thinking-dots{display:inline-flex;gap:4px;flex-shrink:0}

  width:5px;

}
.noam-thinking-dots span:nth-child(2){animation-delay:.16s}
.noam-thinking-dots span:nth-child(3){animation-delay:.32s}
@keyframes noam-thinking-pulse{
  0%,60%,100%{opacity:.35;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-3px)}
}
@media(prefers-reduced-motion:reduce){
  .noam-thinking-dots span{animation:none;opacity:.7}
}
.noam-kind{
  display:block;
  margin-bottom:3px;
  color:var(--accent-dark);
  font-family:'Heebo',sans-serif;
  font-size:10.5px;

}

.noam-math-toggle{
  padding:4px 8px;

  border-radius:8px;

  background:var(--tint);

  border-radius:7px;
  color:var(--ink);
  background:#fff;
  font:600 17px Georgia,serif;
  cursor:pointer;
}
.noam-math-key:hover{background:var(--tint)}
.noam-math-key:focus-visible,.noam-math-toggle:focus-visible{outline:2px solid var(--accent-dark);outline-offset:2px}
.noam-math-key[disabled],.noam-math-toggle[disabled]{opacity:.45;cursor:not-allowed}
.noam-compose textarea{
  width:100%;
  min-height:68px;
  resize:vertical;
  padding:9px 10px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:11px;

.noam-send{
  width:100%;
  margin-top:7px;
  padding:9px 12px;
  color:#fff;
  background:var(--ink);
  border:2px solid var(--ink);
  border-radius:999px;
  font-family:'Heebo',sans-serif;
  font-size:13.5px;
  font-weight:900;

}
.noam-send[disabled]{opacity:.45;cursor:not-allowed}
.noam-question-list{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
}
.noam-question-list button{
  min-height:36px;

  border:2px solid var(--ink);

.noam-dot::after{content:"";animation:dots 1.1s steps(4,end) infinite}

<script>
(function(){

"use strict";

var mobileLayout = window.matchMedia("(max-width:900px)");

/* CONFIG */

var BASE =

var API =

// The public config and Google key domains were verified before activation.

var BOT_GUARD_ENABLED = true;
var noamBotClient = null;
var noamBotClientLoading = null;

var LEVEL = {

};

var MIN_WAIT = 1250;
var TIMEOUT = 20000;
var STATUS_POLL_MS = 1500;
var ASYNC_JOB_MAX_WAIT = 8 * 60 * 1000;

var MAX_IMAGE_BYTES = 2 * 1024 * 1024;
var TARGET_IMAGE_BYTES = 250 * 1024;
var MAX_IMAGE_DIMENSION = 1800;
var SOLVER_MESSAGE_MAX = 700;
var MATH_OUTPUT_INSTRUCTION =
  "\n\nהנחיית תצוגה: כתוב כל ביטוי מתמטי ב-LaTeX תקין. עטוף ביטוי בתוך \\( ... \\) ונוסחה נפרדת בתוך \\[ ... \\].";

var GRADE_NAME = {
  7:"כיתה ז׳",

};

var GRADE_EMOJI = {

};

var LEVEL_NAME = {

/* R504-DEV-MIN-20260901-01: LOCAL-OVERRIDE DEVELOPMENT COPY, NOT FOR GITHUB.
   Observability only: no student text, image data or answer text in this buffer.
   E2E below is accepted ask() to final UI update; image requests may span
   multiple short start/status HTTP calls. It is NOT a physical paint,
   image-attachment/compression or PDF-load measurement. */
var DEV_CANDIDATE = "NOAM-STATIC-MANIFEST-V1-20260904";
var devMeasurements = [];
var devSequence = 0;

function devNow(){
  return window.performance && typeof window.performance.now === "function"
    ? window.performance.now()
    : Date.now();
}

function devElapsed(started){
  return Math.max(0, Math.round(devNow() - started));
}

function devBegin(route, exerciseId){
  devSequence += 1;
  var record = {
    candidate:DEV_CANDIDATE,
    clientRequestId:"v504-" + Date.now().toString(36) + "-" +
      devSequence.toString(36) + "-" + Math.random().toString(36).slice(2, 8),
    startedAtUtc:new Date().toISOString(),
    route:route,
    exerciseId:exerciseId,
    endpoint:API + "/noamTutor",
    clock:"performance.now",
    outcome:"pending",
    httpStatus:null,
    requestId:null,
    networkStartMs:null,
    headersMs:null,
    bodyDoneMs:null,
    uiUpdatedMs:null,
    nextFrameMs:null,
    minimumWaitMs:0,
    responseAnswerChars:null,
    jobId:null,
    acceptedMs:null,
    statusPolls:0,
    errorCode:null
  };
  if (!(window.performance && typeof window.performance.now === "function")){
    record.clock = "Date.now fallback";
  }
  devMeasurements.push(record);
  if (devMeasurements.length > 80){ devMeasurements.shift(); }
  console.info("NOAM VIEWER START:", JSON.stringify(record));
  return { started:devNow(), record:record };
}

function devReadResponse(measurement, data){
  if (!measurement){ return; }
  var record = measurement.record;
  record.bodyDoneMs = devElapsed(measurement.started);
  if (data && typeof data.requestId === "string" &&
      /^r504-[a-z0-9-]{1,150}$/i.test(data.requestId)){
    record.requestId = data.requestId;
  }
  if (data && typeof data.answer === "string"){
    record.responseAnswerChars = data.answer.length;
  }
  if (data && typeof data.hint === "string"){
    record.responseAnswerChars = data.hint.length;
  }
  if (data && typeof data.jobId === "string"){
    record.jobId = data.jobId;
  }
}

function devFinish(measurement, outcome, errorCode){
  if (!measurement){ return; }
  measurement.record.outcome = outcome;
  measurement.record.errorCode = errorCode || null;
  measurement.record.uiUpdatedMs = devElapsed(measurement.started);
  console.info("NOAM VIEWER END:", JSON.stringify(measurement.record));
  if (typeof window.requestAnimationFrame === "function"){
    window.requestAnimationFrame(function(){
      measurement.record.nextFrameMs = devElapsed(measurement.started);
    });
  }
}

/* ASYNC OWNER KEY

var OWNER_KEY_STORAGE = "noam-ai-owner-key-v1";
var OWNER_KEY_RE = /^[A-Za-z0-9_-]{16,200}$/;

function createOwnerKey(){
  if (window.crypto && typeof window.crypto.randomUUID === "function"){
    return window.crypto.randomUUID();
  }

  var bytes = new Uint8Array(24);

  if (window.crypto && typeof window.crypto.getRandomValues === "function"){
    window.crypto.getRandomValues(bytes);
  }else{
    for (var i = 0; i < bytes.length; i += 1){
      bytes[i] = Math.floor(Math.random() * 256);
    }
  }

  var out = "";
  for (var j = 0; j < bytes.length; j += 1){
    out += bytes[j].toString(16).padStart(2, "0");
  }
  return out;
}

function getOwnerKey(){
  var existing = "";

  try{
    existing = String(localStorage.getItem(OWNER_KEY_STORAGE) || "").trim();
  }catch(e){}

  if (OWNER_KEY_RE.test(existing)){
    return existing;
  }

  var created = createOwnerKey();

  try{
    localStorage.setItem(OWNER_KEY_STORAGE, created);
  }catch(e){}

  return created;
}

var ownerKey = getOwnerKey();

/* PARAMS */

var q =
  new URLSearchParams(
    location.search
  );

var g =
  parseInt(
    q.get("g"),
    10
  );

var x =
  (
    q.get("x") ||
    ""
  ).trim();

var lv =
  (
    q.get("lv") ||
    ""
  ).trim().toLowerCase();

var pdf =
  (
    q.get("pdf") ||
    ""
  ).trim().toLowerCase();

var ttl =
  (
    q.get("t") ||
    "דף עבודה"
  ).trim();

var okPdf =
  /^[0-9a-f]{32}$/
  .test(pdf);

var okGrade =
  g >= 7 &&
  g <= 9;

var okX =
  /^G[1-9]-T\d{2}$/
  .test(x) &&
  x.indexOf(
    "G" + g + "-"
  ) === 0;

var okLv =
  Object.prototype
  .hasOwnProperty
  .call(
    LEVEL,
    lv
  );

var aiReady =
  okPdf &&
  okGrade &&
  okX &&
  okLv;

/* INVALID PDF */

if (!okPdf){

  document.body.innerHTML =
    '<div style="' +
    'padding:40px;' +
    'text-align:center;' +
    'font-family:Heebo,sans-serif;' +
    'font-weight:900' +
    '">' +

    'הקישור אינו תקין. ' +

    '<a href="./">' +
    'חזרה לדפי העבודה' +
    '</a>' +

    '</div>';

  return;
}

/* PDF */

var pdfUrl =
  BASE +
  pdf +
  ".pdf";

document.body
  .setAttribute(
    "data-grade",
    okGrade ? g : 7
  );

document.title =
  ttl +
  " · מתמטיקה · נועם דורון";

document
  .getElementById("title")
  .textContent =
  ttl;

document
  .getElementById("emoji")
  .textContent =
  GRADE_EMOJI[g] ||
  "📄";

document
  .getElementById("rawBtn")
  .href =
  pdfUrl;

document
  .getElementById("pdfOpenFull")
  .href =
  pdfUrl;

/* HEADER CONTEXT + LEVEL SWITCHER */

var gc =
  document
  .getElementById(
    "gradeChip"
  );

if (okGrade){

  gc.textContent =
    GRADE_NAME[g];

}else{

  gc.style.display =
    "none";
}

var levelSwitch =
  document
  .getElementById(
    "levelSwitch"
  );

var levelPdfMap = {
  a:"",
  b:"",
  c:""
};

["a", "b", "c"]
  .forEach(
    function(key){

      var candidate =
        String(
          q.get("p" + key) ||
          ""
        )
        .trim()
        .toLowerCase();

      if (
        /^[0-9a-f]{32}$/
        .test(candidate)
      ){
        levelPdfMap[key] =
          candidate;
      }
    }
  );

if (okLv){
  levelPdfMap[lv] =
    pdf;
}

function buildLevelHref(
  nextLevel,
  nextPdf
){

  var next =
    new URL(
      window.location.href
    );

  next.searchParams
    .set(
      "lv",
      nextLevel
    );

  next.searchParams
    .set(
      "pdf",
      nextPdf
    );

  ["a", "b", "c"]
    .forEach(
      function(key){

        if (
          levelPdfMap[key]
        ){
          next.searchParams
            .set(
              "p" + key,
              levelPdfMap[key]
            );
        }
      }
    );

  return (
    next.pathname +
    next.search +
    next.hash
  );
}

function renderLevelSwitch(
  loading
){

  if (!okLv){
    levelSwitch.style.display =
      "none";
    return;
  }

  var html =
    ["a", "b", "c"]
    .map(
      function(key){

        var label =
          LEVEL_NAME[key];

        if (key === lv){
          return (
            '<span class="level-link" ' +
            'data-level="' + key + '" ' +
            'aria-current="page">' +
            label +
            '</span>'
          );
        }

        if (
          levelPdfMap[key]
        ){
          return (
            '<a class="level-link" ' +
            'data-level="' + key + '" ' +
            'href="' +
            escAttr(
              buildLevelHref(
                key,
                levelPdfMap[key]
              )
            ) +
            '">' +
            label +
            '</a>'
          );
        }

        if (loading){
          return (
            '<span class="level-link is-loading" ' +
            'data-level="' + key + '" ' +
            'aria-disabled="true">' +
            label +
            '</span>'
          );
        }

        return "";
      }
    )
    .join("");

  levelSwitch.innerHTML =
    html;
}

function escapeRegExp(value){
  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );
}

function parseIndexLevelPdfs(
  source
){

  if (
    !okGrade ||
    !okX ||
    !source
  ){
    return null;
  }

  var topicMatch =
    new RegExp(
      "\\{\\s*id\\s*:\\s*(\\d+)\\s*,\\s*x\\s*:\\s*[\"']" +
      escapeRegExp(x) +
      "[\"']",
      "i"
    )
    .exec(source);

  if (!topicMatch){
    return null;
  }

  var topicId =
    parseInt(
      topicMatch[1],
      10
    );

  var dataStart =
    source.indexOf(
      "var DATA"
    );

  var gradeSearch =
    dataStart >= 0
      ? source.slice(dataStart)
      : source;

  var gradeMarker =
    new RegExp(
      "(?:^|\\n)\\s*" +
      g +
      "\\s*:\\s*\\{\\s*(?:\\n\\s*)?links\\s*:\\s*\\{",
      "m"
    )
    .exec(gradeSearch);

  if (!gradeMarker){
    return null;
  }

  var gradeStart =
    gradeMarker.index;

  var groupsIndex =
    gradeSearch.indexOf(
      "groups:",
      gradeStart
    );

  if (groupsIndex < 0){
    return null;
  }

  var gradeBlock =
    gradeSearch.slice(
      gradeStart,
      groupsIndex
    );

  var rowMatch =
    new RegExp(
      "(?:^|\\n)\\s*" +
      topicId +
      "\\s*:\\s*\\{([\\s\\S]*?)\\}",
      "m"
    )
    .exec(gradeBlock);

  if (!rowMatch){
    return null;
  }

  var row =
    rowMatch[1];

  var found = {
    a:"",
    b:"",
    c:""
  };

  ["a", "b", "c"]
    .forEach(
      function(key){

        var match =
          new RegExp(
            "(?:^|[,\\s])" +
            key +
            "\\s*:\\s*[\"']([0-9a-f]{32})[\"']",
            "i"
          )
          .exec(row);

        if (match){
          found[key] =
            match[1]
            .toLowerCase();
        }
      }
    );

  return found;
}

function discoverSiblingLevels(){

  if (
    !okX ||
    !okGrade ||
    !okLv
  ){
    renderLevelSwitch(false);
    return;
  }

  if (levelPdfMap.a && levelPdfMap.b && levelPdfMap.c){
    renderLevelSwitch(false);
    return;
  }

  renderLevelSwitch(
    !(
      levelPdfMap.a &&
      levelPdfMap.b &&
      levelPdfMap.c
    )
  );

  fetch(
    "./index.html",
    {
      cache:"default"
    }
  )
  .then(
    function(response){

      if (!response.ok){
        throw new Error(
          "index " +
          response.status
        );
      }

      return response.text();
    }
  )
  .then(
    function(source){

      var discovered =
        parseIndexLevelPdfs(
          source
        );

      if (discovered){
        ["a", "b", "c"]
          .forEach(
            function(key){

              if (
                discovered[key] &&
                key !== lv
              ){
                levelPdfMap[key] =
                  discovered[key];
              }
            }
          );
      }

      renderLevelSwitch(false);
    }
  )
  .catch(
    function(error){
      console.warn(
        "LEVEL SWITCH DISCOVERY:",
        error
      );

      renderLevelSwitch(false);
    }
  );
}

renderLevelSwitch(true);
discoverSiblingLevels();

function createPdfPageShells(
  doc
){

  var html =
    "";

  for (
    var pageNumber = 1;
    pageNumber <= doc.numPages;
    pageNumber += 1
  ){
    html +=
      '<div class="pdf-page" data-page="' +
      pageNumber +
      '" data-state="idle">' +
        '<canvas aria-label="עמוד ' +
        pageNumber +
        '"></canvas>' +
        '<div class="pdf-page-wait">עמוד ' +
        pageNumber +
        '</div>' +
      '</div>';
  }

  pdfPages.innerHTML =
    html;
}

function renderPdfPage(
  pageNumber,
  version
){

  if (
    !pdfDocument ||
    version !== pdfRenderVersion
  ){
    return;
  }

  var pageElement =
    pdfPages.querySelector(
      '[data-page="' +
      pageNumber +
      '"]'
    );

  if (!pageElement){
    return;
  }

  var state =
    pageElement.getAttribute(
      "data-state"
    );

  if (
    state === "rendering" ||
    state === "ready"
  ){
    return;
  }

  pageElement.setAttribute(
    "data-state",
    "rendering"
  );

  pdfDocument
    .getPage(pageNumber)
    .then(
      function(page){

        if (
          version !== pdfRenderVersion
        ){
          return;
        }

        var baseViewport =
          page.getViewport({
            scale:1
          });

        var cssScale = getPdfPageWidth() / baseViewport.width;

        var viewport =
          page.getViewport({
            scale:cssScale
          });

        var pixelRatio =
          Math.min(
            window.devicePixelRatio || 1,
            mobileLayout.matches ? 2 : 1.25
          );

        var canvas =
          pageElement.querySelector(
            "canvas"
          );

        var context =
          canvas.getContext(
            "2d",
            {
              alpha:false
            }
          );

        canvas.width =
          Math.max(
            1,
            Math.floor(
              viewport.width *
              pixelRatio
            )
          );

        canvas.height =
          Math.max(
            1,
            Math.floor(
              viewport.height *
              pixelRatio
            )
          );

        canvas.style.width =
          Math.floor(
            viewport.width
          ) +
          "px";

        canvas.style.height =
          Math.floor(
            viewport.height
          ) +
          "px";

        pageElement.style.width =
          Math.floor(
            viewport.width
          ) +
          "px";

        pageElement.style.height =
          Math.floor(
            viewport.height
          ) +
          "px";

        pageElement.style.aspectRatio =
          viewport.width +
          " / " +
          viewport.height;

        var renderTask =
          page.render({
            canvasContext:context,
            viewport:viewport,
            transform:
              pixelRatio === 1
                ? null
                : [
                    pixelRatio,
                    0,
                    0,
                    pixelRatio,
                    0,
                    0
                  ]
          });

        pageElement._renderTask =
          renderTask;

        return renderTask.promise;
      }
    )
    .then(
      function(){

        if (
          version !== pdfRenderVersion
        ){
          return;
        }

        pageElement.setAttribute(
          "data-state",
          "ready"
        );

        pageElement.classList
          .add(
            "is-ready"
          );
        if (manifestReady){renderManifestPins();}
      }
    )
    .catch(
      function(error){

        if (
          error &&
          error.name ===
          "RenderingCancelledException"
        ){
          return;
        }

        console.warn(
          "PDF PAGE RENDER:",
          pageNumber,
          error
        );

        pageElement.setAttribute(
          "data-state",
          "error"
        );

        var wait =
          pageElement.querySelector(
            ".pdf-page-wait"
          );

        if (wait){
          wait.textContent =
            "לא הצלחתי להציג את עמוד " +
            pageNumber;
        }
      }
    );
}

function observePdfPages(){

  if (pdfObserver){
    pdfObserver.disconnect();
  }

  var version =
    pdfRenderVersion;

  if (
    "IntersectionObserver" in window
  ){
    pdfObserver =
      new IntersectionObserver(
        function(entries){
          entries.forEach(
            function(entry){
              if (entry.isIntersecting){
                renderPdfPage(
                  Number(
                    entry.target.dataset.page
                  ),
                  version
                );
              }
            }
          );
        },
        {
          root:pdfScroll,
          rootMargin:"900px 0px",
          threshold:.01
        }
      );

    pdfPages
      .querySelectorAll(
        ".pdf-page"
      )
      .forEach(
        function(pageElement){
          pdfObserver.observe(
            pageElement
          );
        }
      );

  }else{
    for (
      var pageNumber = 1;
      pageNumber <= pdfDocument.numPages;
      pageNumber += 1
    ){
      renderPdfPage(
        pageNumber,
        version
      );
    }
  }
}

function getPdfPageWidth(){
  return Math.max(120,pdfScroll.clientWidth - (mobileLayout.matches ? 64 : 34)) * pdfZoom;
}

// Keep the same point on the current page when rotation or zoom changes page sizes.
function capturePdfPosition(){
  var top = pdfScroll.getBoundingClientRect().top;
  var pages = Array.from(pdfPages.querySelectorAll(".pdf-page"));
  var page = pages.find(function(item){ return item.getBoundingClientRect().bottom > top; });
  if (!page){return null;}
  var rect = page.getBoundingClientRect();
  return { page:page, fraction:Math.max(0,Math.min(1,(top-rect.top)/Math.max(1,rect.height))) };
}

function restorePdfPosition(anchor){
  if (!anchor || !anchor.page.isConnected){return;}
  var rect = anchor.page.getBoundingClientRect();
  pdfScroll.scrollTop += rect.top - pdfScroll.getBoundingClientRect().top + anchor.fraction * rect.height;
}

function resetPdfRendering(){

  if (!pdfDocument){
    return;
  }

  var anchor = capturePdfPosition();
  var nextWidth = getPdfPageWidth();
  pdfRenderVersion += 1;

  pdfPages
    .querySelectorAll(
      ".pdf-page"
    )
    .forEach(
      function(pageElement){

        if (
          pageElement._renderTask &&
          typeof pageElement._renderTask.cancel ===
            "function"
        ){
          try{
            pageElement._renderTask.cancel();
          }catch(e){}
        }

        pageElement._renderTask =
          null;

        pageElement.classList
          .remove(
            "is-ready"
          );

        pageElement.setAttribute(
          "data-state",
          "idle"
        );

        var canvas =
          pageElement.querySelector(
            "canvas"
          );

        if (canvas){
          canvas.width = 1;
          canvas.height = 1;
          canvas.style.width = "";
          canvas.style.height = "";
        }

        var oldRect = pageElement.getBoundingClientRect();
        var ratio = oldRect.width > 0 && oldRect.height > 0 ? oldRect.height / oldRect.width : 297 / 210;
        pageElement.style.width = nextWidth + "px";
        pageElement.style.height = (nextWidth * ratio) + "px";
      }
    );

  restorePdfPosition(anchor);
  observePdfPages();
}

function setPdfZoom(value, deferRender){
  if (!Number.isFinite(value)){ return; }
  var percent = Math.max(70, Math.min(170, Math.round(value * 100)));
  var nextZoom = percent / 100;
  var changed = nextZoom !== pdfZoom;
  pdfZoom = nextZoom;
  pdfZoomValue.textContent = percent + "%";
  pdfZoomSlider.value = String(percent);
  pdfZoomSlider.setAttribute("aria-valuetext", percent + "%");

  if (!changed && !pdfZoomRenderTimer){ return; }
  clearTimeout(pdfZoomRenderTimer);
  pdfZoomRenderTimer = 0;
  // Update the percentage immediately; redraw after a short pause or release.
  if (deferRender){
    pdfZoomRenderTimer = setTimeout(function(){
      pdfZoomRenderTimer = 0;
      resetPdfRendering();
    }, 120);
  }else{
    resetPdfRendering();
  }
}

function schedulePdfResize(){

  clearTimeout(
    pdfResizeTimer
  );

  pdfResizeTimer =
    setTimeout(
      function(){

        var nextWidth =
          Math.round(
            pdfScroll.clientWidth
          );

        if (
          !pdfDocument ||
          Math.abs(
            nextWidth -
            pdfLastWidth
          ) < 3
        ){
          return;
        }

        pdfLastWidth =
          nextWidth;

        resetPdfRendering();
      },
      180
    );
}

var noamAssetLoads = {};

function loadNoamAsset(tag,url){
  if (noamAssetLoads[url]){return noamAssetLoads[url];}
  var element=document.createElement(tag);
  noamAssetLoads[url]=new Promise(function(resolve,reject){
    element.onload=function(){resolve();};
    element.onerror=function(){reject(new Error("לא ניתן לטעון רכיב תצוגה."));};
    if (tag==="script"){
      element.src=url;
      element.async=true;
      element.crossOrigin="anonymous";
    }else{
      element.rel="stylesheet";
      element.href=url;
    }
    document.head.appendChild(element);
  }).catch(function(error){
    delete noamAssetLoads[url];
    element.remove();
    throw error;
  });
  return noamAssetLoads[url];
}

function ensureNoamMathRenderer(){
  if (noamMathAssetsPromise){return noamMathAssetsPromise;}
  var base="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/";
  noamMathAssetsPromise=Promise.all([
    loadNoamAsset("link",base+"katex.min.css"),
    loadNoamAsset("script",base+"katex.min.js").then(function(){
      return loadNoamAsset("script",base+"contrib/auto-render.min.js");
    })
  ]).then(function(){
    noamMathAssetsReady=true;
  }).catch(function(error){
    noamMathAssetsPromise=null;
    throw error;
  });
  return noamMathAssetsPromise;
}

function buildManifestPinGroups(exercises, groupByQuestion){
  var groups = [];
  var byQuestion = Object.create(null);
  exercises.forEach(function(exercise){
    var pageNumber = Number((exercise.pin || {}).page || 0);
    var questionKey = pageNumber + ":" + String(exercise.q);
    var group = groupByQuestion && byQuestion[questionKey];
    if (!group){
      group = { questionKey:questionKey, exercises:[] };
      groups.push(group);
      if (groupByQuestion){ byQuestion[questionKey] = group; }
    }
    group.exercises.push(exercise);
  });
  return groups;
}

function clusterManifestPinGroups(groups, pageHeight){
  var height = Math.max(1, Number(pageHeight) || 1);
  var edge = Math.min(22, height / 2);
  var positioned = groups.map(function(group){
    var pin = group.exercises[0].pin || {};
    var anchor = Math.max(.02, Math.min(.98, Number(pin.y) || .2)) * height;
    return {
      questionKey:group.questionKey,
      questionKeys:[group.questionKey],
      exercises:group.exercises.slice(),
      top:Math.max(edge, Math.min(height - edge, anchor))
    };
  }).sort(function(a,b){ return a.top - b.top; });
  var clusters = [];
  positioned.forEach(function(group){
    var previous = clusters[clusters.length - 1];
    if (previous && group.top - previous.top < 48){
      previous.exercises = previous.exercises.concat(group.exercises);
      previous.questionKeys = previous.questionKeys.concat(group.questionKeys);
    }else{
      clusters.push(group);
    }
  });
  return clusters;
}

function manifestPinQuestionLabel(exercises){
  var questions = [];

    if (questions.indexOf(String(exercise.q)) === -1){ questions.push(String(exercise.q)); }

  return (questions.length > 1 ? "שאלות " : "שאלה ") + questions.join(", ");
}

function renderManifestPins(){
  if (!manifestReady || !pdfPages){ return; }

  var focused = document.activeElement;
  var focusedPinId = focused && focused.classList && focused.classList.contains("noam-exercise-pin")
    ? focused.dataset.exerciseId : null;
  var narrow = noamNarrowPinsMedia.matches;
  var activeQuestionKeys = selectedPin ? (selectedPin.dataset.questionKeys || selectedPin.dataset.questionKey || "").split(" ") : [];
  selectedPin = null;
  pdfPages.querySelectorAll(".noam-exercise-pin")
    .forEach(function(button){ button.remove(); });

  var groups = buildManifestPinGroups(manifest.exercises, narrow);
  if (narrow){
    var groupsByPage = Object.create(null);
    groups.forEach(function(group){
      var number = Number((group.exercises[0].pin || {}).page || 0);
      if (!groupsByPage[number]){ groupsByPage[number] = []; }
      groupsByPage[number].push(group);
    });
    groups = [];
    Object.keys(groupsByPage).forEach(function(number){
      var page = pdfPages.querySelector('.pdf-page[data-page="' + number + '"]');
      if (page && page.clientHeight > 0){
        groups = groups.concat(clusterManifestPinGroups(groupsByPage[number], page.clientHeight));
      }
    });
  }
  groups.forEach(function(group){
    var exercise = group.exercises[0];
    var pin = exercise.pin || {};
    var pageNumber = Number(pin.page || 0);
    var pageElement = pdfPages.querySelector('.pdf-page[data-page="' + pageNumber + '"]');
    if (!pageElement){ return; }

    /*
      Manifest coordinates point at the printed RTL question/part marker.
      Desktop robots stay beside that marker. Phone targets use the reserved
      outer gutter so their larger touch area cannot cover printed content.
    */
    var pinX = Number(pin.x);
    if (!isFinite(pinX)){ pinX = .92; }
    pinX = Math.max(.02,Math.min(.98,pinX));
    var pinLeft = narrow
      ? "calc(100% + 26px)"
      : "clamp(16px, calc(" + (pinX*100) + "% + 52px), calc(100% - 16px))";

    var button = document.createElement("button");
    button.type = "button";
    button.className = "noam-exercise-pin" + (narrow ? " noam-question-pin" : "");
    button.textContent = "🤖";
    button.style.left = pinLeft;
    button.style.top = narrow ? group.top + "px" : (Math.max(.02,Math.min(.98,Number(pin.y)||.2))*100) + "%";
    button.dataset.exerciseId = exercise.id;
    button.dataset.questionKey = group.questionKey;
    button.dataset.questionKeys = (group.questionKeys || [group.questionKey]).join(" ");
    button.dataset.exerciseIds = group.exercises.map(function(item){ return item.id; }).join(" ");
    button.dataset.label = narrow && group.exercises.length > 1
      ? manifestPinQuestionLabel(group.exercises) + " · בחירת שאלה וסעיף · נועם AI"
      : exerciseLabel(exercise) + " · העזר בנועם AI";
    button.setAttribute("aria-label", button.dataset.label);
    var active = selectedExercise
      ? group.exercises.some(function(item){ return item.id === selectedExercise.id; })
      : !selectedPin && (group.questionKeys || [group.questionKey]).some(function(key){ return activeQuestionKeys.indexOf(key) !== -1; });
    if (active){ button.classList.add("is-active"); selectedPin = button; }
    button.addEventListener("click", function(event){
      event.preventDefault();
      event.stopPropagation();
      if (narrow && group.exercises.length > 1){
        renderNoamQuestionParts(group.exercises, button);
      }else{
        selectManifestExercise(exercise, button);
      }
    });
    pageElement.appendChild(button);
    if (focusedPinId && button.dataset.exerciseIds.split(" ").indexOf(focusedPinId)!==-1){
      button.focus({preventScroll:true});
    }
  });
}

function insertNoamMath(kind){
  var input=document.getElementById("noamQuestion");
  if (!input||busy||input.disabled){return;}
  var start=input.selectionStart;
  var end=input.selectionEnd;
  var selected=input.value.slice(start,end);
  var insertion="";
  var caret;
  if (kind==="square"||kind==="cube"){
    insertion=(selected?"("+selected+")":"")+(kind==="square"?"²":"³");
  }else if (kind==="power"){
    insertion=(selected?"("+selected+")":"")+"^()";
    caret=insertion.length-1;
  }else if (kind==="root"){
    insertion="√("+selected+")";
    caret=selected?insertion.length:2;
  }else if (kind==="fraction"){
    insertion="("+selected+")/()";
    caret=selected?insertion.length-1:1;
  }else if (kind==="multiply"){
    insertion=" × ";
  }else if (kind==="divide"){
    insertion=" ÷ ";
  }else if (kind==="parentheses"){
    insertion="("+selected+")";
    caret=selected?insertion.length:1;
  }else{return;}
  input.focus({preventScroll:true});
  if (input.value.length-(end-start)+insertion.length>input.maxLength){return;}
  input.setRangeText(insertion,start,end,"end");
  var position=start+(caret===undefined?insertion.length:caret);
  input.setSelectionRange(position,position);
  input.dispatchEvent(new Event("input",{bubbles:true}));
}

/* QUESTION IMAGE FOR NOAM AI — rendered from the PDF itself, not from the on-screen
   canvas. The display canvas is capped at devicePixelRatio 1.25 on desktop, which put
   about 115 dots per inch in front of the image model and made small labels such as the
   vertices of a triangle unreadable. Here the page is rendered again, off-screen, at a
   scale chosen so the cropped band itself reaches CROP_TARGET_WIDTH pixels. */

var CROP_TARGET_WIDTH_DESKTOP = 2200;
var CROP_TARGET_WIDTH_MOBILE = 1800;
var CROP_MIN_RENDER_SCALE = 1.5;
var CROP_MAX_RENDER_SCALE = 8;
var CROP_MAX_PAGE_PIXELS = 36000000;
var CROP_PAGE_CACHE_LIMIT = 2;
var cropPageCache = [];

function cropTargetWidth(){
  return (mobileLayout && mobileLayout.matches)
    ? CROP_TARGET_WIDTH_MOBILE
    : CROP_TARGET_WIDTH_DESKTOP;
}

function cropRenderScale(baseViewport, crop){
  var band = Math.max(.05, Math.min(1, Number(crop && crop.w) || 1));
  var scale = cropTargetWidth() / (baseViewport.width * band);
  scale = Math.min(CROP_MAX_RENDER_SCALE, Math.max(CROP_MIN_RENDER_SCALE, scale));
  while (
    scale > CROP_MIN_RENDER_SCALE &&
    baseViewport.width * scale * baseViewport.height * scale > CROP_MAX_PAGE_PIXELS
  ){
    scale *= .8;
  }
  return Math.round(scale * 100) / 100;
}

function cachedCropPage(pageNumber, scale){
  for (var i = 0; i < cropPageCache.length; i++){
    if (cropPageCache[i].page === pageNumber && cropPageCache[i].scale === scale){
      return cropPageCache[i].canvas;
    }
  }
  return null;
}

function renderCropPageCanvas(pageNumber, scale){
  var cached = cachedCropPage(pageNumber, scale);
  if (cached){ return Promise.resolve(cached); }
  return pdfDocument.getPage(pageNumber).then(function(page){
    var viewport = page.getViewport({scale:scale});
    var canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.floor(viewport.width));
    canvas.height = Math.max(1, Math.floor(viewport.height));
    var context = canvas.getContext("2d",{alpha:false});
    context.fillStyle = "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    return page.render({canvasContext:context, viewport:viewport}).promise.then(function(){
      cropPageCache.push({page:pageNumber, scale:scale, canvas:canvas});
      /* one full-resolution page is about 25 megabytes of canvas, so phones keep one */
      var keep = (mobileLayout && mobileLayout.matches) ? 1 : CROP_PAGE_CACHE_LIMIT;
      while (cropPageCache.length > keep){ cropPageCache.shift(); }
      return canvas;
    });
  });
}

function cropExerciseSegment(crop){
  var pageNumber = Number(crop && crop.page || 0);
  if (!(pageNumber >= 1)){ return Promise.reject(new Error("עמוד השאלה אינו זמין.")); }
  return pdfDocument.getPage(pageNumber).then(function(page){
    var scale = cropRenderScale(page.getViewport({scale:1}), crop);
    return renderCropPageCanvas(pageNumber, scale);
  }).then(function(canvas){
    var sx = Math.max(0, Math.floor((Number(crop.x) || 0) * canvas.width));
    var sy = Math.max(0, Math.floor((Number(crop.y) || 0) * canvas.height));
    var sw = Math.min(canvas.width - sx, Math.floor((Number(crop.w) || 1) * canvas.width));
    var sh = Math.min(canvas.height - sy, Math.floor((Number(crop.h) || 1) * canvas.height));
    if (sw < 1 || sh < 1){ throw new Error("לא הצלחנו לחתוך את תמונת השאלה."); }
    return {source:canvas, sx:sx, sy:sy, sw:sw, sh:sh};
  });
}

function stitchCropSegments(segments){
  var width = Math.min(cropTargetWidth(), Math.max.apply(null, segments.map(function(s){return s.sw;})));
  var gap = segments.length > 1 ? 16 : 0;
  var height = segments.reduce(function(total,s){return total + s.sh * width / s.sw;}, 0) + gap * (segments.length - 1);
  var scale = Math.min(1, (segments.length > 1 ? 5200 : 3600) / height);
  var target = document.createElement("canvas");
  target.width = Math.max(20, Math.round(width * scale));
  target.height = Math.max(20, Math.round(height * scale));
  var ctx = target.getContext("2d",{alpha:false});
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, target.width, target.height);
  var top = 0;
  segments.forEach(function(s){
    var drawHeight = s.sh * width / s.sw * scale;
    ctx.drawImage(s.source, s.sx, s.sy, s.sw, s.sh, 0, top, target.width, drawHeight);
    top += drawHeight + gap * scale;
  });
  return target;
}

function cropExerciseCanvasFromPdf(exercise){
  var crops = Array.isArray(exercise.crops) && exercise.crops.length ? exercise.crops : [exercise.crop||{}];
  if (crops.length > 12){ return Promise.reject(new Error("יותר מדי עמודים לשאלה אחת.")); }
  return crops.reduce(function(chain, crop){
    return chain.then(function(segments){
      return cropExerciseSegment(crop).then(function(segment){
        segments.push(segment);
        return segments;
      });
    });
  }, Promise.resolve([])).then(stitchCropSegments);
}

function cropExerciseCanvas(exercise){
  if (typeof pdfDocument !== "undefined" && pdfDocument && typeof cropExerciseCanvasFromPdf === "function"){
    return cropExerciseCanvasFromPdf(exercise).catch(function(error){
      console.warn("NOAM CROP HIGH RES FALLBACK:", error);
      return cropExerciseCanvasFromView(exercise);
    });
  }
  return cropExerciseCanvasFromView(exercise);
}

function cropExerciseCanvasFromView(exercise){
  return new Promise(function(resolve,reject){
    var crops=Array.isArray(exercise.crops)&&exercise.crops.length?exercise.crops:[exercise.crop||{}];
    var version=pdfRenderVersion;
    var attempts=0;
    if (crops.length>12){reject(new Error("יותר מדי עמודים לשאלה אחת."));return;}
    function prepare(){
      if (version!==pdfRenderVersion){reject(new Error("התצוגה השתנתה. נסו שוב."));return;}
      var segments=[];
      var waiting=false;
      try{
        crops.forEach(function(crop){
          var pageNumber=Number(crop.page||0);
          var page=pdfPages.querySelector('.pdf-page[data-page="'+pageNumber+'"]');
          if (!page){throw new Error("עמוד השאלה אינו זמין.");}
          if (page.getAttribute("data-state")==="error"){throw new Error("לא הצלחנו לטעון את עמוד השאלה. נסו לרענן.");}
          var source=page.querySelector("canvas");
          if (page.getAttribute("data-state")!=="ready"||!source||source.width<20||source.height<20){
            renderPdfPage(pageNumber,version);
            waiting=true;
            return;
          }
          var sx=Math.max(0,Math.floor((Number(crop.x)||0)*source.width));
          var sy=Math.max(0,Math.floor((Number(crop.y)||0)*source.height));
          var sw=Math.min(source.width-sx,Math.floor((Number(crop.w)||1)*source.width));
          var sh=Math.min(source.height-sy,Math.floor((Number(crop.h)||1)*source.height));
          if (sw<1||sh<1){throw new Error("לא הצלחנו לחתוך את תמונת השאלה.");}
          segments.push({source:source,sx:sx,sy:sy,sw:sw,sh:sh});
        });
        if (waiting){
          if (++attempts>120){throw new Error("טעינת עמודי השאלה מתעכבת. נסו שוב.");}
          setTimeout(prepare,100);
          return;
        }
        var width=Math.min(1500,Math.max.apply(null,segments.map(function(s){return s.sw;})));
        var gap=segments.length>1?12:0;
        var height=segments.reduce(function(total,s){return total+s.sh*width/s.sw;},0)+gap*(segments.length-1);
        var scale=Math.min(1,(segments.length>1?3000:1500)/height);
        var target=document.createElement("canvas");
        target.width=Math.max(20,Math.round(width*scale));
        target.height=Math.max(20,Math.round(height*scale));
        var ctx=target.getContext("2d",{alpha:false});
        ctx.fillStyle="#fff";ctx.fillRect(0,0,target.width,target.height);
        var top=0;
        segments.forEach(function(s){
          var drawHeight=s.sh*width/s.sw*scale;
          ctx.drawImage(s.source,s.sx,s.sy,s.sw,s.sh,0,top,target.width,drawHeight);
          top+=drawHeight+gap*scale;
        });
        resolve(target);
      }catch(error){reject(error);}
    }
    prepare();
  });
}

function encodeCropCanvas(canvas){
  var qualities=[.84,.72,.58,.46];
  for (var i=0;i<qualities.length;i++){
    var dataUrl=canvas.toDataURL("image/jpeg",qualities[i]);
    if (dataUrl.length<=390000){return dataUrl;}
  }
  return "";
}

function shrinkCropCanvas(canvas,factor){
  var smaller=document.createElement("canvas");
  smaller.width=Math.max(20,Math.round(canvas.width*factor));
  smaller.height=Math.max(20,Math.round(canvas.height*factor));
  var ctx=smaller.getContext("2d",{alpha:false});
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,smaller.width,smaller.height);
  ctx.drawImage(canvas,0,0,canvas.width,canvas.height,0,0,smaller.width,smaller.height);
  return smaller;
}

/* The image is built at the highest resolution the question needs and is only reduced
   when it does not fit the backend limit of 390,000 characters. Resolution is given up
   before quality, because small printed labels survive compression better than scaling. */
function cropExerciseImage(exercise){
  return cropExerciseCanvas(exercise).then(function(canvas){
    var dataUrl=encodeCropCanvas(canvas);
    if (dataUrl){return dataUrl;}
    var factors=[.8,.64,.5];
    for (var i=0;i<factors.length;i++){
      if (!(canvas.width>0&&canvas.height>0)){break;}
      dataUrl=encodeCropCanvas(shrinkCropCanvas(canvas,factors[i]));
      if (dataUrl){return dataUrl;}
    }
    throw new Error("תמונת השאלה גדולה מדי לשליחה. נסו שוב בתצוגה קטנה יותר.");
  });
}

function cacheExercisePreview(exerciseId,dataUrl){
  if (!exercisePreviewCache[exerciseId]){
    exercisePreviewOrder.push(exerciseId);
  }
  exercisePreviewCache[exerciseId]=dataUrl;
  while (exercisePreviewOrder.length>16){
    delete exercisePreviewCache[exercisePreviewOrder.shift()];
  }
}

function showExercisePreview(exercise,dataUrl){
  var preview=document.getElementById("noamPickedPreview");
  var fallback=document.getElementById("noamPickedText");
  if (!preview||!fallback||!selectedExercise||selectedExercise.id!==exercise.id){return;}
  var image=document.createElement("img");
  image.src=dataUrl;
  image.alt=exerciseLabel(exercise)+" — "+String(exercise.text||exercise.prompt||"").slice(0,500);
  preview.replaceChildren(image);
  preview.hidden=false;
  fallback.hidden=true;
}

function renderExercisePreview(exercise,attempt){
  if (!exercise||!exercise.crop){return;}
  if (exercisePreviewCache[exercise.id]){
    showExercisePreview(exercise,exercisePreviewCache[exercise.id]);
    return;
  }
  cropExerciseCanvas(exercise)
    .then(function(canvas){
      /* the panel preview only has to be readable on screen; the full-resolution
         image is kept for the model, not for this thumbnail */
      var preview=(canvas.width>1200&&typeof shrinkCropCanvas==="function")
        ? shrinkCropCanvas(canvas,1200/canvas.width)
        : canvas;
      var dataUrl=preview.toDataURL("image/png");
      cacheExercisePreview(exercise.id,dataUrl);
      showExercisePreview(exercise,dataUrl);
    })
    .catch(function(){
      if (attempt>=12||!selectedExercise||selectedExercise.id!==exercise.id){return;}
      renderPdfPage(Number(exercise.crop.page||0),pdfRenderVersion);
      setTimeout(function(){renderExercisePreview(exercise,attempt+1);},150);
    });
}

function getExerciseAnalysis(exercise){
  if (analysisCache[exercise.id]){ return Promise.resolve(analysisCache[exercise.id]); }
  var fallback=syntheticAnalysis(exercise);
  if (!exercise.needsVision&&!exercise.requiresVision){ analysisCache[exercise.id]=fallback;saveNoamState();return Promise.resolve(fallback); }

  // New manifests share a complete question image across its sections.
  // This cache is already scoped to the PDF, and stores unmodified analysis.
  var imageKey=exercise.requiresVision?"image:"+JSON.stringify(exercise.crops||[exercise.crop]):null;
  var cachedImage=imageKey&&analysisCache[imageKey];
  var request=cachedImage?Promise.resolve({ok:true,analysis:cachedImage}):cropExerciseImage(exercise)
    .then(function(imageDataUrl){
      return postJson(API+"/noamImageAnalyze",{imageDataUrl:imageDataUrl,clientRequestId:"manifest-"+Date.now().toString(36)});
    });
  return request
    .then(function(result){
      if (!result||!result.ok||!result.analysis){ throw new Error("vision unavailable"); }
      var analysis=result.analysis;
      if (exercise.requiresVision && analysis.readable!==true){throw new Error("לא הצלחנו לקרוא את השאלה בבירור. נסו שוב.");}
      if (exercise.requiresVision && !["transcription","math_content","problem_statement","diagram_description"].some(function(key){return typeof analysis[key]==="string"&&analysis[key].trim();})){
        throw new Error("לא התקבל תוכן קריא מתמונת השאלה.");
      }
      if (imageKey){
        analysisCache[imageKey]=analysis;
        analysis=JSON.parse(JSON.stringify(analysis));
      }
      var semantic=exercise.prompt||"";
      analysis.transcription=[semantic,analysis.transcription||""].filter(Boolean).join("\n");
      analysis.problem_statement=[semantic,analysis.problem_statement||""].filter(Boolean).join("\n");
      analysisCache[exercise.id]=analysis;saveNoamState();return analysis;
    })
    .catch(function(error){
      // Security refusals must never trigger another paid request through the
      // synthetic-analysis fallback. Preserve them for the chat error message.
      if (isBotProtectionError(error)){ throw error; }
      // These manifests deliberately carry no guessed OCR transcription.
      // The solver must receive the actual worksheet image analysis.
      if (exercise.requiresVision){throw new Error("לא הצלחנו לקרוא את תמונת השאלה. נסו שוב בעוד רגע.");}
      console.warn("NOAM VISION FALLBACK:",exercise.id,error);
      analysisCache[exercise.id]=fallback;saveNoamState();return fallback;
    });
}

function askNoam(helpKind,studentMessage){
  if (!selectedExercise||busy){return;}
  var requestFocusId = panelBody.contains(document.activeElement) ? document.activeElement.id : "";
  if (helpKind==="free_question"){delete noamDrafts[selectedExercise.id];}
  var exercise=selectedExercise;
  var thread=exerciseThread(exercise.id);
  var hintIndex=helpKind==="hint"?thread.hintIndex:0;
  var kindLabel=helpKind==="overview"?"הסבר כללי":helpKind==="hint"?("רמז "+(hintIndex+1)):helpKind==="common_mistake"?"טעות נפוצה":"";
  var visible=helpKind==="overview"?"אפשר הסבר כללי קצר?":helpKind==="hint"?("אפשר רמז "+(hintIndex+1)+"?"):helpKind==="common_mistake"?"מה הטעות הנפוצה כאן?":studentMessage;
  var historyQuestion=kindLabel||studentMessage;
  var started=Date.now();

  thread.messages.push({role:"user",text:visible,kind:kindLabel});
  pendingExerciseId=exercise.id;
  saveNoamState();setNoamBusy(true);renderNoamChat();
  restoreNoamChatFocus(requestFocusId);
  announceNoam("נועם AI מכין תשובה עבור " + exerciseLabel(exercise) + ".");

  getExerciseAnalysis(exercise)
    .then(function(analysis){
      var solverMessage=String(studentMessage||"");
      solverMessage=solverMessage.slice(
        0,
        Math.max(0,SOLVER_MESSAGE_MAX-MATH_OUTPUT_INSTRUCTION.length)
      )+MATH_OUTPUT_INSTRUCTION;
      return postJson(API+"/noamImageSolve",{
        exerciseId:exercise.id,
        grade:g,
        level:LEVEL[lv],
        topic:ttl,
        helpKind:helpKind,
        hintIndex:hintIndex,
        studentMessage:solverMessage,
        conversationHistory:thread.history,
        imageAnalysis:analysis
      });
    })
    .then(function(result){
      if (!result||!result.ok||!result.answer){ throw new Error((result&&result.error)||"נועם AI לא זמין כרגע."); }
      var elapsed=Date.now()-started;
      return new Promise(function(resolve){setTimeout(function(){resolve(result);},Math.max(0,MIN_WAIT-elapsed));});
    })
    .then(function(result){
      var answer=String(result.answer||"").trim();
      thread.messages.push({role:"assistant",text:answer,kind:""});
      thread.history.push({role:"user",content:historyQuestion},{role:"assistant",content:answer});
      thread.history=thread.history.slice(-8);
      thread.messages=thread.messages.slice(-60);
      if (helpKind==="hint"){thread.hintIndex=Math.min(3,thread.hintIndex+1);}
      saveNoamState();setNoamBusy(false);renderNoamChat();
      announceNoam(exerciseLabel(exercise) + ". נועם AI: " + answer);
    })
    .catch(function(error){
      var errorMessage=String(error&&error.message||"לא הצלחנו לקבל תשובה כרגע.");
      thread.messages.push({role:"assistant",text:errorMessage,kind:""});
      saveNoamState();setNoamBusy(false);renderNoamChat();
      announceNoam(exerciseLabel(exercise) + ". " + errorMessage);
    });
}

function postJson(endpoint,payload){
  return ensureNoamBotClient().then(function(client){
    return client.postJson(endpoint,payload);
  });
}

function ensureNoamBotClient(){
  if (noamBotClient){return Promise.resolve(noamBotClient);}
  if (noamBotClientLoading){return noamBotClientLoading;}
  // Even the small local client loads only when AI is requested. Opening or
  // downloading a worksheet starts no security script or verification request.
  noamBotClientLoading=new Promise(function(resolve,reject){
    var script=null;
    var timer=null;
    var finished=false;
    function finish(success){
      if (finished){return;}
      finished=true;
      clearTimeout(timer);
      if (script){script.onload=null;script.onerror=null;}
      if (success&&window.NoamBotClient&&typeof window.NoamBotClient.create==="function"){
        try{
          noamBotClient=window.NoamBotClient.create({
            api:API,
            enabled:BOT_GUARD_ENABLED,
            modelTimeoutMs:TIMEOUT
          });
          if (noamBotClient&&typeof noamBotClient.postJson==="function"){
            resolve(noamBotClient);return;
          }
        }catch(error){/* Treat an incomplete client as an unavailable asset. */}
      }
      noamBotClient=null;
      if (script&&script.parentNode){script.parentNode.removeChild(script);}
      var unavailable=new Error("לא הצלחנו לטעון את נועם AI. נסו שוב בעוד רגע.");
      unavailable.code="BOT_CLIENT_UNAVAILABLE";
      reject(unavailable);
    }
    if (window.NoamBotClient){finish(true);return;}
    script=document.createElement("script");
    script.src="./noam-bot-client.js";
    script.async=true;
    script.onload=function(){finish(true);};
    script.onerror=function(){finish(false);};
    timer=setTimeout(function(){finish(false);},BOT_CLIENT_LOAD_TIMEOUT_MS);
    try{document.head.appendChild(script);}catch(error){finish(false);}
  }).catch(function(error){
    noamBotClientLoading=null;
    throw error;
  });
  return noamBotClientLoading;
}

function isBotProtectionError(error){
  if (window.NoamBotClient&&typeof window.NoamBotClient.isProtectionError==="function"){
    return window.NoamBotClient.isProtectionError(error);
  }
  var status=error&&(error.status||error.httpStatus);
  return !!(error&&(/^(BOT_|HTTP_ERROR_BODY_)/.test(String(error.code||""))||status===401||status===403||status===429));
}

function renderPanelMath(root){
  if (!root){return;}
  if (!noamMathAssetsReady||typeof window.renderMathInElement!=="function"){
    ensureNoamMathRenderer().then(function(){
      if (root.isConnected&&typeof window.renderMathInElement==="function"){renderPanelMath(root);}
    }).catch(function(error){console.warn("NOAM MATH ASSETS:",error);});
    return;
  }
  try{
    window.renderMathInElement(root,{
      delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"\\[",right:"\\]",display:true},
        {left:"\\(",right:"\\)",display:false},
        {left:"$",right:"$",display:false}
      ],
      throwOnError:false,strict:"ignore",trust:false
    });
  }catch(error){console.warn("NOAM KATEX:",error);}
}

if (!aiReady){
  fab.classList.add("hidden");
  panel.style.display="none";
}else{
  fab.classList.remove("hidden");
  loadStaticManifest();
}

/* ESCAPE HTML */

function escAttr(s){
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function esc(s){

  return String(s)
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[m];
      }
    );
}
