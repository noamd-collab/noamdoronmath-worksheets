function noamRetryActionLabel(message){
  var code=String(message&&message.answerErrorCode||"");
  var text=String(message&&message.text||"");
  // Match the retry CTA to the failure that was shown — never imply a crop/read
  // problem when bot verification (or another non-vision refusal) was the cause.
  if (isBotProtectionError({code:code,message:text}) || /בדיקת האבטחה|לאמת את הבקשה/.test(text)){
    return "נסו שוב את בדיקת האבטחה";
  }
  if (code==="QUESTION_IMAGE_UNREADABLE" || /תמונת השאלה|לקרוא את השאלה|לקרוא את הקבצים/.test(text)){
    return "נסו שוב לקרוא את השאלה";
  }
  if (code==="NETWORK_UNAVAILABLE" || /החיבור לנועם AI נקטע/.test(text)){
    return "נסו שוב להתחבר";
  }
  return "נסו שוב";
}

function postJson(endpoint,payload){
  return ensureNoamBotClient().then(function(client){
    return client.postJson(endpoint,payload);
  });
}

function ensureNoamBotClient(){
  if (noamBotClient){return Promise.resolve(noamBotClient);}
  if (noamBotClientLoading){return noamBotClientLoading;}
  // Even the small local client loads only when AI is requested. Opening or
  // downloading a worksheet starts no security script or verification request.
  noamBotClientLoading=new Promise(function(resolve,reject){
    var script=null;
    var timer=null;
    var finished=false;
    function finish(success){
      if (finished){return;}
      finished=true;
      clearTimeout(timer);
      if (script){script.onload=null;script.onerror=null;}
      if (success&&window.NoamBotClient&&typeof window.NoamBotClient.create==="function"){
        try{
          noamBotClient=window.NoamBotClient.create({
            api:API,
            enabled:BOT_GUARD_ENABLED,
            modelTimeoutMs:TIMEOUT
          });
          if (noamBotClient&&typeof noamBotClient.postJson==="function"){
            resolve(noamBotClient);return;
          }
        }catch(error){/* Treat an incomplete client as an unavailable asset. */}
      }
      noamBotClient=null;
      if (script&&script.parentNode){script.parentNode.removeChild(script);}
      var unavailable=new Error("לא הצלחנו לטעון את נועם AI. נסו שוב בעוד רגע.");
      unavailable.code="BOT_CLIENT_UNAVAILABLE";
      reject(unavailable);
    }
    if (window.NoamBotClient){finish(true);return;}
    script=document.createElement("script");
    script.src="./noam-bot-client.js?v=20260921-diagnostics1";
    script.async=true;
    script.onload=function(){finish(true);};
    script.onerror=function(){finish(false);};
    timer=setTimeout(function(){finish(false);},BOT_CLIENT_LOAD_TIMEOUT_MS);
    try{document.head.appendChild(script);}catch(error){finish(false);}
  }).catch(function(error){
    noamBotClientLoading=null;
    throw error;
  });
  return noamBotClientLoading;
}

function isBotProtectionError(error){
  if (window.NoamBotClient&&typeof window.NoamBotClient.isProtectionError==="function"){
    return window.NoamBotClient.isProtectionError(error);
  }
  var status=error&&(error.status||error.httpStatus);
  return !!(error&&(/^(BOT_|HTTP_ERROR_BODY_)/.test(String(error.code||""))||status===401||status===403||status===429));
}

function renderPanelMath(root){
  if (!root){return;}
  if (!noamMathAssetsReady||typeof window.renderMathInElement!=="function"){
    ensureNoamMathRenderer().then(function(){
      if (root.isConnected&&typeof window.renderMathInElement==="function"){renderPanelMath(root);}

        {left:"$",right:"$",display:false}
      ],
      throwOnError:false,strict:"ignore",trust:false
    });
  }catch(error){console.warn("NOAM KATEX:",error);}
}

// The Sheet publishes only approved phrase → existing-concept mappings. The
// canonical definitions always remain in the versioned local glossary, so an
// unavailable feed cannot remove or weaken any explanation.
var NOAM_GLOSSARY_FEED_URL="https://script.google.com/macros/s/AKfycbxc9lNBL_awGULrhzNWK3MRT2mq6ppPfhZPQVuTCX3rPeuX-g3vVmtdEd-mWt6rQIR6/exec?feed=1";

  window.fetch(NOAM_GLOSSARY_FEED_URL,{method:"GET",mode:"cors",cache:"no-store"})

function esc(s){

          "&":"&amp;",

      var parent=node.parentElement;
      if(!parent||!/[0-9]/.test(node.nodeValue||'')){continue;}
      if(parent.closest('button,a,svg,.noam-sr-only,.exact-hint-head,.exact-error-title,.exact-frac')){continue;}
      nodes.push(node);
    }
    var mathRe=/([0-9]+\/[0-9]+|(?:[0-9]+(?:\.[0-9]+)?)(?:\s*[+\-−×÷=<>≤≥()]+\s*(?:[0-9]+(?:\.[0-9]+)?))+)/g;
    nodes.forEach(function(node){
      var text=node.nodeValue||'';
      mathRe.lastIndex=0;
      if(!mathRe.test(text)){return;}
      mathRe.lastIndex=0;
      var frag=document.createDocumentFragment();
      var last=0,match;
      while((match=mathRe.exec(text))){
        if(match.index>last){frag.appendChild(document.createTextNode(text.slice(last,match.index)));}
        var span=document.createElement('span');
        span.dir='ltr';
        span.style.unicodeBidi='isolate';
        span.style.whiteSpace='nowrap';
        var frac=/^([0-9]+)\/([0-9]+)$/.exec(match[1]);
        if(frac){
          span.className='exact-frac';
          span.appendChild(document.createTextNode(frac[1]));
          var bar=document.createElement('span');
          bar.className='exact-frac-bar';
          bar.setAttribute('aria-hidden','true');
          span.appendChild(bar);
          span.appendChild(document.createTextNode(frac[2]));
        }else{
          span.textContent=match[1].replace(/-/g,'−');
        }
        frag.appendChild(span);
        last=match.index+match[1].length;
      }
      if(last<text.length){frag.appendChild(document.createTextNode(text.slice(last)));}
      node.parentNode.replaceChild(frag,node);
    });
    root.dataset.mathIsolated='1';
  }
  function decoratePins(){
    document.querySelectorAll('.noam-exercise-pin').forEach(function(button){
      var avatar=button.querySelector('ramzi-avatar');
      var size=narrow?30:28;
      if(!avatar){
        button.textContent='';
        avatar=makeAvatar(size,'idle');
        var label=document.createElement('span');
        label.className='exact-pin-label';
        label.textContent='עזרה';
        button.append(avatar,label);
      }
      avatar.setAttribute('size',String(size));
    });
  }

  function sync(){
    scheduled=false;
    narrow=window.innerWidth<1000||window.innerHeight<640;
    open=!panel.classList.contains('hidden')&&panel.style.display!=='none';
    body.classList.toggle('exact-narrow',narrow);body.classList.toggle('exact-help-active',narrow&&open);
    var helpDisabled=panel.style.display==='none'||(!open&&fab.classList.contains('hidden'));
    if(helpTab.disabled!==helpDisabled){helpTab.disabled=helpDisabled;}
    setAttr(pageTab,'aria-selected',!open);setAttr(helpTab,'aria-selected',open);
    pageTab.tabIndex=open?-1:0;helpTab.tabIndex=open?0:-1;
    var actions=document.querySelector('.header-actions');
    if(actions&&fab.parentNode!==actions){actions.prepend(fab);}
    if(narrow&&open){
      if(header.parentNode!==panelIn){panelIn.prepend(header,tabs);}
      bar.inert=true;paper.inert=true;
      setAttr(panel,'aria-label','רמזי, עזרה בדף העבודה');
      ['.nl-viewer-progress','#noam-accessibility'].forEach(function(selector){var el=document.querySelector(selector);if(el){el.inert=true;}});
    }else{
      if(header.parentNode!==body){homeAnchor.after(header,tabs);}
      bar.inert=false;paper.inert=false;
      setAttr(panel,'aria-label','רמזי, עזרה בדף העבודה');
      if(!narrow){panel.removeAttribute('role');panel.removeAttribute('aria-modal');}
      ['.nl-viewer-progress','#noam-accessibility'].forEach(function(selector){var el=document.querySelector(selector);if(el){el.inert=false;}});
      if(narrow&&previousOpen&&(document.activeElement===body||panel.contains(document.activeElement))){pageTab.focus({preventScroll:true});}
    }
    previousOpen=open;
    adaptQuestionChoices();adaptComposer();decorateConversation();decoratePins();
    var locate=document.getElementById('noamLocate');
    if(locate){text(locate,narrow?'לראות בדף':'בדף');}
    var label=document.querySelector('label[for="noamQuestion"]');
    if(label){text(label,'הודעה לרמזי');}
    var mood=currentMood(),mode=motionMode();
    text(status,mood==='thinking'?'רמזי חושב…':mood==='error'?'לא הצלחתי לקבל תשובה':mood==='hint'?'יש רמז חדש':mood==='success'?'התשובה נכונה':'רמזים והסברים במתמטיקה');
    document.querySelectorAll('.exact-ramzi-avatar ramzi-avatar, .panel-head ramzi-avatar').forEach(function(avatar){
      if(avatar.getAttribute('mood')!==mood){avatar.setAttribute('mood',mood);}
      var headerSize=narrow?36:44;
      if(avatar.closest('.panel-head')&&avatar.getAttribute('size')!==String(headerSize)){avatar.setAttribute('size',String(headerSize));}
    });
    if(mood!==previousMood||mode!==previousMotion){previousMood=mood;previousMotion=mode;}
    if(!narrow&&!initialWideOpened&&helpReadyObserved&&!helpTab.disabled){initialWideOpened=true;if(!open){fab.click();}}
  }
  function schedule(){if(!scheduled){scheduled=true;queueMicrotask(sync);}}
  function observeHelpAvailability(records){
    if(records.some(function(record){return record.target===fab&&record.attributeName==='class';})&&!fab.classList.contains('hidden')){
      helpReadyObserved=true;
    }
    schedule();
  }
  fab.addEventListener('click',function(){initialWideOpened=true;});
  var observer=new MutationObserver(observeHelpAvailability);
  observer.observe(panel,{childList:true,subtree:true,attributes:true,attributeFilter:['class','disabled','hidden']});
  observer.observe(fab,{attributes:true,attributeFilter:['class']});
  if(typeof pdfPages!=='undefined'&&pdfPages){
    var pinTimer=0;
    new MutationObserver(function(){
      clearTimeout(pinTimer);
      pinTimer=setTimeout(decoratePins,80);
    }).observe(pdfPages,{childList:true,subtree:true});
  }
  new MutationObserver(schedule).observe(html,{attributes:true,attributeFilter:['class','data-nd-motion','data-motion']});
  window.addEventListener('resize',schedule);panel.addEventListener('focusin',schedule);panel.addEventListener('focusout',schedule);
  document.addEventListener('visibilitychange',schedule);window.addEventListener('storage',schedule);
  window.addEventListener('nd:motion-off',function(event){
    var off=event&&event.detail&&typeof event.detail.off==='boolean'?event.detail.off:true;
    motionEventOff=off;schedule();
  });
  if(reduced.addEventListener){reduced.addEventListener('change',schedule);}else{reduced.addListener(schedule);}
  Array.from(document.querySelectorAll('img.exact-ramzi-avatar')).forEach(function(img){mountAvatar(img,44);});
  var fabImg=fab.querySelector('img');if(fabImg){mountAvatar(fabImg,36);}
  sync();

})();
</script>
