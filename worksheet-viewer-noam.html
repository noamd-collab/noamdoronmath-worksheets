function localVisualExerciseSource(exercise){
  var analysis=analysisCache[exercise.id]||{};
  return [
    exercise.text,exercise.prompt,exercise.context,
    analysis.transcription,analysis.problem_statement,analysis.math_content
  ].filter(Boolean).filter(function(value,index,values){
    return values.indexOf(value)===index;
  }).join("\n");
}

function tryNoamLocalVisual(studentMessage){
  var local=window.NoamLocalVisual;
  var previousThread=selectedExercise&&exerciseThread(selectedExercise.id);
  var previousAnswer=previousThread&&(previousThread.messages||[]).filter(function(item){return item.role==="assistant";}).slice(-1)[0];
  var retryDrawing=!!(previousAnswer&&previousAnswer.diagramError&&/^(?:(?:בבקשה|אולי)\s+)?(?:נסה|נסי|נסו|תנסה|תנסי)\s+שוב[.!?\s]*$/.test(String(studentMessage||"").trim()));
  var visualRequest=local&&((local.wantsDrawing&&local.wantsDrawing(studentMessage))||
    (local.wantsVisualSupport&&local.wantsVisualSupport(studentMessage)));
  if (!selectedExercise||busy||(!visualRequest&&!retryDrawing)){return false;}
  if (typeof currentAttachments==="function"&&currentAttachments().length){return false;}
  var thread=exerciseThread(selectedExercise.id);
  var lastAnswer=(thread.messages||[]).filter(function(item){return item.role==="assistant";}).slice(-1)[0];
  var options=noamMessageVisualOptions(thread,lastAnswer);
  if (!retryDrawing){options.studentMessage=studentMessage;}
  options.helpKind="free_question";
  options.hintIndex=0;
  delete options.focusKey;
  var visual=noamConstructedVisual(selectedExercise,options)||
    window.NoamLocalVisual.parseFactoredQuadraticInequality(localVisualExerciseSource(selectedExercise));
  if (!visual){
    if (!window.NoamDiagramPlan){return false;}
    var drawingExercise=selectedExercise;
    delete noamDrafts[drawingExercise.id];
    var drawingReply={role:"assistant",text:"מכין המחשה לשלב שעליו שאלת.",kind:"",diagramOptions:options,diagramTyped:true};
    if (retryDrawing){drawingReply.diagramError=previousAnswer.diagramError;}
    thread.messages.push({role:"user",text:studentMessage,kind:""},drawingReply);
    thread.messages=thread.messages.slice(-60);
    requestNoamDiagram(drawingExercise,thread,drawingReply,options);
    return true;
  }
  var answer=visual.type==="geometry-guide"
    ? "הנה המחשה מסומנת של השלב שעליו שאלת."
    : window.NoamLocalVisual.assistantText(visual);
  delete noamDrafts[selectedExercise.id];
  thread.messages.push({role:"user",text:studentMessage,kind:""});
  thread.messages.push({role:"assistant",text:answer,kind:"",visual:visual});
  thread.history.push(
    {role:"user",content:studentMessage},
    {role:"assistant",content:answer+(visual.type==="geometry-guide"?" [הוצג שרטוט גאומטרי מסומן של השלב הנוכחי.]":" [הוצג שרטוט מקומי של הפרבולה והשורשים.]")}
  );
  thread.history=thread.history.slice(-8);
  thread.messages=thread.messages.slice(-60);
  saveNoamState();
  renderNoamChat();
  announceNoam(exerciseLabel(selectedExercise)+". נועם AI הציג שרטוט להמחשה.");
  return true;
}

function insertNoamMath(kind){
  var input=document.getElementById("noamQuestion");
  if (!input||busy||input.disabled){return;}
  var start=input.selectionStart;
  var end=input.selectionEnd;
  var selected=input.value.slice(start,end);
  var insertion="";
  var caret;
  if (kind==="square"||kind==="cube"){
    insertion=(selected?"("+selected+")":"")+(kind==="square"?"²":"³");
  }else if (kind==="power"){
    insertion=(selected?"("+selected+")":"")+"^()";
    caret=insertion.length-1;
  }else if (kind==="root"){
    insertion="√("+selected+")";
    caret=selected?insertion.length:2;
  }else if (kind==="fraction"){
    insertion="("+selected+")/()";
    caret=selected?insertion.length-1:1;
  }else if (kind==="multiply"){
    insertion=" × ";
  }else if (kind==="divide"){
    insertion=" ÷ ";
  }else if (kind==="parentheses"){
    insertion="("+selected+")";
    caret=selected?insertion.length:1;
  }else{return;}
  input.focus({preventScroll:true});
  if (input.value.length-(end-start)+insertion.length>input.maxLength){return;}
  input.setRangeText(insertion,start,end,"end");
  var position=start+(caret===undefined?insertion.length:caret);
  input.setSelectionRange(position,position);
  input.dispatchEvent(new Event("input",{bubbles:true}));
}

function locateSelectedExercise(){
  if (!selectedExercise){ return; }
  if (mobileLayout.matches){closeNoamPanel();}
  if (pdfNativeActive && pdfCleanAvailable){ setNativePdfMode(false); }
  var page = pdfPages.querySelector('.pdf-page[data-page="' + selectedExercise.pin.page + '"]');
  if (page){
    var pin=Array.from(page.querySelectorAll(".noam-exercise-pin")).find(function(button){
      return button.dataset.exerciseId===selectedExercise.id ||
        (button.dataset.exerciseIds||"").split(" ").includes(selectedExercise.id);
    });
    (pin||page).scrollIntoView({behavior:"smooth",block:"center",inline:"nearest"});
    (pin||pdfScroll).focus({preventScroll:true});
  }
}

function setNoamBusy(value){
  busy=!!value;
  if (!busy){ pendingExerciseId=null; }
  ["noamOverview","noamHint","noamMistake","noamDraw","noamSend","noamQuestion","noamNewThread","noamMathToggle"]
    .forEach(function(id){ var el=document.getElementById(id);if(el){el.disabled=busy;} });
  panelBody.querySelectorAll("[data-math]").forEach(function(button){ button.disabled=busy; });
}

function syntheticAnalysis(exercise){
  var prompt = exercise.prompt || [exercise.context,exercise.text].filter(Boolean).join("\n");
  return {
    readable:true,
    readability_confidence:1,
    content_type:"static_manifest_exercise",
    transcription:prompt,
    math_content:exercise.text||prompt,
    problem_statement:prompt,
    diagram_description:"",
    student_work:"",
    extracted_entities:{numbers:[],expressions:[],labels:[],units:[]},
    uncertain_parts:[],
    complexity:exercise.needsVision ? "medium" : "easy",
    complexity_reasons:["static worksheet manifest"]
  };
}

/* Bad static OCR that leaked later parts (ב/ג/ד) into one exercise blob, or
   signed-arithmetic token soup — must not be sent to the model as ground truth. */
function noamManifestOcrUnreliable(exercise){
  var text=String((exercise&&(exercise.text||exercise.prompt))||"");
  if (!text){return false;}
  if (/(?:^|[\s−\-\d.+])ב\s*\.[\s\S]{0,80}?ג\s*\./.test(text)){return true;}
  if (/[−\-]\s+\d+\s+[+＋]\s+\d+\s+[−\-]\s+ב\s*\./.test(text)){return true;}
  return false;
}

function noamExerciseSectionLabel(exercise){
  var q=exercise&&exercise.q!=null?String(exercise.q):"";
  var part=exercise&&exercise.part?String(exercise.part):"";
  if (q&&part){return "שאלה "+q+" סעיף "+part;}
  if (q){return "שאלה "+q;}
  return String(exercise&&exercise.id||"התרגיל הנבחר");
}

function noamScopedExerciseSemantic(exercise){
  if (!noamManifestOcrUnreliable(exercise)){
    return String(exercise&&exercise.prompt||"");
  }
  return "התרגיל שנבחר הוא "+noamExerciseSectionLabel(exercise)+
    ". קראו מתמונת השאלה רק את הביטוי של הסעיף הנבחר. אם מופיעים סעיפים נוספים באותה תמונה — התעלמו מהם. אל תשחזרו טקסט OCR משובש כנתון.";
}

function noamExerciseNeedsLiveVision(exercise){
  return !!(exercise&&(exercise.requiresVision||exercise.needsVision||noamManifestOcrUnreliable(exercise)));
}

/* Hebrew section markers א–ד (and finals) used as worksheet part labels. */
function noamIsPartLabelToken(text){
  return /^[א-ת]$/.test(String(text||"").trim());
}

/* Merge a detached unary minus glyph with the digit immediately to its right.
   PDF text layers (and RTL worksheets) often emit "−" as its own item left of 7. */
function noamAssociateUnaryMinusTokens(tokens){
  var sorted=(tokens||[]).slice().sort(function(a,b){
    return (a.x-b.x)||(a.y-b.y);
  });
  var out=[];
  for (var i=0;i<sorted.length;i++){
    var tok=sorted[i];
    var next=sorted[i+1];
    var minus=/^[−\-\u2212–]$/.test(String(tok.text||"").trim());
    if (minus&&next&&/^\d+$/.test(String(next.text||"").trim())){
      var gap=(Number(next.x0)!=null?next.x0:next.x)-(Number(tok.x1)!=null?tok.x1:tok.x);
      if (!(gap>0.03)){
        out.push({
          text:"−"+String(next.text).trim(),
          x:(tok.x+next.x)/2,
          y:(tok.y+next.y)/2,
          x0:tok.x0!=null?tok.x0:tok.x,
          x1:next.x1!=null?next.x1:next.x,
          y0:Math.min(tok.y0!=null?tok.y0:tok.y,next.y0!=null?next.y0:next.y),
          y1:Math.max(tok.y1!=null?tok.y1:tok.y,next.y1!=null?next.y1:next.y)
        });
        i+=1;
        continue;
      }
    }
    out.push(tok);
  }
  return out;
}

/* Pure rebuild of one part's arithmetic expression from normalized page tokens.
   tokens: [{text,x,y,x0,x1,y0,y1}] with x/y in 0..1, origin top-left. */
function noamRebuildPartExpressionFromTokens(tokens, partLabel, crop){
  var part=String(partLabel||"").trim();
  if (!part||!tokens||!tokens.length){return null;}
  var cx=Number(crop&&crop.x)||0;
  var cy=Number(crop&&crop.y)||0;
  var cw=Number(crop&&crop.w)||1;
  var ch=Number(crop&&crop.h)||1;
  var inCrop=tokens.filter(function(tok){
    return tok.x>=cx-0.02&&tok.x<=cx+cw+0.02&&tok.y>=cy-0.02&&tok.y<=cy+ch+0.02;
  });
  var label=null;
  inCrop.forEach(function(tok){
    if (String(tok.text||"").trim()!==part){return;}
    if (!label||tok.x>label.x){label=tok;}
  });
  if (!label){return null;}
  var line=inCrop.filter(function(tok){
    return Math.abs(tok.y-label.y)<0.014&&tok.x<=label.x+0.015;
  });
  var merged=noamAssociateUnaryMinusTokens(line);
  var pieces=[];
  merged.forEach(function(tok){
    var t=String(tok.text||"").trim();
    if (!t||t===part){return;}
    if (t==="."||t==="·"){return;}
    pieces.push(t);
  });
  if (pieces.length<3){return null;}
  var expression=pieces.join(" ").replace(/\s+/g," ").trim();
  // Require a signed/operator form so we never promote heading words as math.
  if (!/(?:[−\-\u2212]\s*\d|\d\s*[+＋−\-\u2212])/.test(expression)){return null;}
  if (!/\d/.test(expression)){return null;}
  // Space binary operators only; keep unary minus glued to its digit (−7 not − 7).
  expression=expression
    .replace(/\s*([+＋])\s*/g," $1 ")
    .replace(/(\d)\s*([−\-\u2212])\s*(?=\d)/g,"$1 $2 ")
    .replace(/\s+/g," ")
    .trim();
  return expression;
}

/* Vertical band covering the selected part (and the question heading for part א). */
function noamPartBandCropFromTokens(tokens, partLabel, crop){
  var base=crop||{};
  var part=String(partLabel||"").trim();
  if (!part){return null;}
  var cx=Number(base.x)||0;
  var cy=Number(base.y)||0;
  var cw=Number(base.w)||1;
  var ch=Number(base.h)||1;
  var labels=[];
  (tokens||[]).forEach(function(tok){
    var t=String(tok.text||"").trim();
    if (!noamIsPartLabelToken(t)){return;}
    if (tok.x<cx-0.02||tok.x>cx+cw+0.02||tok.y<cy-0.02||tok.y>cy+ch+0.02){return;}
    labels.push(tok);
  });
  labels.sort(function(a,b){return a.y-b.y;});
  var idx=-1;
  for (var i=0;i<labels.length;i++){
    if (String(labels[i].text).trim()===part){idx=i;break;}
  }
  if (idx<0){return null;}
  var y0=idx===0?cy:(labels[idx-1].y+labels[idx].y)/2;
  var y1=idx===labels.length-1?(cy+ch):(labels[idx].y+labels[idx+1].y)/2;
  var pad=0.006;
  y0=Math.max(cy,y0-pad);
  y1=Math.min(cy+ch,y1+pad);
  if (!(y1-y0>0.02)){return null;}
  return {
    page:Number(base.page)||1,
    x:cx,
    y:y0,
    w:cw,
    h:y1-y0
  };
}

function noamNormalizePdfJsTextItems(items, viewport){
  var width=viewport.width||1;
  var height=viewport.height||1;
  var out=[];
  (items||[]).forEach(function(item){
    var raw=String(item&&item.str||"").replace(/\u00a0/g," ");
    if (!raw.trim()){return;}
    var transform=item.transform||[1,0,0,1,0,0];
    var pt=viewport.convertToViewportPoint
      ? viewport.convertToViewportPoint(transform[4],transform[5])
      : [transform[4], height-transform[5]];
    var x=pt[0]/width;
    var y=pt[1]/height;
    var w=(Number(item.width)||0)/width;
    var h=(Number(item.height)||Math.abs(transform[3])||0)/height;
    // Split runs like "7 + 4" or "א." so a detached "−" can attach to its digit.
    var chunks=raw.trim().split(/\s+/).filter(Boolean);
    var step=chunks.length?w/chunks.length:w;
    chunks.forEach(function(chunk,index){
      var x0=x+step*index;
      var x1=x+step*(index+1);
      var mx=(x0+x1)/2;
      if (/^[א-ת]\.$/.test(chunk)){
        out.push({text:chunk.charAt(0),x:mx,y:y,x0:x0,x1:x1,y0:y,y1:y+h});
        return;
      }
      out.push({text:chunk,x:mx,y:y,x0:x0,x1:x1,y0:y,y1:y+h});
    });
  });
  return out;
}

function noamRebuildSelectedPartExpression(exercise){
  if (!exercise||!exercise.part||!exercise.crop){return Promise.resolve(null);}
  if (typeof pdfDocument==="undefined"||!pdfDocument){return Promise.resolve(null);}
  var pageNumber=Number(exercise.crop.page||0);
  if (!(pageNumber>=1)){return Promise.resolve(null);}
  return pdfDocument.getPage(pageNumber).then(function(page){
    var viewport=page.getViewport({scale:1});
    return page.getTextContent().then(function(content){
      var tokens=noamNormalizePdfJsTextItems(content&&content.items||[],viewport);
      var expression=noamRebuildPartExpressionFromTokens(tokens,exercise.part,exercise.crop);
      if (!expression){return null;}
      var tight=noamPartBandCropFromTokens(tokens,exercise.part,exercise.crop);
      return {
        expression:expression,
        crop:tight||exercise.crop,
        source:"pdf_text_layer"
      };
    });
  }).catch(function(){return null;});
}

function noamAnalysisFromPartExpression(exercise,rebuild){
  var expression=String(rebuild&&rebuild.expression||"").trim();
  var label=noamExerciseSectionLabel(exercise);
  var statement=label+": "+expression;
  return {
    readable:true,
    readability_confidence:0.95,
    content_type:"pdf_part_expression_rebuild",
    transcription:statement,
    math_content:expression,
    problem_statement:statement,
    diagram_description:"",
    student_work:"",
    extracted_entities:{numbers:[],expressions:[expression],labels:[String(exercise.part||="")],units:[]},
    uncertain_parts:[],
    complexity:"easy",
    complexity_reasons:["pdf text-layer rebuild of selected part"],
    selected_part_expression:expression,
    manifest_ocr_unreliable:true,
    pdf_part_rebuild:true
  };
}

/* STUDENT ATTACHMENTS — a photo or file of the student's own work, sent together
   with the question image so the analyzer can separate printed content from
   handwriting. Up to ATTACH_MAX_FILES files, each up to ATTACH_MAX_BYTES. The
   files never leave the browser except inside that one combined image. */

var ATTACH_MAX_FILES = 4;
var ATTACH_MAX_BYTES = 4 * 1024 * 1024;
var ATTACH_MAX_WIDTH = 1600;
var ATTACH_MAX_PDF_PAGES = 2;
var noamAttachments = {};

function attachmentsFor(exerciseId){
  if (!exerciseId){ return []; }
  if (!noamAttachments[exerciseId]){ noamAttachments[exerciseId] = []; }
  return noamAttachments[exerciseId];
}

function currentAttachments(){
  return (typeof selectedExercise !== "undefined" && selectedExercise)
    ? attachmentsFor(selectedExercise.id)
    : [];
}

function setAttachmentNote(text, isError){
  var note = document.getElementById("noamAttachNote");
  if (!note){ return; }
  note.textContent = text || "";
  note.hidden = !text;
  note.classList.toggle("is-error", !!isError);
  note.setAttribute("role", isError ? "alert" : "status");
  note.setAttribute("aria-live", isError ? "assertive" : "polite");
}

function scaleCanvasTo(source, maxWidth){
  if (!(source.width > maxWidth)){ return source; }
  return shrinkCropCanvas(source, maxWidth / source.width);
}

function canvasFromImageFile(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var image = new Image();
    image.onload = function(){
      URL.revokeObjectURL(url);
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, image.naturalWidth || image.width);
      canvas.height = Math.max(1, image.naturalHeight || image.height);
      var ctx = canvas.getContext("2d",{alpha:false});
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0);
      resolve(scaleCanvasTo(canvas, ATTACH_MAX_WIDTH));
    };
    image.onerror = function(){
      URL.revokeObjectURL(url);
      reject(new Error("לא הצלחנו לקרוא את התמונה. נסו קובץ JPG או PNG."));
    };
    image.src = url;
  });
}

function canvasFromPdfFile(file){
  if (typeof pdfjsLib === "undefined" || !pdfjsLib){
    return Promise.reject(new Error("קובצי PDF אינם נתמכים כרגע. אפשר לצרף צילום."));
  }
  return file.arrayBuffer().then(function(buffer){
    return pdfjsLib.getDocument({data:new Uint8Array(buffer)}).promise;
  }).then(function(doc){
    var count = Math.min(doc.numPages, ATTACH_MAX_PDF_PAGES);
    var pages = [];
    var chain = Promise.resolve();
    for (var number = 1; number <= count; number += 1){
      (function(pageNumber){
        chain = chain.then(function(){
          return doc.getPage(pageNumber).then(function(page){
            var base = page.getViewport({scale:1});
            var viewport = page.getViewport({scale:Math.min(3, ATTACH_MAX_WIDTH / base.width)});
            var canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.floor(viewport.width));
            canvas.height = Math.max(1, Math.floor(viewport.height));
            var ctx = canvas.getContext("2d",{alpha:false});
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            return page.render({canvasContext:ctx, viewport:viewport}).promise.then(function(){
              pages.push(canvas);
            });
          });
        });
      })(number);
    }
    return chain.then(function(){
      if (!pages.length){ throw new Error("לא הצלחנו לקרוא את ה-PDF."); }
      return pages.length === 1 ? pages[0] : stackCanvases(pages, 14);
    });
  });
}

function stackCanvases(list, gap){
  var width = Math.max.apply(null, list.map(function(c){return c.width;}));
  var height = list.reduce(function(total,c){return total + c.height * width / c.width;}, 0) + gap * (list.length - 1);
  var target = document.createElement("canvas");
  target.width = Math.max(20, Math.round(width));
  target.height = Math.max(20, Math.round(height));
  var ctx = target.getContext("2d",{alpha:false});
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, target.width, target.height);
  var top = 0;
  list.forEach(function(canvas){
    var drawHeight = canvas.height * target.width / canvas.width;
    ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, top, target.width, drawHeight);
    top += drawHeight + gap;
  });
  return target;
}

function addNoamAttachments(fileList){
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length){ return Promise.resolve(); }
  var list = currentAttachments();
  var room = ATTACH_MAX_FILES - list.length;
  if (room <= 0){
    setAttachmentNote("כבר צורפו " + ATTACH_MAX_FILES + " קבצים. אפשר להסיר אחד ולצרף אחר.", true);
    return Promise.resolve();
  }
  var skipped = files.length - room;
  files = files.slice(0, room);
  setAttachmentNote("מכין את הקבצים…", false);
  var errors = [];
  return files.reduce(function(chain, file){
    return chain.then(function(){
      if (file.size > ATTACH_MAX_BYTES){
        errors.push(file.name + " גדול מ-4 מגה בייט");
        return;
      }
      var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
      var reader = isPdf ? canvasFromPdfFile(file) : canvasFromImageFile(file);
      return reader.then(function(canvas){
        list.push({name:file.name, canvas:canvas, thumb:shrinkCropCanvas(canvas, Math.min(1, 120 / canvas.width)).toDataURL("image/jpeg",.7)});
      }).catch(function(error){
        errors.push(file.name + ": " + (error && error.message ? error.message : "לא נקרא"));
      });
    });
  }, Promise.resolve()).then(function(){
    renderNoamAttachments();
    if (skipped > 0){ errors.push("אפשר לצרף עד " + ATTACH_MAX_FILES + " קבצים בבת אחת"); }
    setAttachmentNote(errors.length ? errors.join(" · ") : "", errors.length > 0);
  });
}

function removeNoamAttachment(index){
  var list = currentAttachments();
  list.splice(index, 1);
  renderNoamAttachments();
  setAttachmentNote("", false);
}

function clearNoamAttachments(exerciseId){
  if (exerciseId){ noamAttachments[exerciseId] = []; }
  renderNoamAttachments();
}

function renderNoamAttachments(){
  var holder = document.getElementById("noamAttachList");
  if (!holder){ return; }
  var list = currentAttachments();
  holder.replaceChildren();
  list.forEach(function(item, index){
    var chip = document.createElement("div");
    chip.className = "noam-attach-item";
    var image = document.createElement("img");
    image.src = item.thumb;
    image.alt = "";
    var name = document.createElement("span");
    name.className = "noam-attach-name";
    name.textContent = item.name;
    var remove = document.createElement("button");
    remove.type = "button";
    remove.className = "noam-attach-remove";
    remove.textContent = "×";
    remove.setAttribute("aria-label", "הסרת " + item.name);
    remove.addEventListener("click", function(){ removeNoamAttachment(index); });
    chip.append(image, name, remove);
    holder.append(chip);
  });
}

function exerciseImageWithAttachments(exercise, list){
  return cropExerciseCanvas(exercise).then(function(canvas){
    var stacked = stackCanvases([canvas].concat(list.map(function(item){return item.canvas;})), 24);
    var dataUrl = encodeCropCanvas(stacked);
    if (dataUrl){ return dataUrl; }
    var factors = [.8,.64,.5,.4];
    for (var i = 0; i < factors.length; i++){
      dataUrl = encodeCropCanvas(shrinkCropCanvas(stacked, factors[i]));
      if (dataUrl){ return dataUrl; }
    }
    throw new Error("הקבצים שצורפו גדולים מדי לשליחה. נסו לצרף פחות קבצים.");
  });
}

/* QUESTION IMAGE FOR NOAM AI — rendered from the PDF itself, not from the on-screen
   canvas. The visible page now uses the screen's full device-pixel resolution, while
   the model still receives a separate off-screen rendering at a scale chosen so the
   cropped question band itself reaches CROP_TARGET_WIDTH pixels. */

var CROP_TARGET_WIDTH_DESKTOP = 2200;
var CROP_TARGET_WIDTH_MOBILE = 1800;
var CROP_MIN_RENDER_SCALE = 1.5;
var CROP_MAX_RENDER_SCALE = 8;
var CROP_MAX_PAGE_PIXELS = 36000000;
var CROP_PAGE_CACHE_LIMIT = 2;
var cropPageCache = [];

function cropTargetWidth(){
  return (mobileLayout && mobileLayout.matches)
    ? CROP_TARGET_WIDTH_MOBILE
    : CROP_TARGET_WIDTH_DESKTOP;
}

function cropRenderScale(baseViewport, crop){
  var band = Math.max(.05, Math.min(1, Number(crop && crop.w) || 1));
  var scale = cropTargetWidth() / (baseViewport.width * band);
  scale = Math.min(CROP_MAX_RENDER_SCALE, Math.max(CROP_MIN_RENDER_SCALE, scale));
  while (
    scale > CROP_MIN_RENDER_SCALE &&
    baseViewport.width * scale * baseViewport.height * scale > CROP_MAX_PAGE_PIXELS
  ){
    scale *= .8;
  }
  return Math.round(scale * 100) / 100;
}

function cachedCropPage(pageNumber, scale){
  for (var i = 0; i < cropPageCache.length; i++){
    if (cropPageCache[i].page === pageNumber && cropPageCache[i].scale === scale){
      return cropPageCache[i].canvas;
    }
  }
  return null;
}

function renderCropPageCanvas(pageNumber, scale){
  var cached = cachedCropPage(pageNumber, scale);
  if (cached){ return Promise.resolve(cached); }
  return pdfDocument.getPage(pageNumber).then(function(page){
    var viewport = page.getViewport({scale:scale});
    var canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.floor(viewport.width));
    canvas.height = Math.max(1, Math.floor(viewport.height));
    var context = canvas.getContext("2d",{alpha:false});
    context.fillStyle = "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    return page.render({canvasContext:context, viewport:viewport}).promise.then(function(){
      cropPageCache.push({page:pageNumber, scale:scale, canvas:canvas});
      /* one full-resolution page is about 25 megabytes of canvas, so phones keep one */
      var keep = (mobileLayout && mobileLayout.matches) ? 1 : CROP_PAGE_CACHE_LIMIT;
      while (cropPageCache.length > keep){ cropPageCache.shift(); }
      return canvas;
    });
  });
}

function cropExerciseSegment(crop){
  var pageNumber = Number(crop && crop.page || 0);
  if (!(pageNumber >= 1)){ return Promise.reject(new Error("עמוד השאלה אינו זמין.")); }
  return pdfDocument.getPage(pageNumber).then(function(page){
    var scale = cropRenderScale(page.getViewport({scale:1}), crop);
    return renderCropPageCanvas(pageNumber, scale);
  }).then(function(canvas){
    var sx = Math.max(0, Math.floor((Number(crop.x) || 0) * canvas.width));
    var sy = Math.max(0, Math.floor((Number(crop.y) || 0) * canvas.height));
    var sw = Math.min(canvas.width - sx, Math.floor((Number(crop.w) || 1) * canvas.width));
    var sh = Math.min(canvas.height - sy, Math.floor((Number(crop.h) || 1) * canvas.height));
    if (sw < 1 || sh < 1){ throw new Error("לא הצלחנו לחתוך את תמונת השאלה."); }
    return {source:canvas, sx:sx, sy:sy, sw:sw, sh:sh};
  });
}

function stitchCropSegments(segments){
  var width = Math.min(cropTargetWidth(), Math.max.apply(null, segments.map(function(s){return s.sw;})));
  var gap = segments.length > 1 ? 16 : 0;
  var height = segments.reduce(function(total,s){return total + s.sh * width / s.sw;}, 0) + gap * (segments.length - 1);
  var scale = Math.min(1, (segments.length > 1 ? 5200 : 3600) / height);
  var target = document.createElement("canvas");
  target.width = Math.max(20, Math.round(width * scale));
  target.height = Math.max(20, Math.round(height * scale));
  var ctx = target.getContext("2d",{alpha:false});
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, target.width, target.height);
  var top = 0;
  segments.forEach(function(s){
    var drawHeight = s.sh * width / s.sw * scale;
    ctx.drawImage(s.source, s.sx, s.sy, s.sw, s.sh, 0, top, target.width, drawHeight);
    top += drawHeight + gap * scale;
  });
  return target;
}

function showExercisePreviewFailure(exercise){
  var fallback=document.getElementById("noamPickedText");
  if (!fallback||!selectedExercise||selectedExercise.id!==exercise.id){return;}
  var link=document.createElement("a");

}

function cropExerciseCanvasFromPdf(exercise){
  var baseCrops = Array.isArray(exercise.crops) && exercise.crops.length ? exercise.crops : [exercise.crop||{}];
  if (baseCrops.length > 12){ return Promise.reject(new Error("יותר מדי עמודים לשאלה אחת.")); }
  var cropPromise=Promise.resolve(baseCrops);
  if (noamManifestOcrUnreliable(exercise)&&exercise.part&&baseCrops.length===1){
    cropPromise=noamRebuildSelectedPartExpression(exercise).then(function(rebuild){
      return (rebuild&&rebuild.crop)?[rebuild.crop]:baseCrops;
    }).catch(function(){ return baseCrops; });
  }
  return cropPromise.then(function(crops){
    return crops.reduce(function(chain, crop){
      return chain.then(function(segments){
        return cropExerciseSegment(crop).then(function(segment){
          segments.push(segment);
          return segments;
        });
      });
    }, Promise.resolve([])).then(stitchCropSegments);
  });
}

function cropExerciseCanvas(exercise){
  return ensurePdfDocumentForCrop()
    .catch(function(){ return null; })
    .then(function(){
      if (typeof pdfDocument !== "undefined" && pdfDocument && typeof cropExerciseCanvasFromPdf === "function"){
        return cropExerciseCanvasFromPdf(exercise).catch(function(error){
          console.warn("NOAM CROP HIGH RES FALLBACK:", error);
          return cropExerciseCanvasFromView(exercise);
        });
      }
      return cropExerciseCanvasFromView(exercise);
    });
}

function cropExerciseCanvasFromView(exercise){
  return new Promise(function(resolve,reject){
    var crops=Array.isArray(exercise.crops)&&exercise.crops.length?exercise.crops:[exercise.crop||{}];
    var version=pdfRenderVersion;
    var attempts=0;
    if (crops.length>12){reject(new Error("יותר מדי עמודים לשאלה אחת."));return;}
    function prepare(){
      if (version!==pdfRenderVersion){reject(new Error("התצוגה השתנתה. נסו שוב."));return;}
      var segments=[];
      var waiting=false;
      try{
        crops.forEach(function(crop){
          var pageNumber=Number(crop.page||0);
          var page=pdfPages.querySelector('.pdf-page[data-page="'+pageNumber+'"]');
          if (!page){throw new Error("עמוד השאלה אינו זמין.");}
          if (page.getAttribute("data-state")==="error"){throw new Error("לא הצלחנו לטעון את עמוד השאלה. נסו לרענן.");}
          var source=page.querySelector("canvas");
          if (page.getAttribute("data-state")!=="ready"||!source||source.width<20||source.height<20){
            renderPdfPage(pageNumber,version);
            waiting=true;
            return;
          }
          var sx=Math.max(0,Math.floor((Number(crop.x)||0)*source.width));
          var sy=Math.max(0,Math.floor((Number(crop.y)||0)*source.height));
          var sw=Math.min(source.width-sx,Math.floor((Number(crop.w)||1)*source.width));
          var sh=Math.min(source.height-sy,Math.floor((Number(crop.h)||1)*source.height));
          if (sw<1||sh<1){throw new Error("לא הצלחנו לחתוך את תמונת השאלה.");}
          segments.push({source:source,sx:sx,sy:sy,sw:sw,sh:sh});
        });
        if (waiting){
          if (++attempts>120){throw new Error("טעינת עמודי השאלה מתעכבת. נסו שוב.");}
          setTimeout(prepare,100);
          return;
        }
        var width=Math.min(1500,Math.max.apply(null,segments.map(function(s){return s.sw;})));
        var gap=segments.length>1?12:0;
        var height=segments.reduce(function(total,s){return total+s.sh*width/s.sw;},0)+gap*(segments.length-1);
        var scale=Math.min(1,(segments.length>1?3000:1500)/height);
        var target=document.createElement("canvas");
        target.width=Math.max(20,Math.round(width*scale));
        target.height=Math.max(20,Math.round(height*scale));
        var ctx=target.getContext("2d",{alpha:false});
        ctx.fillStyle="#fff";ctx.fillRect(0,0,target.width,target.height);
        var top=0;
        segments.forEach(function(s){
          var drawHeight=s.sh*width/s.sw*scale;
          ctx.drawImage(s.source,s.sx,s.sy,s.sw,s.sh,0,top,target.width,drawHeight);
          top+=drawHeight+gap*scale;
        });
        resolve(target);
      }catch(error){reject(error);}
    }
    prepare();
  });
}

function encodeCropCanvas(canvas){
  var qualities=[.84,.72,.58,.46];
  for (var i=0;i<qualities.length;i++){
    var dataUrl=canvas.toDataURL("image/jpeg",qualities[i]);
    if (dataUrl.length<=390000){return dataUrl;}
  }
  return "";
}

function shrinkCropCanvas(canvas,factor){
  var smaller=document.createElement("canvas");
  smaller.width=Math.max(20,Math.round(canvas.width*factor));
  smaller.height=Math.max(20,Math.round(canvas.height*factor));
  var ctx=smaller.getContext("2d",{alpha:false});
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,smaller.width,smaller.height);
  ctx.drawImage(canvas,0,0,canvas.width,canvas.height,0,0,smaller.width,smaller.height);
  return smaller;
}

/* The image is built at the highest resolution the question needs and is only reduced
   when it does not fit the backend limit of 390,000 characters. Resolution is given up
   before quality, because small printed labels survive compression better than scaling. */
function cropExerciseImage(exercise){
  return cropExerciseCanvas(exercise).then(function(canvas){
    var dataUrl=encodeCropCanvas(canvas);
    if (dataUrl){return dataUrl;}
    var factors=[.8,.64,.5];
    for (var i=0;i<factors.length;i++){
      if (!(canvas.width>0&&canvas.height>0)){break;}
      dataUrl=encodeCropCanvas(shrinkCropCanvas(canvas,factors[i]));
      if (dataUrl){return dataUrl;}
    }
    throw new Error("תמונת השאלה גדולה מדי לשליחה. נסו שוב בתצוגה קטנה יותר.");
  });
}

function cacheExercisePreview(exerciseId,dataUrl){
  if (!exercisePreviewCache[exerciseId]){
    exercisePreviewOrder.push(exerciseId);
  }
  exercisePreviewCache[exerciseId]=dataUrl;
  while (exercisePreviewOrder.length>16){
    delete exercisePreviewCache[exercisePreviewOrder.shift()];
  }
}

function showExercisePreview(exercise,dataUrl){
  var preview=document.getElementById("noamPickedPreview");
  var fallback=document.getElementById("noamPickedText");
  if (!preview||!fallback||!selectedExercise||selectedExercise.id!==exercise.id){return;}
  var image=document.createElement("img");
  image.src=dataUrl;
  image.alt=exerciseLabel(exercise)+" — "+(
    noamManifestOcrUnreliable(exercise)
      ? noamExerciseSectionLabel(exercise)
      : String(exercise.text||exercise.prompt||"")
  ).slice(0,500);
  preview.replaceChildren(image);
  preview.hidden=false;
  fallback.hidden=true;
  panelBody.querySelectorAll('.noam-question-visual-image[data-exercise-id="'+exercise.id+'"]')
    .forEach(function(visualImage){visualImage.src=dataUrl;visualImage.hidden=false;});
}

function renderExercisePreview(exercise,attempt){
  if (!exercise||!exercise.crop){return;}
  if (exercisePreviewCache[exercise.id]){
    showExercisePreview(exercise,exercisePreviewCache[exercise.id]);
    return;
  }
  cropExerciseCanvas(exercise)
    .then(function(canvas){
      /* the panel preview only has to be readable on screen; the full-resolution
         image is kept for the model, not for this thumbnail */
      var preview=(canvas.width>1200&&typeof shrinkCropCanvas==="function")
        ? shrinkCropCanvas(canvas,1200/canvas.width)
        : canvas;
      var dataUrl=preview.toDataURL("image/png");
      cacheExercisePreview(exercise.id,dataUrl);
      showExercisePreview(exercise,dataUrl);
    })
    .catch(function(){
      if (attempt>=12||!selectedExercise||selectedExercise.id!==exercise.id){return;}
      renderPdfPage(Number(exercise.crop.page||0),pdfRenderVersion);
      setTimeout(function(){renderExercisePreview(exercise,attempt+1);},150);
    });
}

function getExerciseAnalysis(exercise){
  // A student's own photo makes the image unique to this request: it is never
  // served from the cache and is never written into it.
  var attachments=arguments[1]===true?[]:(typeof currentAttachments==="function")?currentAttachments():[];
  if (attachments.length){
    return exerciseImageWithAttachments(exercise,attachments)
      .then(function(imageDataUrl){
        return postJson(API+"/noamImageAnalyze",{imageDataUrl:imageDataUrl,clientRequestId:"attach-"+Date.now().toString(36)});
      })
      .then(function(result){
        if (!result||!result.ok||!result.analysis){ throw new Error("לא הצלחנו לקרוא את הקבצים שצורפו. נסו שוב."); }
        var analysis=result.analysis;
        if (analysis.readable!==true){ throw new Error("לא הצלחנו לקרוא את הקבצים שצורפו בבירור. נסו צילום ברור יותר."); }
        var semantic=noamScopedExerciseSemantic(exercise);
        analysis.transcription=[semantic,analysis.transcription||""].filter(Boolean).join("\n");
        analysis.problem_statement=[semantic,analysis.problem_statement||""].filter(Boolean).join("\n");
        return analysis;
      });
  }
  var ocrUnreliable=noamManifestOcrUnreliable(exercise);
  if (analysisCache[exercise.id]){
    var cachedAnalysis=analysisCache[exercise.id];
    // Drop stale synthetic / vision-without-expression caches for unreliable OCR.
    if (ocrUnreliable&&cachedAnalysis&&(
      cachedAnalysis.content_type==="static_manifest_exercise"||
      (cachedAnalysis.content_type==="vision_over_unreliable_ocr"&&!cachedAnalysis.selected_part_expression)
    )){
      delete analysisCache[exercise.id];
    }else{
      return Promise.resolve(cachedAnalysis);
    }
  }
  var fallback=syntheticAnalysis(exercise);
  var forceVision=noamExerciseNeedsLiveVision(exercise);
  if (!forceVision){ analysisCache[exercise.id]=fallback;saveNoamState();return Promise.resolve(fallback); }

  // Unreliable multi-part OCR: prefer PDF text-layer rebuild of the selected part
  // (reattach detached minus glyphs). Tall-crop vision has dropped the leading
  // minus and leaked ב/ג/ד into the solve payload.
  function analysisFromPdfRebuild(){
    return ensurePdfDocumentForCrop()
      .catch(function(){ return null; })
      .then(function(){ return noamRebuildSelectedPartExpression(exercise); })
      .then(function(rebuild){
        if (!rebuild||!rebuild.expression){return null;}
        var analysis=noamAnalysisFromPartExpression(exercise,rebuild);
        analysisCache[exercise.id]=analysis;saveNoamState();
        return analysis;
      });
  }

  // Cache key includes part so a shared-question crop cannot poison siblings.
  var imageKey=forceVision?"image:"+String(exercise.part||"")+":"+JSON.stringify(exercise.crops||[exercise.crop]):null;
  var cachedImage=imageKey&&analysisCache[imageKey];
  function requestVisionAnalysis(allowCachedImage){
    return ensurePdfDocumentForCrop()
      .catch(function(){ return null; })
      .then(function(){
        if (allowCachedImage && cachedImage){
          return {ok:true,analysis:cachedImage};
        }
        return noamRebuildSelectedPartExpression(exercise).then(function(rebuild){
          var cropExercise=exercise;
          if (rebuild&&rebuild.crop&&ocrUnreliable){
            cropExercise=Object.assign({},exercise,{crop:rebuild.crop,crops:null});
          }
          return cropExerciseImage(cropExercise).then(function(imageDataUrl){
            return postJson(API+"/noamImageAnalyze",{imageDataUrl:imageDataUrl,clientRequestId:"manifest-"+Date.now().toString(36)});
          }).then(function(result){
            if (result&&result.analysis&&rebuild&&rebuild.expression){
              result.analysis.selected_part_expression=rebuild.expression;
              result.analysis.math_content=rebuild.expression;
              var pinned="ביטוי הסעיף הנבחר: "+rebuild.expression;
              result.analysis.transcription=[pinned,result.analysis.transcription||""].filter(Boolean).join("\n");
              result.analysis.problem_statement=[pinned,result.analysis.problem_statement||""].filter(Boolean).join("\n");
            }
            return result;
          });
        });
      });
  }
  var rebuildFirst=ocrUnreliable?analysisFromPdfRebuild():Promise.resolve(null);
  return rebuildFirst.then(function(rebuilt){
    if (rebuilt){return rebuilt;}
    return requestVisionAnalysis(true)
    .catch(function(error){
      if (isBotProtectionError(error)){ throw error; }
      // One recovery pass after ensuring the crop document (covers clean-view races).
      console.warn("NOAM VISION RETRY AFTER CROP DOC:", exercise.id, error);
      cachedImage=null;
      pdfCropLoadPromise=null;
      return requestVisionAnalysis(false);
    })
    .then(function(result){
      if (!result||!result.ok||!result.analysis){ throw new Error("vision unavailable"); }
      var analysis=result.analysis;
      var strictVision=!!(exercise.requiresVision||ocrUnreliable);
      if (strictVision && analysis.readable!==true){throw new Error("לא הצלחנו לקרוא את השאלה בבירור. נסו שוב.");}
      if (strictVision && !["transcription","math_content","problem_statement","diagram_description"].some(function(key){return typeof analysis[key]==="string"&&analysis[key].trim();})){
        throw new Error("לא התקבל תוכן קריא מתמונת השאלה.");
      }
      if (imageKey){
        analysisCache[imageKey]=analysis;
        analysis=JSON.parse(JSON.stringify(analysis));
      }
      var semantic=noamScopedExerciseSemantic(exercise);
      if (!analysis.selected_part_expression){
        analysis.transcription=[semantic,analysis.transcription||""].filter(Boolean).join("\n");
        analysis.problem_statement=[semantic,analysis.problem_statement||""].filter(Boolean).join("\n");
      }
      if (ocrUnreliable){
        analysis.content_type=analysis.selected_part_expression
          ? "vision_with_pdf_part_expression"
          : "vision_over_unreliable_ocr";
        analysis.manifest_ocr_unreliable=true;
      }
      analysisCache[exercise.id]=analysis;saveNoamState();return analysis;
    })
    .catch(function(error){
      // Security refusals must never trigger another paid request through the
      // synthetic-analysis fallback. Preserve them for the chat error message.
      if (isBotProtectionError(error)){ throw error; }
      // These manifests deliberately carry no guessed OCR transcription.
      // Unreliable OCR must not fall back to the garbled static text either.
      if (exercise.requiresVision||ocrUnreliable){
        var visionError=new Error(
          "לא הצלחנו לקרוא את תמונת השאלה. אפשר לנסות שוב — בלי לנחש את תוכן השאלה."
        );
        visionError.code="QUESTION_IMAGE_UNREADABLE";
        visionError.cause=error;
        throw visionError;
      }
      console.warn("NOAM VISION FALLBACK:",exercise.id,error);
      analysisCache[exercise.id]=fallback;saveNoamState();return fallback;
    });
  });
}

function clearExerciseVisionCache(exercise){
  if (!exercise){ return; }
  delete analysisCache[exercise.id];
  var imageKey=noamExerciseNeedsLiveVision(exercise)
    ?"image:"+String(exercise.part||"")+":"+JSON.stringify(exercise.crops||[exercise.crop])
    :null;
  if (imageKey){ delete analysisCache[imageKey]; }
  delete exercisePreviewCache[exercise.id];
  pdfCropLoadPromise=null;
}

function retryLastNoamHelp(){
  if (!selectedExercise||busy){ return; }
  var thread=exerciseThread(selectedExercise.id);
  // Drop failed assistant + matching user turn so retry does not stack dead-ends.
  if (thread.messages.length&&thread.messages[thread.messages.length-1].answerError){
    thread.messages.pop();
  }
  var lastUser=null;
  if (thread.messages.length&&thread.messages[thread.messages.length-1].role==="user"){
    lastUser=thread.messages.pop();
  }
  if (!lastUser){ return; }
  clearExerciseVisionCache(selectedExercise);
  var kind=lastUser.kind||"";
  if (/^רמז/.test(kind)){
    thread.hintIndex=Math.max(0, thread.hintIndex-1);
    saveNoamState();
    askNoam("hint","תן לי רמז אחד בלבד. אל תגלה את התשובה הסופית, ואל תבצע את הצעד במקומי.");
    return;
  }
  if (kind==="הסבר כללי"){
    saveNoamState();
    askNoam("overview","תן לי הסבר כללי קצר על הרעיון הדרוש כאן, בלי לפתור ובלי לגלות את התשובה.");
    return;
  }
  saveNoamState();
  askNoam("free_question", String(lastUser.text||"").trim());
}

function noamGeometryContext(text){
  return /גאומטר|גיאומטר|משולש|מרובע|זווית|מקביל|מאונך|חפיפ|דמיון|פיתגורס|טרפז|מעוין|מלבן|ריבוע/i.test(String(text||""));
}

function noamSignedNumberContext(text){
  var source=String(text||"");
  if (/מספר(?:ים)?\s+מכוונ|ערך\s+מוחלט|סימנים\s+שונים|מספר(?:ים)?\s+שלילי|חיבור\s+(?:וחיסור\s+)?מספרים|ישר\s+המספרים|ציר\s+המספרים/i.test(source)){
    return true;
  }
  // Mixed-sign arithmetic cues such as −7+4 or 5+(−3), without requiring topic keywords.
  if (/(?:^|[^\d])[−\-]\s*\d+(?:\s*[,،]\s*[−\-]?\d+)*\s*(?:\+|[\u2212\-])\s*[−\-]?\d+/.test(source)){
    return true;
  }
  if (/\d+\s*(?:\+|[\u2212\-])\s*[(\[]?\s*[−\-]\s*\d+/.test(source)){return true;}
  return false;
}

/* Focused rewrite for ambiguous different-sign addition language.
   Does NOT blanket-replace גדול/קטן outside this signed-add rule phrasing. */
function noamClarifySignedAddLanguage(answer){
  var text=String(answer||"");
  if (!text){return text;}
  var ruleCue=/סימנים\s+שונים|חיבור\s+(?:של\s+)?מספרים|מספרים\s+(?:בעלי\s+)?סימנים|הערך\s+הקטן\s+מהגדול|הסימן\s+של\s+הגדול/i.test(text);
  if (!ruleCue){return text;}
  if (/ערך(?:ים)?\s+מוחלט|\|/i.test(text)){return text;}
  text=text.replace(
    /חסר(?:ים)?\s+את\s+הערך\s+הקטן\s+מהגדול(?:\s+יותר)?/gi,
    "מחסרים את הערך המוחלט הקטן מהגדול"
  );
  text=text.replace(
    /שמור(?:ו|י)?\s+על\s+הסימן\s+של\s+הגדול(?:\s+יותר)?/gi,
    "לוקחים את הסימן של המספר בעל הערך המוחלט הגדול"
  );
  text=text.replace(
    /(?:^|[^\u0590-\u05FF])הסימן\s+של\s+הגדול(?:\s+יותר)?(?!\s+ערך)/gi,
    function(match){
      var prefix=match.charAt(0);
      var he=/[\u0590-\u05FF]/.test(prefix)?"":prefix;
      return he+"הסימן של המספר בעל הערך המוחלט הגדול";
    }
  );
  return text;
}

function noamMixedSignAddExpression(text){
  var source=String(text||"");
  return /[−\-]\s*\d+\s*\+\s*(?![−\-])\d+/.test(source) ||
    /\d+\s*\+\s*[−\-]\s*\d+/.test(source) ||
    /\d+\s*\+\s*\(\s*[−\-]\s*\d+/.test(source);
}

/* Wrong rule family for a mixed-sign sum: both-negatives OR same-sign add rules. */
function noamWrongSignedAddRuleIssue(answer,analysis){
  var source=[
    analysis&&analysis.selected_part_expression,
    analysis&&analysis.transcription,
    analysis&&analysis.math_content,
    analysis&&analysis.problem_statement
  ].filter(Boolean).join("\n");
  if (!noamMixedSignAddExpression(source)){return null;}
  var text=String(answer||"");
  if (/(?:לחבר|חיבור)\s+מספרים\s+שליליים|שני(?:ם)?\s+מספרים\s+שליליים|שני\s+השליליים|חבר(?:ו|י)?\s+את\s+הערכים\s+המוחלטים[\s\S]{0,60}סימן\s+מינוס/i.test(text)){
    return "הביטוי הנבחר הוא חיבור של מספרים בעלי סימנים שונים, לא שני מספרים שליליים. השתמשו בכלל הסימנים השונים עם ערכים מוחלטים, בלי לחשוף את התוצאה המספרית.";
  }
  // Same-sign rule applied to −a+b (user S10: "אותו סימן" / "אותו צד של אפס" / unsigned 4 ו-7).
  if (/(?:בעלי\s+)?אותו\s+סימן|סימנים?\s+זהים|אותו\s+צד\s+של\s+אפס|שני\s+המספרים\s+\d+\s+ו[־\-]?\s*\d+/i.test(text)){
    return "הביטוי הנבחר הוא חיבור של מספרים בעלי סימנים שונים (יש מינוס לפני אחד מהמספרים). אל תשתמשו בכלל אותו סימן; השתמשו בכלל הסימנים השונים עם ערכים מוחלטים, בלי לחשוף את התוצאה המספרית.";
  }
  if (/כאשר\s+מחברים\s+שני\s+מספרים[\s\S]{0,40}אותו\s+סימן|סכום\s+הערכים\s+המוחלטים\s+הוא\s+גודל/i.test(text)){

function noamGeometryAnalysisSource(analysis,guide){

function noamSegmentKey(segment){
  return String(segment||"").replace(/[^A-Z]/gi,"").toUpperCase().split("").sort().join("");
}

function noamSegmentEqualityKey(left,right){
  return [noamSegmentKey(left),noamSegmentKey(right)].sort().join("=");
}

function noamSegmentEqualities(text){
  var source=String(text||"").toUpperCase();
  var result=[];
  var expression=/(^|[^A-Z])([A-Z]{2})\s*=\s*([A-Z]{2})(?![A-Z])/g;
  var match;
  while ((match=expression.exec(source))){
    result.push({
      left:match[2],right:match[3],
      key:noamSegmentEqualityKey(match[2],match[3]),
      index:match.index+match[1].length,
      end:expression.lastIndex
    });
  }
  return result;
}

function noamProofTargets(text){
  var source=String(text||"");
  var targets=[];
  var cues=/(?:הוכיחו|הוכח(?:נה)?|יש\s+להוכיח|צריך\s+להוכיח|הראו|יש\s+להראות|צריך\s+להראות)\s*:?\s*/gi;
  var cue;
  while ((cue=cues.exec(source))){
    var tail=source.slice(cues.lastIndex,cues.lastIndex+220).split(/[\n.!?;]/)[0];
    noamSegmentEqualities(tail).forEach(function(item){
      if (!targets.some(function(target){return target.key===item.key;})){targets.push(item);}
    });
  }
  return targets;
}

function noamCircularProofIssue(answer,source){
  var targets=noamProofTargets(source);
  if (!targets.length){return null;}
  var text=String(answer||"");
  var mentions=noamSegmentEqualities(text);
  for (var i=0;i<mentions.length;i+=1){
    var mention=mentions[i];
    if (!targets.some(function(target){return target.key===mention.key;})){continue;}
    var before=text.slice(Math.max(0,mention.index-70),mention.index);
    var after=text.slice(mention.end,mention.end+45);
    var negated=/(?:לא|אינו|אינה|אין|אסור|אל)\s+[^.!?\n]{0,28}$/i.test(before);
    var premise=/(?:שימו\s+לב\s+לנתון|מהנתון|לפי\s+הנתון|נתון(?:\s+לנו)?(?:\s+ש)?|ידוע(?:\s+ש)?|מאחר\s+ש|מכיוון\s+ש|מפני\s+ש|נניח\s+ש|מתקיים|נשתמש\s+(?:גם\s+)?ב(?:נתון|כך\s+ש)?)\s*[-:–—־]?\s*$/i.test(before);
    var usedToInfer=/^\s*[,.;:]?\s*(?:ו?לכן|מכאן|אז|אפשר\s+להסיק)/i.test(after);
    var goalFraming=/(?:המטרה(?:\s+היא)?|צריך\s+להוכיח|נרצה\s+להוכיח|כדי\s+להוכיח)\s*[-:–—־]?\s*$/i.test(before);
    var completion=/^\s*[,.;:]?\s*(?:ו?לכן\s+)?(?:סיימנו|זה\s+מה|כנדרש|הוכחנו)/i.test(after);
    if (!negated&&(premise||(mention.index<80&&usedToInfer&&!goalFraming&&!completion))){
      return "השוויון "+mention.left+"="+mention.right+" הוא יעד ההוכחה, ולכן אסור להשתמש בו כנתון או כהנחה בדרך.";
    }
  }
  return null;
}

function noamParallelPairs(text){
  var source=String(text||"").toUpperCase();
  var pairs=[];
  var expression=/([A-Z])\s*([A-Z])\s*(?:∥|\|\||\\PARALLEL|מקביל(?:ה|ים|ות)?\s*ל\s*[-־]?)\s*([A-Z])\s*([A-Z])/g;
  var match;
  while ((match=expression.exec(source))){
    var first=match[1]+match[2];
    var second=match[3]+match[4];
    var key=[noamSegmentKey(first),noamSegmentKey(second)].sort().join("∥");
    if (!pairs.some(function(pair){return pair.key===key;})){pairs.push({first:first,second:second,key:key});}
  }
  return pairs;
}

function noamAngles(text){
  var source=String(text||"").toUpperCase();
  var angles=[];
  var expression=/(?:∠|\\ANGLE\s*\{?|הזווית\s+)([A-Z])\s*([A-Z])\s*([A-Z])\}?/g;
  var match;
  while ((match=expression.exec(source))){
    var name=match[1]+match[2]+match[3];
    angles.push({name:name,left:match[1],vertex:match[2],right:match[3],index:match.index,end:expression.lastIndex});
  }
  return angles;
}

function noamAnglesClaimedByRelation(text,relationStart,relationEnd){
  var beforeBoundary=Math.max(text.lastIndexOf(".",relationStart-1),text.lastIndexOf("!",relationStart-1),text.lastIndexOf("?",relationStart-1),text.lastIndexOf("\n",relationStart-1),text.lastIndexOf(";",relationStart-1));
  var boundaryCandidates=[text.indexOf(".",relationEnd),text.indexOf("!",relationEnd),text.indexOf("?",relationEnd),text.indexOf("\n",relationEnd),text.indexOf(";",relationEnd)]
    .filter(function(index){return index!==-1;});
  var afterBoundary=boundaryCandidates.length?Math.min.apply(Math,boundaryCandidates):text.length;
  var sentenceStart=beforeBoundary+1;
  var sentence=text.slice(sentenceStart,afterBoundary);
  var angles=noamAngles(sentence);
  if (!angles.length){
    return noamAngles(text).filter(function(angle){return angle.end<=relationStart;})
      .sort(function(a,b){return b.end-a.end;}).slice(0,1);
  }
  relationStart-=sentenceStart;
  relationEnd-=sentenceStart;
  var before=angles.filter(function(angle){return angle.end<=relationStart;})
    .sort(function(a,b){return b.end-a.end;});
  var after=angles.filter(function(angle){return angle.index>=relationEnd;})
    .sort(function(a,b){return a.index-b.index;});
  if (before.length&&after.length){return [before[0],after[0]];}
  if (before.length>=2){return before.slice(0,2);}
  if (after.length>=2){return after.slice(0,2);}
  return before.concat(after).slice(0,2);
}

function noamAngleParallelRole(angle,pair){
  var lines=[pair.first,pair.second];
  for (var i=0;i<lines.length;i+=1){
    var line=lines[i];
    if (angle.vertex!==line[0]&&angle.vertex!==line[1]){continue;}
    var other=angle.vertex===line[0]?line[1]:line[0];
    if (angle.left===other||angle.right===other){return i;}
  }
  return -1;
}

function noamAlternateAngleIssue(answer,source){
  var text=String(answer||"");
  // Specific known mislabel: ∠BMN with ∠BAC on transversal AB are corresponding, not alternate.
  if (/מתחלפ(?:ת|ות|ים)?/i.test(text) &&
      /(?:∠\s*)?BMN/i.test(text) &&
      /(?:∠\s*)?BAC/i.test(text) &&
      !/(?:בדקו|האם|מתאימות\s+או)/i.test(text)){
    return "∠BMN ו־∠BAC אינן זוויות מתחלפות בזיהוי הזה; הן זוויות מתאימות ביחס לחותך AB.";
  }
  var pairs=noamParallelPairs(source);
  if (!pairs.length){return null;}
  var relation=/(?:מתחלפ(?:ת|ות|ים)?|מתאימ(?:ה|ות|ים)?)/gi;
  var match;
  while ((match=relation.exec(text))){
    var word=String(match[0]||"");
    var isAlternate=/מתחלפ/i.test(word);
    var windowText=text.slice(Math.max(0,match.index-170),Math.min(text.length,relation.lastIndex+170));
    var offset=Math.max(0,match.index-170);
    var angles=noamAnglesClaimedByRelation(windowText,match.index-offset,relation.lastIndex-offset);
    for (var a=0;a<angles.length;a+=1){
      var angle=angles[a];
      var endpointPairs=pairs.filter(function(pair){return (pair.first+pair.second).indexOf(angle.vertex)!==-1;});
      if (endpointPairs.length&&!endpointPairs.some(function(pair){return noamAngleParallelRole(angle,pair)!==-1;})){
        return "הזווית ∠"+angle.name+" אינה כוללת קרן על אחד הישרים המקבילים בנקודת החיתוך, ולכן אינה יכולה לשמש כאן כזווית מתחלפת או מתאימה.";
      }
    }
    for (var left=0;left<angles.length;left+=1){
      for (var right=left+1;right<angles.length;right+=1){
        if (angles[left].vertex===angles[right].vertex){
          return "זוג הזוויות שנקרא "+(isAlternate?"מתחלף":"מתאים")+" חולק אותו קודקוד. זוויות של ישר חותך נמצאות בשתי נקודות חיתוך שונות.";
        }
        var sharedPairs=pairs.filter(function(pair){
          var leftRole=noamAngleParallelRole(angles[left],pair);
          var rightRole=noamAngleParallelRole(angles[right],pair);
          return leftRole!==-1&&rightRole!==-1;
        });
        if (isAlternate&&sharedPairs.length&&sharedPairs.every(function(pair){
          return noamAngleParallelRole(angles[left],pair)===noamAngleParallelRole(angles[right],pair);
        })){
          return "שתי הזוויות שנקראו מתחלפות נשענות על אותו ישר מקביל; צריך זווית אחת בכל אחת משתי נקודות החיתוך של החותך. בדקו אם מדובר בזוויות מתאימות.";
        }
      }
    }
  }
  return null;
}

function noamParallelTransversalIssue(answer,source){
  function normalized(value){
    return String(value||"").replace(/\\(?:text|mathrm)\s*\{([^{}]*)\}/g,"$1")
      .replace(/\\parallel/g,"∥").replace(/\\[()[\]]/g,"")
      .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069${}]/g,"").toUpperCase();
  }
  // Only explicit affirmative parallel givens authorize this rejection. A
  // goal or hypothetical relation is not a fact, even if it names both lines.
  var uncertain=/(?:\?|האם|הוכיחו|הוכח|להוכיח|הראו|להראות|נניח|בהנחה|ייתכן|אולי|(?:^|[^א-ת])(?:אם|לא|אין|אינו|אינה)(?:[^א-ת]|$))/;
  var pairs=(normalized(source).match(/[^\n.!?;]+[.!?;]?/g)||[]).map(function(sentence){
    // OCR may join "given AD∥BC" and "prove ..." on one line. Keep only the
    // facts before the goal; never extract a parallel relation from the goal.
    var goal=sentence.search(/(?:^|[^א-ת])ו?(?:הוכיחו|הוכח(?:ו)?|הראו|יש\s+להוכיח|צריך\s+להוכיח|נדרש\s+להוכיח)/);
    return goal>0?sentence.slice(0,goal):sentence;
  }).filter(function(sentence){
    return !uncertain.test(sentence);
  }).flatMap(function(sentence){return noamParallelPairs(sentence);});
  if (!pairs.length){return null;}
  var text=normalized(answer);
  var relation=/(?:^|[^A-Z])([A-Z]{2})\s+(?:חותך|חותכת)\s+את\s+(?:(?:שני\s+)?הישרים\s+ה?מקבילים\s+([A-Z]{2})\s*(?:ו[-־]?\s*|,\s*)([A-Z]{2})|(?:(?:הקרן|הישר|הקטע)\s+)?([A-Z]{2}))(?![A-Z])/g;
  var match;
  while ((match=relation.exec(text))){
    var start=Math.max(text.lastIndexOf(".",match.index),text.lastIndexOf("!",match.index),text.lastIndexOf("?",match.index),text.lastIndexOf("\n",match.index),text.lastIndexOf(";",match.index))+1;
    var prefix=text.slice(start,match.index).replace(/האם\s+(?:שמת(?:ם)?\s+לב|ראית(?:ם)?)\s+ש/,"");
    // Preserve actual questions, negations, hypotheses and reported mistakes.
    // The observed "האם שמת לב ש..." explicitly presupposes the false fact.
    if (uncertain.test(prefix)||/(?:האם|טעות|טועה|שגוי|שגויה|התלמיד|נטען|נכתב)/.test(prefix)){continue;}
    var transversal=noamSegmentKey(match[1]);
    var crossed=[match[2],match[3],match[4]].filter(Boolean).map(noamSegmentKey);
    for (var i=0;i<pairs.length;i+=1){
      var pair=pairs[i],first=noamSegmentKey(pair.first),second=noamSegmentKey(pair.second);
      if ((transversal===first&&crossed.indexOf(second)!==-1)||(transversal===second&&crossed.indexOf(first)!==-1)){
        return "לפי הנתון "+pair.first+"∥"+pair.second+", אי אפשר לתאר אחד מהם כישר חותך של האחר. בדוק מחדש את זהות הישרים המקבילים ואת הישר החותך לפי הנתונים בלבד.";
      }
    }
  }
  return null;
}

function noamGeometryAnswerReview(answer,analysis,guide){
  var source=noamGeometryAnalysisSource(analysis,guide);
  if (!noamGeometryContext(source+" "+answer)){return {ok:true,reasons:[]};}
  var reasons=[];
  var circular=noamCircularProofIssue(answer,source);
  var alternate=noamAlternateAngleIssue(answer,source);
  var transversal=noamParallelTransversalIssue(answer,source);
  if (circular){reasons.push(circular);}
  if (alternate){reasons.push(alternate);}
  if (transversal){reasons.push(transversal);}
  return {ok:reasons.length===0,reasons:reasons};
}

    return {
      ok:true,

function noamSolverMessage(studentMessage,thread,topic,guidePrompt,analysis){

  var visual=window.NoamLocalVisual&&window.NoamLocalVisual.wantsVisualSupport&&window.NoamLocalVisual.wantsVisualSupport(current);
  var signedGuard=mixed
    ? "הביטוי של הסעיף הנבחר הוא "+(pinnedExpr||"חיבור עם סימנים שונים")+". זה סימנים שונים — לא אותו סימן ולא שני שליליים. השוו ערכים מוחלטים במפורש; מחסרים את הערך המוחלט הקטן מהגדול ולוקחים את הסימן של המספר בעל הערך המוחלט הגדול. אל תחשפו את התוצאה המספרית."
    : (signed
      ? "בחיבור מספרים בעלי סימנים שונים השוו ערכים מוחלטים במפורש — לא 'הגדול/הקטן' כמספרים על הציר. מחסרים את הערך המוחלט הקטן מהגדול ולוקחים את הסימן של המספר בעל הערך המוחלט הגדול. אל תחשפו את התוצאה המספרית."
      : "");
  var generalGuard=geometry
    ? "בדיקת דיוק בגאומטריה: הפרד בין הנתונים לבין מה שצריך להוכיח. אסור להשתמש במסקנה כנתון או לאשר טענה קודמת בלי לבדוק אותה. בשוויון זוויות בדוק קודקוד ושתי קרניים. חוצה זווית מחלק זווית; אל תבלבל אותו עם ישר חותך. אל תערבב זוויות מתחלפות עם זוויות מתאימות — בדוק באיזה צד של החותך נמצאת כל זווית. ברמז ראשון כוון לחשיבה בלי לחשוף את הצעד המרכזי; ברמזים הבאים הוסף צעד קטן בלי פתרון מלא ובלי נתונים מומצאים."
    : signedGuard;
  var verified=String(guidePrompt||"");
  var guard=verified||generalGuard;
  if (visual){guard+=verified?" ציין בדיוק מה לסמן בשרטוט.":" התלמיד מתקשה בזיהוי חזותי. ציין מה לסמן; אל תבקש ממנו לנחש. האתר יציג שרטוט לצד התשובה, לכן אל תאמר שאינך יכול לצייר.";}
  var label="הודעת התלמיד עכשיו: ";
  var currentBudget=Math.min(current.length,Math.max(90,Math.floor(budget*(verified ? .24 : .42))));
  var currentText=current.slice(0,currentBudget);
  var prefixBudget=Math.max(0,budget-label.length-currentText.length-2);
  var prefix=guard.length<=prefixBudget?guard:
    (guard.slice(0,Math.max(0,prefixBudget-145))+" … "+guard.slice(-140)).slice(0,prefixBudget);
  var contextRoom=Math.max(0,prefixBudget-prefix.length-(prefix?1:0));
  if (contextRoom>45&&(thread.history||[]).length){
    var context="הקשר קודם, שעשוי לכלול טעות: "+noamRecentThreadText(thread,contextRoom-34);
    prefix+=(prefix?"\n":"")+context.slice(0,contextRoom);
  }
  return (prefix?prefix+"\n":"")+label+currentText+MATH_OUTPUT_INSTRUCTION;
}

function noamResponseVisual(exercise,thread,studentMessage,answer,helpKind,hintIndex,imageAnalysis){
  var visualContext=ttl+" "+String(imageAnalysis&&imageAnalysis.diagram_description||"");
  if (!exercise||!noamVisualNeed(studentMessage,answer,helpKind,hintIndex,visualContext)){return null;}
  return noamConstructedVisual(exercise,{
    studentMessage:studentMessage,answer:answer,helpKind:helpKind,hintIndex:hintIndex,
    progress:thread&&thread.hintIndex
  });
}

function noamCanOfferDrawing(exercise,thread,message){
  if (!exercise||!thread||!message||message.role!=="assistant"||!String(message.text||"").trim()){
    return false;
  }
  if (message.visual&&message.visual.type==="geometry-guide"){
    return !noamRenderGeometryGuide(message.visual);
  }
  if (message.visual&&message.visual.type==="ai-diagram"){
    return !noamRenderAiDiagram(message.visual);
  }
  if (message.visual&&message.visual.type!=="question-image"){return false;}
  if (message.diagramOptions||message.diagramTyped||message.diagramError){return true;}
  if (!window.NoamLocalVisual||/failed\s+to\s+fetch|לא\s+זמין|נסו\s+שוב\s+בעוד/i.test(String(message.text||""))){
    return false;
  }
  var options=noamMessageVisualOptions(thread,message);
  var studentAskedForVisual=!!(window.NoamLocalVisual.wantsVisualSupport&&
    window.NoamLocalVisual.wantsVisualSupport(options.studentMessage));
  var sourceOnlyFallback=!!(message.visual&&message.visual.type==="question-image");
  // This is an escape hatch for visual edge cases, not a permanent control on
  // every geometry answer. Offer it only after a visual request was missed or
  // when the only visual available is the original worksheet crop.
  if (!studentAskedForVisual&&!sourceOnlyFallback){return false;}
  var source=ttl+"\n"+localVisualExerciseSource(exercise)+"\n"+noamRecentThreadText(thread,700)+"\n"+message.text;
  return noamGeometryContext(source);
}

function noamManualVisual(exercise,thread,message){
  if (!exercise||!thread||!window.NoamLocalVisual){return null;}
  var options=noamMessageVisualOptions(thread,message);
  var constructed=noamConstructedVisual(exercise,options);
  return constructed||null;
}

function noamMessageVisualOptions(thread,message){
  var messages=thread&&thread.messages||[];
  var index=messages.indexOf(message);
  if (index<0){index=messages.length;}
  if (message&&message.visual&&message.visual.type==="geometry-guide"&&message.visual.options){
    return Object.assign({},message.visual.options);
  }
  if (message&&message.diagramOptions){return Object.assign({},message.diagramOptions);}
  if (message&&message.visual&&message.visual.type==="ai-diagram"&&message.visual.context){
    return {answer:message.visual.context.hintText,studentMessage:message.visual.context.studentMessage};
  }
  var options={answer:String(message&&message.text||""),studentMessage:"",progress:0};
  // An older answer must keep its own question and hint scope, even after
  // the student has advanced to a later proof step.
  for (var i=index-1;i>=0;i--){
    if (messages[i]&&messages[i].role==="user"){
      options.studentMessage=String(messages[i].text||"");
      var hint=String(messages[i].kind||"").match(/^רמז\s+([1-3])$/);
      if (hint){options.helpKind="hint";options.hintIndex=Number(hint[1])-1;options.progress=Number(hint[1]);}
      break;
    }
  }
  return options;
}

function noamConstructedVisual(exercise,options){
  var guides=window.NoamGeometryGuides;
  if (!exercise||!guides||typeof guides.resolve!=="function"){return null;}
  try{
    if (!guides.resolve(exercise,options||{})){return null;}
    // Store bounded context, not SVG or caller-supplied coordinates. Rendering
    // rebuilds the scene from the current worksheet's verified source facts.
    var visual={type:"geometry-guide",exerciseId:exercise.id,options:{
      studentMessage:String(options&&options.studentMessage||"").slice(0,700),
      answer:String(options&&options.answer||"").slice(0,4000),
      helpKind:String(options&&options.helpKind||""),
      hintIndex:Number(options&&options.hintIndex)||0,
      progress:Number(options&&options.progress)||0,
      focusKey:String(options&&options.focusKey||"")
    }};
    // Resolving a scene is not success unless the current renderer can draw it.
    return noamRenderGeometryGuide(visual)?visual:null;
  }catch(error){return null;}
}

function noamRenderGeometryGuide(visual){
  var guides=window.NoamGeometryGuides,engine=window.NoamGeometry;
  if (!guides||!engine||!manifest){return null;}
  var exercise=(manifest.exercises||[]).find(function(item){return item.id===visual.exerciseId;});
  if (!exercise){return null;}
  try{
    var scene=guides.resolve(exercise,visual.options||{});
    return scene?engine.render(document,scene):null;
  }catch(error){return null;}
}

function noamDiagramRuntime(){
  // Private runtime maps are not transcript state. A reload never leaves a
  // disabled "pending" button behind, and failures never enter the cache.
  if (!noamDiagramRuntime.state){noamDiagramRuntime.state={jobs:new Map(),cache:new Map(),messages:new Map()};}
  return noamDiagramRuntime.state;
}

function noamDiagramSourceIdentity(exercise){
  return JSON.stringify([
    typeof pdf==="string"?pdf:"",manifest&&manifest.sourceSha256||"",exercise.id,
    exercise.geometrySourcePdfSha256||"",exercise.geometrySource||"",
    exercise.context||"",exercise.prompt||"",exercise.text||"",exercise.crops||exercise.crop||null
  ]);
}

function noamDiagramAnalysis(analysis){
  var clean={readable:!!(analysis&&analysis.readable)},remaining=12000;
  ["diagram_description","transcription","problem_statement","math_content"].forEach(function(key){
    var value=String(analysis&&analysis[key]||"").slice(0,Math.min(4000,remaining));
    clean[key]=value;remaining-=value.length;
  });
  // Handwritten student work is not evidence for equal/parallel/angle marks.
  return clean;
}

function noamDiagramQuestionText(exercise,analysis){
  return [exercise.geometrySource,exercise.context,exercise.prompt,exercise.text,
    analysis.transcription,analysis.problem_statement,analysis.math_content,analysis.diagram_description]
    .filter(Boolean).filter(function(value,index,items){return items.indexOf(value)===index;}).join("\n").slice(0,12000);
}

function noamRenderAiDiagram(visual){
  if (!visual||!window.NoamDiagramPlan||!window.NoamGeometry||!manifest){return null;}
  var exercise=(manifest.exercises||[]).find(function(item){return item.id===visual.exerciseId;});
  if (!exercise||visual.sourceIdentity!==noamDiagramSourceIdentity(exercise)){return null;}
  try{
    var scene=window.NoamDiagramPlan.compile(visual.plan,visual.context);
    return scene?window.NoamGeometry.render(document,scene):null;
  }catch(error){return null;}
}

function noamDiagramError(error){
  if (isBotProtectionError(error)){return String(error.message||"לא הצלחנו לאמת את הבקשה. נסו שוב בעוד רגע.").slice(0,220);}
  if (error&&error.code==="DIAGRAM_UNSUPPORTED"){
    return "עדיין לא הצלחתי להכין המחשה מדויקת לשלב הזה. אפשר לכתוב אילו קטעים או זוויות להדגיש.";
  }
  return "לא הצלחתי להכין את השרטוט כרגע. אפשר לנסות שוב.";
}

function noamDiagramCurrent(exercise,thread){
  return !!(selectedExercise&&selectedExercise.id===exercise.id&&exerciseThread(exercise.id)===thread);
}

function noamDiagramRefresh(exercise,thread,message,complete){
  if (!noamDiagramCurrent(exercise,thread)){return;}
  renderNoamChat();
  if (complete){
    var reveal=function(){
      if (!noamDiagramCurrent(exercise,thread)){return;}
      var transcript=document.getElementById("noamTranscript");
      var row=transcript&&transcript.children[(thread.messages||[]).indexOf(message)];
      if (!row||row.isConnected===false){return;}
      var figure=!message.diagramError&&row.querySelector&&row.querySelector(".noam-geometry");
      var target=figure||(message.diagramError&&row.querySelector&&row.querySelector(".noam-draw-action, .noam-draw-error"))||row;
      // A long answer can be taller than the scrollport. Reveal its drawing,
      // not the whole answer; prefer the SVG if the complete figure cannot fit.
      if (figure&&figure.getBoundingClientRect&&transcript.clientHeight>0&&
          figure.getBoundingClientRect().height>transcript.clientHeight){
        target=figure.querySelector(".noam-geometry-svg")||figure;
      }
      if (typeof target.scrollIntoView==="function"){
        target.scrollIntoView({block:figure?"center":"nearest",inline:"nearest",behavior:"instant"});
      }
    };
    // Finish layout first and cancel the generic smooth scroll to transcript end.
    if (typeof window.requestAnimationFrame==="function"){window.requestAnimationFrame(reveal);}else{reveal();}
    announceNoam(message.diagramError||"נוסף שרטוט להמחשת השלב הנוכחי.");
  }
}

function noamDiagramSourceInput(exercise){
  // Vision and planning belong to the same background job. This keeps both
  // model calls outside Wix's short request window and preserves one source.
  if (exercise.requiresVision||exercise.needsVision){
    return cropExerciseImage(exercise).then(function(imageDataUrl){
      return {questionText:String(exercise.prompt||"").slice(0,12000),imageDataUrl:imageDataUrl};
    });
  }
  return getExerciseAnalysis(exercise,true).then(function(analysis){
    var cleanAnalysis=noamDiagramAnalysis(analysis);
    return {questionText:noamDiagramQuestionText(exercise,cleanAnalysis),imageDataUrl:""};
  });
}

function postNoamDiagramStatus(jobId){
  var controller=("AbortController" in window)?new AbortController():null;
  var timer=setTimeout(function(){if(controller){controller.abort();}},12000);
  return fetch(API+"/noamDiagramStatus",{
    method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",
    body:JSON.stringify({ownerKey:ownerKey,jobId:jobId}),signal:controller?controller.signal:undefined
  }).then(function(response){
    return response.json().catch(function(){return null;}).then(function(data){
      if(!response.ok||!data||data.ok!==true){
        var error=new Error(data&&data.error||"diagram status unavailable");
        error.code=data&&data.code||"DIAGRAM_STATUS_UNAVAILABLE";throw error;
      }
      return data;
    });
  }).finally(function(){clearTimeout(timer);});
}

function pollNoamDiagramJob(jobId){
  return new Promise(function(resolve,reject){
    var started=Date.now(),errors=0;
    function check(){
      if(Date.now()-started>ASYNC_JOB_MAX_WAIT){
        var timeout=new Error("diagram job timeout");timeout.code="DIAGRAM_JOB_TIMEOUT";reject(timeout);return;
      }
      postNoamDiagramStatus(jobId).then(function(status){
        errors=0;
        if(status.status==="completed"){
          if(status.result&&status.result.ok&&status.result.plan){resolve(status.result);}
          else{var empty=new Error("empty diagram result");empty.code="DIAGRAM_UNSUPPORTED";reject(empty);}
          return;
        }
        if(status.status==="failed"){
          var failed=new Error(status.error||"diagram worker failed");
          failed.code=status.code||"DIAGRAM_UNAVAILABLE";reject(failed);return;
        }
        setTimeout(check,STATUS_POLL_MS);
      }).catch(function(error){
        errors+=1;
        if(errors>=3){reject(error);return;}
        setTimeout(check,STATUS_POLL_MS);
      });
    }
    setTimeout(check,Math.min(STATUS_POLL_MS,500));
  });
}

function requestNoamDiagram(exercise,thread,message,providedOptions){
  var runtime=noamDiagramRuntime();
  if (runtime.messages.has(message)){return runtime.messages.get(message);}
  var options=providedOptions||noamMessageVisualOptions(thread,message);
  options={answer:String(options.answer||"").slice(0,4000),studentMessage:String(options.studentMessage||"").slice(0,700),
    helpKind:String(options.helpKind||""),hintIndex:Number(options.hintIndex)||0,
    progress:Number(options.progress)||0,focusKey:String(options.focusKey||"")};
  message.diagramOptions=options;
  var local=noamConstructedVisual(exercise,options);
  if (local){
    message.visual=local;delete message.diagramError;
    saveNoamState();noamDiagramRefresh(exercise,thread,message,true);
    return Promise.resolve(local);
  }
  if (message.visual&&message.visual.type==="question-image"){delete message.visual;}
  // The existing proxy forwards clientRequestId unchanged. Its review prefix
  // signals an explicit retry without changing the student's pedagogical input.
  var reviewRequested=!!message.diagramError;
  delete message.diagramError;
  var sourceIdentity=noamDiagramSourceIdentity(exercise);
  var key=JSON.stringify(["diagram-v1",sourceIdentity,options.answer,options.studentMessage]);
  var job=runtime.cache.has(key)?Promise.resolve(runtime.cache.get(key)):runtime.jobs.get(key);
  // Reuse a validated saved transcript result after reload, but only for an
  // identical worksheet version, question, student request, and current hint.
  if (!job){
    var saved=(thread.messages||[]).map(function(item){return item.visual;}).find(function(visual){
      return visual&&visual.type==="ai-diagram"&&visual.cacheKey===key&&noamRenderAiDiagram(visual);
    });
    if (saved){job=Promise.resolve(saved);}
  }
  if (!job){
    job=Promise.resolve().then(function(){
      if (!window.NoamDiagramPlan){throw new Error("diagram compiler unavailable");}
      return noamDiagramSourceInput(exercise);
    }).then(function(source){
      var context={questionText:source.questionText,hintText:options.answer,studentMessage:options.studentMessage};
      return postJson(API+"/noamDiagramPlan",{
        exerciseId:exercise.id,grade:g,level:LEVEL[lv],topic:String(ttl||"").slice(0,180),
        studentMessage:context.studentMessage,currentHint:context.hintText,
        questionText:context.questionText,imageDataUrl:source.imageDataUrl,ownerKey:ownerKey,
        clientRequestId:(reviewRequested?"diagram-review-":"diagram-")+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9)
      }).then(function(start){
        if(!start||!start.ok||!start.accepted||typeof start.jobId!=="string"){
          var startError=new Error("diagram start failed");startError.code="DIAGRAM_UNAVAILABLE";throw startError;
        }
        return pollNoamDiagramJob(start.jobId);
      }).then(function(result){
        var validatedContext={questionText:typeof result.validationQuestionText==="string"?
          result.validationQuestionText.slice(0,18000):context.questionText,
          hintText:context.hintText,studentMessage:context.studentMessage};
        var checked=result&&result.ok&&window.NoamDiagramPlan.inspect(result.plan,validatedContext);
        if (!checked||!checked.ok){
          console.warn("NOAM_DIAGRAM_REJECTED",String(result&&result.validationReason||checked&&checked.reason||"unavailable").slice(0,80),JSON.stringify(result&&result.constraint||null));
          var error=new Error("diagram unsupported");error.code="DIAGRAM_UNSUPPORTED";
          error.diagramReason=String(result&&result.validationReason||checked&&checked.reason||"unavailable");throw error;
        }
        if (!window.NoamGeometry||!window.NoamGeometry.render(document,checked.scene)){
          console.warn("NOAM_DIAGRAM_RENDER_FAILED",JSON.stringify({points:result.plan.points,segments:result.plan.segments,
            highlights:result.plan.highlights,angles:result.plan.angles,pointHighlights:result.plan.pointHighlights}));
          var renderError=new Error("diagram render failed");renderError.code="DIAGRAM_UNSUPPORTED";throw renderError;
        }
        return {type:"ai-diagram",exerciseId:exercise.id,sourceIdentity:sourceIdentity,cacheKey:key,
          plan:JSON.parse(JSON.stringify(result.plan)),context:validatedContext};
      });
    }).then(function(visual){
      runtime.cache.set(key,visual);
      while(runtime.cache.size>16){runtime.cache.delete(runtime.cache.keys().next().value);}
      runtime.jobs.delete(key);return visual;
    },function(error){runtime.jobs.delete(key);throw error;});
    runtime.jobs.set(key,job);
  }
  var completion=job.then(function(visual){
    if ((thread.messages||[]).indexOf(message)<0){return visual;}
    // A section switch does not cancel a useful result, but it cannot mutate
    // or redraw the new section's conversation.
    message.visual=visual;delete message.diagramError;
    if (message.diagramTyped){
      message.text="הנה המחשה של השלב שעליו שאלת.";
      thread.history.push({role:"user",content:options.studentMessage},
        {role:"assistant",content:message.text+" [הוצג שרטוט של השלב הנוכחי.]"});
      thread.history=thread.history.slice(-8);delete message.diagramTyped;
    }
    return visual;
  },function(error){
    message.diagramError=noamDiagramError(error);
    if (message.diagramTyped){message.text="השרטוט עדיין לא מוכן.";}
    return null;
  }).then(function(visual){
    runtime.messages.delete(message);saveNoamState();noamDiagramRefresh(exercise,thread,message,true);return visual;
  });
  runtime.messages.set(message,completion);
  saveNoamState();noamDiagramRefresh(exercise,thread,message,false);
  return completion;
}

function noamVisualAnswer(studentMessage,answer,visual){
  var local=window.NoamLocalVisual;
  var askedToDraw=local&&local.wantsDrawing&&local.wantsDrawing(studentMessage);
  var conflicts=/(?:לא\s+(?:יכול|יכולה)|אין\s+לי\s+אפשרות)\s+(?:לצייר|לשרטט)|האתר\s+יציג\s+(?:את\s+)?השרטוט/i.test(String(answer||""));
  if (!visual||!askedToDraw||!conflicts){return answer;}
  if (visual.type==="geometry-guide"){return "הנה המחשה מסומנת של השלב שעליו שאלת.";}
  if (visual.type==="labeled-triangle"){
    var name=(visual.vertices||[]).join("");
    return "הנה משולש "+name+" לבדו. האות האמצעית בשם כל זווית היא הקודקוד שלה.";
  }
  return "הנה המחשה של השלב שעליו שאלת.";
}

function askNoam(helpKind,studentMessage){
  if (!selectedExercise||busy){return;}
  var requestFocusId = panelBody.contains(document.activeElement) ? document.activeElement.id : "";
  if (helpKind==="free_question"){delete noamDrafts[selectedExercise.id];}
  var exercise=selectedExercise;
  var thread=exerciseThread(exercise.id);
  var hintIndex=helpKind==="hint"?thread.hintIndex:0;
  var kindLabel=helpKind==="overview"?"הסבר כללי":helpKind==="hint"?("רמז "+(hintIndex+1)):helpKind==="common_mistake"?"טעות נפוצה":"";
  var visible=helpKind==="overview"?"אפשר הסבר כללי קצר?":helpKind==="hint"?("אפשר רמז "+(hintIndex+1)+"?"):helpKind==="common_mistake"?"מה הטעות הנפוצה כאן?":studentMessage;
  var historyQuestion=kindLabel||studentMessage;
  var started=Date.now();

  thread.messages.push({role:"user",text:visible,kind:kindLabel});
  pendingExerciseId=exercise.id;
  saveNoamState();setNoamBusy(true);renderNoamChat();
  restoreNoamChatFocus(requestFocusId);
  announceNoam("נועם AI מכין תשובה עבור " + exerciseLabel(exercise) + ".");

  var attachments=(typeof currentAttachments==="function")?currentAttachments().slice():[];
  var guide=noamDidacticGuide(exercise.id);
  var guidePrompt=noamDidacticPrompt(exercise.id);
  var guidedResponse=attachments.length?null:noamDidacticResponse(exercise,helpKind,hintIndex,studentMessage,thread.hintIndex);
  var requestAnalysis=null;
  var requestPayload=null;

  if (guidedResponse&&guidedResponse.text){
    var guidedAnswer=String(guidedResponse.text).trim();
    var guidedNeedsVisual=guidedResponse.visual==="focus"||
      !!(window.NoamLocalVisual&&window.NoamLocalVisual.wantsVisualSupport&&window.NoamLocalVisual.wantsVisualSupport(studentMessage));
    var guidedFocus=noamDidacticVisualSelection(exercise.id,{
      key:guidedResponse.focusKey,
      helpKind:helpKind,
      hintIndex:hintIndex,
      progress:thread.hintIndex,
      studentMessage:studentMessage,
      answer:guidedAnswer
    });
    var guidedVisual=guidedNeedsVisual
      ? noamConstructedVisual(exercise,{studentMessage:studentMessage,answer:guidedAnswer,
          helpKind:helpKind,hintIndex:hintIndex,progress:thread.hintIndex,focusKey:guidedFocus&&guidedFocus.key||""})
      : null;
    thread.messages.push({role:"assistant",text:guidedAnswer,kind:"",visual:guidedVisual});
    thread.history.push({role:"user",content:historyQuestion},{role:"assistant",content:guidedAnswer});
    thread.history=thread.history.slice(-8);
    thread.messages=thread.messages.slice(-60);
    if (helpKind==="hint"){thread.hintIndex=Math.min(3,thread.hintIndex+1);}
    saveNoamState();setNoamBusy(false);renderNoamChat();
    announceNoam(exerciseLabel(exercise) + ". נועם AI: " + guidedAnswer);
    return;
  }

  getExerciseAnalysis(exercise)
    .then(function(analysis){
      requestAnalysis=analysis;
      var solverMessage=noamSolverMessage(studentMessage,thread,ttl,guidePrompt,analysis);
      requestPayload={
        exerciseId:exercise.id,
        grade:g,
        level:LEVEL[lv],
        topic:ttl,
        helpKind:helpKind,

    })
    .then(function(result){
