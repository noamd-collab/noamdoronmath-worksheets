html,body{margin:0}

body{min-height:100dvh;font-family:Heebo,system-ui,sans-serif;color:#17233f;background:linear-gradient(160deg,#eef6f4,#f5f4ef 55%,#f7f0ea);-webkit-tap-highlight-color:transparent}

button[data-primary]:focus-visible{outline-color:#f0b429}
#app{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px}
#card{position:relative;overflow:hidden;width:min(1080px,100%);background:#fff;border-radius:24px;box-shadow:0 16px 40px rgba(23,35,63,.1);padding:14px 20px 18px;display:flex;flex-direction:column;gap:12px}

#soundBtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;font-size:20px;cursor:pointer;display:grid;place-items:center}

.track{height:5px;background:#e2e8f0;border-radius:5px;overflow:hidden}
#progressFill{height:100%;width:0;background:linear-gradient(90deg,#32b5a7,#1a8a80);border-radius:5px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:#faf9f6;border:1.5px solid #e8e5db;border-radius:16px}

#panelSquare{padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
#square{width:min(320px,100%);height:auto;display:block;overflow:visible;user-select:none;-webkit-user-select:none}

#strip b{display:block;font-size:11.5px;font-weight:700;color:#64748b;font-style:normal}
#strip span{font-family:"Secular One",sans-serif;font-size:17px;display:inline-block}
#synth{background:linear-gradient(135deg,#e6f6f4,#fef8eb);border:1.5px solid #9ad4c8;border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;line-height:1.6;color:#17233f;text-wrap:pretty}
#panelNumeric,#panelFinish{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.numbox{background:#fff;border:1.5px solid #e8e5db;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.numok{background:#eafaf1;border:1.5px solid #9fe0bf;border-radius:12px;padding:10px 14px;text-align:center;font-weight:800;color:#146c43;font-size:15px}
h1{margin:0;font-family:"Secular One",sans-serif;font-weight:400;font-size:clamp(17px,4.6vw,22px);line-height:1.35;color:#17233f;text-wrap:balance;text-align:center}
#sub{font-size:clamp(13px,3.5vw,15px);color:#64748b;text-align:center}
#opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{font-family:"Secular One",sans-serif;font-size:19px;min-height:52px;padding:10px 12px;border-radius:14px;border:2px solid #e8e5db;background:#fff;color:#17233f;cursor:pointer;box-shadow:0 2px 0 #e8e5db;direction:ltr;unicode-bidi:isolate;white-space:nowrap;transition:background .2s,border-color .2s,color .2s,box-shadow .2s}
#hintBtn{align-self:flex-start;font-family:"Secular One",sans-serif;font-size:15px;padding:8px 20px;border-radius:50px;cursor:pointer;background:#f0b429;color:#17233f;border:2px solid #d4930d;box-shadow:0 3px 0 #d4930d}
#hintBox{background:#fef8eb;border:1.5px solid #e0b84a;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;line-height:1.55;color:#6b4a00;text-wrap:pretty}
#fb{border-radius:12px;padding:9px 14px;font-weight:700;font-size:14.5px;line-height:1.5}
#home{min-height:86px}
#cue{border-radius:12px;padding:7px 12px;font-weight:700;font-size:13.5px;text-align:center;transition:background .3s,border-color .3s,color .3s}
#next{width:100%;font-family:"Secular One",sans-serif;font-size:15.5px;border:0;border-radius:50px;padding:13px 20px;transition:background .25s,color .25s,box-shadow .25s}
#float{position:absolute;top:0;left:0;z-index:60;pointer-events:none;will-change:transform;transition:transform .85s cubic-bezier(.5,0,.2,1.12)}
#tilt{transform-origin:70% 60%}
#drift{display:flex;align-items:center;gap:8px}
#bubble{position:relative;flex:0 1 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;pointer-events:none}
#shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#bubbleName{position:relative;font-weight:800;font-size:13px;color:#1a8a80}
#bubbleText{position:relative;min-height:24px;font-size:14.5px;line-height:1.5;color:#17233f;transform-origin:right center;text-wrap:pretty}
#rivoBox{flex:none;width:72px;height:78px;transform-origin:center bottom;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
#rivoHost{width:72px;height:78px}
#pointer{flex:none;width:0;margin-inline-start:-8px;overflow:hidden;font-size:26px;line-height:1;text-align:center;opacity:0;transition:width .3s,opacity .3s,margin .3s}
#conf{position:absolute;inset:0;z-index:99;pointer-events:none;overflow:hidden}
.dots{display:flex;gap:5px;align-items:center;height:24px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#1a8a80;display:block;animation:dotB 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
#slots{display:flex;align-items:flex-start;justify-content:center;gap:6px;flex-wrap:wrap;font-family:"Secular One",sans-serif;width:100%}
.slot{min-width:46px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:10px}
.plus{font-size:18px;color:#64748b;padding-top:8px}
.sumbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:right;align-self:stretch}
.skill{background:#fff;border:1.5px solid #e8e5db;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:right}
.bar{height:8px;background:#eef2f6;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px;transform-origin:right center}
.retry{align-self:flex-start;font-family:"Secular One",sans-serif;font-size:13.5px;padding:6px 16px;border-radius:50px;border:2px solid #1a8a80;background:#fff;color:#1a8a80;cursor:pointer}
.formula{background:#fff;border:2.5px solid #1a8a80;border-radius:16px;padding:14px 20px;font-family:"Secular One",sans-serif;font-size:clamp(20px,5.4vw,26px);color:#17233f;box-shadow:0 8px 20px rgba(26,138,128,.12);text-align:center}
/* Inline math stays one LTR run. A trailing ? lives inside the run so it
   does not jump to the left of the opening parenthesis. */
.math{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.math-line{display:block;width:100%;max-width:100%;min-width:0;align-self:stretch;direction:ltr;unicode-bidi:isolate;white-space:nowrap;text-align:center}
#heroEq{font-family:"Secular One",sans-serif;font-size:22px;color:#c04a2d}
#numLead{font-family:"Secular One",sans-serif;font-size:20px;color:#1a8a80}
#numEq1{font-family:"Secular One",sans-serif;font-size:clamp(17px,4.6vw,21px)}
#numEq2{display:flex;flex-wrap:nowrap;justify-content:center;align-items:baseline;gap:0 6px;font-family:"Secular One",sans-serif;font-size:clamp(16px,4.4vw,21px)}
.puzzle{font-size:44px;line-height:1;animation:floatY 3.2s ease-in-out infinite}
.mini{display:grid;grid-template-columns:44px 28px;grid-template-rows:44px 28px;gap:3px;padding:3px;background:#fff;border-radius:8px}
.mini div{display:grid;place-items:center;border-radius:5px;font-family:"Secular One",sans-serif}
@keyframes hlPulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes ringPulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(2);opacity:0}}
@keyframes dotB{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes qPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08);opacity:1}}
@keyframes flashA{0%{opacity:0}15%,70%{opacity:1}100%{opacity:0}}
@keyframes flashB{0%{opacity:0}15%,70%{opacity:1}100%{opacity:0}}
@media (min-width:900px){
  #card{max-height:min(100dvh - 16px,780px)}
  #square{width:min(300px,34vw)}
}
@media (max-height:760px) and (min-width:900px){
  #app{padding:6px}
  #card{padding:8px 14px 10px;gap:8px}
  #square{width:min(240px,30vh)}
  #panelIntro{padding:14px 12px;gap:8px}
  .puzzle{font-size:32px}
  #home{min-height:72px}
  h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
