'use strict';
const DURATION=19;
const A=[339, 640], B=[751, 331], C=[751, 640];
const els=new Map(); const el=id=>{if(!els.has(id)) els.set(id,document.getElementById(id)); return els.get(id)};
const clamp=v=>Math.max(0,Math.min(1,v));
const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
const out=v=>1-Math.pow(1-clamp(v),3);
const phase=(t,s,d=.36)=>out((t-s)/d);
const range=(t,s,e,fade=.28)=>phase(t,s,fade)*(1-smooth((t-e)/fade));
const op=(id,v)=>el(id).style.opacity=String(clamp(v));
function fadeIn(id,t,s,d=.4,shift=0){const p=phase(t,s,d);op(id,p);if(shift)el(id).style.transform=`translateY(${(1-p)*shift}px)`;return p}
function draw(id,a,b,p){const e=el(id);e.setAttribute('x1',a[0]);e.setAttribute('y1',a[1]);e.setAttribute('x2',a[0]+(b[0]-a[0])*p);e.setAttribute('y2',a[1]+(b[1]-a[1])*p)}
function tip(id,a,b,p,opacity){el(id).setAttribute('cx',a[0]+(b[0]-a[0])*p);el(id).setAttribute('cy',a[1]+(b[1]-a[1])*p);op(id,opacity)}
function popPoint(id,P,t,s){const p=phase(t,s,.45);const scale=.4+.6*p;el(id).setAttribute('transform',`translate(${P[0]} ${P[1]}) scale(${scale}) translate(${-P[0]} ${-P[1]})`);op(id,p)}
const pulse=(t,at,d=.48)=>Math.sin(Math.PI*clamp((t-at)/d));
const stroke=(id,w)=>el(id).setAttribute('stroke-width',w);
