    :root{color-scheme:light;--paper:#fbfaf5;--ink:#22305a;--teal:#2a7c7a;--teal-dark:#1e605e;--mint:#eaf4f3;--muted:#4a5478;--line:rgba(34,48,90,.16)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:Heebo,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    button,select,input[type=range]{touch-action:manipulation}
    button{color:inherit;cursor:pointer}
    button:disabled,select:disabled,input:disabled{opacity:.44;cursor:default}
    button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:4px}
    button svg{width:20px;height:20px;display:block;flex:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
    [hidden]{display:none!important}
    .page{width:min(1540px,100%);margin:auto;padding:24px 28px 32px}
    .masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 3px 18px}
    .brand{font-size:15px;font-weight:700;letter-spacing:-.15px;white-space:nowrap}
    .brand small{font-size:inherit;font-weight:400;color:var(--muted)}
    .lesson-name{font-size:13px;font-weight:400;color:var(--muted);margin:0;text-align:left}
    .player{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 42px rgba(34,48,90,.055)}
    .stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--paper);border-bottom:1px solid var(--line);direction:ltr}
    .stage iframe{position:absolute;left:0;top:0;display:block;width:1920px;height:1080px;border:0;transform-origin:0 0;background:var(--paper)}
    .loading{position:absolute;inset:0;display:grid;place-items:center;direction:rtl;background:var(--paper);font-size:15px;color:var(--muted);z-index:1}
    .control-panel{padding:17px 24px 19px}
    .seek-row{display:flex;align-items:center;gap:18px;direction:ltr;margin-bottom:15px}
    .clock{display:flex;gap:7px;align-items:center;white-space:nowrap;direction:ltr;unicode-bidi:isolate;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted);min-width:89px}
    .clock .now{color:var(--ink);font-weight:700}
    .clock .slash{opacity:.5}
    input[type=range]{--progress:0%;-webkit-appearance:none;appearance:none;display:block;width:100%;height:5px;border-radius:999px;background:linear-gradient(to right,var(--teal) 0%,var(--teal) var(--progress),#e5e8ea var(--progress),#e5e8ea 100%);cursor:pointer;direction:ltr;flex:1;min-width:0;margin:8px 0}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border:2px solid #fff;border-radius:50%;background:var(--teal);box-shadow:0 0 0 1px var(--teal)}
    input[type=range]::-moz-range-thumb{width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:var(--teal);box-shadow:0 0 0 1px var(--teal)}
    .button-row,.playback,.extras{display:flex;align-items:center;gap:10px}
    .button-row{justify-content:space-between;flex-wrap:wrap;gap:14px}
    .button{height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
    .button:hover:not(:disabled){background:var(--mint);border-color:rgba(42,124,122,.38)}
    .button.primary{min-width:106px;border-color:var(--ink);background:var(--ink);color:#fff}
    .button.primary:hover:not(:disabled){background:#3d4870}
    .button.quiet{border-color:transparent;padding-inline:12px;color:var(--muted)}
    .button.chapters{color:var(--teal-dark);border-color:rgba(42,124,122,.3)}
    .button.chapters[aria-expanded=true]{background:var(--mint);border-color:var(--teal)}
    .speed-label{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}
    .speed-label select{height:39px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px;font-weight:500;padding:0 8px;direction:ltr}
    .chapter-panel{border-top:1px solid var(--line);margin-top:18px;padding-top:17px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .chapter-button{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px;font-weight:600;line-height:1.45}
    .chapter-button:hover{background:var(--mint);border-color:rgba(42,124,122,.38)}
    .chapter-button[aria-current=true]{color:var(--teal-dark);background:var(--mint);border-color:var(--teal)}
    .chapter-time{direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted)}
    .footer-note{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;column-gap:18px;row-gap:6px;margin:15px 4px 0;font-size:13px;line-height:1.65;color:var(--muted);text-align:center}
    .footer-note a{color:var(--teal-dark);text-decoration-color:rgba(30,96,94,.3);text-underline-offset:3px}
    .footer-note a:hover{text-decoration-color:currentColor}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(min-width:1700px){.page{padding-top:36px}}
    @media(max-width:850px){.chapter-panel{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){.page{padding:16px 12px 22px}.masthead{margin-bottom:12px;gap:12px}.brand{font-size:13px}.lesson-name{font-size:13px;max-width:210px}.player{border-radius:15px}.control-panel{padding:14px 14px 16px}.seek-row{gap:12px}.button-row{gap:12px}.button{padding-inline:11px;font-size:13px}.button.primary{min-width:92px}.playback,.extras{gap:5px}.speed-label>span{display:none}.chapter-button{min-height:62px;padding:10px 12px;font-size:14px}.chapter-time{font-size:13px}.footer-note{font-size:13px}.footer-note .play-note{display:none}}
    @media(max-width:410px){.masthead{display:block}.lesson-name{max-width:none;margin-top:4px;text-align:right}.button-row{gap:10px}.button.quiet{padding-inline:8px}.button.quiet .replay-text{display:none}.button.chapters{padding-inline:10px}.button-row .extras{gap:7px}.speed-label select{padding-inline:3px}.clock{font-size:13px;min-width:96px}.chapter-button{gap:5px;padding-inline:10px}.chapter-panel{gap:8px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.live-caption{margin:0 0 12px;text-align:center;font-size:16px;line-height:1.45;color:var(--ink)}
.live-caption:empty{display:none}
.live-caption strong{font-weight:800;color:var(--teal-dark)}
.live-caption .negative{color:#c64a0b;font-weight:700}
.live-caption .math-inline{display:inline-block;direction:ltr;unicode-bidi:isolate;font-family:Assistant,Arial,sans-serif;font-weight:800}
body.embed .masthead,body.embed .footer-note{display:none}body.embed .page{padding:12px 12px 16px}body.embed{min-height:0}
  </style>
