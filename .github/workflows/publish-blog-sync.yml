name: publish-blog-sync
on:
  pull_request:
    types: [closed]
    branches: [headless/astro-poc-baseline]
permissions:
  contents: read
jobs:
  publish:
    # release.sh checks out the merged commit, installs headless/astro-poc
    # (npm ci), and publishes. Node 22 matches the sync workflow.
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'bot/sync-old-blog'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: headless/astro-poc-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          if [ -z "${WIX_CLI_API_KEY}" ]; then
            echo "WIX_CLI_API_KEY is not set. Not published."
            exit 0
          fi
          bash tools/release/release.sh "$(git rev-parse HEAD)"
