name: Teacher generation free HTTP qualification
on:
  pull_request:
    branches: [headless/astro-poc-baseline]
    paths:
      - 'tools/teacher-generation/**'
      - 'tools/release/teacher-render-release.py'
      - 'tools/release/tests/test_teacher_render_release.py'
      - '.github/scripts/teacher-free-http-*.py'
      - '.github/scripts/tests/test_teacher_free_http*.py'
      - '.github/workflows/teacher-generation-free-http.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teacher-free-http-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    name: teacher-free-http-512mb-01cpu
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Check guard, native HTTP supervisor, and qualification harness
        run: |
          python3 -m unittest discover -s tools/release/tests -p 'test_teacher_render_release.py' -v
          python3 -m unittest discover -s tools/teacher-generation/cloud/render -p 'test_http_supervisor.py' -v
          python3 -m unittest discover -s .github/scripts/tests -p 'test_teacher_free_http*.py' -v
      - name: Build exact standalone HTTP runtime without credentials
        run: |
          docker buildx build --load --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --file tools/teacher-generation/cloud/render/Dockerfile \
            --tag noam-teacher-free-http:qualification .
      - name: Measure real HTTP supervisor and fixed worker under free limits
        run: |
          python3 .github/scripts/teacher-free-http-qualification.py \
            --image noam-teacher-free-http:qualification --source "$SOURCE_SHA" \
            --out "$RUNNER_TEMP/teacher-free-http"
      - name: Preserve exact image source and success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teacher-free-http-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/teacher-free-http/
          retention-days: 7
          if-no-files-found: warn
