name: Release guard PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test publication intent, Git history and durable deployment state
        run: node --test .github/scripts/production-release.test.mjs .github/scripts/reconcile-production.test.mjs
