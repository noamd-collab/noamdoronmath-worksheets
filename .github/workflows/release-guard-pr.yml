name: Release guard PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test publication intent, Git history and durable deployment state
        run: node --test .github/scripts/production-release.test.mjs .github/scripts/reconcile-production.test.mjs .github/scripts/reconcile-pr461.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Cloudflare controller, image guard and preflight recovery offline
        run: python3 -B -m unittest discover -s tools/release/tests -p 'test_teacher_cloudflare_*.py' -v
