# Pull requests into main.
#
# Blocking jobs: astro-poc-build, astro-poc-test, astro-poc-internal-links.
# Advisory jobs: astro-poc-deepseek-review, astro-poc-qwen-visual-review.
# Both call the QwenCloud Token Plan gateway
# (https://token-plan.maas.qwencloudapi.com/compatible-mode/v1) with the shared
# CHINESE_MODELS_API_KEY repo secret. Secrets are not allowed in job-level
# `if:`, so each advisory job maps the secret to a job env flag (HAS_KEY) and
# gates every step on it; the jobs skip cleanly when the secret is missing
# (including fork pull requests) and use continue-on-error so a model failure
# does not fail the workflow.
#
# This workflow never deploys. Do not add `wix release`, `wix preview`, or `wix env pull`.

name: Astro POC PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: astro-poc-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: astro-poc-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Install dependencies
        working-directory: headless/astro-poc
        run: npm ci

      - name: Build the Astro site
        run: bash .github/scripts/build-servable.sh

      - uses: actions/upload-artifact@v4
        with:
          name: astro-poc-dist
          path: headless/astro-poc/dist
          retention-days: 3
          if-no-files-found: error

  test:
    name: astro-poc-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Test the pull-request scripts
        run: node --test .github/scripts/check-internal-links.test.mjs .github/scripts/pr-pages.test.mjs

      - name: Install dependencies
        working-directory: headless/astro-poc
        run: npm ci

      - name: Install Chrome for the gate fixture
        run: |
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/google-chrome-stable ]; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -qq
            sudo apt-get install -y /tmp/chrome.deb
          fi

      - name: Run existing tests when a test script exists
        working-directory: headless/astro-poc
        run: |
          has_test="$(node --input-type=module -e "import {readFileSync} from 'node:fs'; const pkg=JSON.parse(readFileSync('package.json','utf8')); process.stdout.write(pkg.scripts && pkg.scripts.test ? 'yes' : 'no')")"
          if [ "$has_test" = "yes" ]; then
            npm test
          else
            echo "No test script in headless/astro-poc/package.json. Skipping."
          fi

  internal-links:
    name: astro-poc-internal-links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Install dependencies
        working-directory: headless/astro-poc
        run: npm ci

      - name: Build the Astro site
        run: bash .github/scripts/build-servable.sh

      - name: Serve the built site
        run: bash .github/scripts/serve-built-site.sh

      - name: Check internal links
        run: node .github/scripts/check-internal-links.mjs --base http://127.0.0.1:4321 --pages headless/astro-poc/src/pages --report /tmp/internal-links.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-link-report
          path: /tmp/internal-links.json
          retention-days: 7
          if-no-files-found: ignore

  deepseek-review:
    name: astro-poc-deepseek-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      HAS_KEY: ${{ secrets.CHINESE_MODELS_API_KEY != '' }}
      BASE_REF: ${{ github.base_ref }}
      BASE_SHA: origin/${{ github.base_ref }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Skip when CHINESE_MODELS_API_KEY is not set
        if: env.HAS_KEY != 'true'
        run: echo "CHINESE_MODELS_API_KEY is not set; skipping the advisory review."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1

      - name: Fetch the base branch
        if: env.HAS_KEY == 'true'
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Check Noam navigation against the real model when changed
        if: env.HAS_KEY == 'true'
        timeout-minutes: 3
        env:
          CHINESE_MODELS_API_KEY: ${{ secrets.CHINESE_MODELS_API_KEY }}
        run: node .github/scripts/noam-navigation-smoke.mjs

      - name: Post the DeepSeek review
        if: env.HAS_KEY == 'true'
        env:
          CHINESE_MODELS_API_KEY: ${{ secrets.CHINESE_MODELS_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/deepseek-review.mjs

  qwen-visual-review:
    name: astro-poc-qwen-visual-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    continue-on-error: true
    if: needs.build.result == 'success'
    env:
      HAS_KEY: ${{ secrets.CHINESE_MODELS_API_KEY != '' }}
      BASE_REF: ${{ github.base_ref }}
      BASE_SHA: origin/${{ github.base_ref }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Skip when CHINESE_MODELS_API_KEY is not set
        if: env.HAS_KEY != 'true'
        run: echo "CHINESE_MODELS_API_KEY is not set; skipping the advisory review."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1

      - name: Fetch the base branch
        if: env.HAS_KEY == 'true'
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Install dependencies
        if: env.HAS_KEY == 'true'
        working-directory: headless/astro-poc
        run: npm ci

      - name: Build the Astro site
        if: env.HAS_KEY == 'true'
        run: bash .github/scripts/build-servable.sh

      - name: Install Playwright Chromium
        if: env.HAS_KEY == 'true'
        run: |
          npm install --prefix /tmp/pw --no-audit --no-fund playwright
          npx --prefix /tmp/pw playwright install --with-deps chromium

      - name: Serve the built site
        if: env.HAS_KEY == 'true'
        run: bash .github/scripts/serve-built-site.sh

      - name: Screenshot pages and post the Qwen review
        if: env.HAS_KEY == 'true'
        env:
          CHINESE_MODELS_API_KEY: ${{ secrets.CHINESE_MODELS_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_URL: http://127.0.0.1:4321
          SCREENSHOT_DIR: /tmp/astro-poc-screenshots
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright/index.js
        run: node .github/scripts/qwen-visual-review.mjs

      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.HAS_KEY == 'true' }}
        with:
          name: qwen-visual-screenshots
          path: /tmp/astro-poc-screenshots
          retention-days: 7
          if-no-files-found: ignore
