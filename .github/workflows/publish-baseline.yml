name: publish-baseline

# GitHub starts workflow_dispatch only from the default branch. This file is
# on main so a manual run can release headless/astro-poc-baseline.
# A push of this file to main also releases once, because the token that
# merges pull requests cannot call the dispatch API (Actions: write).
# Release script on baseline installs @wix/cli before login (see #275).
# Noam approved teacher answer completion, editable RTL Word download and publication.
# Release a668e478 preserves the live hero opening and adds only #380 + #389.
# The unrelated unpublished teachers homepage card is intentionally excluded.
# Noam, 4.11.2026: then publish the homepage hero random from the whole site (#391).
# Release b109def8 = live a668e478 + the three #391 files only. Teachers card still excluded.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Release headless/astro-poc-baseline
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-baseline.yml

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.publish == true || inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: release/hero-site-wide-20261104
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Publish baseline
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          RELEASE_BRANCH: release/hero-site-wide-20261104
        run: |
          if [ -z "${WIX_CLI_API_KEY}" ]; then
            echo "WIX_CLI_API_KEY is not set. The baseline was not published."
            exit 1
          fi
          git fetch origin release/hero-site-wide-20261104
          bash tools/release/release.sh "b109def82fec7fbb823d61b600b682e8abff0ed0"
