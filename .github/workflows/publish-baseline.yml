name: publish-baseline

# GitHub starts workflow_dispatch only from the default branch. This file is
# on main so a manual run can release headless/astro-poc-baseline.
# Release script on baseline installs @wix/cli before login (see #275).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Release headless/astro-poc-baseline
        type: boolean
        default: true
      sha:
        description: Optional commit SHA on headless/astro-poc-baseline to release (defaults to current branch head)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.publish == true || inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: headless/astro-poc-baseline
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Publish baseline
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          if [ -z "${WIX_CLI_API_KEY}" ]; then
            echo "WIX_CLI_API_KEY is not set. The baseline was not published."
            exit 1
          fi
          git fetch origin headless/astro-poc-baseline
          SHA="${TARGET_SHA:-$(git rev-parse origin/headless/astro-poc-baseline)}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "Invalid commit SHA: $SHA"
            exit 1
          fi
          echo "Releasing $SHA"
          bash tools/release/release.sh "$SHA"
