name: publish-baseline

# GitHub starts workflow_dispatch only from the default branch. This file is
# on main so a manual run can release headless/astro-poc-baseline.
# A push of this file to main also releases once, because the token that
# merges pull requests cannot call the dispatch API (Actions: write).
# Release script on baseline installs @wix/cli before login (see #275).
# Publish only from the canonical branch, headless/astro-poc-baseline;
# never publish from separate release/* branches.
# Changes go through PRs and checks, with Noam's approval for the exact SHA.
# Noam approved 254d7b8093de9ebea9c3608effd76428ee43f810 only.
# It is 0b59201 plus the Pythagoras promo orange shadow (#401).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Release headless/astro-poc-baseline
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-baseline.yml

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.publish == true || inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: headless/astro-poc-baseline
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Publish baseline
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          RELEASE_BRANCH: headless/astro-poc-baseline
        run: |
          if [ -z "${WIX_CLI_API_KEY}" ]; then
            echo "WIX_CLI_API_KEY is not set. The baseline was not published."
            exit 1
          fi
          git fetch origin headless/astro-poc-baseline
          bash tools/release/release.sh "254d7b8093de9ebea9c3608effd76428ee43f810"
