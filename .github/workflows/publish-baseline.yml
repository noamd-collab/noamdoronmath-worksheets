name: publish-baseline

# GitHub starts workflow_dispatch only from the default branch. This file is
# on main so a manual run can release headless/astro-poc-baseline.
# A push of this file to main also releases once, because the token that
# merges pull requests cannot call the dispatch API (Actions: write).
# Release script on baseline installs @wix/cli before login (see #275).
# Noam, 5.11.2026: put the homepage teachers card back (#385 + #387), SHA 0e192d1
# = live 45f9038 + the three teachers-card files. The card was live on 4.11 (published
# directly with wix release, not through this file), and the #388 and #393 releases,
# built from older SHAs, removed it.
# LIVE NOW: 0e192d1 on release/hero-random-opening. Build the next release on this SHA,
# or the teachers card is lost again. #380 + #389 are still not live.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Release headless/astro-poc-baseline
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-baseline.yml

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.publish == true || inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: release/hero-random-opening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Publish baseline
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          RELEASE_BRANCH: release/hero-random-opening
        run: |
          if [ -z "${WIX_CLI_API_KEY}" ]; then
            echo "WIX_CLI_API_KEY is not set. The baseline was not published."
            exit 1
          fi
          git fetch origin release/hero-random-opening
          bash tools/release/release.sh "0e192d172cd021b319729484c838fd5cf8e9dba9"
