name: publish-baseline

# GitHub starts workflow_dispatch only from the default branch. This file is
# on main so a manual run can release headless/astro-poc-baseline.
# A push of this file to main also releases once, because the token that
# merges pull requests cannot call the dispatch API (Actions: write).
# Release script on baseline installs @wix/cli before login (see #275).
# Noam approved teacher answer completion and editable RTL Word publication.
# 16a15cb8 includes live 0e192d1: whole-site hero and restored teachers card.
# It adds #380 + #389 + #394; its tree matches reviewed baseline d40b9ceb.
# #394 fixes the production Node/zlib validation failure; content bytes stay pinned.
# Build future releases on this SHA so previously published changes are retained.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Release headless/astro-poc-baseline
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-baseline.yml

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.publish == true || inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: release/teacher-word-selected-answers-20261104
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Publish baseline
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          RELEASE_BRANCH: release/teacher-word-selected-answers-20261104
        run: |
          if [ -z "${WIX_CLI_API_KEY}" ]; then
            echo "WIX_CLI_API_KEY is not set. The baseline was not published."
            exit 1
          fi
          git fetch origin release/teacher-word-selected-answers-20261104
          bash tools/release/release.sh "16a15cb8ffb83c496ea639910688b5dfc0c79be8"
