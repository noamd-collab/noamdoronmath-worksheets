name: publish-baseline

# Publish only from headless/astro-poc-baseline, never from release/* branches.
# Every new site SHA needs Noam's explicit approval and a reviewed PR.
# Noam approved 8d0d692213cd5d4900cde50d0f7612cf2062ba9d only (9.11.2026: #427, play the grade 8 statistics film silently on load).
# A push publishes only when RELEASE_SHA changes. Infrastructure-only PRs do
# not republish the site. Manual retries use the same approved pin on main.

env:
  RELEASE_SHA: 8d0d692213cd5d4900cde50d0f7612cf2062ba9d

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the approved canonical site SHA
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [.github/workflows/publish-baseline.yml]

permissions:
  contents: read

jobs:
  release-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.intent.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether an approved publication was requested
        id: intent
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: node .github/scripts/production-release.mjs intent

  publish:
    needs: release-request
    if: needs.release-request.outputs.publish == 'true'
    # Read the production marker only after acquiring this lock. Never cancel
    # an active deployment; its final state must be recorded before the next.
    concurrency:
      group: wix-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the reviewed release controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Check out the exact approved site commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: site
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/headless/astro-poc/package-lock.json

      - name: Fetch the current canonical branch
        run: git -C site fetch origin headless/astro-poc-baseline:refs/remotes/origin/headless/astro-poc-baseline

      - name: Reject rollback and record the deployment before publication
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_DIR: ${{ github.workspace }}/site
        run: node controller/.github/scripts/production-release.mjs begin

      - name: Publish the approved baseline
        id: release
        working-directory: site
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          RELEASE_BRANCH: headless/astro-poc-baseline
        run: |
          if [ -z "${WIX_CLI_API_KEY}" ]; then
            echo "WIX_CLI_API_KEY is not set. The baseline was not published."
            exit 1
          fi
          bash tools/release/release.sh "$RELEASE_SHA"

      - name: Record confirmed success or block subsequent releases
        if: always() && steps.guard.outputs.deployment_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.guard.outputs.deployment_id }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: node controller/.github/scripts/production-release.mjs finish
