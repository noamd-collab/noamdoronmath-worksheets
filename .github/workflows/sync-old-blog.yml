name: sync-old-blog

# Copies new posts from the old public Wix blog (amiramnoam.wixsite.com/my-site)
# into the headless site on headless/astro-poc-baseline, and opens a pull request
# with them. Posts are still written on the old site; the live site serves its
# blog from files in the repo, so they only appear there after this sync.
#
# This file lives on main because GitHub runs schedule and workflow_dispatch
# only from the default branch. The scheduled run only opens a pull request.
# A manual run with publish=true releases the current headless/astro-poc-baseline
# through tools/release/release.sh and the WIX_CLI_API_KEY secret.
#
# The sync itself reads the old site's public sitemap, feed and post pages.

on:
  schedule:
    # Posts on the old site go out around 02:15 and 03:50 UTC.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Release headless/astro-poc-baseline even when this run imports no new posts
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-old-blog
  cancel-in-progress: false

env:
  BASE_BRANCH: headless/astro-poc-baseline
  SYNC_BRANCH: automation/old-blog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the headless site
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          # A push or PR made with GITHUB_TOKEN does not start other workflows, so the
          # required checks (seo, astro-poc-slash-fractions) would never run on the
          # sync PR. BLOG_SYNC_PAT: fine-grained, this repository only,
          # Contents + Pull requests read/write.
          token: ${{ secrets.BLOG_SYNC_PAT || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Install
        working-directory: headless/astro-poc
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync posts
        working-directory: headless/astro-poc
        run: node scripts/sync-old-blog.mjs

      - name: Warn when BLOG_SYNC_PAT is missing
        env:
          HAS_SYNC_PAT: ${{ secrets.BLOG_SYNC_PAT != '' }}
        run: |
          if [ "$HAS_SYNC_PAT" != "true" ]; then
            echo "::warning::BLOG_SYNC_PAT is not set. The sync PR is pushed and opened with GITHUB_TOKEN, so the required checks will not run on it and it cannot be merged until someone updates the branch. Add BLOG_SYNC_PAT (fine-grained, this repository only, Contents + Pull requests read/write)."
          fi

      # The branch is rebuilt from the base on every run, so a pull request that
      # was not merged yet picks up the newer posts too.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.BLOG_SYNC_PAT || github.token }}
        run: |
          git add \
            headless/astro-poc/src/data/blog-posts \
            headless/astro-poc/src/data/blog-archives/blog-index.json \
            headless/astro-poc/src/data/site-guide.v1.json \
            headless/astro-poc/src/data/search-index.v1.json \
            headless/astro-poc/src/lib/blogArchives.ts \
            headless/astro-poc/docs/search/index-build.json
          if git diff --cached --quiet; then
            echo "No new posts on the old blog."
            exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- headless/astro-poc/src/data/blog-posts | grep -c '\.json$' || true)
          git config user.name "old-blog-sync"
          git config user.email "old-blog-sync@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          git commit -m "Sync ${added} new posts from the old Wix blog"
          git push --force origin "$SYNC_BRANCH"

          body="New posts copied from the old Wix blog by the sync-old-blog workflow (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          To put them on the live site: merging needs Noam's approval, and publishing needs a separate approval. After both, from the repository root run \`bash tools/release/release.sh <approved-commit-sha>\`. Do not run \`npm run release\` or \`wix release\` directly."
          existing=$(gh pr list --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updated pull request #${existing}."
          elif ! gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --title "Sync new posts from the old Wix blog" --body "$body"; then
            echo "::error::The posts are on branch ${SYNC_BRANCH}, but the pull request could not be opened. Allow GitHub Actions to create pull requests (Settings → Actions → General), or open it by hand: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${SYNC_BRANCH}"
            exit 1
          fi

      # publish is a string in some contexts and a boolean in others.
      - name: Publish baseline
        if: ${{ inputs.publish == true || inputs.publish == 'true' }}
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          if [ -z "${WIX_CLI_API_KEY}" ]; then
            echo "WIX_CLI_API_KEY is not set. The baseline was not published."
            exit 1
          fi
          git fetch origin "$BASE_BRANCH"
          bash tools/release/release.sh "$(git rev-parse "origin/${BASE_BRANCH}")"
