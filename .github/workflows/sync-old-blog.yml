name: sync-old-blog

# Pull new posts from the old public Wix blog into the headless archive.
# Soro publishes most mornings (around 04:00 UTC). This runs after that.
#
# GitHub runs schedule and workflow_dispatch only when this file is on the
# default branch (main). A copy that exists only on headless/astro-poc-baseline
# never starts. New posts open a pull request into the live branch. Publishing
# happens after that pull request merges, in publish-blog-sync.yml.

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-old-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: headless/astro-poc-baseline

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: headless/astro-poc/package-lock.json

      - name: Install
        working-directory: headless/astro-poc
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync posts
        working-directory: headless/astro-poc
        run: node scripts/sync-old-blog.mjs

      - name: Open a pull request with new posts
        uses: peter-evans/create-pull-request@v7
        with:
          # A fine-grained PAT lets the required checks run on the bot PR.
          # PRs opened with GITHUB_TOKEN do not trigger other workflows.
          token: ${{ secrets.BLOG_SYNC_PAT || secrets.GITHUB_TOKEN }}
          base: headless/astro-poc-baseline
          branch: bot/sync-old-blog
          delete-branch: true
          committer: cursor-blog-sync <cursor-blog-sync@users.noreply.github.com>
          author: cursor-blog-sync <cursor-blog-sync@users.noreply.github.com>
          commit-message: Sync new posts from the old Wix blog
          title: Sync new posts from the old Wix blog
          body: Automated daily sync from the old Wix blog. Merging this PR publishes the posts.
          labels: blog-sync
          add-paths: |
            headless/astro-poc/src/data/blog-posts
            headless/astro-poc/src/data/blog-archives/blog-index.json
            headless/astro-poc/src/data/site-guide.v1.json
            headless/astro-poc/src/data/search-index.v1.json
            headless/astro-poc/src/lib/blogArchives.ts
            headless/astro-poc/docs/search/index-build.json
