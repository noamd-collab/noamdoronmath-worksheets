<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>חוק הפילוג המורחב · כיתה ט׳ · רמה א׳ · נועם AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#14213D;
  --accent:#00A08A;
  --accent-dark:#00705F;
  --tint:#CFF3EC;
  --paper:#E3DFD2;
  --grid:#BFBDB2;
}
*,
*::before,
*::after { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  font-family:'Assistant','Heebo',Arial,sans-serif;
  color:var(--ink);
  background:
    linear-gradient(var(--grid) 2px,transparent 2px) 0 0/45px 45px,
    linear-gradient(90deg,var(--grid) 2px,transparent 2px) 0 0/45px 45px,
    var(--paper);
}
.topbar {
  position:sticky;
  top:0;
  z-index:40;
  min-height:54px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 14px;
  background:#fff;
  border-bottom:3px solid var(--ink);
}
.topbar-title {
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:17px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.topbar-badge {
  margin-inline-start:auto;
  border:2px solid var(--ink);
  border-radius:999px;
  padding:6px 11px;
  background:var(--tint);
  font-weight:800;
  font-size:12px;
  white-space:nowrap;
}
.stage {
  padding:20px 154px 38px 18px;
}
.page-shell {
  width:min(820px,calc(100vw - 200px));
  margin:0 auto;
}
.page {
  position:relative;
  width:100%;
  aspect-ratio:595.2756/841.8898;
  background:#fff;
  border:3px solid var(--ink);
  box-shadow:-5px 5px 0 var(--ink);
}
.page-image {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:fill;
  user-select:none;
  -webkit-user-drag:none;
}
.noam-pin {
  position:absolute;
  right:-139px;
  transform:translateY(-50%);
  width:128px;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:7px 10px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  box-shadow:-2px 2px 0 var(--ink);
  font-family:'Heebo',sans-serif;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  direction:rtl;
  z-index:3;
  transition:transform .14s ease,background .14s ease;
}
.noam-pin:hover {
  transform:translateY(-50%) translateX(-2px);
  background:var(--tint);
}
.noam-pin.is-active {
  color:#fff;
  background:var(--accent);
}
.noam-pin-icon { font-size:15px; }
.overlay {
  position:fixed;
  inset:0;
  z-index:80;
  background:rgba(20,33,61,.34);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.panel {
  position:fixed;
  top:0;
  left:0;
  z-index:90;
  width:min(430px,94vw);
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#fff;
  border-right:3px solid var(--ink);
  box-shadow:18px 0 55px rgba(20,33,61,.25);
  transform:translateX(-103%);
  transition:transform .22s ease;
  direction:rtl;
}
body.noam-open .overlay {
  opacity:1;
  pointer-events:auto;
}
body.noam-open .panel {
  transform:translateX(0);
}
.panel-head {
  flex:none;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:62px;
  padding:11px 13px;
  background:var(--tint);
  border-bottom:3px solid var(--ink);
}
.panel-title {
  flex:1;
  min-width:0;
  font-family:'Heebo',sans-serif;
  font-size:20px;
  font-weight:900;
}
.panel-close {
  flex:none;
  width:37px;
  height:37px;
  border:2px solid var(--ink);
  border-radius:50%;
  background:#fff;
  color:var(--ink);
  font-size:22px;
  line-height:1;
  cursor:pointer;
}
.panel-body {
  flex:1;
  min-height:0;
  overflow:auto;
  padding:15px;
}
.panel-meta {
  color:var(--accent-dark);
  font-size:12px;
  font-weight:800;
  margin-bottom:10px;
}
.selected-card {
  padding:11px 12px;
  margin-bottom:13px;
  background:var(--tint);
  border:2px solid var(--ink);
  border-radius:12px;
}
.selected-label {
  font-family:'Heebo',sans-serif;
  font-size:13px;
  font-weight:900;
  margin-bottom:5px;
}
.selected-text {
  font-size:15px;
  line-height:1.6;
}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}
.action {
  min-height:37px;
  padding:7px 13px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  box-shadow:-2px 2px 0 var(--ink);
  font-family:'Heebo',sans-serif;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}
.action.primary {
  color:#fff;
  background:var(--accent);
}
.action:disabled {
  opacity:.45;
  cursor:not-allowed;
}
.answer {
  min-height:110px;
  max-height:42vh;
  overflow-y:auto;
  padding:10px 2px 14px;
  display:flex;
  flex-direction:column;
  gap:9px;
  scroll-behavior:smooth;
}
.chat-empty {
  padding:12px 2px;
  color:#667085;
  font-size:14px;
  line-height:1.6;
}
.chat-row {
  display:flex;
  width:100%;
}
.chat-row.user {
  justify-content:flex-start;
}
.chat-row.assistant {
  justify-content:flex-end;
}
.chat-bubble {
  max-width:88%;
  padding:9px 11px;
  border:2px solid var(--ink);
  border-radius:14px;
  font-size:15px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.chat-row.user .chat-bubble {
  background:#fff;
  border-bottom-right-radius:5px;
}
.chat-row.assistant .chat-bubble {
  background:var(--tint);
  border-bottom-left-radius:5px;
}
.chat-bubble.thinking {
  color:#667085;
  background:#f7f8fa;
}
.chat-kind {
  display:block;
  margin-bottom:3px;
  color:var(--accent-dark);
  font-family:'Heebo',sans-serif;
  font-size:11px;
  font-weight:900;
}
.thread-tools {
  display:flex;
  justify-content:flex-end;
  margin:-4px 0 10px;
}
.new-thread {
  border:0;
  background:transparent;
  color:#667085;
  font-family:'Assistant',sans-serif;
  font-size:12px;
  font-weight:700;
  text-decoration:underline;
  cursor:pointer;
  padding:2px 0;
}
.dots::after {
  content:"";
  animation:dots 1.1s steps(4,end) infinite;
}
@keyframes dots {
  0% { content:""; }
  25% { content:"."; }
  50% { content:".."; }
  75%,100% { content:"..."; }
}
.question-box {
  padding-top:13px;
  border-top:2px solid var(--ink);
}
.question-box label {
  display:block;
  margin-bottom:7px;
  font-family:'Heebo',sans-serif;
  font-size:13px;
  font-weight:900;
}
.question-input {
  width:100%;
  min-height:76px;
  resize:vertical;
  padding:10px 11px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:12px;
  font-family:'Assistant',sans-serif;
  font-size:15px;
  line-height:1.5;
  direction:rtl;
}
.question-input:focus {
  outline:none;
  box-shadow:-3px 3px 0 var(--accent);
}
.send {
  width:100%;
  margin-top:8px;
  padding:10px 13px;
  color:#fff;
  background:var(--ink);
  border:2px solid var(--ink);
  border-radius:999px;
  font-family:'Heebo',sans-serif;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}
.panel-note {
  margin-top:11px;
  color:#667085;
  font-size:11px;
  text-align:center;
}
@media (max-width:820px) {
  .topbar-badge { display:none; }
  .stage { padding:9px 6px 26px; }
  .page-shell { width:100%; }
  .page {
    border-width:2px;
    box-shadow:-3px 3px 0 var(--ink);
  }
  .noam-pin {
    right:5px;
    width:34px;
    height:32px;
    min-height:32px;
    padding:0;
    border-radius:50%;
    box-shadow:none;
    background:rgba(255,255,255,.94);
  }
  .noam-pin-label { display:none; }
  .panel {
    top:auto;
    bottom:0;
    width:100%;
    height:min(75dvh,650px);
    border-right:0;
    border-top:3px solid var(--ink);
    border-radius:20px 20px 0 0;
    transform:translateY(103%);
  }
  body.noam-open .panel {
    transform:translateY(0);
  }
}
</style>
</head>

  const SEMANTIC = {"G9-T02-A-Q01א":{"exerciseId":"G9-T02-A-Q01א","questionNumber":1,"part":"א","context":"במלבן שבשרטוט אורכי הצלעות הם x + 6 וגם x + 4. שני התאים העליונים בדוגמה המודרכת הם x·x = x² ו־x·6 = 6x. השלימו את שני התאים התחתונים.","partText":"רשמו את הביטוי בכל אחד מארבעת התאים.","promptText":"במלבן שבשרטוט אורכי הצלעות הם x + 6 וגם x + 4. שני התאים העליונים בדוגמה המודרכת הם x·x = x² ו־x·6 = 6x. השלימו את שני התאים התחתונים. רשמו את הביטוי בכל אחד מארבעת התאים."},"G9-T02-A-Q01ב":{"exerciseId":"G9-T02-A-Q01ב","questionNumber":1,"part":"ב","context":"במלבן שבשרטוט אורכי הצלעות הם x + 6 וגם x + 4. שני התאים העליונים בדוגמה המודרכת הם x·x = x² ו־x·6 = 6x. השלימו את שני התאים התחתונים.","partText":"רשמו ביטוי מכונס לשטח המלבן כסכום ארבעת התאים.","promptText":"במלבן שבשרטוט אורכי הצלעות הם x + 6 וגם x + 4. שני התאים העליונים בדוגמה המודרכת הם x·x = x² ו־x·6 = 6x. השלימו את שני התאים התחתונים. רשמו ביטוי מכונס לשטח המלבן כסכום ארבעת התאים."},"G9-T02-A-Q01ג":{"exerciseId":"G9-T02-A-Q01ג","questionNumber":1,"part":"ג","context":"במלבן שבשרטוט אורכי הצלעות הם x + 6 וגם x + 4. שני התאים העליונים בדוגמה המודרכת הם x·x = x² ו־x·6 = 6x. השלימו את שני התאים התחתונים.","partText":"רשמו את אותו שטח כמכפלת שני סוגריים.","promptText":"במלבן שבשרטוט אורכי הצלעות הם x + 6 וגם x + 4. שני התאים העליונים בדוגמה המודרכת הם x·x = x² ו־x·6 = 6x. השלימו את שני התאים התחתונים. רשמו את אותו שטח כמכפלת שני סוגריים."},"G9-T02-A-Q01ד":{"exerciseId":"G9-T02-A-Q01ד","questionNumber":1,"part":"ד","context":"במלבן שבשרטוט אורכי הצלעות הם x + 6 וגם x + 4. שני התאים העליונים בדוגמה המודרכת הם x·x = x² ו־x·6 = 6x. השלימו את שני התאים התחתונים.","partText":"הסבירו מדוע השיטה עובדת גם כאשר אורכי הצלעות אינם ידועים.","promptText":"במלבן שבשרטוט אורכי הצלעות הם x + 6 וגם x + 4. שני התאים העליונים בדוגמה המודרכת הם x·x = x² ו־x·6 = 6x. השלימו את שני התאים התחתונים. הסבירו מדוע השיטה עובדת גם כאשר אורכי הצלעות אינם ידועים."}};

  const $ = id => document.getElementById(id);
  const answerEl = $("answerEl");
  const inputEl = $("questionInput");
  const overviewBtn = $("overviewBtn");
  const hintBtn = $("hintBtn");
  const mistakeBtn = $("mistakeBtn");
  const sendBtn = $("sendBtn");

  let selected = null;
  let activeExerciseId = "";
  let busy = false;

  const STORAGE_KEY = "noam-ai-pilot-threads-v1";
  let threads = {};

  try {
    threads = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "{}");
  } catch (_) {
    threads = {};
  }

  function saveThreads() {
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(threads));
    } catch (_) {}
  }

  function getThread(exerciseId) {
    if (!threads[exerciseId]) {
      threads[exerciseId] = {
        hintIndex: 0,
        history: [],
        messages: []
      };
    }
    return threads[exerciseId];
  }

  function currentThread() {
    return getThread(activeExerciseId);
  }

  function clean(value) {
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function setBusy(value) {
    busy = value;
    overviewBtn.disabled = value || !selected;
    hintBtn.disabled = value || !selected || currentThread().hintIndex >= 3;
    mistakeBtn.disabled = value || !selected;
    sendBtn.disabled = value || !selected;
    inputEl.disabled = value || !selected;
  }

  function renderThread() {
    const thread = currentThread();

    answerEl.innerHTML = "";

    if (!thread.messages.length) {
      const empty = document.createElement("div");
      empty.className = "chat-empty";
      empty.textContent = "בחר סוג עזרה או כתוב שאלה.";
      answerEl.appendChild(empty);
    } else {
      thread.messages.forEach(message => {
        appendBubble(
          message.role,
          message.text,
          message.kind || "",
          false
        );
      });
    }

    hintBtn.textContent =
      thread.hintIndex === 0
        ? "רמז"
        : thread.hintIndex === 1
          ? "רמז נוסף"
          : thread.hintIndex === 2
            ? "רמז אחרון"
            : "3 רמזים ניתנו";

    mistakeBtn.hidden =
      thread.hintIndex < 3;

    setTimeout(() => {
      answerEl.scrollTop = answerEl.scrollHeight;
    }, 0);
  }

  function appendBubble(role, text, kind = "", save = true) {
    const row = document.createElement("div");
    row.className = `chat-row ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "chat-bubble";

    if (kind && role === "user") {
      const kindEl = document.createElement("span");
      kindEl.className = "chat-kind";
      kindEl.textContent = kind;
      bubble.appendChild(kindEl);
    }

    const body = document.createElement("span");
    body.textContent = text;
    bubble.appendChild(body);

    row.appendChild(bubble);
    answerEl.appendChild(row);

    if (save) {
      const thread = currentThread();
      thread.messages.push({
        role,
        text,
        kind
      });
      thread.messages = thread.messages.slice(-50);
      saveThreads();
    }

    answerEl.scrollTop = answerEl.scrollHeight;
    return row;
  }

  function appendThinkingBubble() {
    const row = document.createElement("div");
    row.className = "chat-row assistant";
    row.dataset.thinking = "1";

    const bubble = document.createElement("div");
    bubble.className = "chat-bubble thinking";
    bubble.innerHTML = '<span class="dots">נועם AI חושב</span>';

    row.appendChild(bubble);
    answerEl.appendChild(row);
    answerEl.scrollTop = answerEl.scrollHeight;

    return row;
  }

  function openPanel(exerciseId, button) {
    selected = SEMANTIC[exerciseId];
    if (!selected) return;

    activeExerciseId = exerciseId;
    getThread(exerciseId);

    document.querySelectorAll(".noam-pin.is-active")
      .forEach(el => el.classList.remove("is-active"));

    button.classList.add("is-active");

    $("selectedLabel").textContent =
      `שאלה ${selected.questionNumber} · סעיף ${selected.part}`;

    $("selectedText").textContent =
      clean(selected.partText || selected.promptText || selected.context);

    inputEl.value = "";

    document.body.classList.add("noam-open");
    renderThread();
    setBusy(false);
  }

  function closePanel() {
    document.body.classList.remove("noam-open");
  }

  function buildAnalysis() {
    const fullText = [
      selected.context,
      selected.partText,
      selected.promptText
    ].filter(Boolean).join("\n");

    return {
      readable: true,
      readability_confidence: 1,
      content_type: "semantic_html_exercise",
      transcription: fullText,
      math_content: selected.partText || selected.promptText || "",
      problem_statement: fullText,
      diagram_description: "",
      student_work: "",
      extracted_entities: {
        numbers: [],
        expressions: [],
        labels: [],
        units: []
      },
      uncertain_parts: [],
      complexity: "medium",
      complexity_reasons: ["semantic worksheet context"]
    };
  }

  async function askNoam(helpKind, studentMessage = "") {
    if (!selected || busy) return;

    const thread = currentThread();
    const currentHint =
      helpKind === "hint"
        ? thread.hintIndex
        : 0;

    const historyQuestion =
      helpKind === "overview"
        ? "הסבר כללי"
        : helpKind === "hint"
          ? `רמז ${currentHint + 1}`
          : helpKind === "common_mistake"
            ? "טעות נפוצה"
            : studentMessage;

    const visibleQuestion =
      helpKind === "overview"
        ? "הסבר כללי"
        : helpKind === "hint"
          ? `אפשר רמז ${currentHint + 1}?`
          : helpKind === "common_mistake"
            ? "מה הטעות הנפוצה שכדאי להיזהר ממנה?"
            : studentMessage;

    const startedAt = performance.now();

    setBusy(true);

    const empty = answerEl.querySelector(".chat-empty");
    if (empty) empty.remove();

    appendBubble(
      "user",
      visibleQuestion,
      helpKind === "free_question" ? "" : historyQuestion
    );

    const thinkingRow =
      appendThinkingBubble();

    try {
      const requestPromise = fetch(`${API}/noamImageSolve`, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({
          exerciseId: selected.exerciseId,
          grade: 9,
          level: "A",
          topic: "חוק הפילוג המורחב",
          helpKind,
          hintIndex: currentHint,
          studentMessage,
          conversationHistory: thread.history,
          imageAnalysis: buildAnalysis()
        })
      });

      const [response] = await Promise.all([
        requestPromise,
        sleep(Math.max(0, MIN_WAIT_MS - (performance.now() - startedAt)))
      ]);

      const data = await response.json();

      if (!response.ok || !data?.ok || !data?.answer) {
        throw new Error(data?.error || "נועם AI לא זמין כרגע.");
      }

      const answer = clean(data.answer);

      thinkingRow.remove();
      appendBubble("assistant", answer);

      thread.history.push(
        { role:"user", content:historyQuestion },
        { role:"assistant", content:answer }
      );
      thread.history =
        thread.history.slice(-8);

      if (helpKind === "hint") {
        thread.hintIndex += 1;
      }

      saveThreads();
      renderThread();

      if (helpKind === "free_question") {
        inputEl.value = "";
      }

    } catch (error) {
      thinkingRow.remove();

      const errorText =
        clean(error?.message || "לא הצלחתי לקבל תשובה כרגע.");

      appendBubble(
        "assistant",
        errorText
      );
    } finally {
      setBusy(false);
    }
  }

  document.querySelectorAll(".noam-pin").forEach(button => {
    button.addEventListener("click", () => {
      openPanel(button.dataset.exerciseId, button);
    });
  });

  $("closeBtn").addEventListener("click", closePanel);
  $("overlay").addEventListener("click", closePanel);

  overviewBtn.addEventListener("click", () =>
    askNoam("overview", "תן לי הסבר כללי קצר.")
  );

  hintBtn.addEventListener("click", () =>
    askNoam("hint", "תן לי רמז.")
  );

  mistakeBtn.addEventListener("click", () =>
    askNoam("common_mistake", "מה הטעות הנפוצה שכדאי להיזהר ממנה כאן?")
  );

  $("newThreadBtn").addEventListener("click", () => {
    if (!activeExerciseId) return;

    threads[activeExerciseId] = {
      hintIndex: 0,
      history: [],
      messages: []
    };

    saveThreads();
    inputEl.value = "";
    renderThread();
    setBusy(false);
  });

  sendBtn.addEventListener("click", () => {
    const message = clean(inputEl.value).slice(0, 700);
    if (!message) {
      inputEl.focus();
      return;
    }
    askNoam("free_question", message);
  });

  inputEl.addEventListener("keydown", event => {
    if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
      event.preventDefault();
      sendBtn.click();
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closePanel();
  });

  setBusy(false);
})();
</script>
</body>
</html>
