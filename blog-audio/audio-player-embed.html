<!--
  The narration player for an Embed HTML element on the blog post page.

  An embed runs in a cross-origin iframe, so it cannot read the post slug from the
  address bar. Give it the slug one of three ways, tried in this order:

    1. From the page's Velo code (preferred on this site):
         $w('#html1').postMessage({ noamAudioSlug: <slug from wix-location> });
    2. In the embed URL:      ...audio-player-embed.html?slug=<post-slug>
    3. From document.referrer, when the browser sends the parent post URL.

  The iframe posts its own height back to the page as { noamAudioHeight: <px> } so
  the page code can resize the element and avoid an inner scrollbar.

  Controls match the custom element: play/pause, a seekable bar, elapsed and
  remaining time, and a 0.5x to 2x speed slider. Speed uses the browser's own
  playbackRate, so it costs nothing and needs no second audio file.
-->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גרסת שמע לפוסט</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#14181f}
  .wrap{border:1px solid rgba(128,128,128,.35);border-radius:16px;padding:14px 16px;
        background:rgba(128,128,128,.08)}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .label{font-weight:700;font-size:15px}
  .spacer{flex:1 1 auto}
  a.dl{font-size:13px;text-decoration:none;border:1px solid rgba(128,128,128,.5);
       border-radius:999px;padding:5px 13px;color:inherit;white-space:nowrap}
  a.dl:hover{background:rgba(128,128,128,.18)}
  .line{display:flex;align-items:center;gap:12px}
  .play{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
        background:currentColor;display:flex;align-items:center;justify-content:center;padding:0}
  .play:focus-visible{outline:3px solid rgba(128,128,128,.7);outline-offset:3px}
  .play svg{width:20px;height:20px;display:block}
  .grow{flex:1 1 auto;min-width:0}
  .bar{display:block;width:100%}
  .times{display:flex;justify-content:space-between;font-size:12px;opacity:.75;margin-top:4px;
         font-variant-numeric:tabular-nums}
  .speed{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px}
  .speed input{flex:1 1 auto;min-width:120px}
  .speed .val{font-weight:700;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
  .est{font-size:12px;opacity:.75;margin-top:6px}
  input[type=range]{accent-color:currentColor;height:24px;cursor:pointer}
  .hidden{display:none}
  @media (prefers-color-scheme: dark){ body{color:#f2f4f7} }
  @media (max-width:420px){ .speed{flex-wrap:wrap} }
</style>
</head>
<body>
<div class="wrap hidden" id="wrap">
  <div class="top">
    <span class="label">גרסת שמע לפוסט</span>
    <span class="spacer"></span>
    <a class="dl" id="dl" download>הורדת MP3</a>
  </div>
  <div class="line">
    <button class="play" id="play" type="button" aria-label="הפעלה"></button>
    <div class="grow">
      <input class="bar" id="bar" type="range" min="0" max="1000" value="0" step="1"
             aria-label="מיקום בהקראה">
      <div class="times"><span id="elapsed">0:00</span><span id="left">0:00</span></div>
    </div>
  </div>
  <div class="speed">
    <span>מהירות</span>
    <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="מהירות הקראה">
    <span class="val" id="rateval">1×</span>
  </div>
  <div class="est" id="est"></div>
</div>

<script>
(function () {
  var API = 'https://www.noamdoronmath.co.il/_functions/blogAudioInfo';
  var RATE_KEY = 'noam-audio-rate';
  var PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M8 5v14l11-7z"/></svg>';
  var PAUSE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';

  var wrap = document.getElementById('wrap');
  var dl = document.getElementById('dl');
  var playBtn = document.getElementById('play');
  var bar = document.getElementById('bar');
  var elapsedEl = document.getElementById('elapsed');
  var leftEl = document.getElementById('left');
  var rateInput = document.getElementById('rate');
  var rateVal = document.getElementById('rateval');
  var estEl = document.getElementById('est');

  playBtn.innerHTML = PLAY_ICON;

  var audio = new Audio();
  audio.preload = 'none';
  var declaredDuration = 0;
  var seeking = false;
  var loadedSlug = null;

  function mmss(sec) {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function rateLabel(r) {
    var s = (Math.round(r * 100) / 100).toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    return s + '×';
  }
  function storedRate() {
    try { var v = Number(localStorage.getItem(RATE_KEY)); if (v >= 0.5 && v <= 2) return v; } catch (e) {}
    return 1;
  }
  function rememberRate(r) { try { localStorage.setItem(RATE_KEY, String(r)); } catch (e) {} }

  function duration() {
    return isFinite(audio.duration) && audio.duration > 0 ? audio.duration : declaredDuration;
  }
  function reportHeight() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 4;
    try { window.parent.postMessage({ noamAudioHeight: h }, '*'); } catch (e) {}
  }
  function paint() {
    var total = duration(), rate = audio.playbackRate || 1, at = audio.currentTime || 0;
    if (!seeking && total > 0) bar.value = String(Math.round((at / total) * 1000));
    elapsedEl.textContent = mmss(at / rate);
    leftEl.textContent = '−' + mmss(Math.max(0, (total - at) / rate));
    estEl.textContent = total > 0 ? 'משך משוער במהירות ' + rateLabel(rate) + ': ' + mmss(total / rate) : '';
  }
  function applyRate(r) {
    audio.playbackRate = r;
    rateInput.value = String(r);
    rateVal.textContent = rateLabel(r);
    rememberRate(r);
    paint();
  }

  playBtn.addEventListener('click', function () {
    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
  });
  audio.addEventListener('play', function () {
    playBtn.innerHTML = PAUSE_ICON; playBtn.setAttribute('aria-label', 'השהייה');
  });
  audio.addEventListener('pause', function () {
    playBtn.innerHTML = PLAY_ICON; playBtn.setAttribute('aria-label', 'הפעלה');
  });
  audio.addEventListener('ended', function () { audio.currentTime = 0; paint(); });
  audio.addEventListener('timeupdate', paint);
  audio.addEventListener('loadedmetadata', paint);
  audio.addEventListener('ratechange', paint);

  bar.addEventListener('input', function () {
    seeking = true;
    var total = duration(), rate = audio.playbackRate || 1;
    if (total > 0) {
      var at = (Number(bar.value) / 1000) * total;
      elapsedEl.textContent = mmss(at / rate);
      leftEl.textContent = '−' + mmss(Math.max(0, (total - at) / rate));
    }
  });
  bar.addEventListener('change', function () {
    var total = duration();
    if (total > 0) audio.currentTime = (Number(bar.value) / 1000) * total;
    seeking = false;
    paint();
  });
  rateInput.addEventListener('input', function () { applyRate(Number(rateInput.value)); });

  function slugFromUrl(url) {
    var m = String(url || '').match(/\/post\/([^/?#]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function load(slug) {
    if (!slug || slug === loadedSlug) return;
    loadedSlug = slug;
    fetch(API + '?slug=' + encodeURIComponent(slug), { credentials: 'omit' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (info) {
        if (!info || !info.available || !info.src) { reportHeight(); return; }
        declaredDuration = Number(info.durationSec) || 0;
        audio.src = info.src;
        dl.href = info.download || info.src;
        dl.setAttribute('download', slug + '.mp3');
        applyRate(storedRate());
        wrap.classList.remove('hidden');
        reportHeight();
      })
      .catch(function () { reportHeight(); });
  }

  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (d && typeof d === 'object' && d.noamAudioSlug) load(String(d.noamAudioSlug));
  });

  var qs = new URLSearchParams(window.location.search);
  load(qs.get('slug') || slugFromUrl(document.referrer));
  reportHeight();
})();
</script>
</body>
</html>
