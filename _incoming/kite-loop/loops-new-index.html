<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לולאות ConceptLoop חדשות (10) · נועם דורון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfaf5;--ink:#22305a;--navy:#22305a;--teal:#2a7c7a;--teal-dark:#1e605e;
  --coral:#e5735c;--coral-dark:#a84434;--orange:#ea580c;--gold:#e6a534;--violet:#7c3aed;
  --green:#2e9d57;--grid-soft:rgba(34,48,90,.065);--shadow-soft:4px 4px 0 rgba(34,48,90,.08);
}
*{box-sizing:border-box}
body{margin:0;padding:0;position:relative;font-family:Assistant,Heebo,Arial,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);-webkit-font-smoothing:antialiased;background-color:var(--paper);background-image:linear-gradient(var(--grid-soft) 1px,transparent 1px),linear-gradient(90deg,var(--grid-soft) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed;min-height:100vh;overflow-x:clip}
.site-head{max-width:1240px;margin:0 auto;padding:42px 20px 6px;text-align:center}
.site-head h1{font-family:'Secular One',Assistant,Arial,sans-serif;font-size:2rem;margin:0 0 6px;color:var(--navy)}
.site-head p{margin:0;color:var(--navy);opacity:.85}
.head-note{max-width:1240px;margin:14px auto 0;padding:10px 16px;background:#fdf1d8;border:1.5px solid rgba(34,48,90,.12);border-radius:12px;font-weight:700;text-align:center}
.loops-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:24px;max-width:1240px;margin:26px auto 0;padding:0 20px 70px}
figure.old-loop{margin:0}
.old-loop figcaption{margin-top:8px;text-align:center;font-weight:700;color:var(--navy)}
.old-loop figcaption code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;background:#eef1f6;border:1px solid rgba(34,48,90,.12);border-radius:6px;padding:2px 8px;margin-inline-end:6px;color:#4a5478;direction:ltr;unicode-bidi:isolate}
.concept-loop{position:relative;z-index:1;width:100%}
.concept-loop__card{position:relative;background:#fff;border:1.5px solid rgba(26,43,74,.1);border-radius:16px;box-shadow:var(--shadow-soft);padding:14px 14px 8px}
.concept-loop__svg{display:block;width:100%;height:auto}
.concept-loop__toggle{position:absolute;top:10px;inset-inline-start:10px;z-index:2;width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--navy);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:2px 2px 0 rgba(34,48,90,.08)}
.concept-loop__toggle svg{width:12px;height:12px;fill:var(--navy)}
.concept-loop__toggle .ic-play{display:none}
.concept-loop__toggle.is-paused .ic-pause{display:none}
.concept-loop__toggle.is-paused .ic-play{display:block}
.concept-loop__toggle[aria-disabled="true"]{opacity:.35;cursor:default}
.cl-steps{display:flex;align-items:center;gap:7px;justify-content:center;margin:8px 2px 0}
.cl-steps__btn{width:27px;height:27px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;cursor:pointer;font-size:16px;line-height:1;color:var(--navy);display:grid;place-items:center;padding:0}
.cl-steps__btn:hover{background:#f3f4f6}
.cl-steps__dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;cursor:pointer;padding:0}
.cl-steps__dot.on{background:var(--teal);border-color:var(--teal)}
.concept-loop__formula{margin:10px 4px 0;min-height:1.5em;text-align:center;font-size:1.12rem;font-weight:700;color:var(--navy);direction:rtl}
.concept-loop__formula [data-fx]{display:inline-block;margin:0 2px}
.concept-loop__formula .check{color:var(--green)}
.concept-loop__caption{margin:2px 4px 6px;min-height:1.4em;text-align:center;font-weight:700;color:var(--navy)}
.concept-loop [data-fx]{opacity:0}
.concept-loop .cl-line{stroke:var(--navy);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.concept-loop .cl-line-thin{stroke:var(--navy);stroke-width:1.5;fill:none}
.concept-loop .cl-dash{stroke:var(--navy);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.concept-loop .cl-dash-strong{stroke:var(--navy);stroke-width:2;stroke-dasharray:6 5;fill:none}
.concept-loop [pathLength="1"]{stroke-dasharray:1}
.concept-loop .cl-frame{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}
.concept-loop .cl-rail{stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:7 6;fill:none}
.concept-loop .cl-big{font-size:20px;font-weight:800;fill:var(--navy)}
.concept-loop .cl-fill-t{fill:#2a7c7a22}
.concept-loop .cl-stroke-a{stroke:var(--teal);stroke-width:2.5;fill:none;stroke-linecap:round}
.concept-loop .cl-stroke-b{stroke:var(--violet);stroke-width:2.5;fill:none;stroke-linecap:round}
.concept-loop .cl-stroke-c{stroke:var(--orange);stroke-width:2.5;fill:none;stroke-linecap:round}
.concept-loop .cl-t{font-family:Assistant,Arial,sans-serif;font-size:17px;font-weight:600;fill:var(--navy)}
.concept-loop .cl-t-s{font-family:Assistant,Arial,sans-serif;font-size:15.5px;font-weight:600;fill:var(--navy)}
.concept-loop .cl-num{direction:ltr;unicode-bidi:isolate}
.concept-loop .cl-chip{fill:#fff;stroke:var(--navy);stroke-width:1.5}
.concept-loop .cl-ltr{direction:ltr;unicode-bidi:isolate}
.site-foot{max-width:1240px;margin:0 auto;padding:0 20px 46px;text-align:center;color:#5a6588;font-size:.9rem}
</style>
</head>
<body>
<header class="site-head">
  <h1>לולאות ConceptLoop חדשות</h1>
  <p>10 סרטים חדשים לכיתות ז׳–ט׳ · אותו סגנון, אותם גוונים · מהדורה מתוקנת v3</p>
</header>
<div class="head-note">תצוגה מקדימה מקומית בלבד — לא מקושרת מהאתר החי. ממתין לאישור נועם.</div>

<main class="loops-grid">

<!-- 1 · roots -->
<figure class="old-loop">
<div class="concept-loop" data-loop="roots">
  <div class="concept-loop__card">
    <button class="concept-loop__toggle" type="button" aria-label="השהיית הנפשה">
      <svg class="ic-pause" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10" rx="1"/><rect x="7.5" y="1" width="3" height="10" rx="1"/></svg>
      <svg class="ic-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2v9.6L10.8 6z"/></svg>
    </button>
    <svg class="concept-loop__svg" viewBox="0 0 480 300" role="img" aria-label="הדגמה: ריבוע אחד שצלעו גדלה 2, 3, 4 ו־5. בכל שלב נספרות המשבצות: 4, 9, 16, 25. אורך הצלע הוא השורש הריבועי של השטח. אם השטח 20, הצלע היא בין 4 ל־5, כי 16 קטן מ־20 קטן מ־25.">
      <text class="cl-big" x="240" y="40" text-anchor="middle">מה אורך צלע הריבוע?</text>
      <g data-el="cells"></g>
      <rect data-el="b2" x="344" y="194" width="56" height="56" fill="none" class="cl-line" pathLength="1"/>
      <rect data-el="b3" x="316" y="166" width="84" height="84" fill="none" class="cl-line" pathLength="1"/>
      <rect data-el="b4" x="288" y="138" width="112" height="112" fill="none" class="cl-line" pathLength="1"/>
      <rect data-el="b5" x="260" y="110" width="140" height="140" fill="none" class="cl-line" pathLength="1"/>
      <text data-el="a2" class="cl-big cl-num" x="372" y="228" text-anchor="middle">4</text>
      <text data-el="a3" class="cl-big cl-num" x="358" y="214" text-anchor="middle">9</text>
      <text data-el="a4" class="cl-big cl-num" x="344" y="200" text-anchor="middle">16</text>
      <text data-el="a5" class="cl-big cl-num" x="330" y="186" text-anchor="middle">25</text>
      <g data-el="c2"><rect class="cl-chip" x="36" y="64" width="92" height="26" rx="9"/><text class="cl-t-s cl-num" x="82" y="82" text-anchor="middle" style="font-weight:800">√4 = 2</text></g>
      <g data-el="c3"><rect class="cl-chip" x="140" y="64" width="92" height="26" rx="9"/><text class="cl-t-s cl-num" x="186" y="82" text-anchor="middle" style="font-weight:800">√9 = 3</text></g>
      <g data-el="c4"><rect class="cl-chip" x="36" y="98" width="92" height="26" rx="9"/><text class="cl-t-s cl-num" x="82" y="116" text-anchor="middle" style="font-weight:800">√16 = 4</text></g>
      <g data-el="c5"><rect class="cl-chip" x="140" y="98" width="92" height="26" rx="9"/><text class="cl-t-s cl-num" x="186" y="116" text-anchor="middle" style="font-weight:800">√25 = 5</text></g>
      <line data-el="brk" x1="260" y1="250" x2="400" y2="250" stroke="var(--teal)" stroke-width="6" stroke-linecap="round" pathLength="1"/>
      <g data-el="slabel"><rect class="cl-chip" x="288" y="262" width="84" height="26" rx="9"/><text class="cl-t-s" x="330" y="280" text-anchor="middle" style="font-weight:800">צלע = <tspan class="cl-num">5</tspan></text></g>
      <g data-el="msg"><rect x="76" y="140" width="150" height="28" rx="10" fill="#2a7c7a1f" stroke="var(--teal)" stroke-width="1.5"/><text class="cl-t-s" x="151" y="159" text-anchor="middle" style="font-weight:800;fill:var(--teal-dark)">הצלע = השורש!</text></g>
      <path data-el="arrow" d="M228 166 C 252 190, 260 220, 262 246" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round" pathLength="1"/>
      <path data-el="arrowhead" d="M262 246 l -8 -4 M262 246 l -8 4" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round"/>
      <g data-el="rq"><rect class="cl-chip" x="66" y="140" width="172" height="28" rx="10"/><text class="cl-t-s" x="152" y="159" text-anchor="middle" style="font-weight:800">שטח 20 — בין אילו צלעות?</text></g>
      <g data-el="ans"><rect x="86" y="178" width="132" height="26" rx="9" fill="#2e9d5722" stroke="var(--green)" stroke-width="1.5"/><text class="cl-t-s" x="152" y="196" text-anchor="middle" style="font-weight:800;fill:var(--green)">בין 4 ל־5</text></g>
      <text data-el="why" class="cl-t-s cl-num" x="152" y="226" text-anchor="middle">16 &lt; 20 &lt; 25</text>
      <rect data-el="pb4" x="288" y="138" width="112" height="112" fill="none" stroke="var(--gold)" stroke-width="3.5"/>
      <rect data-el="pb5" x="260" y="110" width="140" height="140" fill="none" stroke="var(--gold)" stroke-width="3.5"/>
    </svg>
    <p class="concept-loop__formula"><span data-fx class="cl-num">√4=2 · √9=3 · √16=4 · √25=5</span> <span data-fx>הצלע = השורש</span> <span data-el="check" class="check">✓</span></p>
    <p class="concept-loop__caption" data-el="caption">השורש הריבועי של השטח = אורך צלע הריבוע</p>
  </div>
</div>
<figcaption><code>roots</code>ז׳–ט׳ · שורש ריבועי = צלע הריבוע</figcaption>
</figure>

<!-- 2 · ineq-flip -->
<figure class="old-loop">
<div class="concept-loop" data-loop="ineq-flip">
  <div class="concept-loop__card">
    <button class="concept-loop__toggle" type="button" aria-label="השהיית הנפשה">
      <svg class="ic-pause" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10" rx="1"/><rect x="7.5" y="1" width="3" height="10" rx="1"/></svg>
      <svg class="ic-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2v9.6L10.8 6z"/></svg>
    </button>
    <svg class="concept-loop__svg" viewBox="0 0 480 300" role="img" aria-label="הדגמה בשני חלקים. חלק ראשון: על ישר המספרים מסומנים 2 ו־6, ו־2 קטן מ־6. כופלים שניהם במינוס 1 — הנקודות מתהפכות במראה סביב 0 למינוס 2 ומינוס 6, והסדר מתהפך: מינוס 2 גדול ממינוס 6. חלק שני: פותרים מינוס 2x קטן מ־6. מחלקים את שני האגפים במינוס 2 — והסימן מתהפך לגדול מ. הפתרון: x גדול ממינוס 3. בדיקה: x שווה 0 מקיים 0 קטן מ־6.">
      <text class="cl-big" x="240" y="40" text-anchor="middle">למה הסימן מתהפך?</text>
      <g data-el="axis">
        <line class="cl-line" x1="40" y1="200" x2="440" y2="200" pathLength="1"/>
        <path class="cl-line" d="M440 200 l -9 -4 M440 200 l -9 4" pathLength="1"/>
        <g class="cl-t-s cl-num" text-anchor="middle">
          <text x="90" y="222">−6</text><text x="140" y="222">−4</text><text x="190" y="222">−2</text><text x="240" y="222">0</text><text x="290" y="222">2</text><text x="340" y="222">4</text><text x="390" y="222">6</text>
        </g>
        <g class="cl-line-thin">
          <line x1="90" y1="195" x2="90" y2="205"/><line x1="140" y1="195" x2="140" y2="205"/><line x1="190" y1="195" x2="190" y2="205"/><line x1="240" y1="195" x2="240" y2="205"/><line x1="290" y1="195" x2="290" y2="205"/><line x1="340" y1="195" x2="340" y2="205"/><line x1="390" y1="195" x2="390" y2="205"/>
        </g>
      </g>
      <g data-el="mg2"><circle cx="290" cy="200" r="5.5" fill="var(--teal)" stroke="#fff" stroke-width="1.5"/><text data-el="lb2" class="cl-t-s cl-num" x="290" y="176" text-anchor="middle" style="font-weight:800">2</text></g>
      <g data-el="mg6"><circle cx="390" cy="200" r="5.5" fill="var(--orange)" stroke="#fff" stroke-width="1.5"/><text data-el="lb6" class="cl-t-s cl-num" x="390" y="176" text-anchor="middle" style="font-weight:800">6</text></g>
      <g data-el="chipA"><rect x="300" y="128" width="80" height="26" rx="9" class="cl-chip"/><text class="cl-t-s cl-num" x="340" y="146" text-anchor="middle" style="font-weight:800">2 &lt; 6</text></g>
      <g data-el="badge"><rect x="300" y="88" width="80" height="26" rx="9" fill="var(--gold)" opacity=".25"/><text class="cl-t-s cl-num" x="340" y="106" text-anchor="middle" style="font-weight:800">× (−1)</text><text class="cl-t-s" x="340" y="76" text-anchor="middle">כופלים את שניהם במינוס</text></g>
      <g data-el="chipB"><rect x="100" y="128" width="98" height="26" rx="9" fill="#2e9d5722" stroke="var(--green)" stroke-width="1.5"/><text class="cl-t-s cl-num" x="149" y="146" text-anchor="middle" style="font-weight:800;fill:var(--green)">−2 &gt; −6</text></g>
      <text data-el="exprL" class="cl-big cl-num" x="214" y="92" text-anchor="end" style="font-size:26px">−2x</text>
      <text data-el="fracL" class="cl-big cl-num" x="214" y="92" text-anchor="end" style="font-size:21px">−2x : (−2)</text>
      <text data-el="simpL" class="cl-big cl-num" x="214" y="92" text-anchor="end" style="font-size:26px">x</text>
      <g data-el="flip" transform="translate(250 84)"><text class="cl-big cl-num" x="0" y="0" text-anchor="middle" style="font-size:26px;dominant-baseline:central">&lt;</text></g>
      <text data-el="exprR" class="cl-big cl-num" x="286" y="92" text-anchor="start" style="font-size:26px">6</text>
      <text data-el="fracR" class="cl-big cl-num" x="286" y="92" text-anchor="start" style="font-size:21px">6 : (−2)</text>
      <text data-el="simpR" class="cl-big cl-num" x="286" y="92" text-anchor="start" style="font-size:26px">−3</text>
      <g data-el="div-badge"><rect x="52" y="112" width="110" height="44" rx="9" fill="var(--gold)" opacity=".25"/><text class="cl-t-s" x="107" y="130" text-anchor="middle" style="font-weight:800">חלוקה ב־<tspan class="cl-num">(−2)</tspan></text><text class="cl-t-s" x="107" y="148" text-anchor="middle">בשני האגפים!</text></g>
      <g data-el="res"><rect x="192" y="116" width="96" height="28" rx="10" fill="#2e9d5722" stroke="var(--green)" stroke-width="1.5"/><text class="cl-t-s cl-num" x="240" y="135" text-anchor="middle" style="font-weight:800;fill:var(--green);font-size:17px">x &gt; −3</text></g>
      <g data-el="wrong">
        <rect x="90" y="194" width="100" height="12" fill="var(--coral)" opacity=".3"/>
        <path d="M90 200 l 10 -5 M90 200 l 10 5" stroke="var(--coral)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <text class="cl-t-s" x="140" y="184" text-anchor="middle" style="fill:var(--coral-dark)">שמאלה?</text>
      </g>
      <g data-el="right">
        <rect x="169" y="194" width="261" height="12" fill="var(--teal)" opacity=".28"/>
        <path d="M430 200 l -10 -5 M430 200 l -10 5" stroke="var(--teal)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <text class="cl-t-s" x="300" y="184" text-anchor="middle" style="fill:var(--teal-dark);font-weight:800">מימינה! ✓</text>
      </g>
      <circle data-el="dot" cx="165" cy="200" r="5.5" fill="#fff" stroke="var(--navy)" stroke-width="2.5"/>
      <text data-el="dot-lbl" class="cl-t-s cl-num" x="165" y="244" text-anchor="middle" style="font-weight:800">−3</text>
      <g data-el="chk"><rect class="cl-chip" x="300" y="240" width="150" height="26" rx="9"/><text class="cl-t-s" x="375" y="258" text-anchor="middle">בדיקה: <tspan class="cl-num" style="font-weight:800">x=0: 0 &lt; 6 ✓</tspan></text></g>
    </svg>
    <p class="concept-loop__formula"><span data-fx class="cl-num">−2x &lt; 6</span> <span data-fx>חלוקה בשלילי הופכת את הסימן</span> <span data-fx class="cl-num" style="color:var(--green)">x &gt; −3</span> <span data-el="check" class="check">✓</span></p>
    <p class="concept-loop__caption" data-el="caption">כפל ב־מינוס ממראה את ישר המספרים — והסדר מתהפך</p>
  </div>
</div>
<figcaption><code>ineq-flip</code>ח׳ · אי־שוויונות — היפוך הסימן</figcaption>
</figure>

<!-- 3 · pow-pair -->
<figure class="old-loop">
<div class="concept-loop" data-loop="pow-pair">
  <div class="concept-loop__card">
    <button class="concept-loop__toggle" type="button" aria-label="השהיית הנפשה">
      <svg class="ic-pause" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10" rx="1"/><rect x="7.5" y="1" width="3" height="10" rx="1"/></svg>
      <svg class="ic-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2v9.6L10.8 6z"/></svg>
    </button>
    <svg class="concept-loop__svg" viewBox="0 0 480 300" role="img" aria-label="הדגמה: הביטוי א בחזקת 2 שווה לא בחזקת 2 כפול ב בחזקת 2. מראים קודם חיזוי מספרי: 2 כפול 3 בחזקת 2 שווה 36. אחר כך פותחים לארבעה גורמים, מחליפים בחוק החילוף כך שכל גורם נפגש עם עצמו, ומקבלים א בחזקת 2 כפול ב בחזקת 2. מאמתים: 2 בחזקת 2 כפול 3 בחזקת 2 שווה 4 כפול 9 שווה 36.">
      <text class="cl-big" x="240" y="40" text-anchor="middle">כמה שווה <tspan class="cl-num">(a · b)²</tspan>?</text>
      <text data-el="open1" class="cl-big cl-num" x="240" y="86" text-anchor="middle" style="font-size:29px">(a · b)²</text>
      <text data-el="open2" class="cl-big cl-num" x="220" y="86" text-anchor="middle" style="font-size:26px">(a · b) · (a · b)</text>

/* ===== engine ===== */
var REDUCED=false;
try{REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
var loops=[];
document.querySelectorAll("[data-loop]").forEach(function(box){
  var name=box.getAttribute("data-loop"),def=DEFS[name];
  if(!def){(window.__errs=window.__errs||[]).push("no def: "+name);return}
  var svg=box.querySelector("svg.concept-loop__svg");
  if(def.init){try{def.init(svg)}catch(err){(window.__errs=window.__errs||[]).push("init "+name+": "+err.message)}}
  var btn=box.querySelector(".concept-loop__toggle");
  var stepsArr=def.beats.map(function(b){return [b.t1+.05,b.label]});
  var fxCount=box.querySelectorAll(".concept-loop__formula [data-fx]").length;
  var fxStart0=def.fx!=null?def.fx:12;
  var fxEnd0=fxStart0+Math.max(0,fxCount-1)*.34+.34;
  var contentEnd0=Math.max(def.chk!=null?def.chk+.4:0,def.cap!=null?def.cap+.4:0,fxEnd0);
  def.outStart=contentEnd0+2.3;
  def.effD=def.outStart+.9;
  var rec={box:box,svg:svg,def:def,btn:btn,paused:false,hidden:false,staticMode:REDUCED,n:0,last:performance.now(),holdUntil:0,fxs:Array.prototype.slice.call(box.querySelectorAll(".concept-loop__formula [data-fx]")),dots:[]};
  function renderRec(){
    CUR=rec.box;
    var n=rec.n;
    var outStart=def.outStart;
    var out=1-s(n,outStart,outStart+.7);
    var B={};
    def.beats.forEach(function(b){B[b.id]=Math.min(1,Math.max(0,(n-b.t0)/(b.t1-b.t0)))});
    try{def.render(n,B)}catch(err){(window.__errs=window.__errs||[]).push(name+": "+err.message)}
    if(svg)svg.style.opacity=String(rnd(out));
    rec.fxs.forEach(function(el,i){
      var p=s(n,fxStart0+i*.34,fxStart0+.34+i*.34)*out;
      el.style.opacity=String(rnd(p));
      el.style.transform="translateY("+rnd((1-p)*5)+"px)";
    });
    var chk=box.querySelector('[data-el="check"]');
    if(chk){var cp=s(n,def.chk,def.chk+.4)*out;chk.style.opacity=String(rnd(cp));chk.style.transform="translateY("+rnd((1-cp)*5)+"px)"}
    var cap=box.querySelector('[data-el="caption"]');
    if(cap)cap.style.opacity=String(rnd(s(n,def.cap,def.cap+.4)*out));
    CUR=null;
  }
  rec.renderRec=renderRec;
  /* stepper UI */
  var stepsRow=document.createElement("div");
  stepsRow.className="cl-steps";
  function mkBtn(sym,label,dir){
    var b=document.createElement("button");
    b.type="button";b.className="cl-steps__btn";b.textContent=sym;b.setAttribute("aria-label",label);
    b.addEventListener("click",function(){seek(dir)});
    return b;
  }
  function seek(dir){
    var ts=stepsArr.map(function(st){return st[0]});
    var target=rec.n,i;
    if(dir>0){for(i=0;i<ts.length;i++){if(ts[i]>rec.n+.01){target=ts[i];break}}}
    else{for(i=ts.length-1;i>=0;i--){if(ts[i]<rec.n-.01){target=ts[i];break}}}
    rec.n=target;
    rec.paused=true;
    if(rec.btn){rec.btn.classList.add("is-paused");rec.btn.setAttribute("aria-label","הפעלת הנפשה")}
    rec.last=performance.now();
    renderRec();syncDots();
  }
  function syncDots(){
    var ts=stepsArr.map(function(st){return st[0]});
    var cur=0;
    for(var i2=0;i2<ts.length;i2++){if(rec.n>=ts[i2]-.01)cur=i2}
    rec.dots.forEach(function(d,i3){d.classList.toggle("on",i3===cur)});
  }
  var prev=mkBtn("›","שלב קודם",-1);
  var next=mkBtn("‹","שלב הבא",1);
  stepsRow.appendChild(prev);
  stepsArr.forEach(function(st){
    var d=document.createElement("button");
    d.type="button";d.className="cl-steps__dot";d.title=st[1];d.setAttribute("aria-label","שלב: "+st[1]);
    d.addEventListener("click",function(){
      rec.n=st[0];
      rec.paused=true;
      if(rec.btn){rec.btn.classList.add("is-paused");rec.btn.setAttribute("aria-label","הפעלת הנפשה")}
      rec.last=performance.now();
      renderRec();syncDots();
    });
    stepsRow.appendChild(d);rec.dots.push(d);
  });
  stepsRow.appendChild(next);
  var formula=box.querySelector(".concept-loop__formula");
  formula.parentNode.insertBefore(stepsRow,formula);
  rec.syncDots=syncDots;
  if(btn)btn.addEventListener("click",function(){
    if(rec.staticMode)return;
    rec.paused=!rec.paused;
    btn.classList.toggle("is-paused",rec.paused);
    btn.setAttribute("aria-label",rec.paused?"הפעלת הנפשה":"השהיית הנפשה");
    if(!rec.paused){rec.last=performance.now()}
  });
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(en){rec.hidden=!en[0].isIntersecting},{threshold:.15}).observe(box);
  }
  if(rec.staticMode){
    rec.n=stepsArr[stepsArr.length-1][0]+.6;
    renderRec();syncDots();
    if(btn){btn.setAttribute("aria-disabled","true");btn.setAttribute("tabindex","-1")}
  }
  loops.push(rec);
});
window.__clSeek=function(name,nn){
  var rec=loops.filter(function(L){return L.box.getAttribute("data-loop")===name})[0];
  if(!rec)return null;
  rec.n=nn;rec.holdUntil=0;rec.paused=false;rec.last=performance.now();
  rec.renderRec();rec.syncDots();
  return true;
};
window.__clInfo=function(name){
  var rec=loops.filter(function(L){return L.box.getAttribute("data-loop")===name})[0];
  if(!rec)return null;
  var steps=rec.def.beats.map(function(b){return [b.t1+.05,b.label]});
  return {steps:steps,effD:rec.def.effD,outStart:rec.def.outStart,fx:rec.def.fx,chk:rec.def.chk,cap:rec.def.cap};
};
function tick(now){
  for(var i=0;i<loops.length;i++){
    var L=loops[i];
    var dt=Math.min((now-L.last)/1000,.1);
    L.last=now;
    if(L.paused||L.hidden||L.staticMode)continue;
    if(now<L.holdUntil)continue;
    var target=L.n+dt*RATE,D=L.def.effD;
    var sts=L.def.beats.map(function(b){return b.t1+.05});
    for(var j=0;j<sts.length;j++){
      if(L.n<sts[j]-1e-6&&target>=sts[j]){target=sts[j];L.holdUntil=now+HOLD_MS;break}
    }
    L.n=target%D;
    L.renderRec();L.syncDots();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
/* תמיכת צילום אוטומטי: ?seek=NAME:N&scroll=Y — קופץ למצב ועוצר */
try{
  var qs=new URLSearchParams(location.search);
  if(qs.get("seek")){
    var parts=qs.get("seek").split(":");
    var sName=parts[0], sN=parseFloat(parts[1]);
    window.addEventListener("load",function(){
      window.__clSeek(sName,sN);
      var rec=loops.filter(function(L){return L.box.getAttribute("data-loop")===sName})[0];
      if(rec){rec.paused=true;if(rec.btn){rec.btn.classList.add("is-paused");rec.btn.setAttribute("aria-label","הפעלת הנפשה")}}
      var sc=parseFloat(qs.get("scroll")||"0");
      if(sc)window.scrollTo(0,sc);
    });
  }
}catch(e){}
})();
