<script>/* Standalone port of the helpers + engine in src/lib/conceptLoops.ts (same easing, same clock rules). */
(function(){
function cubicBezier(x1,y1,x2,y2){var cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
 var sx=function(t){return((ax*t+bx)*t+cx)*t},sy=function(t){return((ay*t+by)*t+cy)*t},sd=function(t){return(3*ax*t+2*bx)*t+cx};
 return function(x){if(x<=0)return 0;if(x>=1)return 1;var t=x;for(var i=0;i<8;i++){var e=sx(t)-x;if(Math.abs(e)<1e-6)break;var d=sd(t);if(Math.abs(d)<1e-6)break;t=Math.min(1,Math.max(0,t-e/d));}return sy(t);};}
var EASE=cubicBezier(.16,1,.3,1);
var H={
 EASE:EASE,
 ph:function(t,a,b){return EASE(Math.min(1,Math.max(0,(t-a)/(b-a))));},
 lerp:function(a,b,p){return a+(b-a)*p;},
 r2:function(n){return Math.round(n*100)/100;},
 q:function(root,name){return root.querySelector('[data-el="'+name+'"]');},
 qa:function(root,sel){return Array.prototype.slice.call(root.querySelectorAll(sel));},
 op:function(el,v){if(el)el.style.opacity=String(Math.round(Math.min(1,Math.max(0,v))*100)/100);},
 draw:function(el,p){if(el)el.style.strokeDashoffset=String(Math.round((1-Math.min(1,Math.max(0,p)))*100)/100);},
 move:function(el,x,y,rot){if(el)el.setAttribute('transform','translate('+Math.round(x*100)/100+' '+Math.round(y*100)/100+') rotate('+Math.round((rot||0)*100)/100+')');},
 shift:function(el,dx,dy){if(el)el.setAttribute('transform','translate('+Math.round(dx*100)/100+' '+Math.round(dy*100)/100+')');}
};
window.LoopHelpers=H;
var MAX_LAPS=4;
function motionOff(){var c=document.documentElement.classList;return c.contains('noam-a11y-motion')||c.contains('nd-motion-off');}
window.mountFilm=function(root,film){
 var svg=root.querySelector('.concept-loop__svg');
 svg.innerHTML=film.svgMarkup; svg.setAttribute('viewBox',film.viewBox||'0 0 560 340'); svg.setAttribute('aria-label',film.ariaLabel);
 var top=root.querySelector('.concept-loop__top'); top.textContent=film.top.text; if(film.top.ltr)top.setAttribute('dir','ltr');
 root.querySelector('.concept-loop__formula-slot').innerHTML=film.formulaHTML;
 var toggle=root.querySelector('[data-el="toggle"]');
 var t=0,lap=1,playing=false,done=false,inView=false,isStatic=false,raf=0,last=0;
 var draw=function(){film.render(root,t);};
 function tick(now){if(!playing)return;var dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;t+=dt;
  if(t>=film.duration){t-=film.duration;lap++;}
  if(lap>=MAX_LAPS&&t>=film.hold){t=film.hold;draw();playing=false;done=true;return;}
  draw();raf=requestAnimationFrame(tick);}
 function play(){if(playing||isStatic)return;playing=true;last=performance.now();raf=requestAnimationFrame(tick);}
 function pause(){playing=false;if(raf)cancelAnimationFrame(raf);raf=0;}
 function applyPrefs(){if(motionOff()){isStatic=true;pause();t=film.hold;draw();if(toggle)toggle.style.display='none';}}
 if('IntersectionObserver'in window){new IntersectionObserver(function(e){inView=e[0].isIntersecting;if(isStatic)return;if(inView&&!done)play();else if(!inView&&playing)pause();},{threshold:.35}).observe(root);}
 root.querySelector('.concept-loop__card').addEventListener('click',function(){if(isStatic)return;if(done){done=false;lap=1;t=0;play();}else if(playing)pause();else play();});
 applyPrefs();draw();
 root.__loop={seek:function(tt){t=Math.min(Math.max(tt,0),film.duration);draw();},pause:pause,play:play,state:function(){return{t:t,playing:playing,laps:lap,done:done,static:isStatic};}};
};
})();
</script>

    <rect data-el="hB2" x="180" y="240" width="100" height="44" rx="3" fill="rgba(124,58,237,.35)" style="opacity:0"/>

    <rect data-el="hB4" x="380" y="240" width="100" height="44" rx="3" fill="rgba(124,58,237,.35)" style="opacity:0"/>
    <text class="cl-t cl-num" data-el="cB1" x="130" y="226" text-anchor="middle" style="font-size:34px;opacity:0">1</text>
    <text class="cl-t cl-num" data-el="cB2" x="230" y="226" text-anchor="middle" style="font-size:34px;opacity:0">2</text>
    <text class="cl-t cl-num" data-el="cB3" x="330" y="226" text-anchor="middle" style="font-size:34px;opacity:0">3</text>
    <text class="cl-t cl-num" data-el="cB4" x="430" y="226" text-anchor="middle" style="font-size:34px;opacity:0">4</text>
    <text class="cl-t cl-num" data-el="lB2" x="38" y="272" text-anchor="middle" style="font-size:36px;opacity:0">2</text>
    <g data-el="fB12" style="opacity:0">
      <text class="cl-t cl-num" x="520" y="252" text-anchor="middle" style="font-size:30px">1</text>
      <line class="cl-line-thin" x1="506" y1="258" x2="534" y2="258"/>
      <text class="cl-t cl-num" x="520" y="278" text-anchor="middle" style="font-size:30px">2</text>
    </g>
    <text class="cl-t cl-num" data-el="rB" x="280" y="340" text-anchor="middle" style="font-size:48px;opacity:0">= 4</text>
  `,
  formulaHTML: `<p class="concept-loop__formula cl-num" dir="ltr"><span data-fx="0"><span class="cl-frac"><span class="cl-frac__n">3</span><span class="cl-frac__d">4</span></span>&thinsp;:&thinsp;<span class="cl-frac"><span class="cl-frac__n">1</span><span class="cl-frac__d">4</span></span>&thinsp;=&thinsp;<span class="cl-ok">3</span></span><span data-fx="1">&ensp;2&thinsp;:&thinsp;<span class="cl-frac"><span class="cl-frac__n">1</span><span class="cl-frac__d">2</span></span>&thinsp;=&thinsp;<span class="cl-ok">4</span></span><span data-fx="2" class="cl-check" aria-hidden="true">✓</span></p>`,
  render(root, t) {
    const { ph, op, q, qa } = LoopHelpers;

    // Global fade for clean loop seam — everything hidden at t=0 and t=15
    const fadeIn = ph(t, 0, 0.3);
    const fadeOut = 1 - ph(t, 13.5, 14.5);
    const fade = fadeIn * fadeOut;

    // ── Example A: 3/4 : 1/4 = 3 ──────────────────────
    // Unit length = 200 (whole bar). Quarters = 50 each.
    const aVis = ph(t, 0.2, 0.8) * (1 - ph(t, 6.5, 7.5)) * fade;

    op(q(root, 'barA'), aVis);
    op(q(root, 'tA1'), aVis * 0.5);
    op(q(root, 'tA2'), aVis * 0.5);
    op(q(root, 'tA3'), aVis * 0.5);

    op(q(root, 'fA34'), ph(t, 0.3, 0.8) * aVis);
    op(q(root, 'fA14'), ph(t, 0.6, 1.1) * aVis);

    // All three quarters shaded together to represent 3/4
    const qAvis = ph(t, 1.0, 1.5) * aVis;
    op(q(root, 'qA1'), qAvis);
    op(q(root, 'qA2'), qAvis);
    op(q(root, 'qA3'), qAvis);

    // Counting numbers appear one by one
    op(q(root, 'cA1'), ph(t, 1.8, 2.2) * aVis);
    op(q(root, 'cA2'), ph(t, 2.5, 2.9) * aVis);
    op(q(root, 'cA3'), ph(t, 3.2, 3.6) * aVis);

    // Result "= 3" in green via inline style (CSS trap A fix)
    const rAEl = q(root, 'rA');
    if (rAEl) {
      const rAp = ph(t, 3.9, 4.4) * aVis;
      op(rAEl, rAp);
      rAEl.style.fill = rAp > 0.01 ? '#2e9d57' : '';
    }

    // ── Example B: 2 : 1/2 = 4 ────────────────────────
    // Same unit length = 200 per whole. Two wholes = 400 total. Halves = 100 each.
    const bIn = ph(t, 6.5, 7.5);
    const bVis = bIn * fade;

    op(q(root, 'barB1'), bVis);
    op(q(root, 'barB2'), bVis);
    op(q(root, 'tB1'), bVis * 0.5);
    op(q(root, 'tB2'), bVis * 0.5);
    op(q(root, 'tB3'), bVis * 0.5);

    op(q(root, 'lB2'), ph(t, 7.2, 7.7) * bVis);
    op(q(root, 'fB12'), ph(t, 7.5, 8.0) * bVis);

    // Halves fill one by one with counting numbers
    op(q(root, 'hB1'), ph(t, 8.2, 8.6) * bVis);
    op(q(root, 'cB1'), ph(t, 8.4, 8.8) * bVis);

    op(q(root, 'hB2'), ph(t, 8.9, 9.3) * bVis);
    op(q(root, 'cB2'), ph(t, 9.1, 9.5) * bVis);

    op(q(root, 'hB3'), ph(t, 9.6, 10.0) * bVis);
    op(q(root, 'cB3'), ph(t, 9.8, 10.2) * bVis);

    op(q(root, 'hB4'), ph(t, 10.3, 10.7) * bVis);
    op(q(root, 'cB4'), ph(t, 10.5, 10.9) * bVis);

    // Result "= 4" in green via inline style (CSS trap A fix)
    const rBEl = q(root, 'rB');
    if (rBEl) {
      const rBp = ph(t, 11.1, 11.6) * bVis;
      op(rBEl, rBp);
      rBEl.style.fill = rBp > 0.01 ? '#2e9d57' : '';
    }

    // ── Formula row ───────────────────────────────────
    const fxs = qa(root, '[data-fx]');
    if (fxs[0]) op(fxs[0], ph(t, 4.4, 4.9) * fade);
    if (fxs[1]) op(fxs[1], ph(t, 11.6, 12.1) * fade);
    if (fxs[2]) op(fxs[2], ph(t, 12.3, 12.7) * fade);
  }
};
