<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>דף עבודה · מתמטיקה · נועם דורון</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://amiramnoam.wixstudio.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">

<!-- KaTeX: pinned production math renderer -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/contrib/auto-render.min.js"></script>

<style>
:root{
  --ink:#14213D;
  --accent:#7B2FD1;
  --accent-dark:#551F92;
  --tint:#EBDDFB;
  --paper:#E3DFD2;
  --grid:#BFBDB2;
  --muted:#5E5478;
  --r:18px;
}

[data-grade="7"]{
  --accent:#7B2FD1;
  --accent-dark:#551F92;
  --tint:#EBDDFB;
  --muted:#5E5478;
}

[data-grade="8"]{
  --accent:#D62A8E;
  --accent-dark:#961B62;
  --tint:#FBDCEE;
  --muted:#6E4F62;
}

[data-grade="9"]{
  --accent:#00A08A;
  --accent-dark:#00705F;
  --tint:#CFF3EC;
  --muted:#4A6B64;
}

*,*::before,*::after{
  box-sizing:border-box;
}

html,body{
  height:100%;
  margin:0;
}

body{
  font-family:'Assistant','Heebo',Arial,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;

  background:
    linear-gradient(var(--grid) 2.2px, transparent 2.2px) 0 0/45px 45px,
    linear-gradient(90deg, var(--grid) 2.2px, transparent 2.2px) 0 0/45px 45px,
    var(--paper);

  display:flex;
  flex-direction:column;
}

/* HEADER */

.bar{
  flex:none;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  padding:12px 18px;
  background:#fff;
  border-bottom:3px solid var(--ink);
}

.bar h1{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:18px;
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.bar h1 span.ttl{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chip{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:12px;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:5px 12px;
  background:var(--tint);
}

.chip.lvl-c{
  background:#FFD84D;
}

.bar .spacer{
  margin-inline-start:auto;
}

.btn{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  color:var(--ink);
  background:#fff;
  text-decoration:none;
  white-space:nowrap;
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:8px 16px;
  box-shadow:-3px 3px 0 var(--ink);
}

.btn--go{
  background:var(--accent);
  color:#fff;
}

/* LAYOUT */

.stage{
  flex:1;
  display:flex;
  min-height:0;
}

.pdfwrap{
  flex:1;
  min-width:0;
  padding:14px;
}

.pdfwrap iframe{
  width:100%;
  height:100%;
  border:3px solid var(--ink);
  border-radius:var(--r);
  background:#fff;
  box-shadow:-6px 6px 0 var(--ink);
  display:block;
}

.mobile-open{
  display:none;
}

/* AI PANEL */

.panel{
  flex:none;
  width:380px;
  max-width:42vw;
  padding:14px 14px 14px 0;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.panel.hidden{
  display:none;
}

.panel-in{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  border:3px solid var(--ink);
  border-radius:var(--r);
  box-shadow:-6px 6px 0 var(--ink);
  overflow:hidden;
}

.panel-head{
  flex:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:var(--tint);
  border-bottom:3px solid var(--ink);
}

.panel-head b{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:16px;
}

.panel-head button{
  margin-inline-start:auto;
  border:none;
  background:none;
  cursor:pointer;
  font-size:20px;
  line-height:1;
  color:var(--ink);
  padding:2px 6px;
}

.panel-body{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:14px;
}

.step-title{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  margin:0 0 10px;
}

.opts{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

.qpick{
  display:flex;
  align-items:stretch;
  gap:8px;
  margin-bottom:8px;
}

.qinput{
  flex:1;
  min-width:0;
  font-family:'Heebo',sans-serif;
  font-weight:800;
  font-size:16px;
  color:var(--ink);
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:10px 12px;
  text-align:center;
}

.qinput:focus{
  outline:none;
  box-shadow:-3px 3px 0 var(--accent);
}

.inline-error{
  min-height:20px;
  margin:6px 0 0;
  color:#9A1D2F;
  font-weight:800;
  font-size:13px;
}

.opt{
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  background:#fff;
  color:var(--ink);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:8px 15px;
  box-shadow:-2px 2px 0 var(--ink);
}

.picked{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:var(--tint);
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:9px 12px;
  font-weight:800;
  font-size:14px;
  margin-bottom:14px;
}

.picked button{
  margin-inline-start:auto;
  font-family:inherit;
  font-weight:800;
  font-size:12.5px;
  cursor:pointer;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:999px;
  padding:4px 10px;
}

textarea{
  width:100%;
  min-height:92px;
  resize:vertical;
  font-family:inherit;
  font-size:15px;
  color:var(--ink);
  padding:11px 13px;
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
}

textarea:focus{
  outline:none;
  box-shadow:-3px 3px 0 var(--accent);
}

.send{
  width:100%;
  margin-top:10px;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:#fff;
  background:var(--accent);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:11px;
  box-shadow:-3px 3px 0 var(--ink);
}

.send.qgo{
  flex:none;
  margin-top:0;
  width:auto;
  min-width:92px;
  padding-inline:18px;
}

/* 3 BUTTONS */

.assist-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin:8px 0 4px;
}

.assist-btn{
  width:100%;
  text-align:right;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:var(--ink);
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:14px;
  padding:12px 14px;
  box-shadow:-3px 3px 0 var(--ink);
}

.assist-btn.primary{
  background:var(--tint);
}

.assist-btn.custom{
  background:var(--accent);
  color:#fff;
}

.hint{
  font-size:12.5px;
  font-weight:700;
  color:var(--muted);
  margin:10px 0 0;
}

.note{
  background:var(--tint);
  border:2.5px dashed var(--ink);
  border-radius:12px;
  padding:14px;
  font-weight:700;
  font-size:14px;
  line-height:1.55;
}

.thinking{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:15px;
}

.dots::after{
  content:".";
  animation:dots 1.2s steps(4,end) infinite;
}

@keyframes dots{
  0%{content:"."}
  33%{content:".."}
  66%{content:"..."}
  100%{content:"."}
}

.answer{
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:14px;
  font-size:15px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.qecho{
  font-weight:800;
  font-size:13.5px;
  color:var(--muted);
  margin:0 0 10px;
}

.skel{
  height:38px;
  border-radius:999px;
  background:linear-gradient(90deg,#eee,#f7f7f7,#eee);
  background-size:200% 100%;
  animation:sh 1.2s linear infinite;
  margin-bottom:8px;
}

@keyframes sh{
  to{
    background-position:-200% 0;
  }
}

/* FLOATING AI BUTTON */

.fab{
  position:fixed;
  inset-block-end:22px;
  inset-inline-start:22px;
  z-index:40;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
  color:#fff;
  background:var(--accent);
  border:3px solid var(--ink);
  border-radius:999px;
  padding:13px 22px;
  box-shadow:-5px 5px 0 var(--ink);
}

.fab.hidden{
  display:none;
}

/* MOBILE */

@media (max-width:900px){

  body{
    height:auto;
    min-height:100%;
  }

  .stage{
    flex-direction:column;
  }

  .pdfwrap{
    padding:14px;
  }

  .pdfwrap iframe{
    display:none;
  }

  .mobile-open{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:var(--r);
    box-shadow:-6px 6px 0 var(--ink);
    padding:26px 18px;
  }

  .mobile-open .big{
    font-size:40px;
    line-height:1;
  }

  .panel{
    width:100%;
    max-width:100%;
    padding:0 14px 14px;
  }

  .panel.hidden{
    display:flex;
  }

  .panel-in{
    min-height:340px;
  }

  .panel-head button{
    display:none;
  }

  .fab{
    display:none;
  }
}


/* CHAT */
.chat-shell{
  display:flex;
  flex-direction:column;
  min-height:100%;
}

.chat-log{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-bottom:10px;
}

.chat-row{
  display:flex;
  width:100%;
}

.chat-row.student{
  justify-content:flex-start;
}

.chat-row.tutor{
  justify-content:flex-end;
}

.chat-bubble{
  max-width:88%;
  border:2.5px solid var(--ink);
  border-radius:16px;
  padding:10px 12px;
  font-size:14.5px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  box-shadow:-2px 2px 0 var(--ink);
}

.chat-row.student .chat-bubble{
  background:var(--accent);
  color:#fff;
  border-bottom-right-radius:5px;
}

.chat-row.tutor .chat-bubble{
  background:var(--tint);
  color:var(--ink);
  border-bottom-left-radius:5px;
}

.chat-name{
  display:block;
  font-family:'Heebo',sans-serif;
  font-weight:900;
  font-size:11.5px;
  margin-bottom:3px;
  opacity:.78;
}

.chat-thinking{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:900;
}

.chat-quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:10px 0 8px;
}

.chat-quick .assist-btn{
  font-size:13px;
  padding:9px 10px;
  text-align:center;
}

.chat-compose{
  position:sticky;
  bottom:-14px;
  margin:0 -2px -14px;
  padding:10px 2px 14px;
  background:#fff;
  border-top:2px solid #ece8f1;
}

.chat-compose-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.chat-input{
  flex:1;
  min-height:48px;
  max-height:120px;
  resize:vertical;
  margin:0;
}

.chat-send{
  flex:none;
  width:auto;
  min-width:72px;
  margin:0;
  padding:11px 13px;
}

.chat-send[disabled],
.assist-btn[disabled]{
  opacity:.55;
  cursor:not-allowed;
}

.chat-error{
  background:#fff4f4;
  border:2px dashed #9A1D2F;
  border-radius:12px;
  padding:10px 12px;
  font-size:13px;
  font-weight:800;
  color:#7b1726;
}


/* ---------- מתמטיקה: KaTeX + RTL/LTR isolation ---------- */
.katex{
  direction:ltr;
  unicode-bidi:isolate;
  display:inline-block;
  max-width:100%;
}

.katex-display{
  direction:ltr;
  unicode-bidi:isolate;
  overflow-x:auto;
  overflow-y:hidden;
  max-width:100%;
  margin:.65em 0;
  padding:2px 0;
  text-align:center;
}

.katex-display > .katex{
  display:inline-block;
  text-align:initial;
}

/* אם KaTeX אינו זמין, הטקסט נשאר קריא במקום לשבור את הפאנל */
.math-render-error{
  direction:ltr;
  unicode-bidi:isolate;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}

</style>
</head>

<body>

<div class="bar">

  <h1>
    <span id="emoji">📄</span>
    <span class="ttl" id="title">דף עבודה</span>
  </h1>

  <span class="chip" id="gradeChip"></span>
  <span class="chip" id="levelChip"></span>

  <span class="spacer"></span>

  <a class="btn" id="backBtn" href="./">
    לכל דפי העבודה
  </a>

  <a
    class="btn btn--go"
    id="rawBtn"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
  >
    פתח PDF בלשונית
  </a>

</div>

<div class="stage">

  <div class="pdfwrap">

    <iframe
      id="pdf"
      title="דף העבודה"
    ></iframe>

    <div class="mobile-open">

      <div class="big">
        📄
      </div>

      <div style="
        font-family:Heebo,sans-serif;
        font-weight:900;
        font-size:17px;
      ">
        דף העבודה מוכן
      </div>

      <div style="
        font-weight:700;
        font-size:14px;
        color:var(--muted);
      ">
        ייפתח בלשונית חדשה.
        אפשר לחזור לכאן כדי להשתמש בנועם AI.
      </div>

      <a
        class="btn btn--go"
        id="rawBtn2"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        פתח את דף העבודה
      </a>

    </div>

  </div>

  <aside
    class="panel hidden"
    id="panel"
  >

    <div class="panel-in">

      <div class="panel-head">

        <span>🤖</span>

        <b>
          נועם AI
        </b>

        <button
          type="button"
          id="closePanel"
          aria-label="סגירה"
        >
          ✕
        </button>

      </div>

      <div
        class="panel-body"
        id="panelBody"
      ></div>

    </div>

  </aside>

</div>

<button
  class="fab"
  id="fab"
  type="button"
>
  🤖 נועם AI
</button>

<script>
(function(){

"use strict";

/* CONFIG */

var BASE =
  "https://www.noamdoronmath.co.il/_files/ugd/d8e7ad_";

var API =
  "https://amiramnoam.wixstudio.com/my-site-2/_functions";

var LEVEL = {
  a:"A",
  b:"B",
  c:"E"
};

var MIN_WAIT = 4200;
var TIMEOUT = 20000;

var GRADE_NAME = {
  7:"כיתה ז׳",
  8:"כיתה ח׳",
  9:"כיתה ט׳"
};

var GRADE_EMOJI = {
  7:"🧭",
  8:"🧪",
  9:"🎯"
};

var LEVEL_NAME = {
  a:"רמה א׳",
  b:"רמה ב׳",
  c:"רמת מצוינות"
};

/* PARAMS */

var q =
  new URLSearchParams(
    location.search
  );

var g =
  parseInt(
    q.get("g"),
    10
  );

var x =
  (
    q.get("x") ||
    ""
  ).trim();

var lv =
  (
    q.get("lv") ||
    ""
  ).trim();

var pdf =
  (
    q.get("pdf") ||
    ""
  ).trim();

var ttl =
  (
    q.get("t") ||
    "דף עבודה"
  ).trim();

var okPdf =
  /^[0-9a-f]{32}$/
  .test(pdf);

var okGrade =
  g >= 7 &&
  g <= 9;

var okX =
  /^G[1-9]-T\d{2}$/
  .test(x) &&
  x.indexOf(
    "G" + g + "-"
  ) === 0;

var okLv =
  Object.prototype
  .hasOwnProperty
  .call(
    LEVEL,
    lv
  );

var aiReady =
  okPdf &&
  okGrade &&
  okX &&
  okLv;

/* INVALID PDF */

if (!okPdf){

  document.body.innerHTML =
    '<div style="' +
    'padding:40px;' +
    'text-align:center;' +
    'font-family:Heebo,sans-serif;' +
    'font-weight:900' +
    '">' +

    'הקישור אינו תקין. ' +

    '<a href="./">' +
    'חזרה לדפי העבודה' +
    '</a>' +

    '</div>';

  return;
}

/* PDF */

var pdfUrl =
  BASE +
  pdf +
  ".pdf";

document.body
  .setAttribute(
    "data-grade",
    okGrade ? g : 7
  );

document.title =
  ttl +
  " · מתמטיקה · נועם דורון";

document
  .getElementById("title")
  .textContent =
  ttl;

document
  .getElementById("emoji")
  .textContent =
  GRADE_EMOJI[g] ||
  "📄";

document
  .getElementById("pdf")
  .src =
  pdfUrl;

document
  .getElementById("rawBtn")
  .href =
  pdfUrl;

document
  .getElementById("rawBtn2")
  .href =
  pdfUrl;

/* CHIPS */

var gc =
  document
  .getElementById(
    "gradeChip"
  );

if (okGrade){

  gc.textContent =
    GRADE_NAME[g];

}else{

  gc.style.display =
    "none";
}

var lc =
  document
  .getElementById(
    "levelChip"
  );

if (okLv){

  lc.textContent =
    LEVEL_NAME[lv];

  if (lv === "c"){

    lc.className =
      "chip lvl-c";
  }

}else{

  lc.style.display =
    "none";
}

/* BACK */

if (okGrade){

  document
    .getElementById("backBtn")
    .href =
    "./?grade=" +
    g;
}

/* PANEL */

var panel =
  document
  .getElementById(
    "panel"
  );

var body =
  document
  .getElementById(
    "panelBody"
  );

var fab =
  document
  .getElementById(
    "fab"
  );


/* MATH RENDERING — supports legacy $...$ and canonical \\(...\\) / \\[...\\] */
var mathRenderScheduled = false;

function renderMath(root){
  if (
    !root ||
    typeof window.renderMathInElement !== "function"
  ){
    return;
  }

  try{
    window.renderMathInElement(
      root,
      {
        delimiters:[
          { left:"$$", right:"$$", display:true },
          { left:"\\[", right:"\\]", display:true },
          { left:"\\(", right:"\\)", display:false },
          { left:"$", right:"$", display:false }
        ],
        throwOnError:false,
        strict:"ignore",
        trust:false,
        errorColor:"#9A1D2F"
      }
    );
  }catch(error){
    console.error("KATEX RENDER ERROR:", error);
  }
}

function scheduleMathRender(){
  if (mathRenderScheduled){
    return;
  }

  mathRenderScheduled = true;

  var run = function(){
    mathRenderScheduled = false;
    renderMath(body);
  };

  if (typeof window.requestAnimationFrame === "function"){
    window.requestAnimationFrame(run);
  }else{
    setTimeout(run, 0);
  }
}

if (typeof window.MutationObserver === "function"){
  new MutationObserver(
    function(){
      scheduleMathRender();
    }
  ).observe(
    body,
    {
      childList:true,
      subtree:true,
      characterData:true
    }
  );
}

if (!aiReady){

  fab.classList
    .add(

    );
}

fab.addEventListener(
  "click",
  function(){

      );

      .add(

      );

  }
);

document
  .getElementById(
    "closePanel"
  )

    "click",

      panel.classList

          "hidden"
        );

      fab.classList
        .remove(
          "hidden"
        );

/* STATE */

var loaded =
  false;

var items =
  [];

var pickedQ =
  null;

var pickedS =
  null;

var pickedId =
  null;

var history =
  [];

var hintIndex =
  0;

var canAskMoreHint =
  true;

var prefix =
  aiReady
    ? (
        x +
        "-" +
        LEVEL[lv]
      )
    : "";

var cacheKey =
  "nx:" +
  prefix;

/* FAIL OPEN */

if (!aiReady){

  panel.style.display =
    "none";

}else if (
  window
    .matchMedia(
      "(max-width:900px)"
    )
    .matches
){

  panel.classList
    .remove(
      "hidden"
    );

  loadExercises();
}

/* LOAD EXERCISES */

function loadExercises(){

  loaded =
    true;

  try{

    var c =
      sessionStorage
      .getItem(
        cacheKey
      );

    if (c){

      items =
        JSON.parse(c);

      return renderQuestions();
    }

  }catch(e){}

  body.innerHTML =
    '<p class="step-title">' +
    'טוען את שאלות הדף…' +
    '</p>' +

    '<div class="skel"></div>' +
    '<div class="skel"></div>' +
    '<div class="skel"></div>';

  post(
    API +
    "/listExercises",
    {
      grade:g,
      prefix:prefix
    }
  )
  .then(
    function(res){

      items =
        (
          res &&
          res.ok &&
          Array.isArray(
            res.items
          )
        )
        ? res.items
        : [];

      if (!items.length){

        return renderEmpty();
      }

      try{

        sessionStorage
          .setItem(
            cacheKey,
            JSON.stringify(
              items
            )
          );

      }catch(e){}

      renderQuestions();
    }
  )
  .catch(
    function(){

      renderNetworkError();
    }
  );
}

/* EMPTY */

function renderEmpty(){

  body.innerHTML =
    '<div class="note">' +

    'נועם AI עדיין אינו זמין לדף הזה 🙂' +

    '<br>' +

    'אפשר להמשיך לעבוד על הדף כרגיל.' +

    '</div>';
}

/* NETWORK ERROR */

function renderNetworkError(){

  body.innerHTML =
    '<div class="note">' +
    'לא הצלחנו להתחבר לנועם AI כרגע.' +
    '</div>' +

    '<button class="send" type="button" id="retry">' +
    'נסו שוב' +
    '</button>';

  document
    .getElementById(
      "retry"
    )
    .addEventListener(
      "click",
      function(){

        loaded =
          false;

        loadExercises();
      }
    );
}

/* HELPERS */

function questionNumbers(){

  var seen = {};
  var out = [];

  items.forEach(
    function(it){

      var n =
        it.questionNumber;

      if (!seen[n]){

        seen[n] =
          1;

        out.push(n);
      }
    }
  );

  return out.sort(
    function(a,b){
      return a-b;
    }
  );
}

function sectionsOf(n){

  return items
    .filter(
      function(it){

        return (
          it.questionNumber === n &&
          it.section
        );
      }
    )
    .map(
      function(it){

        return it.section;
      }
    );
}

function idOf(
  n,
  sec
){

  var hit =
    items.filter(
      function(it){

        return (
          it.questionNumber === n &&
          (
            sec
              ? it.section === sec
              : !it.section
          )
        );
      }
    )[0];

  return hit
    ? hit.id
    : null;
}

/* QUESTION */

function renderQuestions(){

  pickedQ =
    null;

  pickedS =
    null;

  pickedId =
    null;

  history =
    [];

  hintIndex =
    0;

  canAskMoreHint =
    true;

  var nums =
    questionNumbers();

  body.innerHTML =
    '<p class="step-title">' +
    'איזו שאלה בדף?' +
    '</p>' +

    '<div class="qpick">' +

      '<input ' +
      'class="qinput" ' +
      'id="qnum" ' +
      'type="text" ' +
      'inputmode="numeric" ' +
      'pattern="[0-9]*" ' +
      'maxlength="3" ' +
      'autocomplete="off" ' +
      'aria-label="מספר שאלה" ' +
      'placeholder="מספר שאלה">' +

      '<button ' +
      'class="send qgo" ' +
      'type="button" ' +
      'id="goQ">' +
      'המשך' +
      '</button>' +

    '</div>' +

    '<p class="hint">' +
    'כתוב את מספר השאלה כפי שהוא מופיע בדף העבודה.' +
    '</p>' +

    '<p class="inline-error" id="qerr" aria-live="polite"></p>';

  var qInput =
    document
    .getElementById(
      "qnum"
    );

  var qError =
    document
    .getElementById(
      "qerr"
    );

  function submitQuestion(){

    var raw =
      String(
        qInput.value ||
        ""
      ).trim();

    if (!/^\d+$/.test(raw)){

      qError.textContent =
        "כתוב מספר שאלה.";

      qInput.focus();

      return;
    }

    var n =
      parseInt(
        raw,
        10
      );

    if (
      nums.indexOf(n) === -1
    ){

      qError.textContent =
        "לא מצאתי את השאלה הזו. בדוק את המספר שמופיע בדף.";

      qInput.focus();
      qInput.select();

      return;
    }

    pickQuestion(n);
  }

  document
    .getElementById(
      "goQ"
    )
    .addEventListener(
      "click",
      submitQuestion
    );

  qInput
    .addEventListener(
      "keydown",
      function(e){

        if (
          e.key ===
          "Enter"
        ){

          submitQuestion();
        }
      }
    );

  qInput.focus();
}

/* SECTION */

function pickQuestion(n){

  pickedQ =
    n;

  hintIndex =
    0;

  var secs =
    sectionsOf(n);

  if (!secs.length){

    pickedS =
      null;

    pickedId =
      idOf(
        n,
        null
      );

    return renderCompose();
  }

  body.innerHTML =
    '<p class="step-title">' +
    'שאלה ' +
    n +
    ' — איזה סעיף?' +
    '</p>' +

    '<div class="opts">' +

      secs.map(
        function(s){

          return (
            '<button ' +
            'class="opt" ' +
            'type="button" ' +
            'data-s="' +
            s +
            '">' +

            'סעיף ' +
            s +

            '</button>'
          );
        }
      ).join("") +

    '</div>' +

    '<button ' +
    'class="opt" ' +
    'type="button" ' +
    'id="backQ">' +

    'שאלה אחרת' +

    '</button>';

  body
    .querySelectorAll(
      "[data-s]"
    )
    .forEach(
      function(b){

        b.addEventListener(
          "click",
          function(){

            pickedS =
              b.dataset.s;

            pickedId =
              idOf(
                n,
                pickedS
              );

            hintIndex =
              0;

            renderCompose();
          }
        );
      }
    );

  document
    .getElementById(
      "backQ"
    )
    .addEventListener(
      "click",
      renderQuestions
    );
}

/* LABEL */

function pickedLabel(){

  return (
    "נבחרה שאלה " +
    pickedQ +
    (
      pickedS
        ? ", סעיף " +
          pickedS
        : ""
    )
  );
}

/* THREE BUTTONS */

function renderCompose(){

  body.innerHTML =
    '<div class="picked">' +
      '<span>✓ ' + pickedLabel() + '</span>' +
      '<button type="button" id="change">שינוי</button>' +
    '</div>' +

    '<p class="step-title">איך אפשר לעזור?</p>' +

    '<div class="assist-actions">' +
      '<button class="assist-btn primary" type="button" id="hintBtn">' +
        '💡 תן לי רמז' +
      '</button>' +

      '<button class="assist-btn" type="button" id="explainBtn">' +
        '📘 תסביר לי את הרעיון' +
      '</button>' +

      '<button class="assist-btn custom" type="button" id="customBtn">' +
        '✍️ יש לי שאלה משלי' +
      '</button>' +
    '</div>';

  document
    .getElementById("change")
    .addEventListener(
      "click",
      renderQuestions
    );

  document
    .getElementById("hintBtn")
    .addEventListener(
      "click",
      function(){
        getStoredHelp("hint");
      }
    );

  document
    .getElementById("explainBtn")
    .addEventListener(
      "click",
      function(){
        getStoredHelp("explain");
      }
    );

  document
    .getElementById("customBtn")
    .addEventListener(
      "click",
      renderCustomQuestion
    );
}

/* CHAT HELPERS */

function trimHistory(){
  if (history.length > 20){
    history = history.slice(-20);
  }
}

function historyForApi(){
  return history
    .slice(-6)
    .map(
      function(turn){
        return {
          studentMessage:
            turn.q || "",
          tutorAnswer:
            turn.a || ""
        };
      }
    );
}

function chatBubble(
  role,
  text
){

  var isStudent =
    role === "student";

  return (
    '<div class="chat-row ' +
    (isStudent ? 'student' : 'tutor') +
    '">' +
      '<div class="chat-bubble">' +
        '<span class="chat-name">' +
        (isStudent ? 'אתה' : '🤖 נועם AI') +
        '</span>' +
        esc(text) +
      '</div>' +
    '</div>'
  );
}

function historyHtml(){

  return history
    .map(
      function(turn){
        var html = "";

        if (turn.q){
          html += chatBubble(
            "student",
            turn.q
          );
        }

        if (turn.a){
          html += chatBubble(
            "tutor",
            turn.a
          );
        }

        return html;
      }
    )
    .join("");
}

function renderChat(options){

  options =
    options || {};

  var busy =
    !!options.busy;

  var pendingMessage =
    String(
      options.pendingMessage || ""
    );

  var extraHtml =
    historyHtml();

  if (pendingMessage){
    extraHtml += chatBubble(
      "student",
      pendingMessage
    );
  }

  if (busy){
    extraHtml +=
      '<div class="chat-row tutor">' +
        '<div class="chat-bubble">' +
          '<span class="chat-name">🤖 נועם AI</span>' +
          '<span class="chat-thinking">AI חושב<span class="dots"></span></span>' +
        '</div>' +
      '</div>';
  }

  if (options.errorMessage){
    extraHtml +=
      '<div class="chat-error">' +
        esc(options.errorMessage) +
      '</div>' +
      '<button class="assist-btn primary" type="button" id="chatRetry">' +
        'נסו שוב' +
      '</button>';
  }

  var quickHtml = "";

  if (!busy && !options.errorMessage){

    quickHtml =
      '<div class="chat-quick">' +
        (
          canAskMoreHint
            ? '<button class="assist-btn primary" type="button" id="chatHint">' +
                (hintIndex > 0 ? '💡 רמז נוסף' : '💡 רמז') +
              '</button>'
            : ''
        ) +
        '<button class="assist-btn" type="button" id="chatExplain">📘 הסבר</button>' +
      '</div>';
  }

  body.innerHTML =
    '<div class="picked">' +
      '<span>✓ ' + pickedLabel() + '</span>' +
      '<button type="button" id="chatChange">שינוי תרגיל</button>' +
    '</div>' +

    '<div class="chat-shell">' +
      '<div class="chat-log" id="chatLog">' +
        extraHtml +
      '</div>' +

      quickHtml +

      '<div class="chat-compose">' +
        '<div class="chat-compose-row">' +
          '<textarea class="chat-input" id="chatMsg" maxlength="600" ' +
            'placeholder="כתוב הודעה נוספת…"' +
            (busy ? ' disabled' : '') +
          '></textarea>' +
          '<button class="send chat-send" type="button" id="chatSend"' +
            (busy ? ' disabled' : '') +
          '>שלח</button>' +
        '</div>' +
        '<p class="hint">Enter לשליחה · Shift+Enter לשורה חדשה. נועם AI זוכר את השיחה האחרונה.</p>' +
      '</div>' +
    '</div>';

  document
    .getElementById("chatChange")
    .addEventListener(
      "click",
      renderQuestions
    );

  var chatHint =
    document.getElementById("chatHint");

  if (chatHint){
    chatHint.addEventListener(
      "click",
      function(){
        getStoredHelp("hint");
      }
    );
  }

  var chatExplain =
    document.getElementById("chatExplain");

  if (chatExplain){
    chatExplain.addEventListener(
      "click",
      function(){
        getStoredHelp("explain");
      }
    );
  }

  var retry =
    document.getElementById("chatRetry");

  if (retry){
    retry.addEventListener(
      "click",
      function(){
        if (options.retryKind){
          getStoredHelp(
            options.retryKind
          );
          return;
        }

        if (options.retryMessage){
          ask(
            options.retryMessage
          );
        }
      }
    );
  }

  var ta =
    document.getElementById("chatMsg");

  var send =
    document.getElementById("chatSend");

  function submitChat(){
    if (busy){
      return;
    }

    var message =
      ta.value.trim();

    if (!message){
      ta.focus();
      return;
    }

    ask(message);
  }

  send.addEventListener(
    "click",
    submitChat
  );

  ta.addEventListener(
    "keydown",
    function(e){
      if (
        e.key === "Enter" &&
        !e.shiftKey
      ){
        e.preventDefault();
        submitChat();
      }
    }
  );

  var log =
    document.getElementById("chatLog");

  if (log){
    log.scrollIntoView({
      block:"end"
    });
  }

  body.scrollTop =
    body.scrollHeight;

  if (!busy && !options.errorMessage){
    setTimeout(
      function(){
        ta.focus();
      },
      0
    );
  }
}

/* CUSTOM QUESTION */

function renderCustomQuestion(){
  renderChat();
}

/* STORED SUPABASE HELP — NO QWEN */

function getStoredHelp(kind){

  if (!pickedId){
    return renderQuestions();
  }

  var label =
    kind === "hint"
      ? (
          hintIndex > 0
            ? "💡 תן לי רמז נוסף"
            : "💡 תן לי רמז"
        )
      : "📘 תסביר לי את הרעיון";

  renderChat({
    busy:true,
    pendingMessage:label
  });

  post(
    API + "/exerciseHelp",
    {
      exerciseId:pickedId,
      kind:kind,
      hintIndex:
        kind === "hint"
          ? hintIndex
          : 0
    }
  )
  .then(
    function(res){

      if (
        res &&
        res.ok &&
        res.answer
      ){

        if (kind === "hint"){
          hintIndex += 1;
          canAskMoreHint =
            !!res.hasMore;
        }

        history.push({
          q:label,
          a:res.answer
        });

        trimHistory();
        renderChat();

      }else{
        renderChat({
          pendingMessage:label,
          errorMessage:
            "לא הצלחתי להציג את העזרה המוכנה כרגע.",
          retryKind:kind
        });
      }
    }
  )
  .catch(
    function(){
      renderChat({
        pendingMessage:label,
        errorMessage:
          "לא הצלחתי להציג את העזרה המוכנה כרגע.",
        retryKind:kind
      });
    }
  );
}

/* FREE QUESTION — QWEN */

function ask(message){

  if (!pickedId){
    return renderQuestions();
  }

  var cleanMessage =
    String(message || "")
      .trim()
      .slice(0, 600);

  if (!cleanMessage){
    renderChat();
    return;
  }

  var apiHistory =
    historyForApi();

  renderChat({
    busy:true,
    pendingMessage:cleanMessage
  });

  var started =
    Date.now();

  post(
    API + "/noamTutor",
    {
      exerciseId:pickedId,
      studentMessage:cleanMessage,
      previousAttempts:
        Math.min(
          history.length,
          10
        ),
      conversationHistory:
        apiHistory
    }
  )
  .then(
    function(res){

      var wait =
        Math.max(
          0,
          MIN_WAIT -
          (
            Date.now() -
            started
          )
        );

      setTimeout(
        function(){

          if (
            res &&
            res.ok &&
            res.answer
          ){

            history.push({
              q:cleanMessage,
              a:res.answer
            });

            trimHistory();
            renderChat();

          }else{
            renderChat({
              pendingMessage:cleanMessage,
              errorMessage:
                "לא הצלחנו לקבל תשובה כרגע. אפשר לנסות שוב בעוד רגע.",
              retryMessage:cleanMessage
            });
          }
        },
        wait
      );
    }
  )
  .catch(
    function(){

      var wait =
        Math.max(
          0,
          MIN_WAIT -
          (
            Date.now() -
            started
          )
        );

      setTimeout(
        function(){
          renderChat({
            pendingMessage:cleanMessage,
            errorMessage:
              "לא הצלחנו לקבל תשובה כרגע. אפשר לנסות שוב בעוד רגע.",
            retryMessage:cleanMessage
          });
        },
        wait
      );
    }
  );
}

/* POST */

function post(
  endpoint,
  payload
){

  var ctrl =
    (
      "AbortController" in window
    )
    ? new AbortController()
    : null;

  var timer =
    setTimeout(
      function(){

        if (ctrl){

          ctrl.abort();
        }
      },
      TIMEOUT
    );

  return fetch(
    endpoint,
    {
      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify(
          payload
        ),

      signal:
        ctrl
          ? ctrl.signal
          : undefined
    }
  )
  .then(
    function(r){

      clearTimeout(
        timer
      );

      if (!r.ok){

        throw new Error(
          "http " +
          r.status
        );
      }

      return r.json();
    }
  );
}

/* ESCAPE HTML */

function esc(s){

  return String(s)
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[m];
      }
    );
}

})();
